# Datos que el CRM NO tiene y que `scripts/olvidata_datos.py` necesita para completar los
# archivos generados. Esto se edita A MANO; el script nunca lo sobreescribe.

version: 2
ultima_actualizacion: 2026-10-16

# ---------------------------------------------------------------------------
# frente_por_cliente: el CRM tiene FrenteComercial en el catalogo de modulos, no en el cliente,
# asi que la linea de producto de cada cliente vive aca. Valores: Build | Landing | AI Agents |
# Chatbots (los cuatro frentes vigentes desde 2026-09-13, ver olvidata-ceo.md).
# La clave es el nombre del negocio tal como esta en el CRM + el sistema si hay mas de uno.
# ---------------------------------------------------------------------------
frente_por_cliente:
  "Contadores BMA|Front web": Landing
  "Contadores BMA|Conversor": AI Agents   # DEC-007: es el caso real del frente AI Agents
  "Delicias Naturales": Build
  "Diercas SA": Landing
  "Eleven La Plata|Eleven": Build
  "ESCABA": Build            # inferido por el tipo de sistema — confirmar (DEC-008)
  "Estancia Santa Rosa": Build
  "Ferretería la Platense": Build
  "KOI|KOI Dumplings": Build
  "LABIPAC|Instituto Privado de Análisis Clínicos": Build
  "Lumitrack": Build
  "Lumitrack|Recotrack": Build
  "Marí Hogar": Build
  "PiApartments": Build      # inferido por el tipo de sistema — confirmar (DEC-008)
  "ShowroomGriffin|Griffin Showroom": Build
  "Vinoysefue": Build
  "Belclau": Build

# ---------------------------------------------------------------------------
# regalados (DEC-005, resuelta 2026-10-16): sistemas entregados sin plan de mantenimiento. Su
# recurrente en 0 NO es un dato faltante — es la decision. Se cuentan aparte para que no bajen el
# ticket promedio ni el conteo de clientes que pagan.
# ---------------------------------------------------------------------------
regalados:
  - "Contadores BMA|Front web"
  - "Contadores BMA|Conversor"
  - "LABIPAC|Instituto Privado de Análisis Clínicos"

# ---------------------------------------------------------------------------
# precios_lista_vigentes: espejo de `precios.md` (planes vigentes desde 2026-09-19), para poder
# contrastar lo que cada cliente paga contra lo que pagaria hoy a lista.
#
# DEC-004 (resuelta 2026-10-16): el ticket real es mas bajo que el de planificacion porque la base
# vieja quedo con el precio anterior — las subas no se aplican retroactivamente a clientes ya
# firmados (precedente 2026-07-24, mismo criterio que el grandfathering de COM-016). No es un error
# de carga ni una perdida: es la politica. Para proyectar clientes NUEVOS hay que usar la lista
# vigente, no el promedio de la base.
# ---------------------------------------------------------------------------
precios_lista_vigentes:
  Starter: 360
  Pro: 480
  Premium: 600
  Scale: 1000

# ---------------------------------------------------------------------------
# correcciones_pendientes_crm: datos que Joaquin confirmo y que el CRM todavia no refleja. El
# script los imprime como aviso en el archivo generado, para que el dato no se pierda mientras no
# se carguen en el sistema. Se borran de aca cuando el CRM queda al dia.
# ---------------------------------------------------------------------------
correcciones_pendientes_crm:
  - cliente: "ESCABA"
    dice_el_crm: "TicketAnualUsd 160, proxima renovacion 2026-10-02 (vencida)"
    es_en_realidad: "Plan anual de USD 240, pagado en 4 cuotas trimestrales. La del 02/10 YA SE COBRO."
    confirmado: 2026-10-16
    nota: >
      El CRM no modela periodicidad de pago: tiene TicketAnualUsd y una sola FechaProximaRenovacion,
      asi que un plan trimestral se ve como una renovacion anual vencida cada 3 meses. Mientras no
      exista el campo, cargar 240 como anual y mover la fecha al proximo trimestre (2027-01-02).

# El sueldo del Ministerio es el umbral de la decision de salida (olvidata-ceo.md, "Plan
# financiero"): el plan dice que Joaquin deja el Ministerio cuando el recurrente real pasa este
# numero durante 6 meses seguidos.
umbral_ministerio_usd_mes: 1173

# Ticket de planificacion que usa hoy el plan financiero, para poder contrastarlo contra el real
# que sale del CRM en vez de arrastrarlo como supuesto.
ticket_planificacion_usd_anual: 426
ticket_observado_h1_2026_usd_anual: 474
