        path: "tests/OlvidataAgentes.Tests/ConectoresTests.cs"
        motivo: "Casos de SSRF, credenciales que no salen, aislamiento entre organizaciones, aprobacion por llamada y tope por tarea"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "tests/OlvidataAgentes.Tests/Infra/ServidorLocalDePrueba.cs"
        motivo: "Servidor HTTP local en 127.0.0.1 para probar el conector sin salir a internet"
        pendiente_verificar: false
