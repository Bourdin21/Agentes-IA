    cuando_usar: >
      Cualquier proyecto con pagos/cobros editables donde hoy la unica forma de corregir un
      importe mal cargado es borrar y recargar a mano. Donde PAT-020 cubre la CANCELACION total
      de un comprobante, este cubre la CORRECCION puntual de un pago que sigue vigente.
      Precondicion practica: que el movimiento de caja tenga FK directa al pago (no busqueda por
      OrigenId+Monto, que elige mal cuando hay dos pagos del mismo importe en el mismo comprobante).
