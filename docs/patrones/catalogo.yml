        motivo: "ReversarPago (FK exacta + fallback historico), RegistrarPagoInterno (alta con sobrepago/SaldoFavor) y EditarPago (orquesta reversion + alta)"
        pendiente_verificar: false
      - proyecto: delicias-naturales
        path: "Controllers/PagosController.cs"
        motivo: "Accion EditarPago: lock de proceso + transaccion unica envolviendo reversion Y alta; traduccion de PagoNegocioException a JSON"
        pendiente_verificar: false
