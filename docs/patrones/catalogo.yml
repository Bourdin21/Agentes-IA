    archivos_referencia:
      - proyecto: olvidata-agentes-multirubro
        path: "docs/olvidata-agentes-multirubro/definiciones/3-arquitecto-mvc.md (seccion M11: RT-M11-01..11)"
        motivo: "Decisiones tecnicas de referencia, incluidas las dos tablas y por que el ultimo uso NO se guarda en la conexion"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Services/Conectores/GuardiaDestinoHttp.cs"
        motivo: "Toda la proteccion SSRF en un solo lugar: lista blanca con comodin y puerto, y rechazo de direcciones internas IPv4/IPv6"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/DependencyInjection.cs (AgregarClienteDeConectores)"
        motivo: "ConnectCallback que valida cada IP resuelta y conecta a esa misma direccion (anti DNS rebinding) + AllowAutoRedirect=false"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Services/Conectores/ConexionConectorService.cs"
        motivo: "Cifrado y borrado de credenciales, unicidad entre vigentes, alcance por rol resuelto contra la base y registro de llamadas"
        pendiente_verificar: false
