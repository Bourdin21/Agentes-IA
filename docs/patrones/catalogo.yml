      intervalo no alcanza para "proxima request"; (3) IDOR en gestion de usuarios porque Identity
      no aplica el query filter de tenant. Relacionado con century-21 (scoping de GrupoId
      resuelto desde el usuario, validacion de pertenencia en escrituras).
      ARQUITECTURA (olvidata-agentes-multirubro, 2026-09-14, ver 3-arquitecto-mvc.md): (a) rol y
