      "es de otro"; (9) adjuntos en los mensajes, no en el prompt de sistema, para no alterar hashes/cache del
      contexto; (10) imagenes y escaneados quedan "no legibles" hasta sumar vision/OCR.
      Lecciones de la implementacion (2026-09-15): (11) EF InMemory traduce un OrderBy sobre la propiedad de un record
      construido en la proyeccion y MySQL no: proyectar a tipo anonimo y mapear despues (lo detecto el verificador EF ->
      MySQL, no los tests); (12) el catch de un FileStream con FileMode.CreateNew nunca debe borrar la ruta si el archivo
      ya existia (solo si esta llamada lo creo); (13) LIKE ... ESCAPE con el propio caracter de escape duplicado no es
      portable (InMemory): usar "!" para % y _ y mapear un "!" del usuario a "_", con comparacion exacta en memoria;
      (14) JSON de herramientas con JavaScriptEncoder.Create(UnicodeRanges.All) escapa marcado sin escapar tildes;
      (15) el paquete NuGet oficial de PdfPig es "PdfPig" (el id UglyToad.PdfPig solo tiene un prerelease viejo);
      (16) en tag helpers model="..." no se decodifica &quot;: armar el modelo en un bloque de codigo.

  - id: PAT-034
    nombre: "Aprobacion humana de acciones de un agente IA dentro de un bucle reanudable (pedido por tool_use_id, espera sin worker, resolucion con token, vencimiento)"
    categoria: dominio
    descripcion: >
      Una herramienta de agente marcada en codigo como "requiere aprobacion" (con nivel: autor de la tarea o rol
      superior, y una descripcion en palabras generada por la propia herramienta) nunca se ejecuta al ser pedida
      por el modelo: el motor registra un pedido por tool_use_id y pone la tarea en "espera aprobacion" en el mismo
      commit, soltando el worker. La persona con permiso aprueba o rechaza (motivo opcional) desde una tarjeta en la
      conversacion o una bandeja; la resolucion guarda el pedido y, si no quedan pendientes del paso, devuelve la
      tarea a la cola (reiniciando intentos) en el mismo guardado con tokens de concurrencia. Al retomar, el bucle
      vuelve al ultimo paso del modelo: ejecuta lo aprobado (autor re-verificado) o devuelve al modelo un
      tool_result de error con el rechazo o el vencimiento, siempre registrando la ejecucion para idempotencia.
      Un barrido vence pedidos sin respuesta.
    cuando_usar: >
      Agentes IA con herramientas que tienen efectos fuera del sistema (mails, mensajes, pagos, escrituras en
      sistemas del cliente) donde una persona tiene que confirmar antes, y el bucle del agente persiste pasos y
      puede cortarse en cualquier momento (hosting compartido, reciclados).
