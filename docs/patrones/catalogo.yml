      Probado end-to-end contra una base real (no solo por inspeccion de codigo) en la-platense:
      solicitud, render del formulario con el token real del link, reset exitoso, login con la
      contraseña nueva, y reuso del mismo token ya consumido correctamente rechazado (Identity
      invalida el token al cambiar el SecurityStamp del usuario).

  - id: PAT-015
    nombre: "Baja (individual o en lote) en listado DataTables sin perder la pagina"
    categoria: ui
    descripcion: >
      La accion "Eliminar" de un listado DataTables server-side debe resolverse por AJAX, nunca
      con un `<form>.submit()`/`RedirectToAction` — un submit real recarga la pagina completa y
      el DataTable siempre vuelve a la pagina 1, sin importar en que pagina estaba el usuario. El
      endpoint de baja devuelve JSON (`{ success, message }`) y el JS refresca la grilla con
      `tabla.ajax.reload(null, false)` — el segundo argumento `false` es el que mantiene la
      pagina actual (con `tabla.ajax.reload()` a secas, o sin el argumento, tambien vuelve a la
      pagina 1 aunque ya no haya recarga completa de browser). Selección múltiple + baja en lote:
      checkbox por fila + "seleccionar todos" acotado a la pagina visible, con un unico endpoint
      que aplique la baja de todos los ids en una sola operacion masiva (`ExecuteUpdateAsync`
      sobre `Where(ids.Contains(...))`), no un loop de N llamadas individuales al service.
    cuando_usar: >
      Cualquier listado DataTables server-side (baseline BlankProject, ver PAT-008) que tenga
      accion de baja — individual y/o en lote. Es la continuacion natural de PAT-008: ese patron
      cubre listar/filtrar, este cubre la accion de eliminar sobre ese mismo listado.
    proyecto_origen: la-platense (bug real reportado por el cliente en produccion, Entrega 1)
    proyectos_que_lo_usan: []
    archivos_referencia:
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Web/Controllers/ProductosController.cs (acciones Delete y EliminarLote)"
        motivo: "Delete devuelve JSON en vez de RedirectToAction; EliminarLote recibe una lista de ids"
        pendiente_verificar: false
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Infrastructure/Services/ProductoService.cs (EliminarLoteAsync)"
        motivo: "Baja en lote con un solo ExecuteUpdateAsync, no un loop de EliminarAsync individuales"
        pendiente_verificar: false
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Web/Views/Productos/Index.cshtml"
        motivo: "JS de referencia: SweetAlert2 + $.post/$.ajax + tabla.ajax.reload(null, false); checkboxes de seleccion con 'seleccionar todos' acotado a la pagina visible"
        pendiente_verificar: false
    dependencias:
      - PAT-008
    notas: >
      Normativo desde Agosto 2026 — ver seccion "Bajas (individuales o en lote) dentro de un
      listado DataTables: siempre AJAX, nunca form-submit" en
      `25-frontend-design-system.instructions.md`, y el item 10c + smoke-check 5 en
      `26-checklists.instructions.md`. Aplicar desde el arranque de cualquier listado nuevo con
      baja, no esperar a que un cliente lo reporte como bug (como paso en la-platense).

  - id: PAT-016
    nombre: "Busqueda global multi-formato (texto/importe/fecha) + filtros persistidos en sesion"
    categoria: ui
    descripcion: >
      Extension de PAT-008 sobre la busqueda global propia del DataTable (el input "Search", no
      un filtro de columna puntual): tiene que matchear contra CUALQUIER columna visible,
      incluidas las de importe/moneda y las de fecha, no solo texto. Importes: probar el texto
      como candidato decimal en formato es-AR ("837.441,39") y en invariante ("837441.39") —
      decidir cual separador es el decimal segun cual aparece ultimo — comparando con
      `>= valor-0.005 && < valor+0.005` (no `==` exacto, por redondeo), mas una pasada de
      substring numerico (para que "500" encuentre "$ 1.500,00"). Fechas: `DateTime.
      TryParseExact` contra los formatos usados en pantalla (`dd/MM/yyyy` y variantes sin cero),
      comparando Year/Month/Day por separado (nunca el DateTime completo, falla por la hora).
      Patron de composicion: como EF no resuelve bien un unico OR gigante mezclando texto +
      numero + fecha sobre columnas de tipos distintos, cada tipo de dato se resuelve por
      separado contra una lista de ids candidatos (`extraIds`) y se combina al final con
      `WHERE textoEnColumnaTexto OR Id IN (extraIds)`.
      Ademas: los filtros usados en cada busqueda se guardan en `Session` (una key por filtro,
      prefijada con el nombre de la entidad) y se reponen como valor inicial la proxima vez que
      se entra a la pantalla — y el boton "Limpiar filtros" (ya obligatorio por PAT-008) tiene
      que borrar tambien esos valores de `Session`, no solo los controles visibles.
    cuando_usar: >
      Cualquier listado DataTables server-side (ver PAT-008) que tenga columnas de importe y/o
      fecha — la busqueda global tiene que poder encontrar filas por esas columnas igual que por
      texto. La persistencia en sesion aplica a cualquier listado con filtros, con o sin columnas
      numericas/fecha.
    proyecto_origen: delicias-naturales (busqueda multi-formato); mismo proyecto (persistencia de filtros en Session)
    proyectos_que_lo_usan:
      - la-platense
    archivos_referencia:
      - proyecto: delicias-naturales
        path: "Helper/BusquedaHelper.cs (ParsearImportes)"
        motivo: "Parseo de importes es-AR/invariante a partir de texto libre, sin depender de la cultura del hilo"
        pendiente_verificar: false
      - proyecto: delicias-naturales
        path: "Controllers/VentasController.cs (ListarVentas, bloque `if (!string.IsNullOrEmpty(searchValue))`)"
        motivo: "Implementacion completa de referencia: numero exacto, importe (decimal y substring), fecha (TryParseExact), enum por texto, combinados via extraIds"
        pendiente_verificar: false
      - proyecto: delicias-naturales
        path: "Controllers/ProductosController.cs (Index, lineas ~30-34 y ~390-391)"
        motivo: "Guardar filtros en Session en cada carga del listado y reponerlos la proxima vez"
        pendiente_verificar: false
    dependencias:
      - PAT-008
    notas: >
      Normativo desde Agosto 2026, mismo lugar que PAT-008/PAT-015 en
      `25-frontend-design-system.instructions.md` (seccion "Listados: DataTables + filtros por
      columna") y el item 10a + smoke-check 2 en `26-checklists.instructions.md`.
      Aplicado en la-platense el 2026-08-24 a los 6 listados server-side (Ventas, Clientes,
      Productos, Caja, Gastos, Entregas) — ver la seccion "PAT-016" en
      `docs/la-platense/definiciones/5-implementador.md`. De esa aplicacion salieron 3 aprendizajes
      que conviene tener a mano al portarlo de nuevo:
      (1) La pasada de substring numerico es la unica del patron que NO se resuelve en SQL, porque
      ni `MySql.EntityFrameworkCore` ni EF6 traducen `decimal.ToString()` — hay que materializar
      los pares (Id, importe). Sobre tablas grandes eso es un problema real: en la-platense el
      catalogo tiene ~121.691 productos activos y sin tope cada pulsacion de tecla los traia
      todos. Solucion: `Take(tope + 1)` en una sola consulta (sin COUNT aparte) y, si se pasa del
      tope, omitir SOLO esa pasada — la coincidencia por valor exacto y las columnas de texto
      siguen aplicando. Sobre >5.000 filas un "contiene estos digitos" no le sirve al usuario.
      (2) Sobre tablas grandes hay que acotar tambien las sub-queries de valor exacto: tipear "0"
      matcheaba el Stock de todo el catalogo y armaba un `Id IN (...)` de cien mil elementos.
      (3) `TryParseExact` conviene con `InvariantCulture` (el separador del formato es el literal
      '/'), y la deteccion de "esto es un importe" debe descartar el texto que tenga letras, para
      que "Martillo 500" no arrastre todos los importes que contengan 500.

