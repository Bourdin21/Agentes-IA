  - id: PAT-043
    nombre: "Conectores a sistemas externos con credenciales por organizacion (multi-tenant), con lista blanca y proteccion SSRF"
    categoria: agentes-ia
    descripcion: >
      Mecanismo para que cada organizacion conecte SUS sistemas externos sin que el proveedor toque sus credenciales.
      Dos piezas: el CONECTOR (tipo de sistema externo, definido en CODIGO: declara que campos pide, como se valida, que
      herramienta le ofrece al agente y como ejecuta una llamada) y la CONEXION (lo que carga cada organizacion sobre ese
      tipo: nombre, codigo corto que ve el agente, "para que sirve" —lo unico que lee el modelo—, credenciales cifradas
      con Data Protection, alcance por rol, tope de llamadas por tarea y activa/inactiva). La conexion NACE INACTIVA: hay
      que probarla y activarla. Las credenciales entran y NO VUELVEN A SALIR: se muestran los nombres y la fecha, se
      reemplazan enteras o se borran, la propiedad queda fuera del audit trail y ningun camino del codigo devuelve el
      valor. El agente resuelve la conexion CONTRA LA BASE por su codigo, dentro de la organizacion de la tarea y con el
      rol del autor re-verificado en cada llamada; "no existe", "esta inactiva" y "no la podes usar" responden lo mismo.
      Cada llamada queda registrada (quien, cuando, destino SIN querystring, resultado, codigo, tamaño, si paso por
      aprobacion) y ningun error del sistema externo sale como excepcion: vuelve como resultado de error.
      La proteccion contra SSRF es parte del patron, no un extra: solo https, sin usuario y contraseña en la URL, host en
      la LISTA BLANCA DE LA CONEXION (nunca "cualquier dominio"), ninguna direccion interna (loopback, 10/8, 172.16/12,
      192.168/16, 169.254/16 —incluida 169.254.169.254, la metadata de las nubes, que entrega credenciales del
      servidor—, 100.64/10, multicast y sus equivalentes IPv6), revision de la IP AL CONECTAR sobre la direccion a la que
      realmente resolvio el nombre y conexion a esa misma direccion (cierra el DNS rebinding), redirecciones apagadas y
      revalidadas salto por salto contra la misma lista blanca, y lectura de la respuesta acotada en bytes.
      El agente manda una RUTA RELATIVA a la direccion base de la conexion, nunca una URL libre: hacen falta dos fallas
      para salirse.
    cuando_usar: >
      Cuando un agente (o cualquier proceso server-side multi-tenant) tiene que llamar a sistemas externos que son de
      cada cliente, con credenciales de cada cliente. Sirve igual para un unico sistema externo si las credenciales son
      del cliente y no del estudio. NO usar para integraciones donde la credencial es del proveedor y una sola (ahi
      alcanza con configuracion). El conector concreto (Gmail, Drive, ARCA) es una implementacion mas del tipo: el motor,
      las aprobaciones y las pantallas no cambian.
    proyecto_origen: olvidata-agentes-multirubro (M11, implementado 2026-09-16)
