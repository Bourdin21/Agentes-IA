      al primer ajuste (conserva el error del turno viejo); (h) un paso del modelo sin bloques se omite al
      reconstruir (la API no acepta asistente vacio); (i) un DbUpdateException por el indice unico
      (TareaAgenteId, Numero) se trata como carrera perdida solo si la Version en la base ya cambio;
