      deserializado, nunca el JSON crudo. (Movido desde PAT-030 el 2026-09-14: correspondia a M3b.)

  - id: PAT-030
    nombre: "Prompts derivados configurables por el cliente sobre un prompt base protegido, con propuesta y aprobacion"
    categoria: dominio
    descripcion: >
      En una plataforma de agentes IA, el cliente no escribe agentes desde cero: crea DERIVADOS de un
      agente base de la plataforma (prompt nunca visible) sumando una capa propia (instrucciones,
      subconjunto de herramientas, visibilidad personal u organizacion, destino). Cada derivado tiene
      versiones propias (borrador -> en revision -> publicada / rechazada -> reemplazada); lo personal lo
      publica su creador, lo compartido con la organizacion lo aprueba un rol superior con revision lado
      a lado y motivo de rechazo. El derivado usa siempre la ultima version publicada del base y cada
      ejecucion queda anclada a ambas versiones. Herramientas efectivas = interseccion con las del base
      vigente. Archivar evita ejecuciones nuevas sin romper historicos.
    cuando_usar: >
      SaaS con IP de prompts propia que quiere dar personalizacion al cliente sin exponer ni permitir
      reemplazar el prompt base, con gobierno interno de lo que se comparte.
    proyecto_origen: olvidata-agentes-multirubro (M4, implementado 2026-09-14 sin la aprobacion del rol superior)
    proyectos_que_lo_usan: [olvidata-agentes-multirubro]
    archivos_referencia:
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Domain/Entities/AgenteOrganizacion.cs (AgenteOrganizacion + AgenteOrganizacionVersion) + Domain/Enums/EnumsAgentesOrganizacion.cs"
        motivo: "Nombre/descripcion no versionados, proyeccion de lo publicado, VersionToken; version con borrador unico y estados con valores reservados para revision"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Services/Agentes/AgenteOrganizacionService.cs"
        motivo: "Catalogo por secciones, permisos por agente (creador / rol superior), limites, nombre unico sin mayusculas ni tildes, guardar con accion (borrador / publicar) en un guardado (transaccion si agente y version son nuevos), duplicar, archivar/reactivar, aviso a Directores, vistas de staff"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Services/Motor/ConstructorContexto.cs (formato 2, DeclaracionPrecedenciaAgenteOrganizacion) + ServicioTareas.cs (ValidarAgenteOrganizacionAsync) + ProcesadorTareas.cs (herramientas por interseccion)"
        motivo: "Instrucciones del derivado en el contexto sin cambiar el render/hash de las ejecuciones con agente base; base = ultima publicada al crear; herramientas efectivas al ejecutar"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Data/Configurations/AgentesOrganizacionConfigurations.cs + Data/Migrations/20260914220326_AgentesOrganizacionM4.cs"
        motivo: "NombreVigente STORED por SQL + indice unico; FK circular agente <-> version; check de reglas recreado (exactamente uno de los dos agentes)"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Web/Controllers/AgentesController.cs + Views/Agentes/{Index,_TarjetaAgente,_Form,_BarraFormAgente,_ScriptFormAgente,_ScriptAccionesAgente,Crear,Editar,Detalle}.cshtml"
        motivo: "Catalogo con buscador, formulario unico por cards con herramientas del base, barra segun visibilidad, detalle con historial y card de reglas"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "tests/OlvidataAgentes.Tests/AgentesOrganizacionTests.cs"
        motivo: "17 tests: golden de hash de ejecuciones previas, privacidad, contexto formato 2, publicacion y aviso, permisos, versiones, herramientas, P1, limites, archivado, suscripcion vencida, duplicar, reglas, sugerencias, incluido siempre, aislamiento, staff"
        pendiente_verificar: false
    dependencias: [PAT-028]
    notas: >
      Riesgos: instrucciones del cliente como via de inyeccion (mismo tratamiento que reglas: nivel fijo
      en el contexto, escape, declaracion de precedencia); una mejora del base cambia a todos los
      derivados (decision consciente: mejoras automaticas); complejidad de estados contra simplicidad
      de uso (mostrar borradores/revision solo a creador y aprobador).
      DECISION olvidata-agentes-multirubro (2026-09-14): la aprobacion se pospuso — cualquier miembro
      publica para la organizacion y se notifica a los aprobadores (que pueden editar/archivar); los
      estados de revision quedan reservados en el enum para sumarlos despues.
      ARQUITECTURA (M4, ver 3-arquitecto-mvc.md): nombre/descripcion no versionados; version con
      instrucciones, herramientas, visibilidad y destino; borrador unico editable y publicadas
      inmutables; proyeccion de lo publicado en el agente + token de concurrencia; unicidad de nombre
      entre activos con columna generada STORED; la tarea ancla version del base (ultima publicada al
      crear) y del derivado; herramientas efectivas por interseccion al ejecutar; instantanea extendida
      sin cambiar el render de ejecuciones previas (hash compatible).
