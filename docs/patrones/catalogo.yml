  - id: PAT-045
    nombre: "Tarea repetitiva reanudable: programacion + ocurrencia reservada con indice unico"
    categoria: agentes-ia
    descripcion: >
      Como hacer que un trabajo se repita cada X tiempo en una app web alojada en hosting compartido, donde el proceso se
      recicla cuando quiere y puede haber mas de una instancia. NO es un scheduler: es una tabla "programacion" (que
      pide, a quien, cada cuanto, responsable, activa/pausada/terminada, proxima ejecucion) mas una tabla "ejecucion"
      inmutable con UN INDICE UNICO (ProgramacionId, Ocurrencia) — esa clave es todo el mecanismo.
      El barrido corre dentro del worker que ya existe y va en DOS FASES:
      (1) RESERVAR: inserta la fila de la ocurrencia y adelanta ProximaEjecucion en el MISMO guardado, protegido ademas
      por un token de concurrencia. Dos instancias barriendo a la vez: una gana, la otra recibe 1062 y se retira.
      (2) EJECUTAR: recien ahi se hace el trabajo caro (crear la tarea, llamar a otros servicios) y se cierra la vuelta.
      Si el proceso muere entre las dos fases, la vuelta queda "Reservada" y un barrido posterior la termina — sin volver
      a reservar esa ocurrencia, porque el unico ya la tiene.
      Dos decisiones de calendario que hay que tomar a proposito: la proxima ocurrencia se recalcula desde AHORA y no
      desde la ocurrencia vencida (un proceso dormido una semana dispara UNA vuelta, no siete), y el dia 31 en un mes mas
      corto cae el ultimo dia del mes en vez de saltearse el mes. Todo el calculo se hace en la zona horaria del negocio
      y se guarda en UTC; la hora del dia se guarda como minutos desde la medianoche LOCAL, no como hora del servidor.
    cuando_usar: >
      Cuando el cliente pide "que esto se haga solo cada X" y no hay (o no conviene) un scheduler externo: hosting
      compartido, un solo proceso, o cuando el trabajo repetitivo tiene que quedar registrado y auditado como cualquier
      otra operacion del sistema. Si el trabajo repetitivo es puro efecto lateral barato (limpiar una tabla, vencer
      pedidos) alcanza con un barrido simple en el worker; PAT-045 aparece cuando cada vuelta cuesta plata, genera datos
      del cliente y tiene que poder verse y auditarse una por una.
      No usar para "cada N minutos con precision": el ritmo real lo marca el barrido del worker y, sin AlwaysRunning, el
      sitio se duerme y las vueltas se atrasan.
    proyecto_origen: olvidata-agentes-multirubro (M12, implementado 2026-09-16)
    proyectos_que_lo_usan: [olvidata-agentes-multirubro]
    archivos_referencia:
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Services/Programaciones/EjecutorProgramaciones.cs"
        motivo: "Las dos fases completas: ReservarAsync (unico + token) y EjecutarUnaAsync, mas el barrido de vueltas colgadas"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Application/Helpers/CalendarioProgramacion.cs"
        motivo: "Calculo de la proxima ocurrencia en hora local, con el recorte del dia 31 y el 'estrictamente despues'"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Data/Configurations/ProgramacionesConfigurations.cs"
        motivo: "El indice unico (ProgramacionTareaId, Ocurrencia) y el indice (Estado, ProximaEjecucionAt) del barrido"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "tests/OlvidataAgentes.Tests/ProgramacionesTests.cs"
        motivo: "Los tres casos que hay que copiar: dos workers a la vez, reinicio entre fases, y despertar despues de dias"
        pendiente_verificar: false
    dependencias: [PAT-034]
    notas: >
      Gotchas CONFIRMADOS al implementar: (1) el orden importa — si la marca de "ya corri" se escribe JUNTO con el
      trabajo, un corte en el medio habilita la doble ejecucion; hay que reservar primero y trabajar despues;
      (2) el indice unico solo no alcanza si la misma instancia reintenta: hace falta el estado intermedio "Reservada"
      con su barrido de recuperacion, o la ocurrencia queda huerfana para siempre; (3) el token de concurrencia se
      incrementa en la FASE 1, nunca en la 2: si la fase 2 lo tocara, una edicion desde la pantalla a mitad de vuelta la
      haria fallar sin motivo real (mismo gotcha que PAT-043); (4) al cerrar una vuelta que no pudo, la programacion NO
      se mata: se cuenta una falla seguida y recien tras N (5 por defecto) se corta y se avisa — si no, una caida del
      proveedor apaga en silencio todo lo que el cliente tenia programado; (5) el costo acumulado se CALCULA sumando el
      costo de lo que produjo cada vuelta, nunca se guarda en la programacion; (6) el "ejecutar ahora" de la pantalla
      solo adelanta ProximaEjecucion, no crea nada: asi el camino de creacion es UNO solo y lo que se prueba a mano es
      exactamente lo que va a pasar sola de noche.

  - id: PAT-046
    nombre: "Automatizacion con n8n (orquestador externo de workflows por webhooks/API)"
    categoria: integracion
    descripcion: >
      n8n (fair-code, Node.js) como orquestador visual de integraciones SaaS <-> SaaS y de avisos: trigger (cron,
      webhook, mail, cambio en planilla) -> nodos (HTTP, MySQL/MSSQL/Postgres, Gmail, Google Sheets, WhatsApp/Telegram,
      nodo AI Agent con Claude) -> accion. Se conecta a nuestros sistemas SOLO por su API/webhooks (HTTP con API key),
      nunca escribiendo directo en la base del sistema: la logica de negocio sigue en los Services del sistema .NET/PHP.
    cuando_usar: >
      Pegamento entre servicios de terceros que ya tienen API (ML, Gmail, Sheets, Meta, WhatsApp), avisos y reportes
      periodicos, prototipos rapidos de una automatizacion antes de codificarla, y automatizacion interna del estudio.
      NO usar para: logica de negocio del cliente, procesos con auditoria/permisos/estados (eso va en el sistema,
      ver PAT-045 para tareas programadas auditables), ni como nucleo de un producto propio que se revende.
    proyecto_origen: ninguno todavia (incorporado al catalogo 2026-09-19 por research, sin implementacion real)
    proyectos_que_lo_usan: []
    archivos_referencia: []
    dependencias: []
    notas: >
      Datos verificados 2026-09-19: (1) Base de datos SOLO SQLite o PostgreSQL — MySQL/MariaDB eliminado en n8n 2.0,
      asi que no puede usar las bases MySQL del estudio como storage (si puede LEERLAS/escribirlas como nodo).
      (2) Es un proceso Node persistente 24/7 (puerto 5678 + reverse proxy HTTPS): no corre en hosting compartido
      IIS (SmarterASP) ni PHP (DonWeb/Ferozo) — requiere VPS con Docker o n8n Cloud. RAM: 2 GB minimo documentado.
      (3) Licencia Sustainable Use: libre para uso interno y para CONSULTORIA (construirle workflows a un cliente en SU
      instancia); alojar workflows y credenciales de clientes en una instancia NUESTRA compartida requiere licencia
      Enterprise, y embeberlo en un producto que se cobra requiere licencia Embed. Modelo permitido sin costo de
      licencia: una instancia interna del estudio + una instancia por cliente a nombre del cliente.
      (4) Community Edition self-hosted gratis e ilimitada; sin SSO/Git/entornos (eso es Business ~EUR 800/mes).
      (5) Riesgos: el editor expone credenciales de todo lo conectado — nunca publico sin auth fuerte; backups de la
      base Postgres/SQLite + clave N8N_ENCRYPTION_KEY (sin ella las credenciales guardadas son irrecuperables);
      actualizaciones con breaking changes entre majors.
      Hosting (olvidata-infra 2026-09-19): ninguno de los 3 proveedores actuales sirve; opcion real Hostinger VPS KVM con
      template n8n (~USD 6,5-9/mes, precio promocional). Integracion con SmarterASP/DonWeb siempre por API/webhooks, nunca
      MySQL remoto expuesto.
      Candidatos detectados 2026-09-19: agentes-ia-sistema (C3 tareas programadas / C6 mantenimiento mensual, uso interno),
      contadores-bma-agentes-ia (ingesta de mails/extractos + lectura SQL Server de Bejerman, instancia del cliente),
      kite-punta-lara (avisos de dia de kite por Telegram/WhatsApp, prototipo). Descartados: libreria-horizonte (67k
      publicaciones ML con lotes reanudables PAT-025 — n8n no escala ahi) y olvidata-agentes-multirubro (M11/M12 ya
      resuelven conectores y tareas; n8n embebido en producto pago exige licencia Embed).
      Presupuesto: un workflow n8n simple (trigger + 3-6 nodos, API documentada) es rango de "integracion simple",
      no de modulo nuevo; sumar setup/mantenimiento del VPS si la instancia es del cliente.

  - id: PAT-047
    nombre: "Ficha de agente en dos vistas: funcional para el cliente y literal para el staff, con DTOs distintos por tipo"
    categoria: agentes-ia
    descripcion: >
      Como mostrar "hasta el minimo detalle" de un agente IA sin filtrar el know-how del prompt. Dos pantallas con la
      misma distribucion (cabecera + 7 pestanas: que hace, como arma su contexto, reglas, herramientas y ayudas,
      conocimiento, versiones y pruebas, crear mi version) y DOS familias de DTOs: la del cliente no tiene ningun campo
      donde pueda viajar texto del nucleo (solo titulo + resumen publico escrito aparte + version); la del staff si lo
      lleva y solo la arma un service que re-verifica el rol adentro. Nada se arma por separado: la secuencia sale del
      mismo constructor de contexto que la tarea (orden REAL del render, con el puesto de autoridad de cada paso) y las
      herramientas de un resolvedor unico extraido del motor (lo que se muestra es lo que corre). El contexto "con una
      organizacion real" es solo SuperUsuario y queda en AuditLog.
    cuando_usar: >
      Cualquier producto donde el prompt/metodo es propiedad intelectual y el cliente igual necesita entender que hace
      el agente, en que orden recibe su contexto y que puede cambiar con su propia version.
