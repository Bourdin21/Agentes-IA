        motivo: "DTOs del cliente sin campo para texto del nucleo (PiezaNucleoPublicaDto: titulo, resumen, version)"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Services/Agentes/AnatomiaAgenteService.cs"
        motivo: "Vista del staff: rol re-verificado en el service, B1 con el mismo render que la tarea, contexto real auditado"
        pendiente_verificar: false
