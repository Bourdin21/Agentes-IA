      formato de contexto NUEVO (2) solo para ejecuciones con derivado: la declaracion de precedencia del
      formato 1 no se toca y los campos nuevos de la instantanea se omiten del JSON cuando son null; test
      golden con hashes calculados ANTES del cambio; (b) agente y version nuevos que se apuntan entre si
      (VersionPublicadaId): dos SaveChanges en una transaccion; con agente existente alcanza la navegacion;
      (c) publicar sin cambios no crea version repetida (y descarta el borrador); (d) el nombre unico se
      compara como la colacion de MySQL (sin mayusculas ni tildes) y el 1062 del indice se reconoce por el
      nombre de la columna generada en el mensaje; (e) "No disponible" derivado (licencia vencida o base
      sin publicar), no persistido; (f) reglas por agente del base aplican a los derivados; las del derivado
      solo a el (base primero dentro del nivel, sin alterar el orden previo).

  - id: PAT-031
    nombre: "Asignacion deterministica de oferta por perfil de prospecto (presencia web + rubro) con plantilla de primer contacto por oferta"
    categoria: dominio
    descripcion: >
      Un bot de prospeccion en frio que vende varias lineas de producto no le manda a todos el mismo
      pitch: cada prospecto recibe una "oferta" (frente) asignada por una tabla de decision
      deterministica, sin LLM, evaluada en orden: canal no frio → sin oferta; eleccion manual → se
      respeta; sin web propia (vacia o solo redes/Linktree/wa.me) → oferta de presencia web (variante
      segun rubro visual); con web → oferta segun grupo del rubro (back-office / muchas consultas /
      gestion). La oferta se guarda con motivo y fecha, no se recalcula sola, y define la plantilla
      del primer mensaje (si la plantilla de esa oferta no esta aprobada, el prospecto NO se envia con
      otra por defecto: queda esperando y se ve en un panel de salud). La respuesta al boton de
      "contame mas" arranca el cuestionario/conversacion de la oferta, no uno generico. Se distingue
      "oferta hecha" (dato del sistema) de "interes detectado" (lo que el prospecto termino pidiendo).
    cuando_usar: >
      Outbound frio multi-producto con datos publicos del prospecto (Google Places: website, rubro) y
      plantillas de WhatsApp que requieren aprobacion previa por plantilla.
    proyecto_origen: crm-olvidata (diseño 2026-09-14, implementado 2026-09-14 — pendiente QA y deploy)
    proyectos_que_lo_usan: [crm-olvidata]
    archivos_referencia:
      - proyecto: crm-olvidata
        path: "docs/crm-olvidata/definiciones/2-disenador-funcional.md (seccion 8: tabla de decision, dominios, plantillas, fallback)"
        motivo: "Diseño funcional de referencia"
      - proyecto: crm-olvidata
        path: "OlvidataCRM.Application/Helpers/GanchoHelpers.cs"
        motivo: "Tabla de decision pura (web propia por dominio en memoria + grupo de rubro), etiquetas/badges, texto de oferta"
      - proyecto: crm-olvidata
        path: "OlvidataCRM.Application/Helpers/PlantillasCombo.cs + CategoriaHelpers.cs"
        motivo: "Nombres fijos de plantilla por gancho + predicado unico de 'plantilla con boton'; vocabulario unico de categorias"
      - proyecto: crm-olvidata
        path: "OlvidataCRM.Domain/Entities/Contacto.cs (AsignarGancho)"
        motivo: "Metodo de dominio unico para escribir el gancho desde los 5 puntos de alta/asignacion (CRM-001)"
      - proyecto: crm-olvidata
        path: "OlvidataCRM.Infrastructure/Services/OutboundCampaignService.cs (ResolverPlantilla, SendDailyBatchAsync, GetEstadoPlantillasGanchoAsync, GetSaludAsync)"
        motivo: "Plantilla por contacto resuelta antes del Take(cupo); sin combo disponible no se envia; salud y card de /Bot con el mismo evaluador"
      - proyecto: crm-olvidata
        path: "OlvidataCRM.Infrastructure/Queries/ModuloCatalogoQueries.cs"
        motivo: "Consulta compartida de modulos por frente (antes duplicada en 2 servicios), envuelta para el webhook"
