        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Services/Motor/ProveedorModeloAnthropic.cs (MapearMensajes) + src/OlvidataAgentes.Application/Motor/ModeloConversacion.cs (CacheConversacion, ContenidoCierreTurno)"
        motivo: "Breakpoint de cache en el ultimo bloque elegible del ultimo mensaje; contenido tipado del cierre de turno"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Services/Motor/ProveedorModeloSimulado.cs + DependencyInjection.UsarModeloSimuladoSiCorresponde"
        motivo: "Modelo simulado solo en Development (Anthropic:Simulado) para QA de la UI sin costo"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Web/Views/Tareas/{Detalle,_Conversacion,_CuadroSeguimiento,_PasosTurno}.cshtml"
        motivo: "Hilo de turnos, turno activo en vivo (SignalR + respaldo, reinicio tras enviar), cuadro con Ctrl+Enter y contador, copiar"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "tests/OlvidataAgentes.Tests/ConversacionTests.cs"
        motivo: "22 tests: normalizacion, pasos por turno, cierres, guardas, concurrencia, reanudacion, cache, reglas cambiadas, P6, listado, simulado"
        pendiente_verificar: false
