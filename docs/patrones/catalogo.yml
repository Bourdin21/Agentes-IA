  - id: PAT-042
    nombre: "Base de conocimiento del proveedor por rubro, consultable por herramientas de solo lectura"
    categoria: agentes-ia
    descripcion: >
      El know-how de oficio que el proveedor mantiene para un rubro vive como DATO VERSIONADO del nucleo (un tipo mas de
      artefacto, con su gate de publicacion), no pegado dentro de los prompts. Al importar, cada archivo Markdown se
      trocea en SECCIONES por sus encabezados y la ruta de encabezados ("Captacion > Documentacion minima") es la fuente
      que se cita. Ni una linea entra en el prompt de sistema: el agente recibe tres herramientas de solo lectura
      (listar / buscar / leer) y solo entra al contexto lo que busca, asi el costo de tokens es proporcional al uso y los
      formatos de contexto existentes y sus hashes quedan intactos. El acceso se acota por el RUBRO DE LA TAREA (resuelto
      contra la base, nunca desde la entrada del modelo) y por la suscripcion vigente de la organizacion; "no existe",
      "es de otro rubro" y "se vencio la suscripcion" responden lo mismo. El material nunca se sirve entero: se excluye
      explicitamente de los caminos que publican contenido al cliente.
    cuando_usar: >
