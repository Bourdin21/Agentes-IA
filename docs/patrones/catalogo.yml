  - id: PAT-012
    nombre: "Importacion de archivo con preview -> confirmar (staging + reporte de excepciones)"
    categoria: integracion
    descripcion: >
      Servicio de importacion de un archivo Excel/CSV subido por el usuario, en dos pasos: (1)
      previsualizar (analiza el archivo completo, lo deja en staging, devuelve contadores de
      altas/actualizaciones/omitidas + muestra de filas + lista de excepciones, sin persistir
      nada); (2) confirmar (recorre el MISMO archivo con la MISMA funcion de proceso y persiste).
      Upsert idempotente por una clave de negocio explicita, y reporte de excepciones por fila
      dividido en bloqueantes (la fila no se importa) e informativas (se importa con un valor por
      defecto).
    cuando_usar: >
      Cualquier import de datos masivos desde un archivo que el usuario sube por pantalla:
      migracion de catalogo legado, listas de precios de proveedor, padrones, importacion de
      historicos. No aplica a sincronizacion contra una API externa (ver FabaImportService en
      labipac para ese caso).
    proyecto_origen: la-platense (Etapa 3, migracion de catalogo)
    proyectos_que_lo_usan: []
    archivos_referencia:
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Application/Interfaces/ICatalogoMigracionService.cs (REMOVIDO — ver nota)"
        motivo: "Contrato completo del patron (previsualizar / obtener preview / listar excepciones / exportar / confirmar)"
        pendiente_verificar: true
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Infrastructure/Services/CatalogoMigracionService.cs (REMOVIDO — ver nota)"
        motivo: "Implementacion: staging por token validado como Guid, lectura ClosedXML por nombre de columna, upsert por lotes, excepciones"
        pendiente_verificar: true
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Web/Controllers/MigracionCatalogoController.cs (REMOVIDO — ver nota)"
        motivo: "Coordinacion HTTP: limite de request elevado, sesion de revision de excepciones, confirmar"
        pendiente_verificar: true
      - proyecto: marihogar
        path: "tools/ImportarHistorico/Program.cs"
        motivo: "Precedente batch (consola de un solo uso) del mismo problema: ClosedXML + escribir entidades directo sin pasar por los Services de negocio"
        pendiente_verificar: false
    dependencias:
      - PAT-008
    notas: >
      Cinco decisiones que hacen que el patron funcione y conviene copiar tal cual:
      (1) UNA sola funcion de proceso con un flag `persistir` — garantiza que el preview no pueda
      desalinearse de lo que realmente pasa al confirmar;
      (2) el archivo subido queda en staging (temp del SO) con un token validado como Guid antes de
      construir cualquier ruta (evita path traversal), junto a un JSON con el analisis, para que el
      reporte de excepciones se pueda paginar/exportar despues sin re-parsear el archivo;
      (3) todas las consultas de matcheo usan `IgnoreQueryFilters()`: el indice unico de MySQL no
      distingue soft-deleted, asi que un registro dado de baja sigue ocupando su clave y hay que
      revivirlo en vez de fallar el insert;
      (4) el import NUNCA pisa los campos que el sistema nuevo calcula o el usuario administra a
      mano (stock, clasificaciones manuales) — una reimportacion no debe perder trabajo hecho;
      (5) subir el limite de request (`RequestSizeLimit`/`RequestFormLimits`): el default de Kestrel
      es 30 MB y un archivo de catalogo completo lo supera.
      Limitacion conocida a resolver si el volumen es grande: corre sincrono dentro del request
      HTTP. Con decenas de miles de filas conviene partir el archivo en tandas (la idempotencia lo
      hace seguro) o mover el proceso a un hosted service.
      CAVEAT 2026-08-17: en la-platense el cliente decidio que la migracion de catalogo real es
      un caso de uso UNICO (una sola vez, con acceso directo al backup del cliente), y pidio
      resolverla con un script de consola (tools/MigracionCatalogo, ver PAT-013 y
      5-implementador.md) en vez de esta pantalla web — los 3 archivos de
      ICatalogoMigracionService/CatalogoMigracionService/MigracionCatalogoController fueron
      commiteados y luego borrados en la misma etapa (commits 71daf36 y 42cae2a). El patron
      preview->confirmar sigue vigente para cualquier import RECURRENTE por archivo (ej. futura
      importacion de listas de precios de proveedor) — para la-platense especificamente, la
      referencia viva de ese caso ya no existe en el working tree, solo en el historial de git.

  - id: PAT-013
    nombre: "Stock arranca en cero + verificacion por conteo, priorizada por rotacion ABC"
    categoria: dominio
    descripcion: >
      Estrategia para llevar el stock de un sistema nuevo (post-migracion desde un sistema
      legado, o alta inicial de catalogo) al stock fisico real, sin bloquear la operacion del
      negocio ni exigir un inventario general de una sola vez. Tres piezas: (1) todo producto
      nuevo/migrado arranca con Stock=0 y un flag StockVerificado=false — el sistema nunca
      inventa un numero de partida, porque el stock del sistema legado (si existe) no es
      confiable; (2) el unico camino para pasar a verificado es el ajuste manual auditado
      (usuario, fecha, cantidad anterior/nueva, motivo obligatorio) — nunca una carga masiva
      silenciosa; (3) el conteo fisico se prioriza por clasificacion ABC (rotacion de ventas,
      ver PAT de clasificacion ABC si se cataloga aparte): oleada A primero (pocos productos,
      alto impacto), oleada B despues, y la oleada C (la mayoria del catalogo, bajisimo impacto
      individual) se resuelve por "verificacion organica" — se cuenta el producto la proxima vez
      que se vende o se repone, en vez de dedicarle un operativo aparte.
    cuando_usar: >
      Cualquier proyecto que migre o de alta un catalogo con muchos items (cientos a cientos de
      miles) donde el numero de stock de origen no es confiable o no existe, y no es viable
      frenar el negocio para un inventario general. Requiere tener o poder calcular alguna
      clasificacion de importancia/rotacion por item (ABC por ventas, frecuencia de pedido,
      valor, etc.) para poder priorizar las oleadas — sin eso, el patron se reduce solo a las
      piezas (1) y (2).
    proyecto_origen: la-platense (Etapa 3, migracion de catalogo — 112.485 productos migrados
      desde un sistema legado sin stock confiable)
    proyectos_que_lo_usan: []
    archivos_referencia:
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Domain/Entities/Producto.cs"
        motivo: "Campos Stock (arranca en 0) y StockVerificado (bool, arranca en false)"
        pendiente_verificar: false
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Infrastructure/Services/AjusteStockService.cs"
        motivo: "AplicarAjusteAsync: unico camino a StockVerificado=true, con AjusteStock (entidad de auditoria: usuario, fecha, cantidad anterior/nueva, motivo obligatorio) e HistorialAsync para consultarla"
        pendiente_verificar: false
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Web/Controllers/StockController.cs, Views/Stock/Index.cshtml"
        motivo: "Filtros combinables de Categoria + Clasificacion ABC + Verificado, base para armar las planillas de conteo por oleada/sector sin necesitar un reporte nuevo"
        pendiente_verificar: false
    dependencias: []
    notas: >
      El documento entregado al cliente de La Platense (manual de usuario + plan de
      sincronizacion, 2026-08-17) es el artefacto de comunicacion de este patron — reutilizable
      como plantilla de redaccion, no solo el codigo: contexto (por que el stock arranca en
      cero), plan de oleadas A/B/C con "verificacion organica" para la cola larga, y como medir
      avance con los filtros ya existentes en vez de pedir un reporte nuevo de entrada. Si el
      volumen de conteo lo justifica en un proyecto futuro, la mejora natural es agregar un
      indicador de "% verificado por categoria/oleada" sobre la misma pantalla de Stock — no
      construirlo de entrada, esperar a que se pida.

  - id: PAT-014
    nombre: "Restablecer contraseña por email (olvide mi contraseña)"
    categoria: infraestructura
    descripcion: >
      Flujo estandar sobre ASP.NET Core Identity: link "Olvidaste tu contraseña?" en Login ->
      ForgotPassword (solo email) -> GeneratePasswordResetTokenAsync + email con link
      (userId+token) -> ResetPassword -> ResetPasswordAsync. La respuesta de ForgotPassword es
      SIEMPRE la misma exista o no el email (no delata cuentas registradas via enumeracion), y
      tiene su propia politica de rate limiting ("password-reset", igual a la de "login") para
      que no sea vector de spam de emails ni de fuerza bruta de token.
    cuando_usar: >
      Cualquier proyecto BlankProject con Identity + login por email/password (practicamente
      todos) que necesite que el usuario pueda recuperar el acceso sin intervencion manual del
      administrador.
    proyecto_origen: la-platense
    proyectos_que_lo_usan:
      - blankproject (portado al baseline el mismo dia — todo proyecto nuevo lo trae de entrada)
    archivos_referencia:
      - proyecto: blankproject
        path: "BlankProject.Web/Controllers/AccountController.cs (acciones ForgotPassword/ResetPassword)"
        motivo: "Implementacion completa y ya portada al baseline — cualquier proyecto nuevo la hereda sin copiar nada"
        pendiente_verificar: false
      - proyecto: blankproject
        path: "BlankProject.Web/Models/PasswordResetViewModels.cs"
        motivo: "ForgotPasswordViewModel + ResetPasswordViewModel"
        pendiente_verificar: false
      - proyecto: blankproject
        path: "BlankProject.Web/Views/Account/ForgotPassword.cshtml, ForgotPasswordConfirmacion.cshtml, ResetPassword.cshtml"
        motivo: "3 vistas nuevas, mismo estilo ov-login-card que Login.cshtml"
        pendiente_verificar: false
    dependencias: []
    notas: >
      No agrega ninguna dependencia nueva: reutiliza IEmailService/EmailService (MailKit, ya
      presente en el baseline) y AddDefaultTokenProviders() de Identity (ya registrado, lifespan
      default de 24hs — si un proyecto necesita otro valor, Configure<DataProtectionTokenProviderOptions>).
      El texto de marca en el email ("BlankProject") es placeholder de plantilla, igual que el
