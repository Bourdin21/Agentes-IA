  - id: PAT-003
    nombre: "MetodoPago (venta con pago dividido en multiples medios + IVA)"
    categoria: financiero
    descripcion: >
      Venta con N lineas de producto (VentaDetalle: PorcentajeIVA/ImporteIVA por linea, el
      IVA es propiedad de la linea de producto) y N lineas de pago independientes (VentaPago:
      MedioPago, Importe, + campos condicionales segun medio — CantidadCuotas/
      PorcentajeFinanciamiento para Cuotas, FechaVencimiento para Cheque). Soporta pago
      dividido entre varios medios (ej. parte efectivo, parte tarjeta, parte transferencia)
      sobre una misma venta.
    cuando_usar: >
      Cualquier modulo de ventas/cobros que necesite mas de un medio de pago por venta,
      financiamiento en cuotas, o venta con IVA aplicado por linea de producto.
    proyecto_origen: ShowroomGriffin (Ventas)
    proyectos_que_lo_usan:
      - vinosefue
      - ganaderia (guard "al menos un item" sobre Pagos[i], ver GAN-001 en 32-estandares-qa-implementador.instructions.md)
    archivos_referencia:
      - proyecto: ShowroomGriffin
        path: "ShowroomGriffin.Domain/Entities/Ventas/VentaPago.cs"
        motivo: "Entidad con CantidadCuotas + validacion condicional por medio"
        pendiente_verificar: false
    dependencias: []
    notas: >
      Ver tambien REG-006 y REG-008 en docs/qa/regresiones-manuales.yml (bugs historicos
      ya corregidos, este es el estado post-fix). Ver la seccion "Venta con IVA + pago
      dividido en multiples metodos" en 32-estandares-qa-implementador.instructions.md
      (agregada 2026-08-15) para la regla de validacion obligatoria: la suma de
      VentaPago.Importe debe ser exactamente igual al Total de la venta (que ya incluye
      IVA) — bloqueante en JS y en Service, nunca solo uno de los dos lados.

  - id: PAT-004
    nombre: "RowVersion manual para concurrencia optimista en MySQL"
    categoria: infraestructura
    descripcion: >
      MySQL no soporta rowversion store-generated como SQL Server — asignar RowVersion
      manualmente en SaveChanges/SaveChangesAsync del DbContext, y configurar la propiedad
      con IsConcurrencyToken().ValueGeneratedNever().IsRequired() en el Fluent API.
    cuando_usar: >
      Cualquier entidad nueva con control de concurrencia optimista sobre MySQL + EF Core
      (baseline BlankProject).
    proyecto_origen: ShowroomGriffin
    proyectos_que_lo_usan: []
    archivos_referencia:
      - proyecto: ShowroomGriffin
        path: "ShowroomGriffin.Infrastructure/Data/AppDbContext.cs"
        motivo: "Asignacion manual de RowVersion en SaveChanges/SaveChangesAsync"
        pendiente_verificar: false
      - proyecto: ShowroomGriffin
        path: "ShowroomGriffin.Infrastructure/Data/Configurations/Productos/VarianteProductoConfiguration.cs"
        motivo: "Config Fluent API de referencia"
        pendiente_verificar: false
    dependencias: []
    notas: >
      Ver REG-001 en docs/qa/regresiones-manuales.yml — patron de arquitectura derivado
      directamente de ese bug. Codificar esto DESDE EL DISEÑO en cualquier proyecto nuevo
      con MySQL, no esperar a que se reproduzca el bug.

