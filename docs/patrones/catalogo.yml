  - id: PAT-035
    nombre: "Limites de gasto mensual de IA por organizacion y miembro, verificados antes de cada llamada al modelo"
    categoria: dominio
    descripcion: >
      En un SaaS multi-tenant que paga los tokens, cada organizacion tiene un tope mensual en USD (fijado por el
      staff, con valor por defecto) y cada miembro un tope opcional (fijado por el rol superior, nunca mayor que el
      de la organizacion; rige el menor). El consumo del mes (calendario local) se calcula sumando el costo guardado
      por paso del modelo (valor del momento: cambiar precios no altera meses pasados). Un servicio de control
      devuelve el estado con el MOTIVO del bloqueo (organizacion o miembro) y se evalua al crear tareas o ajustes y
      antes de cada llamada al modelo; al alcanzarlo, el turno se cierra con mensaje claro y se retoma con un ajuste
      cuando hay margen. Avisos al umbral y al 100 % una sola vez por periodo, umbral y destinatario (tabla de
      dedupe con indice unico). Pantalla de consumo por rol (organizacion con detalle por miembro, area, agente y
      cliente; miembro solo lo propio). Con API key propia del cliente no aplica.
