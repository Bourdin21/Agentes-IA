  - id: PAT-021
    nombre: "Modo de precio por item: formula vs. valor manual, con exclusion explicita del recalculo batch"
    categoria: negocio
    descripcion: >
      Un catalogo cuyo precio se DERIVA de una formula (cantidad x tasa, peso x valor del kilo,
      horas x tarifa) tarde o temprano recibe un item que no encaja en esa formula — un tramite
      administrativo en un laboratorio, un flete en un catalogo de productos, una multa en un
      catalogo de servicios. La solucion NO es forzar el item a la formula con decimales o
      cantidades ficticias: eso deja el precio a merced del proximo cambio de tasa, que es
      exactamente el problema que se queria evitar. El patron: el item declara un ModoPrecio
      (enum, default = el modo derivado, valor 1 en DB para que la migracion no toque nada) y
      cada modo tiene UN escritor unico y exclusivo de su campo de precio. Piezas no negociables:
      (1) el recalculo batch de la tasa FILTRA por modo — el item manual queda fuera a proposito,
      y ese filtro es el corazon del patron; (2) el campo del modo inactivo se OCULTA Y SE
      DESHABILITA en el formulario (deshabilitado no se envia ni valida en HTML5: un campo
      invisible nunca puede bloquear el submit), y el controller escribe solo el campo del modo
      activo, de forma que alternar de modo y volver no pierde el dato del otro; (3) la validacion
      "obligatorio >= 1" del campo derivado pasa de DataAnnotation a IValidatableObject
      CONDICIONADA al modo, porque un [Range] incondicional bloquea el guardado por un campo que
      el usuario no ve; (4) si el precio varia por otra dimension (centro, sucursal, lista), la
      tabla de valores manuales es ACOTADA — una fila por (item manual x dimension), NO una matriz
      completa del catalogo — y la falta de una fila BLOQUEA la operacion con mensaje accionable
      en vez de cobrar $0; (5) si el item derivado puede ser COMPONENTE de un agregado (combo,
      perfil, kit) cuyo total se calcula sumando la formula, hacen falta las DOS mitades de la
      regla: rechazar un componente manual al armar el agregado, Y rechazar el pase a manual de un
      item que ya es componente — con solo la primera, la regla se evita en un paso y el agregado
      pierde volumen (y precio) en silencio, sin que nadie lo haya editado.
    cuando_usar: >
      Cualquier catalogo con precio derivado por formula que necesite convivir con items de precio
      fijo, y en general cualquier entidad donde un mismo campo persistido puede tener dos
      escritores distintos segun una condicion del negocio. No usar si TODOS los items encajan en
      la formula (el enum agrega complejidad sin pagarla), ni si el precio fijo puede vivir en una
      entidad separada sin compartir el resto del ciclo de vida del item.
    proyecto_origen: labipac (sesion 7, 2026-09-03 — caso real LIBRETA SANITARIA, un tramite administrativo dentro de un catalogo de practicas de laboratorio cotizadas por unidades bioquimicas)
    proyectos_que_lo_usan:
      - "koi (Etapas 19 y 26, 2026-09-10) — conceptos porcentuales del Estado de Resultados: flag ImporteEditadoManual por fila y por periodo (pieza 1: el recalculo batch saltea las filas manuales). Variante que agrega la Etapa 26: el recalculo NUNCA pisa en silencio una fila manual — devuelve la lista viejo -> nuevo, el usuario confirma (con tilde por fila) y un endpoint aparte pisa solo lo confirmado, reenviando los importes que el usuario VIO para no pisar una fila que cambio entretanto (chequeo optimista por valor, sin RowVersion). En un GET no se pisa nada con valor; solo se completan vacios. Migracion de datos que marca como manuales las filas heredadas cuyo importe no coincide con base x % (tolerancia 1 centavo por Math.Round al par vs ROUND de MySQL), con AuditLog por fila para un Down exacto. Archivos: KoiDumplings.Infrastructure/Services/EstadoResultadosService.cs (RecalcularInternamente, PisarConceptosManualesAsync), Views/EstadoResultados/Mensual.cshtml (confirmarPisadoManuales), Migrations/20260910162303_E22_PorcentualesManualesHeredados.cs"
    archivos_referencia:
