      el cliente, y pedir aprobacion para todo la vuelve inusable. Si el riesgo es siempre el mismo, alcanza con PAT-034.
      El NIVEL de quien aprueba puede quedar estatico: hacerlo variable tambien agrega superficie al motor y casi nunca
      hace falta si el cliente ya puede configurar que se aprueba y que no.
