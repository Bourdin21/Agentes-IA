        path: "src/OlvidataAgentes.Web/Controllers/ReglasController.cs + Views/Reglas/* + Views/Shared/_ReglasEfectivas.cshtml + Views/Agentes/Ejecutar.cshtml"
        motivo: "Listado por pestañas con filtros por columna, formulario con opciones avanzadas y mismo tema, detalle con historial, vista previa"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "nucleo/plataforma/plataforma.yml + Services/Nucleo/ImportadorRubro.cs (reglas_plataforma)"
