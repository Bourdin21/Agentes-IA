    notas: >
      Gotchas CONFIRMADOS al implementar: (1) NO escribir una columna de la conexion (tipo "ultimo uso") dentro del commit
      del motor: eso arrastra el token de concurrencia de la conexion al guardado de la tarea y un admin editandola a mitad
      de una tarea la hace fallar por conflicto sin ningun motivo real — el ultimo uso se calcula del historial con un
      GROUP BY; (2) validar la IP antes de llamar y despues conectar POR NOMBRE deja una ventana de DNS rebinding: hay que
      validar en el ConnectCallback y conectar a la direccion ya validada; (3) apagar AllowAutoRedirect es obligatorio, si
      no alcanza con que el destino conteste un 302 hacia donde quiera; (4) dejar que el modelo arme la URL entera hace que
      la lista blanca sea la unica defensa — con ruta relativa mas validacion del resultado hacen falta dos fallas (probar
      "//evil.com/x", que cambia de host sin parecer absoluta); (5) la opcion que habilita destinos privados (necesaria
      para probar contra un servidor local) tiene que CORTAR EL ARRANQUE fuera de desarrollo, como cualquier interruptor
      de seguridad; (6) el registro guarda el destino SIN querystring: ahi es donde viajan los tokens; (7) en MySQL, con
      utf8mb4_0900_ai_ci la unicidad del codigo es insensible a mayusculas y tildes — conviene normalizar el codigo a
      minusculas al guardarlo para que el comportamiento sea el mismo en la base y en memoria.

  - id: PAT-044
    nombre: "Aprobacion humana decidida POR LLAMADA, no por herramienta (fail-closed en el motor)"
    categoria: agentes-ia
    descripcion: >
      Extension de PAT-034. Hay herramientas donde "necesita aprobacion" no es una propiedad de la herramienta sino de la
      llamada concreta: leer de un sistema externo puede ir sin aprobacion si la organizacion lo habilito, pero escribir o
      mandar datos afuera la pide siempre. Se resuelve con una interfaz extra
      (IHerramientaAprobacionPorLlamada : IHerramientaConAprobacion) con un metodo asincronico que recibe el contexto y la
      entrada y decide. Las dos reglas que hacen que sea confiable:
      (1) la propiedad estatica RequiereAprobacion sigue devolviendo TRUE, asi una herramienta con aprobacion condicional
      que el motor no llegue a consultar pasa igual por aprobacion; (2) el motor envuelve la consulta en un try/catch que
      ante CUALQUIER error devuelve true. Es decir: la decision de dejar pasar algo tiene que ser una respuesta explicita,
      nunca la consecuencia de que algo fallo. La decision se resuelve contra la BASE (la configuracion de la conexion) y
      la entrada, jamas contra texto del modelo, y no tiene efectos (se llama tambien al reanudar).
      El motor lo resuelve en UN SOLO helper usado en los tres puntos donde antes se leia la propiedad: el recorrido de
