      bloquear la restauracion por Id. El lock tiene que abrirse ANTES de la reversion, no entre
      reversion y alta, o se reintroduce la carrera de lectura de saldo que motivo el lock.

  - id: PAT-024
    nombre: "Cache de token de API externa con vigencia informada por el servidor"
    categoria: integracion
    descripcion: >
      Cache Singleton del token/ticket de una API externa que autentica por login con
      expiracion. Cuatro decisiones que juntas son el patron: (1) la vigencia se toma de lo que
      informa el SERVIDOR en la respuesta del login (expirationTime de AFIP, aliveTime de
      Ayres), nunca de una constante asumida; (2) margen de seguridad antes del vencimiento
      real, para no arrancar una operacion larga con un token que muere a la mitad;
      (3) SemaphoreSlim(1,1) con RE-chequeo de validez DENTRO del lock, para que dos requests
      concurrentes no disparen dos logins; (4) Invalidar() + UN SOLO reintento cuando el server
      rechaza un token que localmente creiamos vigente.
    cuando_usar: >
      Cualquier integracion con una API externa que autentique por login con token de vida
      corta y varias llamadas por operacion (chunking, lotes, reportes paginados). Si la API
      usa headers estaticos sin expiracion (caso QuickPass) NO aplica: no hace falta cache.
    proyecto_origen: >
      marihogar (MariHogar.Infrastructure/Services/AfipTokenCache.cs, WSAA ticket de 12hs) —
      antecedente conceptual en delicias-naturales. Extraido como patron propio el 2026-09-08
      al reutilizarlo en koi para un caso que no tiene nada que ver con AFIP.
    proyectos_que_lo_usan:
      - koi (Ayres POS, E2-01, 2026-09-08)
    archivos_referencia:
      - proyecto: marihogar
        path: "MariHogar.Infrastructure/Services/AfipTokenCache.cs"
        motivo: "Implementacion original, en produccion. Cachea la tupla (Token, Sign) de WSAA con la expirationTime real que devuelve AFIP y margen de 10 minutos"
        pendiente_verificar: false
      - proyecto: koi
        path: "KoiDumplings.Infrastructure/Services/AyresTokenCache.cs"
        motivo: "Adaptacion a un unico token JWT con aliveTime en SEGUNDOS y margen de 60 s. Muestra la forma generica del patron: ObtenerAsync(loginFactory, ct) recibe el login como delegate, asi el cache no sabe nada del protocolo de la API"
        pendiente_verificar: false
      - proyecto: koi
        path: "KoiDumplings.Infrastructure/DependencyInjection.cs"
        motivo: "El registro que hace que el patron funcione: AddSingleton<AyresTokenCache>() + AddScoped<IAyresService>()"
        pendiente_verificar: false
    dependencias: []
    notas: >
      EL ERROR CLASICO, y no da error visible: registrar el cache como Scoped (o el servicio
      como Singleton). El token se pierde entre requests y se dispara un login por llamada —
      4 logins por mes importado en vez de 1 — sin ninguna excepcion ni log de error, solo
      trafico y latencia de mas. Verificar SIEMPRE los ciclos de vida al registrar.
      Segunda trampa: si el servidor no informa vigencia (campo ausente o <= 0), NO inventarle
      una duracion — dejar el token vencido de entrada, que degrada a "un login por llamada"
      (lento pero correcto) en vez de fallar con 401 a mitad de una operacion.
      Tercera: el reintento tiene que ser UNO SOLO. Si la credencial cambio de verdad,
      reintentar en bucle solo genera logins fallidos contra el servidor del tercero.

  - id: PAT-025
    nombre: "Cola de trabajo en segundo plano con scope propio (mails que no bloquean la respuesta)"
    categoria: infraestructura
    descripcion: >
      IBackgroundJobQueue (Singleton, Channel acotado) + BackgroundJobWorker (BackgroundService)
      que drena la cola de a un trabajo por vez, cada uno en un scope de DI PROPIO creado con
      IServiceScopeFactory. Reemplaza el patron `_ = Task.Run(() => _servicioScoped.HacerAlgoAsync())`,
      que captura en la clausura un servicio scoped del request: cuando el request termina se
      dispone el scope y con el el DbContext, y la tarea sigue corriendo contra objetos dispuestos.
      El trabajo encolado recibe el IServiceProvider del scope nuevo y resuelve ahi adentro lo que
      necesita; en la clausura solo viajan datos (ids, strings). Toda excepcion queda logueada.
    cuando_usar: >
      Cualquier accion HTTP que dispare trabajo lento y no critico para la respuesta —
      tipicamente envio de mails por SMTP: restablecer contraseña, notificaciones masivas,
      avisos de cierre. Tambien cuando el tiempo de respuesta es en si mismo informacion
      sensible (anti-enumeracion de cuentas): sacar el SMTP del request iguala las dos ramas.
    proyecto_origen: koi
    proyectos_que_lo_usan: []
    archivos_referencia:
      - proyecto: koi
        path: "KoiDumplings.Application/Interfaces/IBackgroundJobQueue.cs"
        motivo: "Contrato: Encolar(nombre, Func<IServiceProvider, CancellationToken, Task>). El nombre es lo unico que aparece en el log si el trabajo falla"
        pendiente_verificar: false
      - proyecto: koi
        path: "KoiDumplings.Infrastructure/Services/BackgroundJobQueue.cs"
        motivo: "Cola (Channel acotado, DropWrite) + BackgroundJobWorker con el scope por trabajo y el catch que hace visible el fallo"
        pendiente_verificar: false
      - proyecto: koi
        path: "KoiDumplings.Infrastructure/DependencyInjection.cs"
        motivo: "El registro que hace que funcione: AddSingleton<BackgroundJobQueue>() + AddSingleton<IBackgroundJobQueue>(sp => sp.GetRequiredService<BackgroundJobQueue>()) + AddHostedService<BackgroundJobWorker>()"
        pendiente_verificar: false
      - proyecto: koi
        path: "KoiDumplings.Web/Controllers/AccountController.cs (ForgotPassword) y NotificacionCierreController.cs (EnviarMasivo)"
        motivo: "Los dos usos: token y link se arman en el request (dependen de UserManager y Url.Action); al trabajo solo viajan strings. NOTA 2026-09-11: el segundo uso ERA EstadoResultadosController.ConfirmarCierre; se movio a EnviarMasivo cuando el dueño decidio que cerrar un periodo no notifique (KOI-B06). El patron no cambia, cambio quien lo dispara"
        pendiente_verificar: false
    dependencias:
      - PAT-014
    notas: >
      SINTOMA QUE LO MOTIVO (KOI, 2026-09-10): dos `Task.Run` fire-and-forget sobre un servicio
      scoped que usa el DbContext. Funcionaban por carrera ganada — el request devolvia un
      redirect y la tarea alcanzaba a leer antes del dispose. Bajo carga, o con SMTP lento, el
      periodo quedaba cerrado y los inversores sin mail, con CERO rastro en el log porque el
      fire-and-forget no tenia catch. Ese es el motivo por el que un problema asi puede llevar
      meses sin detectarse: no falla, desaparece.
      REGLA: lo que dependa del request (Url.Action, UserManager del usuario logueado, Request.Host,
      PathBase) se resuelve ANTES de encolar y viaja como dato. Nunca se captura un servicio.
      LIMITE DELIBERADO: es una cola en memoria. Si el sitio se recicla (IIS) con trabajos
      pendientes, se pierden. Sirve para mails reintentables a mano; NO para nada que tenga que
      sobrevivir un reinicio — eso va a la base.
      Un `IEmailService` sin estado (solo IOptions + MailKit, no IDisposable, sin DbContext) NO
      sufre este bug aunque se lo capture: por eso `ErrorNotifier.NotifyError` se dejo como
      estaba. El bug aparece cuando el servicio capturado toca el DbContext.

