    notas: >
      Gotchas: (1) si el boton de la plantilla lo resuelve un arbol fijo que asume una sola linea de
      producto, cambiar solo la plantilla produce una conversacion incoherente — el handler del boton
      tiene que leer la oferta; (2) "web vacia" en Places no garantiza "no tiene web": las plantillas de
      la oferta web no deben afirmarlo; (3) mantener grupos de rubro y dominios en la misma fuente unica
      que el vocabulario de rubros (una segunda lista editable ya causo desincronizaciones en crm-olvidata
      CRM-007/016); (4) medir por oferta desde la primera tanda: la señal web tiende a absorber la mayoria
      del volumen de pymes chicas.
      VARIANTE COMBO (crm-olvidata, decision de Joaquin 2026-09-14): todos reciben la misma oferta
      (paquete de varias lineas) y la tabla de decision elige solo el GANCHO (por que dolor abre el
      mensaje); cada plantilla abre con el dolor del gancho y suma el resto del paquete en una sola frase.
      La linea "historica" (sistema de gestion) usa su plantilla de campaña vigente como fallback mientras
      la plantilla combo no este aprobada, asi no se frena el volumen existente. Riesgo propio: un mensaje
      con varios productos reparte el foco frente a uno de un solo dolor — medir tasa de respuesta por
      gancho contra la linea base anterior. El precio de paquete tiene que existir antes de la primera
      propuesta.
      ARQUITECTURA (crm-olvidata 2026-09-14, ver 3-arquitecto-mvc.md §7.2): regla de decision como helper
      estatico puro en Application (dominios comparados en memoria, nunca en query EF por MH-001); metodo
      de dominio unico para asignar el gancho (CRM-001, varios puntos de alta); el filtro "sin plantilla
      disponible" va ANTES del Take(cupo) del lote o un contacto salteado consume cupo; las guardas de
      rename/borrado de plantillas y el diagnostico de "plantilla sin uso" tienen que contemplar tambien
      las plantillas referenciadas desde configuracion; revisar el follow-up automatico: si su texto es
      de una sola linea de producto, contradice la oferta combo.

  - id: PAT-032
    nombre: "Agente que propone cambios de configuracion como tarjetas confirmables, ejecutados por el servicio de negocio"
    categoria: dominio
    descripcion: >
      Un agente IA conversa con un usuario con permisos de configuracion (ej. Director) y, en lugar de
      modificar datos, usa herramientas de PROPUESTA que persisten cambios estructurados (nueva regla,
      cambio con version vista, desactivacion, activar sugerencia) en estado Pendiente. Las herramientas
      de LECTURA estan acotadas por codigo a lo que ese usuario puede ver. Cada propuesta se muestra como
      tarjeta en la conversacion (donde aplica en lenguaje llano, antes/despues, por que) con Aplicar,
      Editar y aplicar, Descartar y Aplicar todas; aplicar ejecuta el MISMO servicio de negocio que el
      formulario (permisos, limites, versiones) y verifica si el dato cambio desde la propuesta. El texto
      de la conversacion nunca cuenta como confirmacion.
    cuando_usar: >
      Configuraciones complejas que usuarios no tecnicos prefieren describir con sus palabras, donde un
      cambio equivocado tiene impacto amplio y hace falta confirmacion humana explicita y trazable.
    proyecto_origen: olvidata-agentes-multirubro (M4b, implementado 2026-09-14; ampliado en M7a 2026-09-15 a los agentes de TRABAJO)
