  - id: PAT-027
    nombre: "Jerarquia de roles dentro del tenant con invariante de responsable activo y refresco inmediato de sesion"
    categoria: dominio
    descripcion: >
      En un SaaS multi-tenant, cada usuario de una organizacion tiene un rol propio de la
      organizacion (ej. Director/Empleado) distinto de los roles de staff de la plataforma, y
      opcionalmente un agrupador (area/equipo). Un servicio de permisos por rol es la unica
      fuente de verdad para services, controllers y vistas. Invariante: la organizacion siempre
      conserva al menos un responsable activo (no se puede degradar ni bloquear al ultimo).
      Todo cambio de rol, agrupador o bloqueo impacta en la sesion del usuario afectado en su
      proxima request, no al vencer la cookie. Las consultas de usuarios (que no tienen filtro
      automatico de tenant) se acotan siempre explicitamente a la organizacion de la sesion.
    cuando_usar: >
      Portales B2B donde el cliente administra su propia estructura interna (quien gestiona,
      quien opera, en que area) sobre un sistema multi-tenant, con alta de usuarios controlada
      o no por la plataforma.
