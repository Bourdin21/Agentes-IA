        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "tests/OlvidataAgentes.Tests/PortalAnatomiaTests.cs"
        motivo: "Test de centinelas por HTTP (WebApplicationFactory) sobre todas las URLs de cliente + control positivo del staff"
