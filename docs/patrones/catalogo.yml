      nombre de quien la pide y el vinculo se guarda en el mismo commit (el servicio de asignaciones prepara el vinculo sin
      SaveChanges); (4) la tarea de agente que propone el asistente queda a nombre del responsable que aplica; (5) usuarios sin
      filtro de tenant: TenantId explicito; (6) el asistente no recibe las reglas de la empresa como instrucciones (formato de
      contexto propio, golden de hash); (7) notificar despues del commit, en try/catch; (8) **la consulta de visibilidad no es
      un permiso**: cada accion vuelve a verificar rol, organizacion y autoria (ver PAT-017 y la leccion OLV-010); (9) en
      MySQL, una columna date NO materializa un DateOnly en una proyeccion anonima (InvalidCastException): hace falta un
      ValueConverter DateOnly<->DateTime aunque la columna siga siendo date.

  - id: PAT-040
    nombre: "Bateria de casos de prueba de prompts versionada en el repositorio, con corrida acotada por tope y calificacion determinista mas modelo juez"
    categoria: dominio
    descripcion: >
      Los casos que prueban un prompt viven en ARCHIVOS del repositorio (una seccion mas del manifiesto) y se versionan por
      hash como los prompts: si el archivo no cambia, no hay version nueva. Hay casos propios de cada prompt y SUITES
      COMUNES que se corren con todos los del mismo tipo. Una corrida evalua UNA version: arma el contexto con el MISMO
      render que las conversaciones reales (el mismo prompt, la misma declaracion de precedencia, reglas simuladas solo en
      memoria), OFRECE las herramientas del prompt pero nunca las resuelve (cada pedido recibe el resultado fijo del caso o
      un error controlado), corre hasta N pasos, y califica primero con verificaciones deterministas (contiene, no
      contiene, expresion, largo, usa/no usa herramienta, termino bien, no revela instrucciones) y despues con un MODELO
      JUEZ distinto del evaluado, un criterio por vez, con la respuesta envuelta como dato y el veredicto en JSON validado
      estricto; un veredicto ilegible deja el caso en Error, nunca en Fallo. Antes de CADA llamada se comparan dos topes
      (el de la corrida y el del mes) para que el exceso quede acotado a una llamada; el corte conserva lo hecho y se
      continua sin repetir. Un SaveChanges por (caso, repeticion) con indice unico hace la reanudacion idempotente. Al
      terminar se agregan las repeticiones (un caso pasa solo si pasa en todas), se compara contra la version publicada
      (Igual / Mejoro / Regresion / Nuevo) y se calcula el resultado global: Aprobada exige 100 % de los casos de
      seguridad y criticos, un umbral en los generales y ninguna regresion critica.
    cuando_usar: >
      Todo producto donde un prompt cambia y llega a clientes: da una medida repetible antes de publicar, sin depender de
      leerlo a ojo. Tambien sirve como plantilla de cualquier proceso pago, largo y reanudable que un worker ejecuta de a
      uno.
