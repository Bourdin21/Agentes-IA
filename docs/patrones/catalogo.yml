    notas: >
      Nacio como correccion de un modelo previo (PAT no catalogado) en el que el precio de TODO el
      catalogo se derivaba de una unica tasa. El cliente habia propuesto como workaround usar
      cantidades con decimales para forzar el precio deseado; se descarto porque no resuelve el
      problema de fondo — el precio se sigue recalculando con cada cambio de tasa. Vale la pena
      registrar dos cosas que en labipac hubo que descubrir implementando: (a) la segunda mitad de
      la pieza 5 (bloquear el pase a manual de un componente) NO estaba en el pedido y es la
      decision mas discutible del patron — se agrego porque sin ella la regla es evitable en un
      paso, pero conviene confirmarla con el cliente porque se siente rigida; (b) la contrapartida
      permanente del modo manual es que ningun aumento general lo alcanza, asi que el patron tiene
      que venir acompanado de VISIBILIDAD de lo que falta cargar (badge de faltantes, fila propia
      en el reporte de diagnostico), no de automatismo — automatizarlo seria volver al problema.
