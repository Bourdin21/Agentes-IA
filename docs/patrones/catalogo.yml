  - id: PAT-013
    nombre: "Stock arranca en cero + verificacion por conteo, priorizada por rotacion ABC"
    categoria: dominio
    descripcion: >
      Estrategia para llevar el stock de un sistema nuevo (post-migracion desde un sistema
      legado, o alta inicial de catalogo) al stock fisico real, sin bloquear la operacion del
      negocio ni exigir un inventario general de una sola vez. Tres piezas: (1) todo producto
      nuevo/migrado arranca con Stock=0 y un flag StockVerificado=false — el sistema nunca
      inventa un numero de partida, porque el stock del sistema legado (si existe) no es
      confiable; (2) el unico camino para pasar a verificado es el ajuste manual auditado
      (usuario, fecha, cantidad anterior/nueva, motivo obligatorio) — nunca una carga masiva
      silenciosa; (3) el conteo fisico se prioriza por clasificacion ABC (rotacion de ventas,
      ver PAT de clasificacion ABC si se cataloga aparte): oleada A primero (pocos productos,
      alto impacto), oleada B despues, y la oleada C (la mayoria del catalogo, bajisimo impacto
      individual) se resuelve por "verificacion organica" — se cuenta el producto la proxima vez
      que se vende o se repone, en vez de dedicarle un operativo aparte.
    cuando_usar: >
      Cualquier proyecto que migre o de alta un catalogo con muchos items (cientos a cientos de
      miles) donde el numero de stock de origen no es confiable o no existe, y no es viable
      frenar el negocio para un inventario general. Requiere tener o poder calcular alguna
      clasificacion de importancia/rotacion por item (ABC por ventas, frecuencia de pedido,
      valor, etc.) para poder priorizar las oleadas — sin eso, el patron se reduce solo a las
      piezas (1) y (2).
    proyecto_origen: la-platense (Etapa 3, migracion de catalogo — 112.485 productos migrados
      desde un sistema legado sin stock confiable)
    proyectos_que_lo_usan: []
    archivos_referencia:
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Domain/Entities/Producto.cs"
        motivo: "Campos Stock (arranca en 0) y StockVerificado (bool, arranca en false)"
        pendiente_verificar: false
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Infrastructure/Services/AjusteStockService.cs"
        motivo: "AplicarAjusteAsync: unico camino a StockVerificado=true, con AjusteStock (entidad de auditoria: usuario, fecha, cantidad anterior/nueva, motivo obligatorio) e HistorialAsync para consultarla"
        pendiente_verificar: false
      - proyecto: la-platense
        path: "FerreteriaLaPlatense.Web/Controllers/StockController.cs, Views/Stock/Index.cshtml"
        motivo: "Filtros combinables de Categoria + Clasificacion ABC + Verificado, base para armar las planillas de conteo por oleada/sector sin necesitar un reporte nuevo"
        pendiente_verificar: false
    dependencias: []
    notas: >
      El documento entregado al cliente de La Platense (manual de usuario + plan de
      sincronizacion, 2026-08-17) es el artefacto de comunicacion de este patron — reutilizable
      como plantilla de redaccion, no solo el codigo: contexto (por que el stock arranca en
      cero), plan de oleadas A/B/C con "verificacion organica" para la cola larga, y como medir
      avance con los filtros ya existentes en vez de pedir un reporte nuevo de entrada. Si el
      volumen de conteo lo justifica en un proyecto futuro, la mejora natural es agregar un
      indicador de "% verificado por categoria/oleada" sobre la misma pantalla de Stock — no
