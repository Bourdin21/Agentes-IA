        path: "src/OlvidataAgentes.Infrastructure/Services/Motor/ConstructorContexto.cs + Application/Motor/IConstructorContexto.cs"
        motivo: "Calculo unico (vista previa/instantanea/motor), instantanea por ids, render en 3 bloques con cache, escape XML, hash SHA-256"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Services/Motor/{ServicioTareas,ProcesadorTareas,ProveedorModeloAnthropic}.cs"
        motivo: "Instantanea al crear la tarea, reconstruccion con verificacion de hash antes de llamar al modelo, CacheControl por bloque"
