      de reglas (plataforma primero, declaracion de precedencia, escape de marcadores de seccion),
      deriva entre vista previa/instantanea/motor si se calculan por caminos distintos, costo por
      volumen de reglas (limites). El texto de reglas de la plataforma y del agente base no se muestra
      al cliente (IP); el staff de la plataforma puede ver el texto de las reglas del cliente para
