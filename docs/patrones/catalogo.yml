        path: "LabIPAC.Domain/Enums/TipoModoPrecio.cs + LabIPAC.Domain/Entities/UnidadBioquimica.cs"
        motivo: "El enum con default = modo derivado (valor 1) y la doc de que campo aplica en cada modo"
