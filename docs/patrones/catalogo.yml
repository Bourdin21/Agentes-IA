        motivo: "Pieza 1 (el batch filtra por ModoPrecio = PorUnidad) y primera mitad de la pieza 5 (rechazo del componente manual en el agregado)"
        pendiente_verificar: false
      - proyecto: labipac
        path: "LabIPAC.Infrastructure/Services/UnidadBioquimicaService.cs (ValidarSegunModo + guard de RN-37 en UpdateAsync)"
        motivo: "Escritor unico por modo y segunda mitad de la pieza 5 (rechazo del pase a manual de un item ya usado como componente)"
        pendiente_verificar: false
