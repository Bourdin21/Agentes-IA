        path: "src/OlvidataAgentes.Infrastructure/Data/Configurations/ConfiguradorConfigurations.cs + Data/Migrations/20260915004203_ConfiguradorReglasM4b.cs + tests/OlvidataAgentes.Tests/ConfiguradorReglasTests.cs + nucleo/plataforma/agentes/configurador-reglas.md"
        motivo: "Unico por (tarea, tool_use_id), token de concurrencia; 13 tests (golden de formatos 2 y 3, permisos, herramientas, validaciones, reanudacion, aplicar, limite, dos aprobadores, simulador); prompt borrador"
        pendiente_verificar: false
