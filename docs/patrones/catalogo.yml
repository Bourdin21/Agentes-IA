  - id: PAT-028
    nombre: "Reglas de texto por alcance con precedencia, vista previa e instantanea auditable del contexto de un agente"
    categoria: dominio
    descripcion: >
      Sistemas con agentes IA donde cada organizacion adapta el comportamiento de los agentes con
      reglas de texto que tienen ALCANCE (organizacion, area, usuario, cliente, agente, cliente+agente),
      MODO (obligatoria / por defecto) y TIPO (regla / procedimiento), versionadas, desactivables sin
      borrar y con limites de tamano por alcance. Un UNICO constructor de contexto calcula las reglas
      efectivas para (usuario, agente, cliente) en orden de precedencia fijo (plataforma > agente base >
      obligatorias de arriba hacia abajo > por defecto de lo mas especifico a lo mas general > usuario)
      y arma el prompt de sistema por secciones de lo mas estable a lo mas variable (maximiza cache de
      prompt). La vista previa que ve el usuario antes de enviar, la instantanea que se guarda en la
      tarea al crearla (ids + versiones + hash) y lo que usa el motor salen del mismo calculo. Regla
      no negociable: una regla es texto, NUNCA otorga permisos (herramientas, clientes, gasto y
      aprobaciones siguen en codigo).
    cuando_usar: >
      Portales multi-tenant que ejecutan agentes con prompts de la plataforma y personalizacion del
      cliente en varios niveles, donde hace falta auditar que instrucciones recibio cada ejecucion.
