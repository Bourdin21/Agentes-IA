        path: "src/OlvidataAgentes.Infrastructure/Services/Organizacion/ResolvedorSesion.cs + ContextoUsuario.cs + PermisosOrganizacion.cs"
        motivo: "Resolvedor de sesion por request (IMemoryCache 60 s + Invalidar) que puebla ITenantContext/IContextoUsuario; matriz de permisos derivada"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Services/Organizacion/MiembroService.cs (CambiarRolYAreaAsync, CambiarEstadoAsync, CrearAsync)"
        motivo: "Invariante del ultimo Director con Tenant.VersionMiembros + reintento con ChangeTracker.Clear; consultas de usuarios acotadas por TenantId; alta por SuperUsuario"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Web/Middleware/SesionOrganizacionMiddleware.cs + Authorization/PermisoOrganizacion.cs + Program.cs (orden del pipeline)"
        motivo: "Middleware entre UseAuthentication y UseAuthorization; policies RequireMiembro/RequireDirector con handler scoped"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "src/OlvidataAgentes.Infrastructure/Data/Migrations/20260914150042_OrganizacionM2.cs + Data/Configurations/OrganizacionConfigurations.cs"
        motivo: "Unicidad con soft delete: columnas generadas STORED escritas con migrationBuilder.Sql (MySql.EntityFrameworkCore 10.0.9 ignora stored: true) + check constraint rol/tenant"
        pendiente_verificar: false
      - proyecto: olvidata-agentes-multirubro
        path: "tests/OlvidataAgentes.Tests/OrganizacionTests.cs"
        motivo: "Tests de aislamiento, ultimo Director con sesion vieja, token de concurrencia + reintento, refresco de sesion"
