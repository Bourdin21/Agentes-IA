        path: "src/OlvidataAgentes.Infrastructure/Services/Conectores/ConectorHttpGenerico.cs"
        motivo: "Conector de ejemplo: validacion de la configuracion, ruta relativa, redirecciones revalidadas y lectura acotada"
        pendiente_verificar: false
