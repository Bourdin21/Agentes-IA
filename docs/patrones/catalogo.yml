  - id: PAT-029
    nombre: "Conversacion multi-turno reanudable sobre una tarea de agente con contexto congelado"
    categoria: dominio
    descripcion: >
      Una tarea de agente IA terminada (completada, fallida o cancelada) se re-abre con un mensaje de
      seguimiento de su autor: el mensaje se persiste como parte de la conversacion ANTES de encolar,
      la tarea vuelve a Pendiente y el worker reconstruye toda la conversacion desde los pasos
      persistidos (incluidos thinking y resultados de herramientas) con el MISMO contexto de sistema
      congelado de la tarea. Maximo de pasos por turno, limites de largo y cantidad de seguimientos,
      costo acumulado visible, un solo turno activo a la vez, y aviso cuando las reglas cambiaron desde
      la creacion (se ofrece tarea nueva en lugar de recalcular).
    cuando_usar: >
      Portales donde usuarios no tecnicos iteran sobre el resultado de un agente ("mas corto", "otro
      tono") y hace falta persistencia, reanudacion tras reinicio y auditoria del contexto usado.
    proyecto_origen: olvidata-agentes-multirubro (M3b, implementado 2026-09-14)
