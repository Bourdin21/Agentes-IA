  - id: PAT-036
    nombre: "Sincronizacion de stock sistema de gestion -> marketplace con cruce en cascada y lote de cambios aprobable"
    categoria: integracion
    descripcion: >
      Alinear el stock de un sistema de gestion de terceros SIN API de stock (entra por export Excel/CSV) con las
      publicaciones de un marketplace (MercadoLibre). Motor de cruce en cascada, de lo seguro a lo dudoso: ISBN/codigo
      de barras exacto -> SKU -> titulo+autor aproximado con umbral -> residuo a revision asistida por IA (propone,
      nunca decide). Con los vinculos se calculan diferencias (pausar / ajustar cantidad / activar) que forman un
      lote Propuesto; un humano lo aprueba y un worker en segundo plano lo aplica cambio por cambio con limitador de
      tasa, dejando cada cambio Aplicado o Fallido con motivo (reintento solo de fallidos). Las ventas del marketplace
      quedan como lista "a descontar" en el sistema de gestion, que sigue siendo escritura manual. El mismo motor
      sirve para una limpieza unica inicial (consola, sin UI) y para la sincronizacion diaria (panel web).
    cuando_usar: >
      Comercios que publican un catalogo grande en un marketplace y llevan el stock en un sistema de gestion o
      facturacion cerrado; tanto para sanear el catalogo una vez como para mantenerlo alineado.
    proyecto_origen: libreria-horizonte (diseñado 2026-09-15 — pendiente aprobacion del cliente e implementacion)
    proyectos_que_lo_usan: [libreria-horizonte]
    archivos_referencia:
      - proyecto: libreria-horizonte
        path: "docs/libreria-horizonte/definiciones/2-disenador-funcional.md y 3-arquitecto-mvc.md (Horizonte.Matching, tools/LimpiezaCatalogo, MercadoLibreClient, AplicadorLotesWorker)"
        motivo: "Diseño y arquitectura de referencia; rutas de codigo a completar al implementar"
        pendiente_verificar: true
    dependencias: [PAT-012, PAT-024, PAT-025, PAT-005, PAT-008]
    notas: >
      Gotchas previstos: (1) nunca eliminar publicaciones, solo pausar (reversible, conserva historial/reputacion);
      (2) una publicacion sin cruzar NO se pausa automaticamente; (3) marca "a pedido" para items que se venden sin
      stock; (4) la IA corre solo sobre el residuo (Message Batches), nunca sobre el catalogo entero — avisar el costo
      antes si el residuo es grande; (5) refresh token del marketplace cifrado con Data Protection persistente; (6)
      limites de API, filas del editor masivo y variantes (available_quantity por variante) a verificar contra el
      caso real; (7) la habilitacion de acceso (app en el marketplace + autorizacion del vendedor) es item separado.

  - id: PAT-038
    nombre: "Subagentes en un bucle de agente IA reanudable (tarea hija por tool_use_id, espera sin worker, resultado como tool_result, cancelacion en cascada)"
    categoria: dominio
    descripcion: >
      Un agente coordinador delega partes del trabajo con una herramienta: cada pedido crea una tarea hija del motor
      (misma organizacion, autor y cliente que la principal, contexto y reglas del autor calculados al crearla, profundidad
      guardada) identificada por (tarea padre, tool_use_id) con indice unico. Los subagentes permitidos los calcula el
      codigo desde la jerarquia del catalogo (hijos publicados del agente base) y nunca desde el texto del modelo. La
      principal recorre el paso en orden (las aprobaciones bloquean, las delegaciones no), queda en un estado de espera
      que el reclamo del worker no toma y vuelve a la cola cuando terminan todas las hijas del paso: aviso al terminar
      cada hija + re-chequeo inmediato tras ponerse en espera + barrido periodico. El resultado (respuesta recortada o
      motivo) vuelve como tool_result registrado como ejecucion (idempotencia). Topes por paso y por turno contados desde
      la base, limite de gasto al delegar, cancelacion en cascada y tarjetas por hija en la conversacion.
