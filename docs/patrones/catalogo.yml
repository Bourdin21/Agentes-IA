    notas: >
      Tres trampas que costaron tiempo y conviene copiar resueltas: (1) el guard "el comprobante
      ya esta totalmente pagado" del alta normal BLOQUEA el caso principal del patron (corregir
      hacia abajo un pago que genero credito por sobrepago: tras la reversion el saldo restante
      queda en 0 y el alta se rechaza) — hay que hacerlo edit-aware, y ademas clampear el saldo
      restante a 0 al calcular el excedente, porque si queda negativo el credito de cuenta
      corriente se infla por encima del importe realmente pagado. (2) Entre la reversion y la
      relectura del saldo hace falta un SaveChanges intermedio (dentro de la misma transaccion):
      si el soft-delete se resuelve por interceptor en SaveChanges, hasta que no corra, las
      propiedades calculadas en memoria siguen contando el pago viejo. (3) Todo pago reemplazado
