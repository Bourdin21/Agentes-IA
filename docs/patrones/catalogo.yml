  - id: PAT-014
    nombre: "Restablecer contraseña por email (olvide mi contraseña)"
    categoria: infraestructura
    descripcion: >
      Flujo estandar sobre ASP.NET Core Identity: link "Olvidaste tu contraseña?" en Login ->
      ForgotPassword (solo email) -> GeneratePasswordResetTokenAsync + email con link
      (userId+token) -> ResetPassword -> ResetPasswordAsync. La respuesta de ForgotPassword es
      SIEMPRE la misma exista o no el email (no delata cuentas registradas via enumeracion), y
      tiene su propia politica de rate limiting ("password-reset", igual a la de "login") para
      que no sea vector de spam de emails ni de fuerza bruta de token.
    cuando_usar: >
      Cualquier proyecto BlankProject con Identity + login por email/password (practicamente
      todos) que necesite que el usuario pueda recuperar el acceso sin intervencion manual del
      administrador.
    proyecto_origen: la-platense
    proyectos_que_lo_usan:
      - blankproject (portado al baseline el mismo dia — todo proyecto nuevo lo trae de entrada)
    archivos_referencia:
      - proyecto: blankproject
        path: "BlankProject.Web/Controllers/AccountController.cs (acciones ForgotPassword/ResetPassword)"
        motivo: "Implementacion completa y ya portada al baseline — cualquier proyecto nuevo la hereda sin copiar nada"
        pendiente_verificar: false
      - proyecto: blankproject
        path: "BlankProject.Web/Models/PasswordResetViewModels.cs"
        motivo: "ForgotPasswordViewModel + ResetPasswordViewModel"
        pendiente_verificar: false
      - proyecto: blankproject
        path: "BlankProject.Web/Views/Account/ForgotPassword.cshtml, ForgotPasswordConfirmacion.cshtml, ResetPassword.cshtml"
        motivo: "3 vistas nuevas, mismo estilo ov-login-card que Login.cshtml"
        pendiente_verificar: false
    dependencias: []
    notas: >
      No agrega ninguna dependencia nueva: reutiliza IEmailService/EmailService (MailKit, ya
      presente en el baseline) y AddDefaultTokenProviders() de Identity (ya registrado, lifespan
      default de 24hs — si un proyecto necesita otro valor, Configure<DataProtectionTokenProviderOptions>).
      El texto de marca en el email ("BlankProject") es placeholder de plantilla, igual que el
      resto de los emails del baseline — renombrar junto con todo lo demas al clonar el proyecto.
      Probado end-to-end contra una base real (no solo por inspeccion de codigo) en la-platense:
      solicitud, render del formulario con el token real del link, reset exitoso, login con la
