  - id: PAT-041
    nombre: "Gate de publicacion por huella de los casos con excepcion auditada del rol maximo"
    categoria: seguridad
    descripcion: >
      Publicar una version de contenido critico exige que su ULTIMA evaluacion sea automatica, aprobada Y hecha con los
      casos vigentes HOY. La comparacion es por una huella (hash de los pares id:hash de las versiones de conjunto de
      casos) que se sella en la corrida y se copia a la evaluacion: si se reimportan los casos, la huella cambia y la
      aprobacion deja de valer sola, sin ningun proceso que la invalide. La unica salida es una EXCEPCION del rol maximo,
      con motivo obligatorio, que queda marcada en el historial y en la auditoria. En la pantalla el boton de publicar se
      muestra DESHABILITADO con el motivo al lado (nunca un boton que falla al apretarlo) y el mismo metodo que calcula ese
      motivo es el que aplica el servicio al publicar: una sola regla, un solo lugar.
    cuando_usar: >
      Cuando una publicacion afecta a todos los clientes y la evidencia que la habilita puede quedar obsoleta por si sola
      (baterias de prueba, checklists versionados, certificaciones con vencimiento).
