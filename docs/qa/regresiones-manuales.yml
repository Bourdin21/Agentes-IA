    sintoma: "La pagina de acceso denegado y el 404 se dibujan con el layout del staff: sidebar con Inicio / Agentes / Tareas / Notificaciones, campana de notificaciones y 'Mi perfil' en el desplegable. Los links no abren nada (la API responde 403) pero el tercero se entera de que existen esas secciones, que es justo lo que el diseno prohibe."
    expectativa: "Un usuario del portal nuevo nunca ve el layout del otro publico, ni siquiera en un 403 o un 404."
    causa_raiz: "El layout compartido decide con un modismo viejo del tipo EsMiembro && !EsStaff, escrito cuando solo habia dos publicos. Al agregar un rol que deliberadamente deja de contar como miembro, esa expresion se vuelve false para el y lo manda a la rama del staff. No falla nada: es una condicion booleana que cambio de significado sin que nadie la tocara. Las vistas PROPIAS del portal nuevo fijan su layout a mano, asi que el agujero queda solo en las compartidas, que son las que nadie prueba."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/Views/_ViewStart.cshtml
        motivo: "Elegir el layout por el ROL CRUDO del usuario (no por un permiso derivado, para que un usuario bloqueado tampoco vea el equivocado). Es el unico lugar que cubre toda vista compartida, presente y futura; arreglar AccessDenied.cshtml a mano deja el 404 y el /Error abiertos."
    migracion_ef: null
    fix_aplicado: "olvidata-agentes-multirubro commit 974edb5 (QA M18 fix 1)"
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "Con la sesion del rol nuevo, GET a >=6 URLs del otro publico incluida una inexistente; en cada una evaluar document.querySelector de la clase del sidebar ajeno"
      condicion_falla: "Alguna respuesta dibuja un elemento de navegacion del otro publico."
    criterio_aceptacion:
      - "En las 403 y 404 alcanzables, el menu que se dibuja es el del portal propio."
      - "Ningun enlace ni contador del otro publico aparece en el HTML."
    pruebas_minimas:
      - "Barrido de todas las URLs de controllers del otro publico + una inexistente + /Error, contando elementos de navegacion ajenos: tiene que dar 0."
      - "Repetirlo con el usuario BLOQUEADO del portal nuevo."
    nota_generalizacion: "Aplica a todo proyecto del estudio que meta un segundo publico autenticado adentro de la misma app (portal del paciente, del cliente, del proveedor). La frontera se prueba casi siempre contra los DATOS y casi nunca contra el CROMO: el equipo escribe tests HTTP por controller, ven 403 y dan el tema por cerrado. Regla: la lista blanca tiene que cubrir tambien QUE LAYOUT se dibuja, y el lugar correcto es _ViewStart, no cada vista. Chequeo barato: pedir una URL inexistente con la sesion del publico nuevo y mirar el sidebar."

  - id: OLV-022
    modulo: "Policy por defecto fail-closed contra un rol nuevo: las acciones de CUENTA PROPIA quedan del lado prohibido"
    titulo: "Al meter el requisito 'no es <rol nuevo>' en la DefaultPolicy, todo [Authorize] a secas se cierra - incluidos cambiar la propia contrasena y el toggle de tema, que el menu del portal nuevo SI ofrece"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - QA M18 2026-09-24, commit 0000506. El boton de tema del portal del cliente respondia 302 -> AccessDenied y la cookie no cambiaba."
    pasos:
      - "Entrar con el usuario del portal nuevo."
      - "Abrir el desplegable del usuario y tocar 'Cambiar contrasena'."
      - "Tocar el boton de tema y recargar."
    sintoma: "'Cambiar contrasena' lleva a acceso denegado. El tema no cambia nunca: el POST se va a AccessDenied y la cookie queda igual, asi que el tema oscuro es inalcanzable para ese publico aunque la hoja de estilos lo soporte."
    expectativa: "Lo que el menu del portal ofrece, funciona. Lo que no ofrece, sigue denegado."
    causa_raiz: "Cerrar la DefaultPolicy es la decision correcta (un endpoint nuevo con [Authorize] a secas no le abre nada al rol nuevo), pero barre tambien los [Authorize] viejos de AccountController, que no son del otro publico: son acciones sobre la propia cuenta, comunes a los dos. El sintoma es invisible en los tests HTTP por controller, porque nadie escribe un test que diga 'el cliente SI puede cambiar su contrasena'."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/Program.cs
        motivo: "Policy aparte para cuenta propia (solo RequireAuthenticatedUser)."
      - path: src/<Proyecto>.Web/Controllers/AccountController.cs
        motivo: "Ponerla SOLO en las acciones que el menu del portal nuevo ofrece (cambiar contrasena, toggle de tema). Las demas (perfil, etc.) se dejan denegadas: la lista blanca se abre de a una, no en bloque."
    migracion_ef: null
    fix_aplicado: "olvidata-agentes-multirubro commit aacfe0a (QA M18 fix 2)"
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "Con la sesion del rol nuevo, seguir TODOS los enlaces y botones del layout propio y verificar que ninguno termina en AccessDenied"
      condicion_falla: "Un enlace o boton del menu propio responde 302 a la pagina de acceso denegado."
    criterio_aceptacion:
      - "Cambiar contrasena y cambiar tema funcionan para el rol nuevo."
      - "Una accion que el menu NO ofrece sigue denegada."
    pruebas_minimas:
      - "Tocar el toggle de tema, recargar y leer document.documentElement.dataset.theme: tiene que haber cambiado."
      - "GET a la accion de cuenta que el menu no ofrece: sigue en acceso denegado."
    nota_generalizacion: "Siempre que se endurezca la DefaultPolicy (o se agregue un FallbackPolicy), hay que listar los [Authorize] a secas que ya existian y clasificarlos en 'del otro publico' y 'de la propia cuenta'. Chequeo de QA que lo agarra sin leer codigo: con la sesion del publico nuevo, hacer clic en cada item de SU propio menu; el que caiga en acceso denegado es el defecto. Es la variante inversa de 'link de sidebar sin autorizacion real' (regla 32): aca la autorizacion es demasiada, no demasiado poca."

  - id: OLV-023
    modulo: "Tipo de tarea nuevo + herramientas: la lista blanca del resolvedor y la guarda del EJECUTOR se escriben en archivos distintos"
    titulo: "El resolvedor ofrece la herramienta al tipo de tarea nuevo pero el ejecutor sigue exigiendo el tipo VIEJO: la herramienta aparece en la solicitud al modelo y falla en el 100% de las llamadas"
    severidad: critical
    reproducido_en: "olvidata-agentes-multirubro - QA M18 2026-09-24, commit 0000506. Tarea 221 (TipoTarea.ConsultaCliente): documentos_listar -> esError 'Herramienta no disponible para este agente.' El bloque Consultas del portal del cliente era inerte de punta a punta."
    pasos:
      - "Crear una tarea del tipo NUEVO desde la pantalla que lo estrena."
      - "Dejar que el modelo (o el simulado) use una de las herramientas que la lista blanca dice que recibe."
      - "Mirar el resultado de la herramienta en la base (PasosTarea) o en 'Ver pasos', no la respuesta final del agente."
    sintoma: "La respuesta del agente suena razonable ('no encontre documentos de este cliente') y la pantalla no muestra ningun error, porque el usuario final no ve los pasos. En la base, cada uso de herramienta vuelve con esError y el mensaje de no disponible."
    expectativa: "La herramienta que la lista blanca ofrece, se puede ejecutar."
    causa_raiz: "La autorizacion de una herramienta esta partida en dos: QUE se ofrece (resolvedor, tocado al agregar el tipo nuevo) y QUE se puede ejecutar (guarda propia de cada familia de herramientas, escrita cuando solo existia el tipo viejo y no tocada). Las dos compilan, los tests unitarios de cada lado pasan, y solo se contradicen al ejecutar. Se agrava porque el agente disimula el error con lenguaje natural."
    capa: Infrastructure
    archivos_fix:
      - path: src/<Proyecto>.Infrastructure/Services/<Familia>/Herramientas<Familia>.cs
        motivo: "Aceptar el tipo de tarea nuevo en la guarda del ejecutor, SIN aflojar la condicion que aisla (que la tarea sea de ese cliente/dueno en ese tenant). El predicado va inline en la consulta EF, no por un metodo auxiliar (KOI-015)."
    migracion_ef: null
    fix_aplicado: "olvidata-agentes-multirubro commit 6df04a9 (QA M18 fix 3)"
    deteccion_qa:
      tipo: consulta
      selector_o_endpoint: "SELECT ContenidoJson FROM PasosTarea WHERE TareaAgenteId = <tarea del tipo nuevo> AND Tipo = 2"
      condicion_falla: "Algun resultado de herramienta tiene esError true con el mensaje de 'no disponible' siendo que la lista blanca la ofrece."
    criterio_aceptacion:
      - "Una tarea del tipo nuevo ejecuta las herramientas que su lista blanca ofrece."
      - "Sigue sin ver nada de otro dueno: la consulta devuelve solo la carpeta propia."
    pruebas_minimas:
      - "Correr una tarea del tipo nuevo y leer los resultados de herramienta en la base: 0 esError."
      - "Con dos duenos cargados, verificar que el listado que devuelve la herramienta trae SOLO los del dueno de la tarea."
    nota_generalizacion: "Regla del estudio: cada vez que se agrega un TipoTarea (o cualquier discriminador que gobierne permisos), hay que hacer grep del enum entero, no solo de donde se arma la lista de herramientas. Las guardas de ejecucion suelen estar escritas como 'if (tipo != TipoViejo) return NoDisponible;' y son invisibles desde el archivo que se esta tocando. El sintoma NUNCA es un error en pantalla: el modelo redacta el fracaso en castellano y parece una respuesta valida. La unica deteccion barata es leer los pasos en la base."

  - id: OLV-024
    modulo: "Aplicar la propuesta de un agente (patron propuesta -> tarjeta -> boton)"
    titulo: "El boton 'aplicar' es un <a> a una accion GET que crea la entidad y marca la propuesta como aplicada: escritura por GET, sin antiforgery"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - QA M18 2026-09-24, commit 0000506. GET /Pedidos/Nuevo?propuesta=1 creaba el pedido y resolvia la propuesta; se detecto porque el estado cambio sin llegar a apretar Guardar."
    pasos:
      - "Dejar una propuesta Pendiente."
      - "Pedir por la barra la URL del 'aplicar' (o dejar que el navegador la prefetchee / volver atras en el historial)."
      - "Mirar el estado de la propuesta y si aparecio la entidad."
    sintoma: "La propuesta queda Aplicada y la entidad creada sin que nadie haya confirmado nada, y sin token antiforgery de por medio."
    expectativa: "Aplicar una propuesta es POST con antiforgery. El GET solo muestra."
    causa_raiz: "Para que el alta apareciera con los items precargados se reuso la accion GET del alta, pasando el id de la propuesta como query string, y se aprovecho a aplicarla ahi mismo. El resto de las propuestas del mismo producto ya iban por POST: es una excepcion que entro con el modulo nuevo."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/Controllers/<Entidad>Controller.cs
        motivo: "Separar en [HttpPost, ValidateAntiForgeryToken] AplicarPropuesta(id) con el mismo cuerpo y el mismo redirect; la accion de alta vuelve a ser solo el alta en blanco."
      - path: src/<Proyecto>.Web/Views/<Entidad>/Index.cshtml
        motivo: "El enlace pasa a ser un form method=post con el id en un hidden."
    migracion_ef: null
    fix_aplicado: "olvidata-agentes-multirubro commit 1915a54 (QA M18 fix 4)"
    deteccion_qa:
      tipo: consulta
      selector_o_endpoint: "grep de asp-route- en los botones de 'aplicar', y de acciones de controller sin [HttpPost] que llamen a un service de escritura"
      condicion_falla: "Una accion sin [HttpPost] invoca un metodo que escribe."
    criterio_aceptacion:
      - "El GET viejo ya no aplica nada: la propuesta queda Pendiente."
      - "El boton por POST aplica, precarga y redirige igual que antes."
    pruebas_minimas:
      - "GET a la URL vieja con la propuesta Pendiente: sigue Pendiente y no se creo la entidad."
      - "Clic en el boton: la propuesta queda Aplicada una sola vez; el segundo intento lo rechaza el service."
    nota_generalizacion: "Chequeo de QA de 30 segundos para cualquier modulo con el patron propuesta/tarjeta: listar las acciones del controller y verificar que TODAS las que resuelven una propuesta llevan [HttpPost, ValidateAntiForgeryToken]. Cuando el producto ya tiene el patron resuelto en otro modulo, comparar contra ese: el modulo nuevo suele ser el unico que se desvia, porque quiso reusar el alta para precargar el formulario."

  - id: OLV-025
    modulo: "Rotulos por enum en pantalla (ficha del agente: cuando recibe cada herramienta)"
    titulo: "Un switch de enum a texto con rama default 'util' le pone a cada valor nuevo el texto de OTRO valor: la pantalla afirma con confianza algo que no es cierto, y no falla nada"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - QA M20/M21 2026-09-25, commit 0335340. La ficha del agente mostraba 'En tareas principales (no en las partes que pide un coordinador)' para la herramienta de M18, cuya condicion real es PortalDeClientesEncendido. Venia mintiendo desde M17 con otra condicion (TodaTareaDeTrabajo), que M20 arreglo agregando su brazo y dejando la gemela anotada."
    pasos:
      - "Listar los valores del enum de condicion/estado/tipo que la pantalla traduce a texto."
      - "Comparar contra las ramas explicitas del switch del helper de textos."
      - "Todo valor sin rama explicita cae al default y se muestra con el texto de ese default."
    sintoma: "La columna muestra un texto plausible y equivocado. No hay excepcion, ni 500, ni celda vacia: el unico sintoma es que lo que dice la pantalla no coincide con lo que hace el resolvedor."
    expectativa: "Cada valor del enum tiene su propio texto, y un valor sin texto se ve como una raya en vez de heredar el de otro."
    causa_raiz: "El switch se escribio con el ultimo valor conocido como rama default (_ => texto de TareaPrincipal) en vez de una rama explicita. Cada modulo que agrega un valor al enum hereda en silencio el texto del default: el compilador no avisa porque el switch sigue siendo exhaustivo, y el test de la pantalla (si existe) suele mirar solo los valores que ese modulo agrego."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/Helpers/<Entidad>Textos.cs
        motivo: "Una rama explicita por cada valor del enum, incluida la que estaba de default; el default pasa a ser un marcador neutro (una raya) que no afirma nada."
    migracion_ef: null
    fix_aplicado: "olvidata-agentes-multirubro commit 019b850 (QA M20/M21 fix 2)"
    deteccion_qa:
      tipo: consulta
      selector_o_endpoint: "Contar los valores del enum y las ramas explicitas del switch que lo traduce: si hay menos ramas que valores, los que faltan estan mintiendo."
      condicion_falla: "Existe un valor del enum sin rama explicita y la rama default devuelve un texto afirmativo (no un marcador neutro)."
    criterio_aceptacion:
      - "Cada valor del enum devuelve un texto distinto de los demas."
      - "Ningun valor devuelve el texto de otro valor."
    pruebas_minimas:
      - "Recorrer Enum.GetValues<T>() y verificar que ningun texto se repite y que ninguno queda vacio."
      - "Por navegador: la fila de la herramienta/estado nuevo muestra su condicion real, no la del default."
    nota_generalizacion: "Aplica a TODO helper que traduzca un enum a texto de pantalla (condicion, estado, tipo, motivo, rol). La regla barata: la rama default de un switch de enum a texto nunca devuelve un texto que afirme algo; devuelve un marcador neutro. Asi, el modulo que agrega un valor al enum ve una raya en la pantalla en la primera corrida y se acuerda de escribir el texto, en vez de leer una frase razonable y darla por buena. El test que lo fija es de tres lineas: recorrer el enum entero y exigir textos distintos y no vacios."

  - id: OLV-026
    modulo: "Motivo/detalle que se concatena en el medio de una frase de la UI"
    titulo: "El mismo motivo se muestra con la inicial en minuscula en una pantalla y en mayuscula en otra: las dos ramas de una MISMA frase no se leen igual"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - QA M20/M21 2026-09-25, commit 0335340. La ficha del documento decia 'El agente no puede leer este documento: Es un escaneado de 25 paginas y el maximo para mirar es 20.' mientras el mensaje de subida, que arma la misma frase, decia 'no puede leerlo: es un escaneado de 25 paginas...'. La rama de respaldo de la PROPIA ficha tambien estaba en minuscula."
    pasos:
      - "Provocar el estado que deja un motivo persistido (rechazo, no legible, error de validacion)."
      - "Leer el motivo en TODAS las pantallas que lo muestran: el mensaje inmediato de la accion, la grilla, el tooltip y la ficha."
      - "Comparar la puntuacion y la inicial de cada una."
    sintoma: "Una mayuscula despues de dos puntos en el medio de una oracion. No rompe nada; se lee como si lo hubieran escrito dos personas distintas."
    expectativa: "El motivo va con la inicial en minuscula cuando se concatena en el medio de una frase, y tal cual cuando es una frase entera (tooltip, columna propia). La decision es por lugar de uso, no por pantalla."
    causa_raiz: "El motivo se guarda redactado como frase entera ('Es un escaneado de N paginas.') porque tambien se muestra solo. El helper que baja la inicial existia y lo usaba el mensaje de subida, pero era privado, asi que la vista Razor no podia llamarlo y concateno el motivo crudo. El sintoma aparece recien cuando el mismo dato se muestra en un lugar nuevo."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Application/DTOs/<Entidad>Dtos.cs
        motivo: "El helper que baja la inicial (respetando siglas) pasa a publico: es la unica forma de que la vista arme la frase igual que el service."
      - path: src/<Proyecto>.Web/Helpers/<Entidad>Textos.cs
        motivo: "La frase completa se arma en el helper de textos, no en la vista: asi la vista no decide nada y el test cubre la frase entera."
      - path: src/<Proyecto>.Web/Views/<Entidad>/Ver.cshtml
        motivo: "La vista pasa a imprimir el helper, sin ternario ni concatenacion propia."
    migracion_ef: null
    fix_aplicado: "olvidata-agentes-multirubro commit 4f9809f (QA M20/M21 fix 3)"
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "Leer el innerText de las pantallas que muestran el motivo y buscar el patron de dos puntos seguidos de mayuscula en el medio de una oracion."
      condicion_falla: "El mismo motivo aparece con inicial distinta en dos pantallas, o una rama del mismo ternario esta en minuscula y la otra en mayuscula."
    criterio_aceptacion:
      - "El motivo se lee igual, con la misma inicial, en las pantallas que lo concatenan."
      - "Una sigla al inicio (PDF, CUIT, IVA) no se baja a minuscula."
    pruebas_minimas:
      - "Assert sobre la frase COMPLETA que arma el helper, no solo sobre el motivo suelto."
      - "El caso de la sigla y el caso sin motivo (rama de respaldo)."
    nota_generalizacion: "Cuando un texto persistido se muestra en mas de un lugar, la puntuacion es parte del contrato. Regla: el motivo se guarda como frase entera (con mayuscula y punto) y todo lugar que lo meta en el medio de otra frase lo pasa por el mismo helper de des-capitalizacion, que tiene que ser publico. Y si una vista tiene un ternario que elige entre el motivo y un texto de respaldo, las dos ramas se escriben con la misma forma: es el lugar donde se ve el defecto sin comparar pantallas. Emparenta con CRM-015 (bajar la inicial a ciegas rompe las siglas): el mismo helper resuelve los dos."

  - id: OLV-027
    modulo: "Tope de tiempo con CancellationTokenSource.CancelAfter"
    titulo: "Un tope de cero segundos implementado con CancelAfter(TimeSpan.Zero) es una carrera, no un tope: con el pool saturado el trabajo se hace igual 298 de 300 veces"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - QA M20/M21 2026-09-25, commit 0335340. El test del tope de extraccion de documentos fallaba de a ratos en la bateria completa y pasaba siempre aislado; el implementador lo anoto como flaky conocido bajo carga."
    pasos:
      - "Configurar el tope de tiempo en 0 (o dejar que una configuracion lo deje en 0)."
      - "Saturar el ThreadPool (Environment.ProcessorCount * 4 tareas girando) y llamar al metodo 300 veces."
      - "Contar cuantas veces el trabajo se hizo igual en vez de cortarse por tiempo."
    sintoma: "El mismo archivo queda legible o no-se-pudo-leer segun la carga de la maquina. En los tests se ve como un rojo que no se reproduce aislado; en produccion, como un tope de configuracion que no hace nada."
    expectativa: "Un tope de cero significa siempre lo mismo y el trabajo no llega a empezar."
    causa_raiz: "CancelAfter(TimeSpan.Zero) no cancela en el momento: programa un temporizador con vencimiento 0, cuyo callback se encola en el ThreadPool. El trabajo (Task.Run) ya esta encolado tambien, asi que los dos compiten. Con el pool libre suele ganar la cancelacion; con el pool saturado, que es exactamente lo que pasa en una bateria de tests en paralelo o en un servidor con carga, gana el trabajo. Y aunque gane la cancelacion, el delegado igual puede haberse ejecutado: el token se observa al esperar, no antes de encolar."
    capa: Infrastructure
    archivos_fix:
      - path: src/<Proyecto>.Infrastructure/Services/<Area>/<Servicio>.cs
        motivo: "Decidir el tope de cero (o negativo) ANTES de encolar: si el tope es cero, Cancel() sincronico; si no, CancelAfter(tope)."
    migracion_ef: null
    fix_aplicado: "olvidata-agentes-multirubro commit 84b54fd (QA M20/M21 fix 1)"
    deteccion_qa:
      tipo: consulta
      selector_o_endpoint: "grep de CancelAfter y verificar que el valor no pueda ser cero, o que el cero se resuelva antes de encolar el trabajo."
      condicion_falla: "CancelAfter recibe un TimeSpan que puede valer cero y el trabajo se encola despues sin chequear el token."
    criterio_aceptacion:
      - "Con el tope en cero, 300 llamadas seguidas con el pool saturado dan siempre el mismo resultado."
      - "El trabajo no llega a leer su entrada (observable: el stream queda en Position 0)."
    pruebas_minimas:
      - "Assert sobre un efecto colateral que solo existe si el trabajo corrio (la posicion del stream, un contador), no solo sobre el estado devuelto: el estado puede salir bien por carrera aunque el trabajo se haya hecho."
    nota_generalizacion: "Vale para todo tope de tiempo en el borde: CancelAfter con un valor que puede ser 0 es una carrera con el trabajo que se encola inmediatamente despues. La regla es decidir el caso degenerado de forma sincronica antes de encolar nada. Y para QA hay una leccion aparte: un test que falla de a ratos es un defecto del codigo hasta que se demuestre lo contrario, no ruido del test. El reproductor barato de una carrera de ThreadPool es saturarlo a proposito (ProcessorCount * 4 tareas girando) y repetir la llamada unos cientos de veces; lo que aislado pasa 12 de 12 veces, ahi falla 298 de 300."

  - id: KOI-015
    modulo: Consultas EF / proyeccion a record reutilizable (ConceptosGastoQuery)
    titulo: "Un .Where() aplicado DESPUES de una proyeccion a record no lo traduce EF Core: la consulta compila, pasa el build y revienta en runtime con 500"
    severidad: critical
    reproducido_en: "KoiDumplings QA-B 2026-09-23 (localhost:7102, Chromium via playwright npm, base koidumplings_qa_b). Introducido por el item 4 del sprint 'Fixes y mejoras' (commit 5a52462), que centralizo la regla del importe en un IQueryable<ImporteConceptoRow>."
    pasos:
      - "Abrir /RepartoGeneral con cualquier rol administrativo."
      - "Abrir /EstadoResultados/Anual (esta en el sidebar del INVERSOR como 'Historial de Resultados')."
      - "Abrir /Dashboard con cualquier rol y mirar el grafico Historico (XHR a /Dashboard/Historico?meses=12)."
    sintoma: "HTTP 500 en las dos pantallas y en el endpoint del grafico. El canvas #chartHistorico queda con 0 pixeles pintados (medido por getImageData) y la consola muestra 'Failed to execute json on Response: Unexpected end of JSON input'. En el log: System.InvalidOperationException: The LINQ expression '...new ImporteConceptoRow(...).PeriodoMensualId == @p_Id' could not be translated."
    expectativa: "Las tres pantallas cargan en 200 con los totales calculados con la regla unica."
    causa_raiz: "ConceptosGastoQuery.ImportesAplicados(db) devuelve IQueryable<ImporteConceptoRow> ya PROYECTADO (select new ImporteConceptoRow(...)). Cualquier .Where() encadenado despues obliga a EF a empujar el predicado por encima del constructor del record, y EF no sabe traducir 'new Record(...).Prop'. Falla IGUAL con el predicado escalar (r.PeriodoMensualId == p.Id) que con el de lista (ids.Contains(r.PeriodoMensualId)): no es el Contains, es el filtrar despues de proyectar. Es invisible al compilador y al analisis estatico, y el implementador no ejecuta la app por diseno, asi que llego entero a QA."
    capa: Infrastructure
    archivos_fix:
      - path: KoiDumplings.Infrastructure/Data/ConceptosGastoQuery.cs
        motivo: "Que el filtro entre ANTES de proyectar: sobrecarga ImportesAplicados(db, Expression<Func<ConceptoGasto,bool>> filtro) que aplica el where sobre ConceptosGasto y recien despues arma el record. Alternativa equivalente: ImportesAplicadosDe(db, IReadOnlyCollection<int> periodoIds)."
      - path: KoiDumplings.Infrastructure/Services/InversionesService.cs
        motivo: "Linea ~249: pasar ids al metodo en vez de encadenar .Where(r => ids.Contains(r.PeriodoMensualId))."
      - path: KoiDumplings.Infrastructure/Services/DashboardService.cs
        motivo: "Linea ~105: idem."
      - path: KoiDumplings.Infrastructure/Services/EstadoResultadosService.cs
        motivo: "Linea ~1244: pasar p.Id en vez de encadenar .Where(r => r.PeriodoMensualId == p.Id)."
      - path: KoiDumplings.Infrastructure/Services/Importacion/ImportacionExcelKoiService.cs
        motivo: "Linea ~522: idem (mismo patron; no se pudo ejercitar por UI en esta corrida)."
    migracion_ef: "No aplica: es un defecto de consulta, sin cambio de esquema."
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /RepartoGeneral, GET /EstadoResultados/Anual, GET /Dashboard/Historico?meses=12"
      condicion_falla: "Alguna responde 500, o el canvas del grafico historico queda con 0 pixeles pintados."
    criterio_aceptacion:
      - "Las tres respuestas son 200 y los totales coinciden con el SQL equivalente de la regla unica."
      - "Ningun consumidor encadena .Where() sobre el IQueryable ya proyectado."
    pruebas_minimas:
      - "GET /RepartoGeneral -> 200 y la columna Utilidad U$D coincide con el USD del E.R. mensual de cada mes."
      - "GET /EstadoResultados/Anual -> 200 con rol Inversor (esta en su sidebar)."
      - "GET /Dashboard/Historico?meses=12 y ?meses=24 -> 200 y el canvas dibuja."
    nota_generalizacion: "Aplica a TODO proyecto del estudio que centralice una regla de negocio en un IQueryable proyectado a record/DTO y lo ofrezca como punto de reuso. La refactorizacion 'una sola fuente de la regla' es correcta, pero el metodo que devuelve el IQueryable ya proyectado es una trampa: invita a que cada consumidor le encadene su propio .Where(), y ese es justamente el uso que EF no traduce. Regla: un helper de consulta compartido recibe el filtro como parametro y proyecta AL FINAL; nunca devuelve un IQueryable proyectado para que el llamador lo filtre. Chequeo barato para QA: tras cualquier refactor que unifique una regla de calculo, abrir TODAS las pantallas que la consumen — el build en verde no dice nada, porque la falla es de traduccion en runtime."

  - id: KOI-016
    modulo: Gestion de usuarios / guarda de privilegio (UsersController.CanManageUser)
    titulo: "Un usuario privilegiado SIN fila en AspNetUserRoles queda gestionable: la guarda resuelve el rol con FirstOrDefault() ?? \"\" y compara por desigualdad (fail-open)"
    severidad: major
    reproducido_en: "KoiDumplings QA-A 2026-09-23 (defecto D-A03, base koidumplings_qa_a); fix verificado por el implementador contra la app real el mismo dia (base koidumplings_impl, 21 acciones rechazadas)"
    pasos:
      - "Borrar la fila de AspNetUserRoles del usuario SuperUsuario (simula un seed/mantenimiento/restore parcial)."
      - "Entrar como Administrador y abrir /Users."
      - "Sobre el id del SuperUsuario: GET Details, GET Edit, POST ToggleEstado, POST ResetPassword, POST SetPassword, POST EnviarRecuperacion, POST Delete."
      - "Variante 2: un usuario con DOS roles, uno de ellos el privilegiado."
    sintoma: "El SuperUsuario aparece en el listado del Administrador como 'Sin rol' y las acciones se EJECUTAN: queda bloqueado (Estado=2) y con una contraseña reseteada que nadie conoce. En la variante 2, el usuario con doble rol se cuela si FirstOrDefault() devuelve el rol no privilegiado."
    expectativa: "Ni el usuario sin rol resoluble ni el que tiene el rol privilegiado entre sus roles se muestran o se gestionan desde la sesion del rol inmediato inferior."
    causa_raiz: "CanManageUser() hacia PuedeGestionarRol(targetRoles.FirstOrDefault() ?? string.Empty) con PuedeGestionarRol(rol) => rol != RolSuperUsuario. Sin fila de roles el rol es cadena vacia, que no es igual a 'SuperUsuario', asi que la guarda devolvia true. Es una decision fail-open sobre la identidad mas privilegiada; el listado repetia la misma logica (?? 'Sin rol'), asi que pantalla y servidor coincidian... en dejar pasar."
    capa: Web
    archivos_fix:
      - path: KoiDumplings.Web/Controllers/UsersController.cs
        motivo: "PuedeGestionar(rolesDelDestino, emailDelDestino): 1) la cuenta del seed (Seed:SuperUser:Email) es intocable siempre; 2) Contains sobre la lista COMPLETA de roles, no FirstOrDefault; 3) sin rol -> fail-closed; 4) salida de rescate: al usuario sin rol lo gestiona solo el SuperUsuario logueado. El listado consume la misma funcion. Ademas, el par RemoveFromRoles/AddToRole de Edit restituye el rol anterior si el alta falla."
      - path: KoiDumplings.Infrastructure/Data/SeedData.cs
        motivo: "SuperUserEmail(IConfiguration): un unico lugar define cual es la cuenta del seed, que antes estaba escrita dos veces con su default."
    migracion_ef: "No aplica: es una guarda de autorizacion, sin cambio de esquema."
    deteccion_qa:
      tipo: http
      selector_o_endpoint: "GET /Users/Details/{idPrivilegiado}, GET /Users/Edit/{id}, POST /Users/{ToggleEstado|ResetPassword|SetPassword|EnviarRecuperacion|Delete}"
      condicion_falla: "Alguna responde 200 sobre la accion (o redirige con mensaje de exito) en vez de AccessDenied, o el usuario aparece en el listado del rol inferior."
    criterio_aceptacion:
      - "Las acciones sobre el usuario sin rol y sobre el de doble rol terminan todas en AccessDenied, sin tocar Estado ni PasswordHash ni escribir auditoria."
      - "El rol maximo conserva una via para devolverle el rol al usuario que quedo sin ninguno."
      - "Un Administrador sigue gestionando con normalidad a los usuarios con rol comun."
    pruebas_minimas:
      - "Sin la fila de roles del privilegiado: 7 acciones como Administrador -> 7 AccessDenied y 0 cambios en la base."
      - "Usuario con [Administrador, SuperUsuario]: invisible en el listado del Administrador y 7 AccessDenied."
      - "Como SuperUsuario: el usuario sin rol se ve y se abre (rescate)."
    nota_generalizacion: "Aplica a TODO proyecto del estudio con roles jerarquicos y una pantalla de gestion de usuarios. Regla: la guarda se evalua sobre la lista completa de roles, el caso 'sin rol' es fail-closed, y la identidad privilegiada se cruza tambien por un dato que no dependa de la tabla de roles (el email del seed). El modo de falla es traicionero porque la barrera existe y se ve funcionar: 8 de 8 acciones rechazadas mientras la fila de roles este; alcanza con que falte para que las 8 pasen."

  - id: KOI-017
    renumerado_desde: "KOI-016 (2026-10-02). Era un DUPLICADO DE NUMERACION, no de contenido: dos items distintos del proyecto koi compartian el id KOI-016. Se renumero este al siguiente id libre (017), que es ademas el id con el que ya lo citaban MH-0xx y CR-0xx en sus textos ('misma familia que KOI-017', 'dos cifras dibujadas juntas... cubrir el mismo conjunto (KOI-017)'): esas referencias eran colgadas y ahora resuelven. El otro KOI-016 (guarda de privilegio en UsersController) conserva su id. Ojo: KOI-007 y KOI-008 no existen en el catalogo y NO se reutilizaron."
    modulo: Confidencialidad por rol / dato derivable entre pantallas
    titulo: "Ocultar una cifra sensible en una pantalla no sirve si el complemento aritmetico sigue visible en otra del mismo menu: el secreto se recupera con una resta"
    severidad: high
    reproducido_en: "KoiDumplings QA-B re-test 2026-09-23 (localhost:7102, Chromium via playwright npm, base koidumplings_qa_b, build 8c22af6). Escenario: mes en curso con lado A del E.R. = 19.317.431, lado B = 6.742.889 (total local 26.060.320) y punto de venta informando 17.500.000."
    pasos:
      - "Entrar con un usuario del rol restringido (Inversor)."
      - "Sidebar > 'Mes actual': anotar la tarjeta 'Ventas registradas' (solo lo que informa el punto de venta)."
      - "Sidebar > 'Historial de Resultados' (/EstadoResultados/Anual): leer la columna Ventas de ESE MISMO mes (total del local, facturado + informal)."
      - "Restar. Variante de control: cambiar SOLO el lado B en la base y repetir — la primera cifra no se mueve y la segunda si."
    sintoma: "El rol restringido obtiene la porcion que la pantalla venia a ocultar: total del local 26.060.320 menos punto de venta 17.500.000 = 8.560.320, que es el lado B mas la brecha de conciliacion. Moviendo el lado B de 0 a 17.000.000 la fila anual acompaña 1 a 1 (19.317.431 -> 36.317.431) mientras 'Ventas registradas' queda clavada en 17.500.000."
    expectativa: "Ninguna combinacion de las pantallas alcanzables por el rol permite separar la parte facturada de la no facturada."
    causa_raiz: "Se endurecio UNA pantalla (Mes actual paso a mostrar solo datos del punto de venta) sin revisar el resto del menu del mismo rol. La pantalla endurecida publica el MINUENDO (lado A) y la otra publica el MINUEDO+SUSTRAENDO (total local): juntas entregan el sustraendo. Paradoja del cambio: mientras Mes actual mostraba el total del local —igual que la anual— no habia nada que restar; al pasarla a 'solo punto de venta' se creo la diferencia. Endurecer una pantalla puede EMPEORAR la exposicion global si el resto del menu no se mueve con ella."
    capa: Web
    archivos_fix:
      - path: "(decision de negocio, no de codigo)"
        motivo: "Las salidas son: (a) que el rol restringido no vea la cifra del punto de venta por separado; (b) que las pantallas del rol expongan SIEMPRE la misma base (todas total del local, o todas punto de venta); o (c) aceptar el riesgo por escrito. Elegir una es del dueño, no del implementador."
    migracion_ef: "No aplica."
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "Todas las pantallas del menu del rol restringido, comparadas entre si para un MISMO periodo"
      condicion_falla: "Dos pantallas del mismo rol publican magnitudes de la misma familia con bases distintas (una parcial y otra total), de modo que su diferencia reconstruye el dato reservado."
    criterio_aceptacion:
      - "Barrer TODAS las pantallas del rol y tabular que base usa cada cifra monetaria (total del local vs. parcial)."
      - "Prueba de movimiento: alterar SOLO la parte reservada en la base y confirmar que ninguna cifra visible del rol se mueve."
    pruebas_minimas:
      - "Poner la parte reservada en 0, en un valor chico y en uno grande; en las tres corridas ninguna cifra del rol puede cambiar."
      - "Restar de a pares todas las cifras monetarias del rol para el mismo periodo y verificar que ninguna da la parte reservada."
    nota_generalizacion: "Aplica a TODO proyecto con un rol de acceso parcial (portal de cliente, de inversor, de proveedor) donde exista un dato reservado que sea la DIFERENCIA entre dos magnitudes publicables. Regla del estudio: la confidencialidad no se evalua pantalla por pantalla sino sobre el CONJUNTO de lo que el rol alcanza; el barrido tiene que ser sobre el menu completo del rol y para un mismo periodo, y la prueba decisiva es mover solo el dato reservado y ver si algo visible se mueve. Corolario contraintuitivo, y es el que se olvida: endurecer una sola pantalla puede abrir la brecha en vez de cerrarla, porque introduce una base distinta a la del resto y crea una resta que antes no existia."
  - id: MH-022
    modulo: "Proyeccion financiera (M17) — ProyeccionFinancieraService.ObtenerAsync (CR-79)"
    titulo: "Una proyeccion que estima por promedio SOLO el egreso y del lado del ingreso pone unicamente los compromisos con fecha da deficit garantizado y falso: anunciaba caja negativa en 2 meses y -$31M en 6, sobre un negocio que venia cerrando +$7M por mes"
    severidad: major
    reproducido_en: "marihogar - base REAL de produccion (QA del 2026-09-24, antes de entregar la pantalla al cliente). El service se corrio desde un runner de consola de solo lectura contra la base de produccion; el defecto no se ve con datos de prueba chicos ni con la base de desarrollo, porque necesita un historial real de ventas de contado."
    pasos:
      - "Abrir la pantalla de proyeccion con datos reales de un negocio que cobra la mayor parte de sus ventas en el acto (efectivo, debito, transferencia)."
      - "Mirar el ingreso proyectado de cada mes futuro y compararlo con el ingreso real de los meses historicos que la misma pantalla muestra al lado."
      - "Mirar el veredicto de la pantalla (saldo proyectado al final de la ventana, primer mes en negativo) y compararlo con el resultado historico mes a mes."
    sintoma: "Los meses futuros mostraban $168.000 de ingreso total (el unico pago con fecha de acreditacion pendiente que habia cargado) contra $6.512.125 por mes de gasto operativo estimado por promedio. El saldo proyectado caia a -$31.040.774 y la pantalla anunciaba en rojo que la caja se iba a negativo en el segundo mes futuro, mientras los 6 meses historicos de la MISMA pantalla mostraban ingresos de ~$14M por mes y neto positivo en todos."
    expectativa: "El veredicto de la proyeccion es coherente con el desempeño historico que la propia pantalla muestra: si no hay ningun hecho nuevo (una deuda grande que vence, una caida de ventas ya ocurrida) que explique el cambio de signo, la proyeccion no puede dar deficit."
    causa_raiz: "Asimetria de bases entre los dos lados de la misma resta — misma familia que KOI-017, aplicada al tiempo en vez de al espacio. Al reemplazar el promedio como formula central por 'compromisos con fecha', el egreso conservo una estimacion por promedio (el gasto operativo, que es lo unico que no se puede conocer de antemano) pero el ingreso quedo solo con los compromisos. Y del lado del ingreso los compromisos son estructuralmente casi vacios: una venta de contado se cobra en el acto y no deja NADA agendado a futuro, asi que solo aparecian los pagos con tarjeta pendientes de acreditar. El defecto no da error, no rompe ninguna consulta y compila perfecto: la pantalla simplemente afirma algo que no es cierto, con numeros que cada uno por separado son correctos."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/ProyeccionFinancieraService.cs
        motivo: "Se estima la operacion habitual de los DOS lados con el mismo criterio (promedio de los meses cerrados de la ventana, neto de reversiones), y cada estimado se netea contra lo ya comprometido del mismo mes: Math.Max(0, promedio * proporcion - comprometido). En el mes en curso la proporcion es los dias que faltan sobre los dias del mes, porque los transcurridos ya estan en el dato real."
      - path: MariHogar.Application/DTOs/ProyeccionFinancieraDtos.cs
        motivo: "IngresoOperativoMensualEstimado (DTO raiz) y ProyeccionMesDto.IngresoOperativoEstimado, con el doc-comment que explica por que existen y por que van neteados."
      - path: MariHogar.Web/Views/ProyeccionFinanciera/Index.cshtml
        motivo: "Cada tramo rotulado como lo que es (real / comprometido / estimado): el estimado se dibuja con trama rayada del mismo color, no con un color propio, y el texto de la pantalla dice cual es el promedio usado y que se le descuenta lo comprometido."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-24"
      por: "Claude Opus 5 (implementador), hallazgo propio en el QA contra produccion antes de entregar"
      resultado: "aplicado"
      build: "dotnet build MariHogar.slnx -> 0 Errores."
      verificacion: "Con los datos reales de produccion: $13.774.127/mes de ventas estimadas y $6.512.125/mes de gastos (ambos promedios verificados con SQL independiente), sin ningun mes en negativo y +$54.190.817 al cierre de la ventana. Los 6 invariantes de la pantalla cierran, entre ellos que la columna 'Cambio de saldo' sea exactamente la diferencia contra el saldo del mes anterior."
    deteccion_qa:
      tipo: calculo
      selector_o_endpoint: "GET /ProyeccionFinanciera — series de ingreso y de egreso de los meses futuros"
      condicion_falla: "Un lado de la proyeccion se estima por promedio historico y el otro solo contiene compromisos con fecha; o el veredicto de la proyeccion contradice el resultado historico que la misma pantalla muestra sin ningun hecho nuevo que lo explique."
    criterio_aceptacion:
      - "Para cada serie proyectada, poder responder desde el MODELO (no desde el nombre de la serie ni un comentario) si es dato cierto o estimacion, y con que base se estimo."
      - "Si un lado se estima por promedio, el otro tambien — o ninguno."
      - "El estimado de cada mes esta neteado contra lo comprometido de ese mismo mes: nunca se suman los dos enteros."
    pruebas_minimas:
      - "Correr el calculo contra datos REALES de produccion (no de prueba) y comparar el veredicto con el neto historico mes a mes de la propia pantalla: si el historial cierra positivo todos los meses y la proyeccion da deficit sin causa visible, el sesgo esta en la formula."
      - "Cargar un cobro comprometido grande en un mes futuro y verificar que el ingreso total de ese mes NO crece en todo su monto (el estimado se corre hacia abajo lo mismo): eso prueba que no hay doble conteo."
      - "Verificar que la suma de los KPIs del horizonte coincida con la suma mes a mes de la serie correspondiente."
    nota_generalizacion: "Aplica a TODA proyeccion o forecast de cualquier proyecto (caja, stock, capacidad, cobranzas) donde una parte del futuro se conozca con fecha y otra haya que estimarla. El sesgo se cuela por donde la asimetria es invisible: lo que se cobra en el acto no deja compromiso agendado, asi que el lado del ingreso parece vacio mientras el del egreso (cheques, pagos programados, gastos recurrentes) parece completo. La prueba decisiva no es revisar las consultas una por una — cada una da bien — sino enfrentar el veredicto de la proyeccion con el historial que la misma pantalla muestra al lado. Corolario: en una pantalla que compara, la simetria de las bases es un requisito funcional, no una cuestion de prolijidad."

  - id: MH-023
    modulo: "Analisis de inventario (CR-80) - InventarioService.ObtenerAsync, clasificacion ABC"
    titulo: "El denominador del Pareto ABC incluye las ventas de productos dados de baja, que no tienen fila en la tabla: A+B+C sumaba $592.023,96 menos que el total de la ventana y el corte del 80% quedaba corrido"
    severidad: minor
    reproducido_en: "marihogar - base REAL de produccion (QA de CR-80, 2026-09-25), ventana de 180 dias. Con ventanas de 60 y 90 dias la diferencia era 0, asi que el defecto aparece y desaparece segun los datos: es de los que pasan cualquier prueba con una ventana y fallan con otra."
    pasos:
      - "Dar de baja (soft-delete) un producto que tenga ventas dentro de la ventana de analisis."
      - "Abrir /Inventario y elegir una ventana que contenga esas ventas (ej. 180 dias)."
      - "Sumar la columna de ventas de la ventana de todas las filas de la tabla y compararla con el total de ventas de la ventana que usa el Pareto (InventarioResumenDto.VentasVentana)."
    sintoma: "Sum(filas.VentasVentana) distinto de InventarioResumenDto.VentasVentana. En produccion: 83.110.721,32 contra 83.702.745,28, una diferencia de 592.023,96 aportada por 2 productos dados de baja el 19/08/2026. Como esos productos igual recibian clase ABC pero no fila, el acumulado de Pareto se corria y un producto vivo podia quedar clase B cuando le correspondia A (en produccion, A paso de 42 a 41 productos al corregirlo)."
    expectativa: "CA-CR80.5: la suma de las ventas de las clases A + B + C es igual al total de ventas de la ventana y ningun producto queda sin clase. El denominador del Pareto tiene que ser exactamente el mismo conjunto de productos que la tabla muestra."
    causa_raiz: "La consulta de ventas valorizadas (VentaItems agrupados por ProductoId) NO navega a Producto - proyecta solo ProductoId y Subtotal -, asi que el query filter global de soft-delete de Producto no la alcanza. La consulta del catalogo si lo aplica. Dos consultas del mismo metodo con universos distintos de producto, y el metodo las cruza como si fueran el mismo. Misma clase de defecto que MH-004 (un desglose que no parte exactamente el mismo conjunto que ya suma el total); el agravante aqui es que el filtro ausente no se ve en el codigo, porque lo aplica EF por detras solo en una de las dos consultas segun si la consulta toca o no la navegacion."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/InventarioService.cs
        motivo: "La consulta de ventas valorizadas se acota con productoIds.Contains(i.ProductoId) sobre los ids del catalogo vigente. Para que ese universo sea el mismo con y sin filtro de categoria (la clase ABC se calcula contra todo el negocio, decision del implementador), el catalogo se trae completo en el SQL y el filtro de categoria pasa a aplicarse en memoria: siguen siendo 3 consultas."
    migracion_ef: null
    deteccion_qa:
      tipo: calculo
      selector_o_endpoint: "InventarioService.ObtenerAsync(ventanaDias, null) con al menos 1 producto soft-deleted con ventas en la ventana"
      condicion_falla: "Resumen.Productos.Sum(p => p.VentasVentana) distinto de Resumen.VentasVentana, o la suma de ventas por clase A+B+C distinta de Resumen.VentasVentana"
    criterio_aceptacion:
      - "Para cualquier ventana, la suma de las ventas de las filas es exactamente igual al total de ventas de la ventana."
      - "Ningun producto de la tabla queda sin clase y el corte del 80%/95% se calcula sobre ese mismo total."
    pruebas_minimas:
      - "Recorrer las 3 ventanas (60/90/180) y verificar diferencia 0 en las tres, no solo en la que trae el default."
      - "Con un producto dado de baja con ventas en la ventana, verificar que la clase de los productos vivos no cambia por un motivo que no sean sus propias ventas."
    fix_aplicado:
      fecha: "2026-09-25"
      por: "QA (auto-fix, CR-80 etapa 6)"
      resultado: "aplicado"
      build: "dotnet build MariHogar.slnx -> 0 Errores, 8 warnings preexistentes, ninguno nuevo."
      verificacion: "Re-ejecutado el runner de solo lectura contra la base de produccion: ventana 180 pasa de dif=592.023,96 a dif=0,00 y A+B+C (66.696.066,23 + 12.314.210,37 + 4.100.444,72) = 83.110.721,32 exacto. Capital inmovilizado, plata quieta y la monotonia de CA-CR80.2 sin cambios. /Inventario, /Inventario?ventanaDias=180, ?categoriaId=1 y ?categoriaId=999 responden 200 sin excepcion en el log."
    nota_generalizacion: "Aplica a cualquier pantalla que cruce en memoria dos consultas del mismo periodo cuando una toca la navegacion a una entidad con query filter global y la otra no. El query filter de soft-delete se aplica por consulta, no por metodo: si una consulta proyecta solo la FK (i.ProductoId) y la otra navega (i.Producto.Nombre), las dos ven universos distintos y el codigo no lo muestra. Regla: cuando dos consultas de un mismo calculo tienen que cubrir el mismo conjunto, el conjunto se pasa explicito (una lista de ids) en vez de confiar en que el filtro global las alcance a las dos."

  - id: MH-024
    modulo: "Analisis de inventario (CR-80) - InventarioService.ObtenerAsync, columna 'Ultima venta'"
    titulo: "La columna 'Ultima venta' mostraba la fecha en que se ANULO una venta como si fuera la ultima vez que el producto se vendio"
    severidad: minor
    reproducido_en: "marihogar - base REAL de produccion (QA de CR-80, 2026-09-25): 5 productos afectados, el peor con 15 dias de error (producto #55, mostraba 19/08 cuando la ultima venta real fue el 04/08)."
    pasos:
      - "Vender un producto y despues cancelar esa venta (la cancelacion revierte el stock con un contramovimiento)."
      - "Abrir /Inventario y mirar la columna 'Ultima venta' de ese producto."
    sintoma: "La fecha mostrada es la de la cancelacion, no la de la ultima venta efectiva. El dato es tanto mas enganoso cuanto mas tiempo pase entre la venta y su anulacion, y sugiere movimiento reciente donde no hubo ninguno - exactamente al reves de lo que la pantalla existe para decir."
    expectativa: "'Ultima venta' es la fecha del ultimo movimiento que efectivamente saco mercaderia por una venta. La reversion de una cancelacion no es una venta."
    causa_raiz: "MAX(Fecha) sobre todos los MovimientoStock de Tipo=Venta del producto. En este modelo la venta guarda Cantidad NEGATIVA y la reversion por cancelacion guarda Cantidad POSITIVA con el MISMO Tipo=Venta: el Tipo no alcanza para distinguirlas, el signo si. El mismo metodo ya usaba el signo correctamente para netear las unidades vendidas (CA-CR80.4) y lo dejaba de usar una linea mas abajo."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/InventarioService.cs
        motivo: "UltimaVenta pasa a ser un maximo condicional g.Max(m => m.Cantidad < 0 ? (DateTime?)m.Fecha : null) - MAX(CASE WHEN ...), mismo criterio de traduccion que la suma condicional de las unidades (se evita g.Where(...) adentro del GroupBy por MH-001/MH-002)."
    migracion_ef: null
    deteccion_qa:
      tipo: data
      selector_o_endpoint: "InventarioService.ObtenerAsync - InventarioProductoDto.UltimaVenta de un producto con una venta cancelada posterior a su ultima venta vigente"
      condicion_falla: "UltimaVenta coincide con la fecha de un MovimientoStock de Tipo=Venta con Cantidad > 0"
    criterio_aceptacion:
      - "UltimaVenta nunca puede caer en la fecha de un movimiento de reversion."
      - "Un producto cuyo unico movimiento de venta fue cancelado muestra 'nunca se vendio', no la fecha de la cancelacion."
    pruebas_minimas:
      - "Cancelar una venta vieja de un producto que tuvo ventas posteriores: la columna no se mueve."
      - "Cancelar la unica venta de un producto: la columna pasa a 'nunca se vendio'."
    fix_aplicado:
      fecha: "2026-09-25"
      por: "QA (auto-fix, CR-80 etapa 6)"
      resultado: "aplicado"
      build: "dotnet build MariHogar.slnx -> 0 Errores, ningun warning nuevo."
      verificacion: "Contra produccion, los 5 productos afectados pasan a mostrar la fecha del ultimo movimiento con Cantidad < 0, verificada por consulta independiente para cada uno (#31 23/09 12:36 en vez de 23/09 16:55, #55 04/08 en vez de 19/08, #65 02/09 15:04 en vez de 15:05, #154 08/08 en vez de 19/08, #167 05/08 en vez de 19/08)."
    nota_generalizacion: "Aplica a cualquier ledger inmutable que registre el hecho y su reversion con el MISMO tipo y signos opuestos (stock, cuenta corriente, caja). Toda agregacion sobre ese ledger tiene que decidir explicitamente si el signo importa: para SUMAR casi siempre da igual (el neteo es el objetivo), para un MAX/MIN/COUNT o un 'ultimo' NUNCA da igual. Es un caso donde el mismo metodo puede estar bien en una linea y mal en la siguiente."

  - id: MH-025
    modulo: "Rentabilidad con costo historico (CR-80) - RentabilidadService.CostoHistorico"
    titulo: "El costo historico de una venta dependia del orden en que la base devolviera las filas cuando un producto tiene dos recepciones de la MISMA fecha con precios distintos"
    severidad: minor
    reproducido_en: "marihogar - base REAL de produccion (QA de CR-80, 2026-09-25): 11 grupos (producto, FechaRecepcion) con mas de un PrecioCompra distinto; el peor es el producto #7 al 31/07/2026, con 256.995,00 y 267.274,80 como candidatos (4% de diferencia). Con el orden que la base devuelve hoy el resultado coincide con el criterio determinista, asi que el numero de HOY es correcto: el defecto es que nada lo garantiza manana."
    pasos:
      - "Cargar dos ordenes de compra del mismo producto con precios distintos y recibirlas con la MISMA FechaRecepcion (o dos lineas del mismo producto en una sola OC con precios distintos)."
      - "Vender ese producto despues de esa fecha y mirar el costo con el que /Rentabilidad valua la linea."
    sintoma: "El costo elegido es el de una de las dos recepciones empatadas, sin criterio definido: la busqueda binaria se queda con la ULTIMA de las empatadas y el orden de las empatadas es el orden en que la base devolvio las filas, que la consulta no pide. Un plan distinto, un indice nuevo o mas volumen lo pueden cambiar sin que nadie toque una linea de codigo, y el margen de un periodo cerrado se mueve solo."
    expectativa: "El costo historico de una venta es una funcion de los datos, no del plan de ejecucion: dos corridas sobre los mismos datos dan el mismo numero siempre."
    causa_raiz: "recepciones.GroupBy(...).ToDictionary(g => g.Key, g => g.OrderBy(r => r.FechaRecepcion)...) sobre una lista traida con ToListAsync() sin OrderBy en el SQL. OrderBy de LINQ-to-Objects es estable, asi que preserva el orden de llegada: la desambiguacion de los empates quedaba delegada al orden de filas de MySQL."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/RentabilidadService.cs
        motivo: "Se agrega el Id de OrdenCompraItem a la proyeccion y el orden pasa a ser .OrderBy(r => r.FechaRecepcion).ThenBy(r => r.Id): la 'ultima recepcion de esa fecha' queda definida como la cargada mas tarde."
    migracion_ef: null
    deteccion_qa:
      tipo: calculo
      selector_o_endpoint: "RentabilidadService.ObtenerAsync - costo de un producto con recepciones empatadas en FechaRecepcion y precios distintos"
      condicion_falla: "La lista de recepciones por producto se ordena solo por fecha, sin un segundo criterio, y existe al menos un (producto, fecha) con mas de un PrecioCompra distinto"
    criterio_aceptacion:
      - "El costo historico total del historico completo es identico calculando con el orden de la base y con el orden explicito (Fecha, Id)."
      - "El criterio de desempate esta escrito en el codigo, no heredado del orden de filas."
    pruebas_minimas:
      - "Buscar por SQL los (producto, FechaRecepcion) con COUNT(DISTINCT PrecioCompra) > 1: si hay alguno, el desempate es obligatorio."
      - "Recalcular el costo historico total con los dos ordenes y verificar diferencia 0 (prueba de no regresion del fix)."
    fix_aplicado:
      fecha: "2026-09-25"
      por: "QA (auto-fix, CR-80 etapa 6)"
      resultado: "aplicado"
      build: "dotnet build MariHogar.slnx -> 0 Errores, ningun warning nuevo."
      verificacion: "Costo historico total contra produccion: 104.005.283,10 con el orden de la base y 104.005.283,10 ordenando por (Fecha, Id) - diferencia 0,00, es decir el fix no cambia ningun numero hoy y cierra la puerta a que cambien solos. El invariante de CA-CR80.6 sigue dando A == B == service en los 3 periodos probados."
    nota_generalizacion: "Aplica a toda busqueda de 'el ultimo registro anterior a una fecha' (costo historico, cotizacion vigente, precio de lista, ultima configuracion) resuelta en memoria sobre una lista traida sin ORDER BY. Si la clave de orden puede empatar, el desempate es parte de la regla de negocio y va escrito: sin el, el resultado es correcto hasta que la base cambie de opinion, y el sintoma aparece como 'un numero cerrado que se movio solo'."

  - id: MH-026
    modulo: "Rentabilidad con costo historico (CR-80) - RentabilidadService.ObtenerAsync / card 'Margen real del periodo' del Dashboard"
    titulo: "Dar de baja un producto borra sus ventas pasadas del margen: la card 'Margen real del periodo' calcula sobre hasta 3,3% menos ventas que la card 'Ventas del periodo' que tiene al lado"
    severidad: major
    reproducido_en: "marihogar - base REAL de produccion (QA de CR-80, 2026-09-25). Detectado por QA y escalado; corregido el mismo dia por el orquestador con la propuesta del item (ver fix_aplicado)."
    pasos:
      - "Dar de baja (soft-delete) un producto que tenga ventas en meses ya cerrados."
      - "Abrir el Dashboard con el rango de uno de esos meses y comparar la card 'Ventas del periodo' con la base de ventas que informa 'Margen real del periodo' (y con el total de /Rentabilidad para el mismo rango)."
    sintoma: "Dos numeros rotulados como ventas del mismo periodo, en el mismo bloque de la misma pantalla, difieren. En produccion la diferencia aparece en 12 de los ultimos 17 meses, entre 0,7% y 3,3%: abril 2026 muestra 11.437.741,92 de ventas y calcula el margen sobre 10.945.724,46 (492.017,46 menos). Sobre el historico completo, 3.359.554,32 de ventas reales (31 lineas) quedan afuera del margen. El % de cobertura de costo historico tambien se informa sobre esa base incompleta (CA-CR80.7)."
    expectativa: "Una venta ocurrida cuenta en el margen de su periodo. Es el mismo invariante que CA-CR80.6 pide para las recepciones -una accion posterior a la venta no puede cambiar el margen de esa venta- aplicado a la baja de un producto: dar de baja un producto hoy no puede mover el margen del abril pasado. Y dos cifras dibujadas juntas para compararse tienen que cubrir el mismo conjunto (KOI-017)."
    causa_raiz: "La consulta de lineas de venta proyecta i.Producto!.Nombre, i.Producto.Categoria!.Nombre y i.Producto.PrecioCompra: al navegar a Producto, EF aplica su query filter global de soft-delete y las lineas de productos dados de baja se caen enteras de la consulta (navegacion requerida + filtro = INNER JOIN). No hay ningun filtro visible en el codigo que lo explique. La card 'Ventas del periodo' suma Venta.Total, que no navega a Producto, y por eso si las incluye. Es la contracara exacta de MH-023: ahi el filtro faltaba en una de las dos consultas, aca sobra."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/RentabilidadService.cs
        motivo: "APLICADO. Separar la consulta en dos: (1) las lineas de venta del periodo proyectando solo ProductoId/Cantidad/Subtotal/FechaVenta, sin navegar a Producto - asi el query filter no las alcanza y entran todas; (2) los datos de producto (nombre, categoria, marca, PrecioCompra) de esos ids con IgnoreQueryFilters(), para que un producto dado de baja siga resolviendo su nombre y su costo actual en vez de caer a costo 0. Pasa de 2 a 3 consultas e introduce IgnoreQueryFilters en un Service (hoy solo se usa en tools/), por eso la decision es del implementador."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-25"
      por: "Claude Opus 5 (orquestador del flujo), con la propuesta que dejo escrita el QA en este mismo item"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Infrastructure/Services/RentabilidadService.cs
          motivo: "La consulta de lineas de venta ya no navega a Producto (proyecta ProductoId/Cantidad/Subtotal/FechaVenta), y una segunda consulta resuelve nombre, categoria, marca y PrecioCompra de esos ids con IgnoreQueryFilters(). Un producto dado de baja se rotula '<nombre> (dado de baja)' en las listas de productos: aparece porque vendio en el periodo, y sin el rotulo parece un producto del catalogo que no esta."
      build: "dotnet build MariHogar.slnx -> 0 Errores, 9 warnings preexistentes."
      verificacion: "Contra la base REAL de produccion, rango 2025-01-01 a 2026-09-25: RentabilidadPeriodoDto.Ventas = 207.904.904,02, identico al SQL de control (SUM(VentaItem.Subtotal) de ventas Estado IN (1,2,3) sin join a Productos) - diferencia 0,00. Antes del fix el mismo rango daba 204.545.349,70 (el SQL con join a productos vivos da exactamente ese numero, 1.077 lineas contra 1.108 reales: 2 productos dados de baja con ventas). La suma de los grupos por categoria vuelve a cerrar contra el total. Cobertura de costo historico 90,0%."
    deteccion_qa:
      tipo: calculo
      selector_o_endpoint: "RentabilidadService.ObtenerAsync(desde,hasta) contra DashboardService.ObtenerVentasPeriodoAsync(desde,hasta) para el MISMO rango, con al menos 1 producto soft-deleted con ventas en ese rango"
      condicion_falla: "RentabilidadPeriodoDto.Ventas distinto de VentasPeriodoDto.TotalPeriodo"
    criterio_aceptacion:
      - "Para cualquier rango, la base de ventas del margen es igual al total de ventas que informa el Dashboard para ese rango."
      - "Dar de baja un producto no cambia el margen de ningun periodo ya cerrado."
    pruebas_minimas:
      - "Anotar el margen de un mes cerrado, dar de baja un producto que vendio en ese mes, recalcular: el margen no cambia."
      - "Comparar por SQL SUM(Venta.Total) contra SUM(VentaItem.Subtotal) con join a Productos vivos para cada mes del ultimo anio: toda diferencia distinta de 0 es un mes afectado."
    nota_generalizacion: "Aplica a todo reporte historico construido sobre las lineas hijas de un documento cuando la proyeccion navega a una entidad de CATALOGO con soft-delete. El catalogo describe lo que se puede vender hoy; el historico describe lo que ya se vendio. Si el reporte navega al catalogo para traer un nombre, hereda su filtro de vigencia y empieza a perder historia en silencio, sin error y sin que se vea en el codigo. Regla: en un reporte historico, los datos de catalogo se resuelven en una consulta aparte que ignora los filtros de vigencia; la consulta del hecho nunca navega al catalogo."

  - id: MH-027
    modulo: "Ventas / Eliminar pago (VentaService.EliminarPagoAsync) + CC Local (MovimientosCCLocal)"
    titulo: "Un OrigenTipo nuevo en el ledger vuelve no-unica la FK al documento hijo y desarma el guard que buscaba 'el' movimiento de ese hijo: el contramovimiento sale por el importe equivocado"
    severidad: critical
    reproducido_en: "marihogar - CR-83 (costo de cobranza por venta), 2026-09-30. Detectado por QA antes del merge, sobre codigo + SQL de solo lectura contra la base REAL de produccion. Corregido por el implementador y re-verificado el mismo dia (ver fix_aplicado)."
    pasos:
      - "Agregar al ledger un OrigenTipo nuevo cuyas filas lleven poblada la misma FK al documento hijo que ya usaba el OrigenTipo original (aca: el Egreso 'CostoCobranza' lleva PagoVentaId, igual que el Ingreso 'Venta')."
      - "Aplicar la migracion y correr el recalculo retroactivo, para que un pago LEGADO (sin movimiento propio hasta ahora) reciba su primera fila con esa FK."
      - "Eliminar ese pago legado desde Ventas/Details."
    sintoma: "El guard 'este pago es de datos anteriores a la mejora de agosto de 2026' deja de dispararse porque ahora encuentra una fila, y el sistema postea un Egreso OrigenTipo='Venta' por el importe del COSTO para reversar un Ingreso de venta que nunca existio. La CC Local queda descuadrada por ese importe, y el costo sale dos veces (el contramovimiento propio del costo se postea unas lineas mas abajo). Para un pago no legado, sin ORDER BY el monto del contramovimiento depende del orden que devuelva MySQL: medido sobre un pago real, ~81.197 en lugar de 366.000."
    expectativa: "Un lookup de 'la' fila del ledger por la FK del documento hijo esta acotado por OrigenTipo explicito y ordenado de forma determinista. El guard de datos legados sigue bloqueando exactamente los mismos registros despues de que el feature nuevo les haya posteado su primera fila."
    causa_raiz: "`.Where(m => m.PagoVentaId == pagoVentaId && !m.EsReversion).FirstOrDefaultAsync()` dependia de una unicidad DE HECHO, nunca declarada en el esquema: hasta el CR nuevo, esa FK identificaba una sola fila no-reversion. El OrigenTipo nuevo la vuelve no-unica. El relevamiento de LP-002 se hizo recorriendo los lugares que LEEN OrigenTipo (y encontro uno real que faltaba), pero no los que buscan una fila por la otra clave que el cambio vuelve ambigua."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/VentaService.cs
        motivo: "APLICADO. EliminarPagoAsync: agregar `&& m.OrigenTipo == \"Venta\"` al Where y un `.OrderBy(m => m.Id)` explicito. El filtro restituye la unicidad de hecho; el OrderBy la hace determinista en vez de depender del orden de MySQL."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-30"
      por: "Implementador, sobre el parte de defecto de QA"
      resultado: "aplicado y re-verificado"
      verificacion: "Barrido independiente de QA en la re-verificacion: `grep -rn PagoVentaId` sobre las 4 capas devuelve un unico lookup de tipo 'buscar la fila' (el corregido); los demas son escrituras o agregaciones ya filtradas por OrigenTipo. Barrido de las claves hermanas: ningun lookup del ledger por OrigenId sin OrigenTipo, y el unico lookup del ledger de proveedores (PagoOrdenCompraService, OrigenTipo='PagoOC') ya estaba acotado. SQL contra produccion: los pagos acreditados no-efectivo sin movimiento OrigenTipo='Venta' propio siguen siendo 388 (identico al conteo sin filtrar OrigenTipo, porque produccion todavia no conoce el OrigenTipo nuevo) - el filtro por el literal 'Venta' mantiene ese conteo por construccion cuando el retroactivo postee los egresos de costo, asi que el guard sigue bloqueando los mismos 388."
    deteccion_qa:
      tipo: static
      selector_o_endpoint: "grep -rn '<NombreFk> ==' Infrastructure/Services/ y clasificar cada hit en agregacion (safe) vs busqueda de 'la' fila (hay que acotarla)"
      condicion_falla: "Existe un FirstOrDefault/Single sobre el ledger por la FK del documento hijo sin filtro explicito de OrigenTipo, o sin OrderBy"
    criterio_aceptacion:
      - "Con el feature nuevo posteando su fila, eliminar un registro legado sigue devolviendo el mensaje de bloqueo original."
      - "Eliminar un registro no legado postea el contramovimiento por el importe del documento hijo, nunca por el importe de la fila nueva."
    pruebas_minimas:
      - "SQL de invariante antes del cambio: SELECT n, COUNT(*) FROM (SELECT <fk>, COUNT(*) n FROM <ledger> WHERE <fk> IS NOT NULL AND EsReversion=0 GROUP BY 1) t GROUP BY n. Si solo aparece n=1, hay codigo que depende de esa unicidad sin declararla."
      - "Eliminar/reversar un registro LEGADO despues de que el feature nuevo le haya posteado su primera fila."
    nota_generalizacion: "Emparentado con DN-003 (lookup heuristico no acotado sobre el ledger) y con LP-002 (relevamiento de una capacidad nueva que no cubre todos sus usos). La generalizacion: al agregar un discriminador nuevo a un ledger existente, el relevamiento no alcanza con recorrer los lugares que leen ese discriminador; hay que recorrer los que buscan una fila por cualquier otra clave que hasta ahora era unica de hecho -tipicamente la FK al documento hijo-. El peligro maximo es cuando esa busqueda alimenta un guard de 'no puedo identificar el movimiento de este dato legado': la fila nueva hace que el guard encuentre algo y deje pasar exactamente lo que bloqueaba."

  - id: MH-033
    modulo: "Cuenta Corriente del Local / Caja (MovimientoCCLocal) + Pagos de Orden de Compra (PagoOrdenCompra)"
    titulo: "El ledger de caja solo registraba Ventas y Gastos: los pagos a proveedores no bajaban el saldo, que se leia como plata disponible"
    severidad: high
    reproducido_en: "marihogar, 2026-09-30. Encontrado al conciliar el extracto del Banco Provincia de septiembre 2026 contra la base REAL de produccion, a partir de un pedido del cliente de 'ajustar el saldo de la cuenta corriente para que coincida con el extracto bancario'. Decision del cliente sobre la regla: los pagos a proveedores SI deben impactar la cuenta corriente del local."
    pasos:
      - "Cargar una Orden de Compra y pagarla (cualquier metodo: efectivo, transferencia, Mercado Pago o cheque acreditado)."
      - "Abrir la Cuenta Corriente del Local (o la pantalla de Caja) del periodo en que se hizo ese pago."
      - "Comparar el saldo que muestra contra la plata que realmente hay entre todas las cuentas del negocio."
    sintoma: "El pago aparece en la cuenta corriente del proveedor (baja la deuda) pero NO genera ningun Egreso en la caja del local: el saldo no se mueve. Medido en produccion: $23.750.495,09 de pagos a proveedores en 7 semanas ausentes del ledger, con una pantalla que mostraba $16.250.558,95 de saldo cuando el numero real, descontando las compras pagadas, era -$7.499.936,14. El cliente leyo ese saldo como disponible y pidio cuadrarlo contra el extracto, lo que habria significado postear un ajuste de $16.201.179,73 sin causa economica."
    expectativa: "Un pago de orden de compra postea en los DOS ledgers en la misma transaccion: Pago en la CC del proveedor y Egreso en la caja del local. El saldo de la caja es la plata que hay; si por alcance el sistema deja algun origen afuera, la pantalla nombra lo que el saldo mide ('Resultado operativo del periodo') en vez de llamarlo saldo disponible."
    causa_raiz: "`MovimientoCCLocal.OrigenTipo` se definio en el primer sprint con los dos origenes que existian entonces ('Venta' y 'Gasto') y nunca se amplio al agregar el modulo de Compras, que resolvio su trazabilidad con un ledger propio (MovimientoCCProveedor) y no volvio sobre el de caja. El enum de origen del ledger hay que definirlo desde el inventario completo de documentos que mueven dinero, no desde los primeros implementados."
    capa: Infrastructure
    regla_catalogo: "MH-033 en 32-estandares-qa-implementador.instructions.md"

  - id: MH-034
    modulo: "Cuenta Corriente del Local / Caja (MovimientoCCLocal) - conciliacion bancaria"
    titulo: "Un unico ledger de caja para un negocio que opera con varias cuentas reales no se puede conciliar contra ningun extracto"
    severidad: medium
    reproducido_en: "marihogar, 2026-09-30, mismo analisis que MH-033."
    pasos:
      - "Tomar un negocio que cobra por efectivo, Mercado Pago, dos bancos y una tarjeta propia, con un solo ledger de caja agregado."
      - "Pedir el saldo de una cuenta puntual, o intentar conciliar el ledger contra el extracto de uno de los bancos."
    sintoma: "No hay ningun extracto que represente el saldo del ledger. En el caso real, de $7.912.995,96 de resultado del mes solo $1.718.724,01 pasaron por el banco conciliado y mas de la mitad de los movimientos quedaron con canal indeterminado. El intento de forzar el cuadre termina en un ajuste manual que destruye la informacion."
    expectativa: "La cuenta es una dimension del movimiento y cada cobro/pago la declara, de forma que el sistema pueda dar saldo POR cuenta. El medio de pago no sirve como sustituto: dice como pago el cliente, no donde quedo la plata (una venta con tarjeta de credito liquida en el banco o en Mercado Pago segun la terminal usada)."
    causa_raiz: "Se asumio que el negocio consolida todos sus cobros en una cuenta principal, sin verificarlo. Chequeo barato que lo desmiente: la cuenta estuvo 14 de 30 dias en descubierto (minimo -$148.518,32, con intereses cobrados), imposible en una cuenta que concentrara los cobros de un negocio que mueve $23,7M; y de los $9.129.000,06 cobrados por fuera solo entraron $4.933.000,00 por transferencia o deposito, dejando $4.196.000,06 que nunca llegaron."
    capa: Domain
    regla_catalogo: "MH-034 en 32-estandares-qa-implementador.instructions.md"


  - id: MH-035
    modulo: "Backfill/regularizacion de un ledger (EgresoPagoProveedorService.ArmarLineasBackfillAsync) + Ajuste de apertura"
    titulo: "Un backfill de ledger sin piso de fecha vuelve a postear el pasado que un ajuste de apertura ya habia cerrado"
    severidad: critical
    reproducido_en: "marihogar, 2026-09-30, CR-84 punto 5. Detectado por QA en revision de codigo + SQL de solo lectura contra la base REAL de produccion, ANTES de que el cliente corriera la accion."
    pasos:
      - "Tener un ledger de caja con un movimiento de 'Ajuste de apertura' que llevo el saldo a 0 en una fecha de corte (en el caso real: Egreso de $96.986.104,22 al 2026-08-10, descripcion 'saldo migrado a $0 para inicio de operacion real')."
      - "Escribir un backfill que incorpore al ledger los documentos historicos de un origen que faltaba, seleccionandolos solo por Estado (Pagado) y por el Estado del documento padre."
      - "Correr la previsualizacion y comparar la cantidad y el monto contra el objetivo declarado en el analisis funcional, que estaba acotado 'desde el ajuste de apertura'."
    sintoma: "La previsualizacion propone 404 pagos por $120.186.982,10 contra un objetivo declarado de 74 pagos por $23.750.495,09. El exceso son 331 pagos por $94.706.987,01 anteriores al corte, que el ajuste de apertura ya habia absorbido al forzar el saldo a 0. Aplicado, el saldo de la caja quedaria en -$103.936.423,15 en vez de los -$7.499.936,14 anunciados en la propia pantalla: un error de $96.436.487,01, 13 veces el numero que el cliente iba a confirmar."
    expectativa: "Todo backfill de un ledger que tiene un ajuste de apertura arranca EN la fecha de ese ajuste: el ajuste es, por definicion, el saldo neto de todo lo anterior, asi que reincorporar documentos previos cuenta el mismo dinero dos veces. El piso de fecha se deriva del movimiento de apertura (o se pide como parametro), nunca se omite. Y la previsualizacion tiene que reproducir el objetivo del analisis funcional al peso: si no lo reproduce, el backfill no se corre."
    causa_raiz: "El backfill se escribio como 'todos los documentos pagados que todavia no tienen su contrapartida', que es la definicion correcta de idempotencia pero no la del alcance. El objetivo del analisis estaba acotado por fecha ('desde el ajuste de apertura del 10/08/2026') y ese recorte no viajo al codigo: el filtro por Estado no lo implica. La pantalla ademas mostraba como saldo resultante esperado un numero que su propia consulta no producia."
    capa: Infrastructure
    deteccion_qa:
      tipo: sql
      consulta: "Comparar el COUNT y el SUM de la consulta del backfill contra el objetivo del analisis, y volver a correrlos con el piso de fecha del movimiento de apertura. Si los dos numeros no coinciden con el analisis, el backfill esta mal acotado."
    archivos_fix:
      - "Services/<Origen>Service.cs — metodo que arma las lineas del backfill: agregar el piso de fecha derivado del movimiento de apertura del ledger, aplicado sobre la fecha del DOCUMENTO."
      - "Views/<Regularizacion>/Index.cshtml — mostrar en la previsualizacion la fecha desde la que se incorpora, para que el recorte sea visible antes de confirmar."
    reverificacion_2026_09_30: "SIGUE FAIL en la corrida 2. El piso se agrego pero aplicado sobre la fecha del MOVIMIENTO del ledger hermano, no del documento: un pago con cheque lleva en el movimiento la fecha de VENCIMIENTO, asi que un cheque acreditado despues del ajuste de apertura pero con vencimiento anterior cae del lado equivocado del corte y se pierde (caso real: pago 364, cheque #30, $495.200,00, movimiento al 2026-08-05 y acreditacion al 2026-08-22). Leccion generalizable: el piso de un backfill se aplica sobre la fecha del DOCUMENTO que decide el alcance, nunca sobre una fecha derivada que el ledger puede llevar por otra regla de negocio (vencimiento, acreditacion estimada, liquidacion). Y el documento se postea con esa misma fecha, para no dejar filas fechadas antes del piso que dice contenerlas. Verificacion: probar los discriminadores candidatos en SQL y quedarse con el que reproduce el objetivo del analisis en TODOS sus rubros — aca solo el piso por fecha del documento reprodujo el rubro cheque."
    migracion_ef: no
    regla_catalogo: "MH-035 en 32-estandares-qa-implementador.instructions.md"

  - id: MH-036
    modulo: "Backfill de un ledger espejando un ledger hermano (EgresoPagoProveedorService.ArmarLineasBackfillAsync)"
    titulo: "Espejar 'la suma de los movimientos del ledger hermano' en vez del monto del documento importa al ledger nuevo los duplicados que el hermano ya tenia"
    severidad: high
    reproducido_en: "marihogar, 2026-09-30, CR-84 punto 5. Detectado por QA con SQL de solo lectura contra la base REAL de produccion."
    pasos:
      - "Buscar en el ledger hermano los documentos con MAS de un movimiento no-reversion del mismo tipo: SELECT OrigenId, COUNT(*), SUM(Monto) ... GROUP BY OrigenId HAVING COUNT(*)>1."
      - "En el caso real aparecen 5 pagos con cheque (ids 339, 340, 341, 344, 345) con dos movimientos Pago cada uno, secuela del cambio de criterio de CR-46 (el pago se posteaba al entregar el cheque y volvio a postearse al acreditarlo)."
      - "Ver que el backfill agrupa por OrigenId y toma Sum(Monto) y Min(Fecha)."
    sintoma: "El egreso que el backfill postea para esos 5 pagos es el DOBLE del monto del pago ($2.224.700,00 de exceso) y su fecha (la del primer movimiento) no es la de ninguno de los dos montos que suma. Rompe la invariante central del CR — misma fecha y mismo monto en los dos ledgers — exactamente en las filas donde el ledger hermano ya estaba inconsistente."
    expectativa: "El monto del movimiento espejo se acota al monto del DOCUMENTO (min de la suma de movimientos y documento.Monto), no a la suma del ledger hermano; y un documento cuyo ledger hermano tiene mas de un movimiento no-reversion se EXCLUYE del backfill y se lista como 'a revisar a mano', porque su estado de partida ya es inconsistente. Espejar un ledger sucio propaga la suciedad con apariencia de dato nuevo."
    causa_raiz: "La decision de diseño 'la fecha y el monto no se recalculan, se leen del ledger hermano' es correcta para garantizar la paridad, pero asume que el ledger hermano tiene exactamente un movimiento por documento. El propio comentario del codigo reconoce el caso ('no deberia, pero el ledger no lo impide') y elige sumarlos en vez de excluirlos: convierte una anomalia conocida y acotada en un posteo nuevo, en el ledger que el CR viene a hacer confiable."
    capa: Infrastructure
    deteccion_qa:
      tipo: sql
      consulta: "GROUP BY OrigenId HAVING COUNT(*)>1 sobre el ledger hermano, filtrando EsReversion=0 y el Tipo que corresponda, antes de correr cualquier backfill que lo espeje."
    archivos_fix:
      - "Services/<Origen>Service.cs — metodo que arma las lineas: excluir los documentos con mas de un movimiento no-reversion y devolverlos en una lista aparte de excepciones."
      - "Views/<Regularizacion>/Index.cshtml — seccion 'quedan afuera y por que', igual que la de los documentos sin movimiento identificable."
    migracion_ef: no
    regla_catalogo: "MH-036 en 32-estandares-qa-implementador.instructions.md"

  - id: MH-037
    modulo: "Carga retroactiva de pagos + backfill que espeja la fecha del ledger (PagoOrdenCompraService.RegistrarPagosAsync)"
    titulo: "Una carga retroactiva masiva se guarda con la fecha de hoy, y el backfill que espeja esa fecha imputa meses enteros al mes equivocado"
    severidad: medium
    reproducido_en: "marihogar, 2026-09-30, CR-84. Confirmado por QA con SQL contra produccion y contra el extracto real del Banco Provincia del mes."
    pasos:
      - "Buscar cargas en lote: SELECT Fecha, COUNT(*), SUM(Monto) FROM <pagos> GROUP BY CreatedAt HAVING COUNT(*)>5 — filas con el CreatedAt identico al microsegundo son una sola sesion de carga."
      - "En el caso real: 14 pagos por transferencia, $6.382.868,96, todos con CreatedAt = Fecha = 2026-09-30 15:02:43.059807 (12:02 hora Argentina), sobre 13 ordenes de compra viejas (20, 31, 47, 48, 55, 58, 63, 65, 119, 129, 130, 131, 132)."
      - "Cruzar contra el extracto de la cuenta: el Banco Provincia cierra ese dia con $49.379,22 de saldo y no muestra ninguna salida de ese orden."
    sintoma: "Esa plata no pudo salir ese dia: es la puesta al dia de pagos viejos, guardada con la fecha del momento de la carga. El sistema OFRECE backdatear la transferencia (CR-54 usa FechaPagoTentativa para eso) pero no lo exige, asi que la fecha real se pierde en silencio. Al espejar esa fecha en el segundo ledger, el backfill imputa los $6.382.868,96 enteros al mes de la carga y descuadra el flujo de ese mes contra el extracto — el uso mismo que el CR venia a habilitar."
    expectativa: "Dos cosas: (a) la fecha del pago es un dato del hecho, no del momento de la carga — para los metodos backdateables la pantalla la pide o al menos advierte cuando se cargan varios pagos juntos sobre documentos viejos; (b) antes de correr un backfill que espeja fechas, se listan los lotes de carga sospechosos (mismo CreatedAt, muchas filas, documentos viejos) y se corrigen o se declaran, porque el backfill los congela en el ledger nuevo."
    causa_raiz: "La fecha por defecto de un pago es DateTime.UtcNow, que es correcta cuando el pago se carga en el momento en que ocurre y falsa cuando se carga al dia siguiente o al mes siguiente. El riesgo era invisible mientras el dato vivia en un solo ledger usado para saldos acumulados; se vuelve visible al usarlo para conciliar flujo contra un extracto mensual."
    capa: Infrastructure
    deteccion_qa:
      tipo: sql
      consulta: "GROUP BY CreatedAt HAVING COUNT(*) > 5 sobre la tabla de pagos, cruzado contra la antiguedad del documento padre y contra el extracto de la cuenta del periodo."
    archivos_fix:
      - "Views/<Pagos>/*.cshtml — hacer visible/obligatoria la fecha real para los metodos backdateables."
      - "Services/<Regularizacion>Service.cs — listar los lotes de carga sospechosos en la previsualizacion del backfill."
    migracion_ef: no
    regla_catalogo: "MH-037 en 32-estandares-qa-implementador.instructions.md"

  - id: MH-038
    modulo: "Backfill de ledger con fechas derivadas (EgresoPagoProveedorService.ArmarBackfillAsync) + Cheques a proveedor"
    titulo: "La fecha con la que un ledger asienta un hecho no es la fecha del hecho: un cheque tiene tres fechas y el backfill eligio la mas lejana de la salida real de dinero"
    severidad: medium
    reproducido_en: "marihogar, 2026-09-30, CR-84 punto 5, corrida 3 de QA. Medido con SQL de solo lectura contra la base REAL de produccion."
    pasos:
      - "Tomar un pago con cheque y enumerar TODAS sus fechas: la del documento de pago (cuando se entrego el cheque), la del vencimiento y la de acreditacion."
      - "Ver con cual de las tres quedo asentado el movimiento en cada ledger."
      - "Medir la distancia de cada candidata contra la fecha en que el dinero realmente salio (la acreditacion): SELECT AVG(DATEDIFF(FechaAcreditacion, <candidata>))."
    sintoma: "El backfill fechaba el egreso con la fecha del documento de pago, que para un cheque es el dia en que se ENTREGO. Medido sobre los 24 cheques del periodo: 19 tienen esa fecha distinta de la acreditacion, con un desfasaje promedio de 10,75 dias y maximo de 32. El vencimiento, que es lo que usa el ledger hermano, se desvia en promedio solo 2,38 dias. O sea que la correccion cambio un error de 2,4 dias por uno de 10,75, cuando la fecha correcta (FechaAcreditacion) ya estaba guardada en la base. Efecto material: 9 pagos por $3.197.940,56 quedan imputados a un MES distinto que el ledger hermano, sobre un backfill de $23.750.495,09 — el 13% del monto en el mes equivocado, en un sistema cuyo proximo paso declarado es conciliar flujo mensual contra el extracto."
    expectativa: "Antes de elegir con que fecha se asienta un hecho en un ledger, enumerar TODAS las fechas que el hecho tiene y elegir la que representa el evento economico (para un cheque: la acreditacion, cuando el banco lo cobro), no la primera que este a mano en la entidad que se esta recorriendo. Si la fecha correcta ya existe en el modelo, no se acepta ninguna aproximacion: el trade-off entre dos fechas equivocadas es una falsa disyuntiva. Y si un backfill de una sola corrida escribe filas con una fecha aproximada, corregirlo despues cuesta otra migracion de datos, asi que se decide antes."
    causa_raiz: "El razonamiento fue de coherencia interna — 'que el mismo campo decida la inclusion y la fecha' — que es correcto como restriccion pero no elige el campo. El campo se eligio por estar disponible en la proyeccion que ya se estaba leyendo, no por representar el hecho. Debajo hay un problema de modelo mas viejo: el movimiento de CC Proveedor de un cheque se postea con `cheque.FechaVencimiento` bajo el supuesto de que ahi salio el dinero, y en produccion 27 de los 29 cheques acreditados ($9.745.379,65, el 92% del monto) tienen vencimiento distinto al dia de acreditacion, con un caso acreditado 28 dias ANTES del vencimiento."
    capa: Infrastructure
    deteccion_qa:
      tipo: sql
      consulta: "Para cada candidata a fecha del movimiento, AVG y MAX de DATEDIFF contra la fecha del evento economico real, y COUNT/SUM de los casos que cambian de mes (DATE_FORMAT '%Y-%m' distinto). La candidata con menor desfasaje gana; si alguna da 0, es la unica aceptable."
    archivos_fix:
      - "Services/<Origen>Service.cs — usar la fecha del evento economico (para cheques, FechaAcreditacion, con fallback a la del documento) tanto en el piso como en el posteo."
      - "Services/<Cheque>Service.cs — el camino en vivo postea con el vencimiento; corregirlo es un CR propio, no parte del backfill."
    migracion_ef: no
    regla_catalogo: "MH-038 en 32-estandares-qa-implementador.instructions.md"
    fix_aplicado: "marihogar CR-84, corrida 4 de QA (2026-09-30): la fecha del egreso y el piso salen de una FECHA EFECTIVA DE SALIDA DE DINERO resuelta por tipo de pago — cheque acreditado -> Cheque.FechaAcreditacion; pago programado y confirmado -> PagoOrdenCompra.FechaPagoTentativa (que ConfirmarPagoAsync pisa con la fecha real de la accion, asi que es el hecho y no un proxy); resto -> PagoOrdenCompra.Fecha. Se mantiene el campo unico: el mismo valor decide la inclusion y fechea el egreso, asi que un egreso anterior al piso es imposible por construccion. Verificado en produccion: el total del periodo no cambia (74 pagos / $23.750.495,09) y los pagos imputados a un mes distinto que el ledger hermano bajan de 9 ($3.197.940,56) a 2 ($918.799,97), y esos 2 quedan con la caja BIEN y el ledger hermano mal — el residuo es el problema de modelo de fondo, no el backfill."
    leccion_adicional: "Dos corolarios que aparecieron al cerrarlo. (1) Un campo que ES la fecha del hecho puede dejar de serlo si otro camino del sistema no lo mantiene: la correccion de fecha del pago actualiza el documento y los dos ledgers pero NO el campo de la confirmacion, que es el que el backfill prefiere — antes de confiar en un campo, revisar TODOS los caminos que lo escriben, no solo el que lo puebla. (2) Al evitar una navegacion a una entidad soft-deletable con IgnoreQueryFilters, auditar las navegaciones RESTANTES del mismo metodo: en este caso se corrigio la del cheque y quedo viva la del documento padre, que sigue cayendo en el mismo INNER JOIN filtrado. Y medir el beneficio: aca el arreglo era correcto pero rescataba 0 filas en produccion, asi que no es un motivo para confiar mas en la corrida."

  - id: MH-039
    modulo: "Retroactivo que reemplaza una carga manual (CostoCobranzaService.PrevisualizarRecalculoAsync + Gastos categoria 'Comisiones bancarias')"
    titulo: "Un retroactivo que reemplaza datos cargados a mano deja el doble conteo vivo si la anulacion de los manuales es una decision humana y nadie la verifica fila por fila"
    severidad: medium
    reproducido_en: "marihogar, 2026-09-30, auditoria de consistencia cross-pantalla de CR-83/CR-84. Medido con SQL de solo lectura contra la base REAL de produccion."
    pasos:
      - "Identificar la categoria/entidad con la que el usuario venia registrando a mano el hecho que el retroactivo ahora postea solo (aca: Gasto con Categoria=ComisionesBancarias vs movimiento de ledger con OrigenTipo='CostoCobranza')."
      - "SELECT Categoria, Anulado, COUNT(*), SUM(Monto) FROM gastos WHERE Categoria=<la del hecho> GROUP BY 1,2 — confirmar que NO queda ninguna fila con Anulado=0 en el periodo que el retroactivo cubrio."
      - "Si queda alguna, medir su peso contra los egresos del periodo y contra el promedio que proyecta los meses futuros."
    sintoma: "La pantalla del retroactivo avisa en rojo y con el monto exacto que hay N gastos manuales que representan lo mismo, y aclara que el sistema no los anula por su cuenta. En produccion se anularon 13 de 14: sobrevivio el gasto id 520, 'COMISION MP', $50.000,00 del 14/09/2026, Anulado=0, conviviendo con los $1.301.077,43 de CostoCobranza que el retroactivo posteo. Resultado: el costo de cobranza queda contado dos veces por $50.000 en Caja mensual (Egresos), en el card Gastos operativos del Dashboard, en el saldo de CC Local y — el peor — en el promedio de gasto operativo que ProyeccionFinancieraService usa para proyectar los meses futuros, asi que un residuo puntual se vuelve gasto recurrente proyectado."
    expectativa: "Cuando un retroactivo pasa a postear solo un hecho que el usuario venia cargando a mano, el aviso de doble conteo no alcanza: la corrida tiene que terminar con una VERIFICACION de cierre que cuente las filas manuales todavia activas en el periodo cubierto y las muestre en 0, o enumere las que quedan. Un aviso previo que depende de que el operador complete una accion manual en otra pantalla se cumple parcialmente, y el residuo no deja rastro en ninguna pantalla."
    causa_raiz: "El guard se diseño como advertencia PRE-corrida (correcto) pero no hay chequeo POST-corrida. La anulacion es correctamente una decision humana, pero una decision humana sobre 14 filas en otra pantalla se ejecuta al 93%, no al 100%, y el sistema no vuelve a mirar."
    capa: Infrastructure
    deteccion_qa:
      tipo: sql
      consulta: "SELECT Categoria, Anulado, COUNT(*) n, SUM(Monto) t FROM gastos WHERE Categoria=<categoria espejo> GROUP BY 1,2 — cualquier fila con Anulado=0 dentro del periodo del retroactivo es doble conteo en vivo. Cruzar contra SUM(Monto) de los movimientos del OrigenTipo nuevo en el mismo periodo."
    archivos_fix:
      - "Services/<Retroactivo>Service.cs — agregar al resultado de la corrida el conteo de filas manuales todavia activas en el periodo, y mostrarlo en la pantalla de resultado."
      - "Views/<Retroactivo>/<Pantalla>.cshtml — convertir el aviso previo en un bloque de cierre que persista mientras queden filas sin anular."
    migracion_ef: no
    regla_catalogo: "MH-039 en 32-estandares-qa-implementador.instructions.md"
    leccion_adicional: "El efecto mas caro no es el del periodo (0,5% de los egresos del mes) sino el de la proyeccion: cualquier residuo que caiga en la base de un PROMEDIO se multiplica por la cantidad de meses proyectados. Al auditar un retroactivo, preguntar siempre que promedios leen la tabla que el retroactivo toco."

  - id: MH-040
    modulo: "Proyeccion financiera / ledger inmutable con estado de documento reversible (ProyeccionFinancieraService + ChequeService.RevertirEstadoAsync)"
    titulo: "'Los dos conjuntos son disjuntos por construccion' deja de ser cierto cuando el ledger es inmutable y el estado del documento puede volver atras: la fila vieja sobrevive y el documento vuelve a contarse"
    severidad: medium
    reproducido_en: "marihogar, 2026-09-30, auditoria de consistencia cross-pantalla de CR-83/CR-84. Confirmado estructuralmente en el codigo + SQL de produccion (0 casos hoy, camino en vivo alcanzable)."
    pasos:
      - "Encontrar en la proyeccion dos sumandos que se declaren disjuntos por el ESTADO de un documento (aca: ChequesPendientes cuenta Estado=Pendiente; EgresosPosteadosFuturos cuenta filas de ledger con fecha futura, que solo nacen al acreditar)."
      - "Buscar el camino que devuelve el documento al estado anterior (aca: ChequeService.RevertirEstadoAsync, volver un cheque Acreditado a Pendiente)."
      - "Ver con que FECHA se postea el contramovimiento de reversion. Si se fecha HOY (criterio correcto para el ledger) y el movimiento original quedo fechado en el FUTURO, la reversion cae en un mes distinto del que tiene que compensar."
      - "Reconstruir el neto del mes futuro: -ChequesPendientes -EgresosPosteadosFuturos = -2x el monto del cheque."
    sintoma: "Un cheque acreditado con vencimiento futuro postea su egreso con la fecha de vencimiento (futura), asi que entra en EgresosPosteadosFuturos del mes del vencimiento. Si despues se revierte la acreditacion, el ledger es inmutable: la fila futura queda, la reversion se postea con fecha HOY (mes pasado o en curso, criterio MH-021, correcto) y el cheque vuelve a Estado=Pendiente, asi que tambien entra en ChequesPendientes del mismo mes futuro. El saldo proyectado de ese mes descuenta el cheque DOS VECES. En produccion hoy hay 0 filas de ledger con fecha futura (el unico cheque acreditado con vencimiento futuro quedo fechado por un backfill con la fecha de acreditacion), asi que es latente — pero el camino en vivo lo produce desde el proximo cheque que se acredite con vencimiento futuro y se revierta."
    expectativa: "Una declaracion de disjuncion entre dos sumandos de un reporte es una invariante, y una invariante se verifica contra TODAS las transiciones de estado del documento, incluidas las que vuelven atras, no solo contra el camino feliz. Si el ledger es inmutable y el estado es reversible, la disjuncion por estado no se sostiene sola: hay que netear el sumando que sale del ledger por EsReversion y por OrigenId, o excluir del tramo futuro las filas cuyo documento ya no esta en el estado que las genero."
    causa_raiz: "El razonamiento fue correcto para la transicion que crea la fila (Pendiente -> Acreditado postea el egreso) y no se extendio a la inversa (Acreditado -> Pendiente, agregada en un CR anterior, que no puede borrar la fila). La consulta del tramo futuro ni siquiera trae EsReversion, asi que no tiene con que compensar."
    capa: Infrastructure
    deteccion_qa:
      tipo: sql
      consulta: "SELECT OrigenTipo, COUNT(*), SUM(Monto) FROM <ledger> WHERE Fecha > CURDATE() GROUP BY OrigenTipo — si hay filas futuras, cruzarlas contra el estado ACTUAL de su documento origen: cualquier fila futura cuyo documento volvio al estado previo al posteo es doble conteo."
    archivos_fix:
      - "Services/ProyeccionFinancieraService.cs — traer EsReversion en la proyeccion del tramo futuro y netear por OrigenTipo/OrigenId, o excluir las filas cuyo documento ya no justifica el posteo."
      - "DTOs/ProyeccionFinancieraDtos.cs — el doc-comment que declara la disjuncion tiene que nombrar la transicion inversa y por que no la rompe."
    migracion_ef: no
    regla_catalogo: "MH-040 en 32-estandares-qa-implementador.instructions.md"
    leccion_adicional: "El patron general: 'inmutabilidad del ledger' + 'fecha del contramovimiento = hoy' + 'fila original fechada en el futuro' = la reversion NO compensa a la fila original en ningun reporte agrupado por mes. Cada vez que un sistema postea una fila con fecha futura, hay que preguntar que pasa si el hecho se deshace. Corolario de lectura: un Ingreso de reversion con un OrigenTipo que no es el de ventas tambien cae en el bucket de 'cobros comprometidos' si queda fechado en el futuro, porque el tramo futuro ramifica por Tipo y no por OrigenTipo."

  - id: MH-041
    modulo: "Auditoria de consistencia cross-pantalla (inventario de lectores de una fuente de datos)"
    titulo: "Un inventario de pantallas enumerado a mano siempre omite pantallas; el inventario se cierra por la lista de LECTORES de la fuente, no por recorrido de cards"
    severidad: low
    reproducido_en: "marihogar, 2026-09-30, auditoria de consistencia cross-pantalla de CR-83/CR-84."
    pasos:
      - "Tomar el inventario de pantallas que declara el implementador y NO verificarlo pantalla por pantalla."
      - "En su lugar, grep de la ENTIDAD fuente (aca: MovimientosCCLocal) sobre toda la solucion, excluyendo migraciones. La lista de archivos que la referencian es cerrada y chequeable."
      - "Para cada numero que el inventario declara 'ajeno', confirmar con grep -c que el servicio que lo calcula tiene 0 referencias a la fuente. Un 'deliberadamente ajeno' con 0 referencias es una decision verificada; con >0 hay que leerlo."
      - "Despues barrer vistas por patrones de monto para encontrar las pantallas que el inventario no enumero."
    sintoma: "Un inventario declarado 'completo' de 16 pantallas dejo afuera, entre otras: el card hero 'Ventas del periodo' del propio Dashboard (con 4 numeros derivados), la pantalla de recalculo retroactivo (que LEE el ledger y filtra por el OrigenTipo nuevo), el grafico de serie de 12 meses del mismo KPI que el card ya auditado (metodo y ventana distintos, pueden divergir), las 4 cards secundarias de la propia pantalla de proyeccion (una de ellas un cuarto calculo de la deuda a proveedores), el export a Excel del reporte financiero (que arma sus filas en el controller, no en la vista), 3 generadores de PDF con montos y las notificaciones que imprimen importes en el texto."
    expectativa: "El inventario de un cambio de consistencia cross-pantalla se cierra por la fuente, no por la UI: la lista de lectores de la entidad es finita y verificable con una herramienta, la lista de cards no. Enumerar las cards sirve para explicar la decision de cada una, no para demostrar que no falta ninguna. Y los 'deliberadamente ajeno' se justifican con la evidencia de 0 referencias a la fuente, que es barata y no admite interpretacion."
    causa_raiz: "El inventario se armo recorriendo las pantallas que el CR venia tocando, que es el conjunto que ya estaba en la cabeza del que implemento. Las omisiones caen justo donde el recorrido no pasa: exports, PDFs, notificaciones, pantallas de configuracion que postean al ledger, y las cards secundarias de una pantalla cuyo elemento principal ya se reviso."
    capa: Transversal
    deteccion_qa:
      tipo: manual
      consulta: "grep -rln '<EntidadFuente>' --include=*.cs <capas> | grep -v Migrations  -> lista cerrada de lectores. Luego grep -c por cada servicio declarado ajeno. Luego barrido de vistas por patron de monto para los item 17+."
    archivos_fix: []
    migracion_ef: no
    regla_catalogo: "MH-041 en 32-estandares-qa-implementador.instructions.md"
    leccion_adicional: "Corolario para QA: cuando el pedido del cliente es 'que este replicado en TODO el sistema', el entregable de QA no es 'revise los 16 que me dijeron' sino 'la fuente tiene N lectores y estos son'. La diferencia entre las dos listas ES el hallazgo."


  - id: MH-044
    modulo: "Correccion de la fecha de un pago a proveedor (PagoOrdenCompraService.ActualizarFechaPagoAsync + EgresoPagoProveedorService.ActualizarFechaEgresoAsync)"
    titulo: "Generalizar 'corregir la fecha del pago' a todos los metodos expone un UPDATE asimetrico: la caja corrige TODAS sus filas y la CC del proveedor solo la PRIMERA, que en un pago con cheque es la fila ya reversada"
    severidad: major
    reproducido_en: "marihogar, commit 0e80ff5 (CR-86 punto 8, frente B), verificado por codigo + SQL contra produccion el 2026-10-02."
    pasos:
      - "Tener un PagoOrdenCompra con MAS DE UN movimiento 'Pago' no-reversion en MovimientosCCProveedor. Se produce solo con (a) el cambio de criterio de CR-46 (Pago al entregar el cheque + reversion + Pago al acreditar) o (b) cualquier backfill que reasiente fechas por reversion + alta."
      - "Abrir OrdenesCompra / Details de la OC de ese pago y usar el lapiz 'Editar fecha de pago' (habilitado para todos los metodos desde CR-86 punto 8; antes estaba acotado a Transferencia y por eso el caso no disparaba)."
      - "Guardar una fecha nueva y leer las dos tablas de ledger por OrigenTipo='PagoOC' y OrigenId=<pago>."
    sintoma: "La fecha se corrige en pago.Fecha, en Cheque.FechaAcreditacion, en el gasto del impuesto y en TODAS las filas de egreso de MovimientosCCLocal, pero en MovimientosCCProveedor solo en UNA fila elegida sin orden explicito. En produccion, pago 339 (cheque #0, OC 20, $533.333,33): las filas no-reversion son la id 593 (19/08/2026, ya compensada por la reversion id 601) y la id 625 (28/08/2026, la viva). FirstOrDefaultAsync sin OrderBy devuelve la 593, asi que se corrige una fila muerta y la viva queda en 28/08 mientras la caja se mueve: los dos ledgers del mismo hecho quedan en meses distintos, que es exactamente la inconsistencia que CR-84 cerro. Mismo cuadro en los pagos 340, 341, 344 y 345; y en los 27 pagos / $9.745.379,65 que el backfill de CR-86 reasienta, en cuanto se corra."
    expectativa: "Corregir la fecha de un pago deja los dos ledgers en la misma fecha, sin importar cuantas filas historicas tenga cada uno. La fila a mover es la que tiene saldo neto vigente (Pago no-reversion menos Cargo reversion de esa fecha), no la primera que devuelve la base; y las filas ya reversadas no se tocan, porque son historia cerrada."
    causa_raiz: "El metodo venia de CR-53 con un guard Metodo == Transferencia. Bajo ese guard el pago tenia siempre exactamente un movimiento de proveedor, asi que FirstOrDefaultAsync era suficiente y nadie lo noto. CR-86 punto 8 elimina el guard para habilitar CA-86.9 (el pago 441 de Mercado Pago) y con eso el metodo alcanza los pagos con cheque, que son precisamente los que tienen el ledger con mas de una fila. El metodo hermano del lado de la caja (ActualizarFechaEgresoAsync) ya usa ToListAsync + foreach, asi que la asimetria esta escrita en el propio par de metodos."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/PagoOrdenCompraService.cs
        motivo: "Hipotesis, no instruccion: identificar la fila con saldo neto vigente (el mismo criterio por fecha que ChequeService.SaldoPorFechaProveedor ya usa para el backfill) en vez de FirstOrDefaultAsync. La opcion mas consistente con PAT-023 es reemplazar el UPDATE en el lugar por reversion + alta en los DOS ledgers, pero eso cambia tambien el camino de caja (CR-52/CR-84 lo dejaron declarado como excepcion consciente) y es una decision de arquitectura, no del fix."
      - path: MariHogar.Infrastructure/Services/EgresoPagoProveedorService.cs
        motivo: "Hipotesis: el foreach que mueve TODAS las filas de egreso tiene el problema simetrico en cuanto el ledger de caja tenga mas de una fila por pago (lo tendra si alguna vez se corre el backfill de fechas con staleCaja no vacio). Acotar al neto vigente, con el mismo criterio."
    migracion_ef: no
    deteccion_qa:
      tipo: manual
      consulta: "SELECT OrigenId, COUNT(*) FROM MovimientosCCProveedor WHERE OrigenTipo='PagoOC' AND EsReversion=0 AND Tipo=2 GROUP BY OrigenId HAVING COUNT(*)>1 -> cualquier pago de esa lista es un caso. Corregirle la fecha desde la UI y comparar DATE(Fecha) de la fila con saldo neto vigente contra DATE(Fecha) del egreso de caja."
      condicion_falla: "Despues de corregir la fecha, la fila de MovimientosCCProveedor con saldo neto vigente y la de MovimientosCCLocal del mismo pago tienen fechas distintas."
    criterio_aceptacion:
      - "Sobre el pago 339 (o cualquiera con mas de una fila no-reversion), corregir la fecha desde OrdenesCompra/Details deja la fila de CC Proveedor con saldo neto vigente y el egreso de caja en la MISMA fecha, y no modifica ninguna fila ya reversada."
      - "El caso de un solo movimiento (una transferencia comun) sigue funcionando igual que antes del fix."
    pruebas_minimas:
      - "Pago con cheque acreditado y ledger de una sola fila: la correccion mueve las dos puntas (hoy PASA, no debe romperse)."
      - "Pago 441 (Mercado Pago, $581.358,96, OC 80): CA-86.9, la correccion tiene que seguir funcionando."
      - "Pago 339: el caso del defecto."

  - id: MH-048
    modulo: "Interaccion entre dos backfills del mismo ledger (ChequeService.AplicarBackfillFechasAsync vs EgresoPagoProveedorService.ArmarBackfillAsync)"
    titulo: "Un backfill por reversion + alta deja a cada pago con dos filas no-reversion, y eso dispara el guard de 'ledger sucio' de OTRO backfill: la pantalla de regularizacion pasa a pedir revision manual de 28 pagos sanos por $10.278.712,98"
    severidad: major
    reproducido_en: "marihogar, commit 0e80ff5 (CR-86 punto 9), verificado por codigo + SQL contra produccion el 2026-10-02. El defecto se materializa al correr el backfill de fechas; la condicion que lo produce esta medida."
    pasos:
      - "Leer el guard MH-036 de EgresoPagoProveedorService.ArmarBackfillAsync: if (mov.Cantidad > 1) { excluidos.Add(...); continue; }, donde Cantidad es el numero de movimientos 'Pago' no-reversion del pago en CC Proveedor."
      - "Comprobar que ese guard se evalua ANTES del chequeo de idempotencia var yaPosteado = netosCaja.GetValueOrDefault(p.Id), o sea que un pago cuyo egreso YA esta correctamente posteado igual cae en la lista de excluidos."
      - "Correr el backfill de fechas de cheques (Cheques / Reasentar fechas historicas). Cada pago reasentado suma una fila Pago no-reversion nueva."
      - "Volver a abrir la pantalla de regularizacion de caja de CR-84 y leer el bloque de excluidos."
    sintoma: "La pantalla de regularizacion de caja pasa de listar 5 pagos / $2.224.700,00 como 'hay que revisarlo a mano' a listar 28 pagos / $10.278.712,98 (los 27 reasentados por $9.745.379,65 mas el pago 341 por $533.333,33), con el motivo 'El pago tiene N movimientos en la cuenta corriente del proveedor: no se puede determinar la fecha del egreso sin revisarlo'. Los 27 nuevos NO tienen nada que revisar: su egreso de caja esta posteado y correctamente fechado (verificado: los 24 cheques con egreso tienen DATE(caja)=DATE(FechaAcreditacion) en los 24 casos). Es una falsa alarma de $10,2M sobre la pantalla que decide una escritura financiera de una sola corrida."
    expectativa: "Un guard de 'el ledger hermano esta sucio' tiene que mirar el saldo NETO por fecha, no la cantidad de filas: con reversion + alta la cantidad de filas crece por diseno y no significa suciedad. Y el chequeo de idempotencia tiene que evaluarse PRIMERO: un pago cuyo egreso ya esta posteado y bien fechado no es candidato a nada, ni a postear ni a excluir, asi que no tiene por que aparecer en ninguna de las dos listas."
    causa_raiz: "Dos backfills del mismo ledger escritos en CRs distintos con criterios distintos sobre la misma senal. El de CR-84 interpreta 'mas de una fila no-reversion' como suciedad irrecuperable (y en su momento lo era: era el rastro del cambio de criterio de CR-46). El de CR-86 produce esa misma senal deliberadamente, porque PAT-023 le prohibe el UPDATE y lo obliga a reversion + alta. Ninguno de los dos es incorrecto por separado; lo que falta es que el guard del primero use el mismo criterio de saldo neto por fecha que el segundo ya implemento (SaldoPorFechaProveedor)."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/EgresoPagoProveedorService.cs
        motivo: "Hipotesis, no instruccion: mover el chequeo de yaPosteado por delante de los dos guards de exclusion, y reemplazar mov.Cantidad > 1 por un criterio de saldo neto por fecha (una sola fecha con neto > 0 = ledger limpio), reutilizando el mismo calculo que ChequeService.SaldoPorFechaProveedor. La alternativa de dejarlo como esta y documentarlo NO alcanza: el texto que ve el cliente le pide una revision manual que no corresponde."
    migracion_ef: no
    deteccion_qa:
      tipo: manual
      consulta: "Previsualizar la regularizacion de caja ANTES y DESPUES de correr el backfill de fechas, y comparar la cantidad y el monto del bloque de excluidos."
      condicion_falla: "El bloque de excluidos crece al correr un backfill que solo reasienta fechas, o incluye algun pago cuyo neto de caja ya es > 0."
    criterio_aceptacion:
      - "Correr el backfill de fechas de cheques NO cambia la lista de excluidos de la regularizacion de caja: sigue en 5 pagos / $2.224.700,00."
      - "Ningun pago con neto de caja > 0 aparece en el bloque de excluidos."
    pruebas_minimas:
      - "Previsualizacion de la regularizacion de caja antes del backfill de fechas: 5 / $2.224.700,00."
      - "Previsualizacion despues del backfill de fechas: el mismo numero."
      - "El objetivo de CA-84.8 (74 pagos / $23.750.495,09) no cambia por el reordenamiento de los guards."
  - id: MH-053
    modulo: "Correccion de la fecha de un pago a proveedor (PagoOrdenCompraService.ActualizarFechaPagoAsync) - pagos con el ledger totalmente reversado"
    titulo: "Agrupar por fecha para mover 'el grupo entero' cubre la reversion PARCIAL del mismo dia, que no existe, y no cubre la reversion TOTAL fechada en otro dia, que si existe: el credito queda en su mes"
    severidad: low
    reproducido_en: "marihogar, commit e973c7b (CR-86 corrida 2, fix de MH-044), verificado por codigo + SQL contra produccion el 2026-10-02. PREEXISTENTE: el codigo anterior hacia lo mismo, asi que no es una regresion del fix."
    pasos:
      - "Buscar pagos con Estado=Pagado cuyo neto en MovimientosCCProveedor sea 0 porque la reversion esta fechada en otro dia que el Pago: SELECT ... EsReversion=1 agrupado por OrigenId. En produccion son los pagos 58 ($629.975,96), 201 ($299.999,88) y 203 ($300.000,00), los tres con la reversion al 2026-09-30 y el Pago en marzo/diciembre/noviembre."
      - "Abrir OrdenesCompra / Details de esa OC y corregir la fecha del pago con el lapiz (habilitado para todos los medios desde CR-86 punto 8)."
      - "Leer MovimientosCCProveedor de ese OrigenId."
    sintoma: "SaldoLedgerPorFecha.Proveedor agrupa por fecha, asi que la fecha del Pago tiene neto > 0 (es 'viva') y la de la reversion tiene neto < 0 (no entra). Se mueve el Pago a la fecha nueva y el Cargo de reversion queda en la fecha vieja: el mes de la reversion se queda con un credito sin su debito, que es literalmente el dano que el comentario del helper dice estar evitando. El caso que el comentario describe (Pago 100 + Cargo reversion 40 el MISMO dia, neto 60) tiene 0 ocurrencias en produccion: las 10 reversiones del ledger de proveedores son todas por el importe total, 5 fechadas el mismo dia que el Pago (neto 0, correctamente ignoradas) y 5 en otro dia."
    expectativa: "Dos salidas posibles, y la eleccion es funcional, no tecnica: (a) un pago cuyo neto TOTAL en el ledger es 0 esta reversado y no tiene fecha que corregir -- el metodo deberia rechazarlo con un mensaje, en vez de reescribir un debito muerto; o (b) si se lo permite, la correccion tiene que arrastrar tambien las reversiones que compensan a las filas que mueve, esten fechadas donde esten. Lo que no corresponde es mover media compensacion."
    causa_raiz: "El criterio de 'grupo vivo' se definio por FECHA porque ese es el eje que el backfill necesita (reasentar un dia en otro dia). Para la correccion de fecha de un pago el eje correcto es el PAGO: lo que se mueve es un hecho economico completo, y su compensacion es parte del hecho aunque este fechada otro dia. El helper compartido resolvio la duplicacion de MH-044 pero importo a los otros dos caminos un criterio que era exacto solo para el tercero."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/PagoOrdenCompraService.cs
        motivo: "Hipotesis, no instruccion: guard de neto total 0 (reutilizando ObtenerNetoPosteadoAsync del lado de proveedores, si existe el equivalente) antes de tocar nada. La opcion (b) exige decidir que es 'la reversion que compensa a esta fila', que el ledger no modela explicitamente -- razon de mas para que lo resuelva el analista."
      - path: MariHogar.Infrastructure/Services/SaldoLedgerPorFecha.cs
        motivo: "Hipotesis: si se elige (b), el helper necesita un segundo metodo con eje de pago, no un cambio en el de eje de fecha, que el backfill usa bien."
    migracion_ef: no
    deteccion_qa:
      tipo: manual
      consulta: "SELECT OrigenId, SUM(CASE WHEN Tipo=2 AND EsReversion=0 THEN Monto WHEN Tipo=1 AND EsReversion=1 THEN -Monto ELSE 0 END) neto FROM MovimientosCCProveedor WHERE OrigenTipo='PagoOC' GROUP BY OrigenId HAVING neto=0 -> cruzar con PagosOrdenCompra.Estado=Pagado."
      condicion_falla: "Un pago con neto total 0 admite correccion de fecha, y despues de corregirla alguna fila del ledger de ese pago quedo en una fecha y su compensacion en otra."
    criterio_aceptacion:
      - "Sobre el pago 58 (o 201, o 203), la correccion de fecha o se rechaza con un mensaje que explica que el pago esta reversado, o deja el Pago y su Cargo de reversion en la MISMA fecha nueva."
      - "Los pagos 339/340/341/344/345 (reversion del mismo dia, neto 0 en esa fecha) siguen moviendo solo su grupo vivo, sin tocar el par compensado del 19/08 (cerrado en MH-044: no debe romperse)."
    pruebas_minimas:
      - "Pago 58: el caso del defecto."
      - "Pago 339: la regresion de MH-044."
      - "Un pago con una sola fila de ledger (los 13 del lote MH-037): el comportamiento no cambia."
  - id: ELV-005
    modulo: "Cuentas / Details - grilla de movimientos (MovimientoService.GetDataTableAsync + GetSaldosAcumuladosAsync)"
    titulo: "Una fila ANULADA en la grilla muestra Saldo Acumulado 0,00 y, si es el ultimo movimiento de la cuenta, el acumulado de la primera fila deja de coincidir con el saldo del encabezado"
    severidad: major
    reproducido_en: "eleven-la-plata, dev + lote F1-F4 sin commitear - reproducido 2026-10-01 contra clon local eleven_qa_a (cuenta 12, movimiento 10401 marcado Anulado=1)"
    pasos:
      - "Entrar al detalle de una cuenta propia con movimientos."
      - "Anular el movimiento mas reciente de esa cuenta (Movimientos -> Anular)."
      - "Volver a Cuentas -> Details de esa cuenta y mirar la grilla en orden descendente por fecha."
    sintoma: "La fila anulada aparece en la grilla (no se oculta) con Saldo Acumulado 0,00. Al ser la primera fila en orden descendente, el acumulado que se lee arriba (0,00) no coincide con el Saldo del encabezado. Evidencia observada: header 59.417.138,47 vs primera fila (id 10401, anulado=true) saldoAcumulado=0."
    expectativa: "O la fila anulada no se lista, o se lista mostrando el acumulado vigente a esa fecha (el mismo de la fila anterior) y nunca 0; en cualquiera de los dos casos el acumulado de la primera fila en orden descendente sin filtros debe seguir igual al saldo del encabezado."
    causa_raiz: "GetDataTableAsync NO filtra Anulado (el unico query filter global es DeletedAt == null), mientras GetSaldosAcumuladosAsync si excluye Anulado. El diccionario de acumulados no tiene la clave de los anulados, y el mapeo usa saldosAcumulados?.GetValueOrDefault(m.Id), que para una clave ausente devuelve 0m en vez de null: ese 0 se renderiza como un saldo real. Cuenta.Saldo tambien excluye anulados, por eso el encabezado y la grilla divergen."
    capa: Infrastructure
    archivos_fix:
      - path: Eleven.Infrastructure/Services/MovimientoService.cs
        motivo: "Decidir y unificar el conjunto: o GetDataTableAsync excluye !Anulado como lo hacen Cuenta.Saldo y GetSaldosAcumuladosAsync, o el mapeo distingue 'sin acumulado' de 'acumulado 0' (TryGetValue y pasar null cuando la clave no esta) para que la vista muestre vacio y no 0,00."
    migracion_ef: null
    deteccion_qa:
      tipo: dynamic
      selector_o_endpoint: "POST /Movimientos/GetDataTable?cuentaId=<id> con sortDirection=desc; comparar data[0].saldoAcumulado contra el Saldo del encabezado de /Cuentas/Details/<id>, con al menos un movimiento anulado en la cuenta."
      condicion_falla: "Alguna fila con anulado=true devuelve saldoAcumulado=0, o data[0].saldoAcumulado distinto del saldo del encabezado."
    criterio_aceptacion:
      - "Con el ultimo movimiento de la cuenta anulado, el acumulado de la primera fila en orden descendente sin filtros sigue siendo exactamente igual al saldo del encabezado."
      - "Ninguna fila anulada muestra Saldo Acumulado 0,00 como si fuera un saldo real."
    pruebas_minimas:
      - "Anular el ultimo movimiento de una cuenta y comparar acumulado de la primera fila vs saldo del encabezado."
      - "Anular un movimiento del medio y verificar que los acumulados de las filas posteriores no se corren."
      - "Cuenta sin anulados: sin cambios respecto del comportamiento actual (regresion)."

  - id: ELV-006
    modulo: "Cuentas / Details y Movimientos / Index - grilla de movimientos (columna Nro. Comprobante)"
    titulo: "Recurrencia de MH-015/MH-018/CRM-003 en superficie nueva: la columna 'Nro. Comprobante' se renderiza ordenable (default de DataTables) pero GetDataTableAsync ignora sortColumn y siempre ordena por Fecha"
    severidad: minor
    reproducido_en: "eleven-la-plata, dev + lote F1-F4 sin commitear - reproducido 2026-10-01 contra clon local eleven_qa_a (cuenta 12)"
    pasos:
      - "Abrir Cuentas -> Details de una cuenta con movimientos (o Movimientos / Index)."
      - "Clickear el encabezado de la columna 'Nro. Comprobante'."
    sintoma: "La flecha de orden se mueve al encabezado 'Nro. Comprobante' pero las filas se reordenan por Fecha. Evidencia observada: POST /Movimientos/GetDataTable con sortColumn=numeroComprobante y sortDirection=asc devuelve 2828 (0007-05-07), 7105 (0053-06-03), 3360 (2023-01-17), 63/66/73 (2023-01-27) - todos con comprobante null: es el orden por Fecha ascendente, no por comprobante."
    expectativa: "O la columna declara orderable: false, o GetDataTableAsync honra request.SortColumn con un switch que incluya numeroComprobante."
    causa_raiz: "GetDataTableAsync solo lee request.SortDirection; no existe switch sobre request.SortColumn, asi que el orden es siempre (Fecha, Id). La vista envia sortColumn desde d.columns[d.order[0].column].data y deja la columna nueva ordenable por default. Afecta a todas las columnas ordenables de esas dos grillas (Tipo, Motivo, Notas, Importe, Cuenta), pero 'Nro. Comprobante' es la que se agrega en este lote."
    capa: Web
    archivos_fix:
      - path: Eleven.Web/Views/Cuentas/Details.cshtml
        motivo: "Agregar orderable: false a la columna numeroComprobante (y a las demas que el servicio no sabe ordenar), o mantenerla ordenable solo si se implementa el switch de SortColumn."
      - path: Eleven.Web/Views/Movimientos/Index.cshtml
        motivo: "Mismo cambio en la grilla global."
      - path: Eleven.Infrastructure/Services/MovimientoService.cs
        motivo: "Alternativa de fondo: switch sobre request.SortColumn con desempate por Id en TODAS las ramas (el ThenBy(Id) de F1 debe conservarse en cada rama, no solo en la de Fecha, o vuelve el riesgo de Skip/Take sin orden total)."
    migracion_ef: null
    deteccion_qa:
      tipo: dynamic
      selector_o_endpoint: "POST al endpoint de la grilla con sortColumn=<cada columna ordenable> y comparar el orden devuelto contra el orden esperado por esa columna."
      condicion_falla: "Una columna ordenable en el cliente devuelve un orden que no corresponde a esa columna."
    criterio_aceptacion:
      - "Clickear 'Nro. Comprobante' ordena por comprobante, o la columna no es clickeable."
    pruebas_minimas:
      - "sortColumn=numeroComprobante asc/desc contra una cuenta con comprobantes mezclados y nulos."
      - "Regresion: sortColumn=fecha sigue ordenando por (Fecha, Id) con el desempate de F1."

  - id: ELV-007
    modulo: "Cuentas / Details y Movimientos / Index - render de la columna Nro. Comprobante"
    titulo: "El render 'data || guion' trata el comprobante 0 como ausente: un movimiento con NumeroComprobante=0 se muestra como guion gris igual que uno sin comprobante"
    severidad: trivial
    reproducido_en: "eleven-la-plata, dev + lote F1-F4 sin commitear - verificado 2026-10-01: hay 2 filas reales con NumeroComprobante=0 (movimientos 1706 y 1707, cuenta 120)"
    pasos:
      - "Abrir la grilla de movimientos de una cuenta que tenga un movimiento con NumeroComprobante = 0."
    sintoma: "La celda muestra el guion gris de 'sin comprobante'. Ejecutado el render real del view con node: f(null) -> guion, f(0) -> guion, f(99001) -> 99001. El 0 es indistinguible del nulo."
    expectativa: "Solo null/undefined muestran el guion; el 0 se muestra como 0, o se decide explicitamente que 0 no es un comprobante valido y se normaliza en los datos."
    causa_raiz: "El render usa el operador || de JavaScript, falsy para 0 y para cadena vacia, en vez de comparar contra null/undefined."
    capa: Web
    archivos_fix:
      - path: Eleven.Web/Views/Cuentas/Details.cshtml
        motivo: "Cambiar 'data || guion' por una comparacion explicita: (data === null || data === undefined) ? guion : data."
      - path: Eleven.Web/Views/Movimientos/Index.cshtml
        motivo: "Mismo cambio."
    migracion_ef: null
    deteccion_qa:
      tipo: static
      selector_o_endpoint: "grep de 'data ||' en los render de columnas DataTables cuyo dato es numerico."
      condicion_falla: "Una columna numerica usa 'data ||' para decidir el placeholder de vacio."
    criterio_aceptacion:
      - "Un movimiento con NumeroComprobante=0 muestra 0; uno sin comprobante muestra el guion gris."
    pruebas_minimas:
      - "Fila con comprobante 0, fila con comprobante null, fila con comprobante mayor a 0."
  - id: ELV-008
    modulo: "Maquinas / Ajustar Contadores - piso de validacion del ajuste masivo (ELV-004)"
    titulo: "El piso en 0 del ajuste masivo incluye Durabilidad de los repuestos, que legitimamente es negativa (vida util excedida): el clamp Math.Min(0, -min) bloquea TODO ajuste negativo en el 46% de las maquinas con repuestos"
    severidad: medium
    reproducido_en: "eleven-la-plata, dev + lote F1-F5 + lote bis sin commitear - reproducido 2026-10-01 contra clon local eleven_qa_d (maquina 6). Dato cruzado contra produccion (db_a7251f_eleven2, solo lectura): 350 de 1314 repuestos vivos tienen Durabilidad < 0, repartidos en 90 maquinas."
    pasos:
      - "Elegir una maquina que tenga al menos un RepuestoMaquina vivo con Durabilidad < 0 (en produccion hay 90; en el clon, la maquina 6, con minimo -751.234)."
      - "Maquinas / Index -> boton de llave inglesa 'Ajustar Contadores'."
      - "Ingresar un ajuste negativo chico y legitimo, por ejemplo -100 (los contadores de esa maquina van de 537.895 a 5.915.812: ninguno quedaria en negativo)."
    sintoma: "El ajuste se rechaza entero con 'El ajuste no puede ser menor a 0: dejaria contadores en negativo.' Evidencia observada: POST /Maquinas/AjustarContadores id=6 cantidadAjustar=-100 -> 302, snapshot de base identico antes y despues (sum ContadorBN 192.275.215, sum Durabilidad -99.561, sum ContadorAsignacion 45.026.935), SweetAlert de error con ese texto. El mensaje es ademas enganoso: nada quedaria en negativo que no lo este ya."
    expectativa: "Un ajuste negativo que no empuja ningun valor por debajo de su piso legitimo debe aplicarse. Durabilidad es vida util RESTANTE y su propio dominio admite valores <= 0 (RepuestoMaquina.DurabilidadPorcentaje devuelve 0 explicitamente para Durabilidad <= 0), asi que no corresponde tratarla como magnitud acumulativa con piso en 0. El piso debe calcularse sobre los valores que de verdad no pueden ser negativos (ContadorBN, ContadorColor si la maquina es color, y ContadorAsignacion), y para Durabilidad el criterio lo tiene que fijar el analista, no el implementador."
    causa_raiz: "MaquinaService.AjustarContadoresAsync mete Durabilidad en la lista valoresAfectados y calcula ajusteMinimoAdmitido = Math.Min(0, -valoresAfectados.Min()). El clamp Math.Min(0, ...) se agrego para cubrir datos 'corruptos' asumiendo que ningun valor negativo es valido; con una Durabilidad negativa preexistente y legitima, -min da un numero positivo, el clamp lo lleva a 0 y entonces cualquier cantidadAAjustar < 0 cae en el rechazo. El premiso del comentario del codigo ('no existe un valor negativo valido') es falso para Durabilidad."
    capa: Infrastructure
    archivos_fix:
      - path: Eleven.Infrastructure/Services/MaquinaService.cs
        motivo: "Hipotesis, no instruccion: separar los valores con piso real en 0 (ContadorBN, ContadorColor condicional, ContadorAsignacion) de Durabilidad, y para Durabilidad usar un piso relativo (no empeorar el valor actual) o excluirla del calculo, segun lo que defina el analista. Si se la excluye, CA-3 del lote bis queda invalidado y hay que reescribirlo."
    migracion_ef: null
    deteccion_qa:
      tipo: dynamic
      selector_o_endpoint: "POST /Maquinas/AjustarContadores con cantidadAjustar=-1 sobre una maquina con min(Durabilidad) < 0 y min(ContadorBN) alto."
      condicion_falla: "El ajuste se rechaza aunque ningun contador ni ContadorAsignacion quedaria por debajo de 0."
    criterio_aceptacion:
      - "Sobre una maquina con al menos un repuesto de Durabilidad negativa y contadores altos, un ajuste de -100 se APLICA (snapshot de base cambia en -100 por fila) y la pantalla muestra el toast de exito."
      - "El mismo ajuste sigue rechazandose si empuja un ContadorBN, un ContadorColor (solo si Color=true) o un ContadorAsignacion por debajo de 0."
    pruebas_minimas:
      - "Maquina con min(Durabilidad)<0 y min(ContadorBN) alto: ajuste -100 debe aplicar."
      - "Maquina con todos los valores positivos: borde -min aplica, -min-1 rechaza (hoy PASA, no debe romperse)."
      - "Maquina B/N con ContadorColor=0: el ajuste negativo no debe bloquearse por ContadorColor (hoy PASA, no debe romperse)."

  - id: ELV-009
    modulo: "Movimientos / Index y Cuentas / Details - grilla de movimientos (conteo vs filas servidas)"
    titulo: "recordsTotal/recordsFiltered cuentan movimientos cuya Cuenta esta soft-deleted, pero el INNER JOIN del Include los descarta: la grilla global declara 9.748 filas y nunca sirve mas de 9.307"
    severidad: minor
    reproducido_en: "eleven-la-plata, dev + lote F1-F5 + lote bis sin commitear - reproducido 2026-10-01 contra clon local eleven_qa_d. PREEXISTENTE: se reproduce igual con sortColumn=fecha, o sea no lo introdujo el lote bis."
    pasos:
      - "Abrir Movimientos / Index sin filtro de cuenta."
      - "Paginar hasta el final con cualquier orden."
    sintoma: "DataTables anuncia 9.748 registros; un barrido completo de paginacion devuelve 9.307 filas unicas, 0 duplicadas y 441 faltantes. Las ultimas paginas vienen vacias o cortas. Evidencia observada: barrido de 20 paginas de 500 con sortColumn=fecha|importeConSigno, asc y desc -> total=9748, rows=9307 en los cuatro casos. SQL de contraste: 441 movimientos vivos cuya CuentaId apunta a una Cuenta con DeletedAt no nulo."
    expectativa: "El conteo y las filas servidas tienen que salir del mismo conjunto: o el filtro de cuenta borrada se aplica tambien al CountAsync, o la navegacion a Cuenta se proyecta con LEFT JOIN para que el movimiento se liste con 'Sin cuenta'."
    causa_raiz: "MovimientoService.GetDataTableAsync hace Include(m => m.Cuenta) sobre una navegacion requerida (CuentaId es int no nullable), asi que EF genera INNER JOIN contra Cuentas, y el filtro global de consulta de SoftDestroyable excluye las cuentas borradas. CountAsync se traduce sin el Include y por eso no pierde esas filas. MapToDto ya contempla el caso ('Sin cuenta'), lo que confirma que la intencion era listarlos."
    capa: Infrastructure
    archivos_fix:
      - path: Eleven.Infrastructure/Services/MovimientoService.cs
        motivo: "Hipotesis: forzar la navegacion opcional en la proyeccion o filtrar explicitamente por cuenta viva en el query base (antes de los dos CountAsync) para que conteo y filas coincidan. La decision de si esos 441 movimientos deben verse o no es funcional, no tecnica."
    migracion_ef: null
    deteccion_qa:
      tipo: dynamic
      selector_o_endpoint: "Barrido completo de paginacion del endpoint de la grilla comparando recordsFiltered contra la cantidad de ids unicos recibidos."
      condicion_falla: "recordsFiltered != cantidad de ids unicos servidos por el barrido completo."
    criterio_aceptacion:
      - "Un barrido completo de Movimientos / Index sin filtros devuelve exactamente recordsFiltered ids unicos, con cualquier orden."
    pruebas_minimas:
      - "Barrido con sortColumn=fecha y con sortColumn=importeConSigno, asc y desc."
      - "Con cuentaId de una cuenta viva (hoy ya coincide: 2.039 = 2.039) para no romper ese caso."

  - id: MH-045
    modulo: "Gastos generados por el sistema / anulacion manual sin guard de origen (GastoService.AnularAsync + ImpuestoChequeService)"
    titulo: "Un gasto que el sistema postea automaticamente desde un documento se puede anular a mano desde el CRUD generico, dejando el documento en el estado que lo genero y sin forma de regenerarlo"
    severidad: medium
    reproducido_en: "marihogar, 2026-10-02, QA de CR-86 lote 3 (impuesto al cheque Ley 25.413). Confirmado en codigo; 0 casos en produccion porque la migracion AddImpuestoChequeCR86 aun no esta aplicada."
    pasos:
      - "Identificar un Gasto que el sistema postea solo, trazado a un documento por FK (aca: Gasto.ChequeId, posteado por ImpuestoChequeService.PostearAsync al acreditar el cheque)."
      - "Abrir el CRUD generico de Gastos y anular ese gasto (GastoService.AnularAsync solo valida 'gasto no encontrado' y 'ya anulado')."
      - "Verificar el estado del documento origen: el cheque sigue Acreditado."
      - "Intentar regenerar el gasto: AcreditarAsync exige Estado=Pendiente, asi que el unico camino es revertir la acreditacion completa (CC Proveedor + egreso de caja) y volver a acreditarla."
    sintoma: "El cheque queda Acreditado sin su impuesto: el gasto desaparece del total del periodo (ObtenerImpuestoPeriodoAsync y la columna 'Cobrado en el periodo' filtran !Anulado) y de la caja (contramovimiento de reversion). El gasto operativo queda SUBESTIMADO y el unico rastro es una fila anulada en Gastos. Si despues se revierte el cheque, ImpuestoChequeService.AnularAsync no encuentra gasto vigente, devuelve 0 y la reversion no menciona el impuesto: el operador no se entera de que falta."
    expectativa: "Cuando un CRUD generico pasa a contener filas que el sistema postea solo desde un documento, la accion destructiva del CRUD tiene que mirar la FK de origen: o se bloquea con un mensaje que nombre el camino correcto (que el gasto lo genero el cheque N y se anula revirtiendo la acreditacion), o se propaga al documento. La FK existe justamente para poder preguntar."
    causa_raiz: "La FK Gasto.ChequeId se agrego para trazabilidad y para el guard de idempotencia de PostearAsync, pero no se la consulto en el camino de anulacion del CRUD preexistente. El CR verifico la transicion que crea la fila y la que la deshace POR EL DOCUMENTO, no la que la deshace POR LA FILA."
    capa: Infrastructure
    deteccion_qa:
      tipo: codigo
      consulta: "Por cada FK nueva de un documento a una fila de un CRUD generico, buscar AnularAsync/EliminarAsync/ActualizarAsync de ese CRUD y verificar que la FK aparezca en el guard. 0 referencias = el agujero existe."
    archivos_fix:
      - "Services/GastoService.cs - AnularAsync: si gasto.ChequeId != null, devolver error nombrando el cheque y el camino de reversion."
      - "Views/Gastos/Index.cshtml - ocultar o deshabilitar el boton Anular en las filas con ChequeId, y rotular el origen (REG-004: la UI no es la unica defensa, pero tampoco ofrece una accion que el servicio va a rechazar)."
    migracion_ef: no
    regla_catalogo: "MH-045 en 32-estandares-qa-implementador.instructions.md"
    criterio_aceptacion:
      - "Anular desde Gastos/Index el gasto de impuesto de un cheque acreditado devuelve error y el gasto sigue con Anulado=0."
      - "Revertir la acreditacion del cheque si lo anula, y el mensaje de la reversion nombra el monto del impuesto anulado."
    leccion_adicional: "Un gasto automatico viviendo en la misma tabla que los gastos manuales hereda TODAS las acciones del CRUD manual, no solo las que el CR penso. El inventario no es que hace mi servicio nuevo sino que puede hacerle el sistema viejo a las filas que mi servicio nuevo escribe."

  - id: MH-046
    modulo: "Gastos / correccion de la fecha de un pago posteado (PagoOrdenCompraService.ActualizarFechaPagoAsync + ImpuestoChequeService.ActualizarFechaImpuestoAsync)"
    titulo: "Una fecha de corte implementada como VigenteDesde de un parametro se respeta al postear y se puede violar despues, porque el camino de correccion de fecha no revalida la vigencia"
    severidad: medium
    reproducido_en: "marihogar, 2026-10-02, QA de CR-86 lote 3. Confirmado en codigo; 0 casos en produccion (migracion no aplicada)."
    pasos:
      - "Tener un parametro con vigencia cuya VigenteDesde ES la fecha de corte del automatismo (aca: AlicuotasImpuestoCheque, sembrada con VigenteDesde = dia del deploy; AC-86.4)."
      - "Acreditar un cheque con una fecha POSTERIOR a esa VigenteDesde: se postea el gasto del impuesto correctamente."
      - "Ir a la pantalla de correccion de fecha del pago de la OC y poner una fecha ANTERIOR a VigenteDesde (p. ej. agosto 2026). ActualizarFechaPagoAsync solo valida que no sea futura."
      - "Verificar: el Gasto de ImpuestosBancarios y su movimiento de caja quedan fechados antes de la vigencia de la unica alicuota que existe."
    sintoma: "Queda un gasto de impuesto automatico fechado en un periodo que la fecha de corte declaraba vacio. En marihogar eso cae exactamente encima de los 58 gastos manuales de la subcategoria 'Gastos Bancarios PCIA y payway' ($5.691.530,00, categoria Otro, hasta el 06/08/2026) que el CR vino a NO duplicar: el doble conteo R-CR86.1 entra por la puerta de atras. La invariante ningun impuesto fechado antes de VigenteDesde se cumple al postear y no se sostiene en el tiempo. Ademas ActualizarFechaPagoAsync no valida contra cheque.FechaEmision, que AcreditarAsync si valida: el mismo dato admite por un camino lo que el otro rechaza."
    expectativa: "Si una fecha de corte se implementa como la vigencia de un parametro, TODO camino que pueda mover la fecha de un asiento ya posteado tiene que revalidar esa vigencia: o se rechaza la correccion cuando deja el asiento fuera de vigencia, o se recalcula/anula el asiento. Y los dos caminos que escriben la misma fecha (alta y correccion) tienen que compartir las mismas validaciones, no solo una de las dos."
    causa_raiz: "La defensa se diseno en el punto de posteo (sin alicuota vigente no postea) y se razono como estructural (sin un solo if de fecha de corte). Pero la fecha del asiento es un dato editable por otra pantalla, asi que la defensa es del INSTANTE del posteo, no de la fila. ActualizarFechaImpuestoAsync mueve gasto.Fecha y el movimiento de ledger sin volver a consultar la alicuota."
    capa: Infrastructure
    deteccion_qa:
      tipo: sql
      consulta: "SELECT COUNT(*) FROM Gastos g WHERE g.Categoria=8 AND g.ChequeId IS NOT NULL AND g.Anulado=0 AND g.Fecha < (SELECT MIN(VigenteDesde) FROM AlicuotasImpuestoCheque) - tiene que dar 0 siempre."
    archivos_fix:
      - "Services/ImpuestoChequeService.cs - ActualizarFechaImpuestoAsync: consultar ObtenerAlicuotaVigenteAsync(fechaNueva) y devolver un resultado que el caller pueda rechazar si no hay alicuota vigente a esa fecha."
      - "Services/PagoOrdenCompraService.cs - ActualizarFechaPagoAsync: propagar ese rechazo como ServiceResult de error, y agregar el guard de fechaNueva >= cheque.FechaEmision que ya tiene AcreditarAsync."
    migracion_ef: no
    regla_catalogo: "MH-046 en 32-estandares-qa-implementador.instructions.md"
    criterio_aceptacion:
      - "Corregir la fecha de pago de un cheque acreditado a una fecha anterior a la VigenteDesde de la alicuota devuelve error y no mueve ni el Gasto ni el movimiento de caja."
      - "La consulta SQL de deteccion_qa devuelve 0 despues de ejercitar el camino."
    leccion_adicional: "Sin un solo if es una virtud de diseno y no una garantia: la defensa estructural protege el camino que la invoca, no la fila que escribio. Cuando el corte vive en un dato (VigenteDesde) y la fecha del asiento tambien vive en un dato editable, la invariante hay que afirmarla sobre los dos y verificarla con un SELECT, no con el argumento."

  - id: MH-047
    modulo: "Enums de catalogo / valor reservado al sistema ofrecido en el alta manual (CategoriaGasto.ImpuestosBancarios en Gastos y GastosRecurrentes)"
    titulo: "Un valor de enum creado para aislar lo que postea el sistema aparece solo en todos los combos que iteran el enum completo, y la garantia de aislamiento desaparece en el alta manual"
    severidad: low
    reproducido_en: "marihogar, 2026-10-02, QA de CR-86 lote 3. Confirmado en codigo (4 vistas con Enum.GetValues<CategoriaGasto>())."
    pasos:
      - "Agregar un valor de enum cuyo proposito declarado sea solo lo que postea el sistema, filtrable y auditable de un filtro."
      - "Buscar las vistas que pueblan el combo con Enum.GetValues del enum (aca Gastos/Create, Gastos/Index, GastosRecurrentes/Create, GastosRecurrentes/Edit)."
      - "Confirmar que el valor nuevo aparece en el combo de ALTA y que ni la vista ni el servicio lo rechazan."
    sintoma: "El usuario puede cargar a mano un gasto de ImpuestosBancarios (sin ChequeId) o, peor, una PLANTILLA de gasto recurrente de esa categoria, que va a generar impuesto fantasma todos los meses. El filtro por categoria deja de identificar lo que postea el sistema, que es la unica justificacion de que la categoria exista aparte de ComisionesBancarias. Es el inverso de OLV-019: ahi la baja del valor estaba solo en el combo y el POST la burlaba; aca el combo no la implementa en absoluto."
    expectativa: "Un valor de enum reservado al sistema se excluye del combo de ALTA (no del de filtro, donde es exactamente lo que se quiere poder filtrar) y se rechaza en el servicio, que es la defensa real (REG-004). Si hay varias vistas que iteran el enum, la exclusion va en un helper unico, no copiada en cada vista."
    causa_raiz: "El valor se agrego al enum con un doc-comment que explica por que es una categoria propia y para que sirve, pero las 4 vistas que arman el combo lo hacen por Enum.GetValues y nadie las toco: el valor nuevo se filtra solo a las pantallas de alta por el mismo mecanismo que lo hace aparecer, deseablemente, en el filtro."
    capa: Web
    deteccion_qa:
      tipo: codigo
      consulta: "grep -rn 'Enum.GetValues<TEnum>()' en Views/ despues de agregar un valor a TEnum: cada hit es un combo que ahora ofrece el valor nuevo. Separar los de filtro (correcto) de los de alta (a revisar)."
    archivos_fix:
      - "Domain/Enums/CategoriaGasto.cs o un helper de Domain - exponer el set de categorias cargables a mano."
      - "Views/Gastos/Create.cshtml, Views/GastosRecurrentes/Create.cshtml, Views/GastosRecurrentes/Edit.cshtml - usar ese set en vez de Enum.GetValues."
      - "Services/GastoService.cs y GastoRecurrenteService.cs - rechazar Categoria=ImpuestosBancarios en el alta/edicion manual."
    migracion_ef: no
    regla_catalogo: "MH-047 en 32-estandares-qa-implementador.instructions.md"
    criterio_aceptacion:
      - "El combo de Gastos/Create y de GastosRecurrentes/Create no ofrece ImpuestosBancarios; el filtro de Gastos/Index si lo ofrece."
      - "Un POST a mano con Categoria=8 al alta de Gasto devuelve error de validacion."
    leccion_adicional: "Agregar un valor a un enum de catalogo es, sin escribir una linea de UI, agregar una opcion a todos los combos del sistema que iteran ese enum. Cuando el valor nuevo es del sistema en vez de del negocio, la pregunta de QA es cuantos combos lo ofrecen ahora y cuantos deberian: la respuesta es un grep, no una interpretacion."

  - id: MH-042
    modulo: "Rotulo del universo de un agregado (Configuracion > Costos de cobranza - rotulo del residuo 'N pagos sin tasa atribuida')"
    titulo: "El criterio de aceptacion y la implementacion del rotulo del residuo miden universos distintos: el numero del criterio se conto SIN el filtro de documentos cancelados que el agregado si aplica"
    severidad: low
    reproducido_en: "marihogar, 2026-10-02, QA de CR-86 frente A (commit 0e80ff5), contra produccion db_a7251f_marihog."
    pasos:
      - "Tomar el numero que el criterio de aceptacion promete para el rotulo del residuo (aca: 730 pagos sin tasa en todo el historial)."
      - "Replicar en SQL la consulta del servicio que alimenta el rotulo, CON todos sus filtros."
      - "Replicarla de nuevo SIN el filtro de documentos cancelados."
      - "Comparar contra el criterio descomponiendo resta por resta, y SIN olvidar los HasQueryFilter globales (ver MH-049, que es la causa del primer diagnostico equivocado de este mismo item). Aca: 730 crudo, 724 con el filtro de baja logica, 723 con la exclusion de cancelados -- y de los 4 pagos sin tasa en documentos cancelados, 3 ya estaban soft-deleted, asi que la exclusion de negocio solo descuenta 1."
    sintoma: "El rotulo declara 723 donde el criterio pedia 730. Descomposicion ratificada: 730 crudo - 6 pagos soft-deleted (filtro global de EF) - 1 pago vivo de documento cancelado = 723. El criterio estaba mal (incluia los 6 dados de baja) y la implementacion cuenta bien: defecto de criterio, no de codigo. CA-86.5 reenunciado en 723 el 2026-10-02."
    expectativa: "Cuando un criterio de aceptacion fija un numero medido, tiene que fijar tambien el universo (con o sin documentos cancelados / dados de baja / anulados). Si el agregado del que el rotulo habla excluye los cancelados, el rotulo tiene que excluirlos igual y el criterio tiene que decir el numero de ESE universo: dos numeros contiguos no pueden medir universos distintos."
    causa_raiz: "El numero del criterio se midio en la etapa de Analisis con un SELECT directo sobre la tabla de detalle, antes de que Arquitectura decidiera derivar el agregado del ledger con exclusion de cancelados. La implementacion aplico el filtro por coherencia con el agregado (correcto) y el criterio quedo congelado con el numero viejo."
    capa: Transversal
    deteccion_qa:
      tipo: manual
      consulta: "Para cada numero prometido por un criterio, correr la consulta del servicio CON y SIN el filtro de cancelados/anulados/soft-deleted. Si uno de los dos coincide con el criterio y el otro con la pantalla, el defecto es de criterio y vuelve al analista, no al implementador."
    archivos_fix: []
    migracion_ef: no
    leccion_adicional: "Es la cara de proceso del corolario de MH-033: el numero dice de que universo habla, y eso aplica tambien al numero que escribe el analista en el criterio. Un criterio con un monto o un conteo pero sin el universo produce un FAIL que nadie puede cerrar sin volver a Analisis."

  - id: MH-043
    modulo: "Reportes de revision / saneamiento construidos sobre un whitelist de categorias (Gastos > 'Gastos que el sistema ya calcula solo')"
    titulo: "Un reporte de saneamiento que lista un SUBCONJUNTO del universo sin declararlo se lee como exhaustivo, y deja afuera justo el caso que ya estaba confirmado como defecto en vivo"
    severidad: medium
    reproducido_en: "marihogar, 2026-10-02, QA de CR-86 frente A (commit 0e80ff5), contra produccion db_a7251f_marihog."
    pasos:
      - "Abrir el reporte de saneamiento y anotar el total que declara (aca: 80 gastos / $9.113.426,00)."
      - "Leer en el servicio la lista literal de categorias/subcategorias del whitelist."
      - "En SQL, buscar las categorias VECINAS por nombre (las que el propio codigo menciona en un comentario como 'misma pinta, fuera de alcance') y sumarlas."
      - "Cruzar los defectos ABIERTOS de las corridas anteriores sobre el mismo concepto contra el whitelist: si el registro del defecto no cae en ninguna categoria del whitelist, el reporte no lo va a mostrar nunca."
    sintoma: "El reporte declara 80 gastos / $9.113.426,00 como 'los gastos que el sistema ya calcula solo', sin ninguna linea que diga que es un subconjunto. Afuera quedan $4.801.222,00 vigentes en 3 subcategorias vecinas y, sobre todo, el gasto 520 'COMISION PERCEPCION MP' de $50.000,00, que una corrida anterior de QA ya habia confirmado como doble conteo EN VIVO (MH-039)."
    expectativa: "Un reporte de revision declara su propio alcance en pantalla: cuantos registros y cuanta plata quedan AFUERA del criterio, con el motivo. Si el proposito del reporte es que el cliente cierre una revision, un total que se lee como el universo entero hace que la cierre con la plata que falta sin mirar. Y cualquier defecto abierto sobre el mismo concepto tiene que caer dentro del reporte, o el reporte no sirve para lo que se construyo."
    causa_raiz: "El whitelist se cerro sobre las categorias de nombre exacto que el analisis habia medido, y las variantes de tipeo del mismo concepto cargadas a mano por el cliente ('comision mp', 'COMISION PERCEPCION MP', 'gastos payway pcia') quedaron afuera. El implementador las declaro en un comentario del codigo, que el cliente no lee, en vez de en la pantalla."
    capa: Web
    deteccion_qa:
      tipo: manual
      consulta: "SELECT Subcategoria, COUNT(*), SUM(Monto) FROM <tabla> GROUP BY 1 ORDER BY 2 DESC sobre la categoria padre, y comparar la lista completa contra el whitelist del servicio. Toda fila fuera del whitelist cuyo nombre describa el mismo concepto es parte del universo no declarado."
    archivos_fix:
      - path: MariHogar.Web/Views/Gastos/Solapados.cshtml
        motivo: "Declarar en pantalla cuantos gastos y cuanta plata quedan afuera del criterio, con el motivo, igual que ya se declara el caso del gasto excluido a proposito."
      - path: MariHogar.Infrastructure/Services/GastoService.cs
        motivo: "Alternativa (o complemento): incorporar al whitelist las variantes de tipeo del mismo concepto y ratificar el total nuevo con el cliente."
    migracion_ef: no
    leccion_adicional: "Cerrado el 2026-10-02 en el commit e973c7b: el reporte quedo en dos bloques (confirmado 80 / $9.113.426,00 + candidatos 60 / $6.363.222,00, $4.851.222,00 vigentes), disjuntos y con el gasto 520 adentro. Hallazgo posterior del Orquestador que explica POR QUE el universo confirmado quedaba corto: el aviso de doble conteo de PrevisualizarRecalculoAsync filtra por Categoria == ComisionesBancarias y en produccion hay 120 gastos / $11.479.487,00 en Otro contra 1 / $50.000,00 en ComisionesBancarias -- el aviso ve 1 de 121, el 0,4% del monto. Levantado como CR-87, fuera del alcance de CR-86. Regla de cierre para QA: un reporte nuevo de saneamiento se prueba cruzandolo contra los defectos ABIERTOS del mismo concepto. Si un defecto confirmado en vivo no aparece en el reporte que se construyo para encontrarlo, eso es el hallazgo, aunque el total del reporte coincida al peso con el criterio."

  - id: MH-049
    modulo: "Metodo de QA / replicar en SQL crudo una consulta de EF Core"
    titulo: "Replicar en SQL crudo el WHERE de un servicio EF sin sus HasQueryFilter globales no da el numero que el usuario ve, y el error se puede cometer desde los dos lados (QA mide de mas, el analista mide de mas distinto)"
    severidad: medium
    reproducido_en: "marihogar, 2026-10-02, QA de CR-86 frente A: dos agentes distintos (QA y Orquestador) midieron el mismo rotulo el mismo dia y les dio 726 y 730; el numero real de la pantalla era 723."
    pasos:
      - "Tomar la expresion LINQ del servicio que alimenta el numero y traducir su Where a SQL."
      - "ANTES de correrla, buscar HasQueryFilter en el DbContext (suele estar en un bucle generico sobre una clase base: 'modelBuilder.Entity<T>().HasQueryFilter(e => e.DeletedAt == null)')."
      - "Para cada entidad que la consulta toca -- la raiz Y las de cada subconsulta -- chequear si hereda la clase base soft-deletable. EF agrega el filtro a TODAS, incluidas las que aparecen dentro de un _db.Otra.Any(...)."
      - "Recien ahi correr el SQL, con el filtro de baja logica escrito a mano en cada tabla que corresponda."
      - "Si el numero sigue sin coincidir, descomponer: crudo -> menos soft-deleted -> menos los filtros de negocio, y mirar en que resta aparece la diferencia."
    sintoma: "El numero del criterio (730) no coincidia con el de QA (726) ni con el de la pantalla (723). Las tres cuentas eran la misma consulta con distintos subconjuntos de filtros: 730 crudo, 724 con el filtro global de la entidad raiz, 723 con el filtro de negocio encima. Ademas los universos parecian irreconciliables -- QA veia 4 pagos de documentos cancelados y el analista 1 -- porque 3 de esos 4 estaban soft-deleted y por lo tanto ya descontados en otra resta."
    expectativa: "Una verificacion por SQL de un numero de pantalla reproduce el numero de la pantalla, no uno parecido. Cuando no coincide, el informe descompone la cuenta resta por resta en vez de atribuir la diferencia al primer filtro de negocio que aparece en el codigo."
    causa_raiz: "Los HasQueryFilter no estan escritos en la consulta del servicio: se declaran una sola vez en el DbContext, normalmente en un bucle generico sobre una clase base, asi que leer el metodo del servicio de punta a punta NO los muestra. Quien replica en SQL ve el Where completo y cree que lo tiene todo."
    capa: Transversal
    deteccion_qa:
      tipo: manual
      consulta: "grep -n 'HasQueryFilter' <Infrastructure>/Data/AppDbContext.cs  +  grep -n 'class <Entidad>' para ver de quien hereda. Despues: COUNT crudo, COUNT + DeletedAt IS NULL, COUNT + filtros de negocio -- y la pantalla tiene que coincidir con el ultimo."
    archivos_fix: []
    migracion_ef: no
    leccion_adicional: "Corolario para el que escribe criterios de aceptacion con un numero medido: el numero tiene que venir con el universo (vivos o todos, cancelados dentro o fuera) y con la consulta que lo produjo. Un criterio que dice solo 'tiene que decir 730' genera un FAIL que no se puede cerrar sin volver a Analisis, y aca efectivamente volvio."

  - id: MH-050
    modulo: "Listados filtrados por un IN de strings contra la base (GastoService.LeerPorSubcategoriaAsync)"
    titulo: "Recurrencia latente de MH-001 en superficie nueva: es el unico lugar de la solucion que manda una coleccion local de strings al IN de SQL, justo en una pantalla que todavia no se abrio nunca"
    severidad: medium
    reproducido_en: "marihogar, 2026-10-02, QA de CR-86 (commit e973c7b). NO reproducido en runtime: la pantalla no se levanto (regla del proyecto). Detectado por revision de codigo contra MH-001."
    pasos:
      - "Buscar en toda la solucion los Where(coleccionLocal.Contains(columnaString)) que se ejecutan contra la base."
      - "Comparar con como resuelve el MISMO problema el resto del codigo: si en los demas lugares se trae la tabla a memoria y se filtra en-proceso con un comentario que cita el defecto, la unica consulta que manda el IN a SQL es la sospechosa."
      - "Abrir la pantalla nueva (es lo que falta aca)."
    sintoma: "Pendiente de observacion. MH-001 produjo 'InvalidOperationException: Expression does not have a type mapping assigned' con el mismo patron sobre HashSet<string>. Si se repite, la pantalla devuelve 500 completa, no un listado parcial."
    expectativa: "Una pantalla nueva que usa un patron que el proyecto evita a proposito en todos los demas lugares se abre al menos una vez antes del merge. Y si el patron esta prohibido por un item del catalogo, la superficie nueva usa el mismo workaround que las demas (traer a memoria y filtrar en-proceso) o demuestra con una corrida que el provider ya lo soporta."
    causa_raiz: "El array de subcategorias era un static readonly usado directamente; al extraer el metodo compartido para los dos bloques paso a ser un PARAMETRO string[], que es exactamente la forma que MH-001 documenta como no traducible. Nadie lo relaciono porque el catalogo tiene el caso escrito sobre HashSet<string> de ids de usuario, no sobre un whitelist de categorias."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/GastoService.cs
        motivo: "LeerPorSubcategoriaAsync: o se confirma con una corrida real que el IN de strings se traduce en este provider, o se adopta el patron que ya usan CCLocalService:98 y StockService:58 (traer la coleccion y filtrar en-proceso, o armar el filtro con OR encadenados sobre constantes)."
    migracion_ef: no
    deteccion_qa:
      tipo: manual
      selector_o_endpoint: "GET /Gastos/Solapados -- tiene que devolver 200 y pintar los dos bloques"
    leccion_adicional: "ARREGLADO y re-verificado el 2026-10-02 (diff sin commitear): se materializa y se filtra en memoria contra un HashSet con StringComparer.OrdinalIgnoreCase, mismo patron que los otros cuatro lugares. Verificado ademas que el cambio de collation no mueve el conjunto: GROUP BY CAST(col AS BINARY) da 8 valores distintos byte a byte, identicos a los 8 literales del whitelist, 0 variantes de caja y 0 valores con espacios de borde en toda la tabla, asi que Ordinal, OrdinalIgnoreCase y la collation _ci seleccionan las mismas 140 filas. **Un GROUP BY normal sobre una collation _ci fusiona las variantes de caja y habria escondido el problema: para comparar semantica de SQL contra semantica de .NET hay que agrupar por el valor BINARIO.** Nota: el GroupBy del agrupador quedo con el comparador por defecto (sensible a mayusculas) mientras el filtro usa OrdinalIgnoreCase -- con 0 casos hoy, pero una variante de caja entraria por el filtro y produciria dos grupos para una sola subcategoria. Para QA: un item del catalogo escrito sobre un tipo concreto (HashSet<string> de ids) hay que leerlo por su CLASE (coleccion local de strings al IN), o la recurrencia en otra forma del mismo patron no se ve. Y verificar un reporte por SQL demuestra que los DATOS cumplen el criterio, no que la pantalla exista: son dos assertions distintas y la segunda necesita un 200."

  - id: MH-051
    modulo: "Correccion de fecha de un pago / anulacion silenciosa de un asiento automatico (PagoOrdenCompraService.ActualizarFechaPagoAsync + ImpuestoChequeService.ActualizarFechaImpuestoAsync)"
    titulo: "Un fix que convierte 'mover' en 'anular' devuelve el monto anulado para que el caller lo informe, y el caller descarta el retorno: la plata desaparece de la pantalla sin un solo mensaje"
    severidad: medium
    reproducido_en: "marihogar, 2026-10-02, QA de CR-86 lote 3 corrida 2 (e973c7b). Confirmado en codigo; 0 casos en produccion (migracion no aplicada). Es el remanente de MH-046."
    pasos:
      - "Tener un asiento automatico con una condicion de vigencia (aca: el Gasto del impuesto Ley 25.413, que solo existe si hay alicuota vigente a su fecha)."
      - "Corregir la fecha del documento padre a una fecha donde la condicion NO se cumple (anterior a la VigenteDesde de la alicuota)."
      - "El servicio hijo hace lo correcto: anula el gasto (PAT-020) en vez de mudarlo, y DEVUELVE el monto anulado 'para que el caller lo informe' (su propio doc-comment)."
      - "Mirar el caller: `await _impuestoChequeService.ActualizarFechaImpuestoAsync(...)` sin asignar el retorno. El ServiceResult de exito sigue diciendo 'Fecha de pago actualizada correctamente'."
    sintoma: "La correccion de fecha anula un gasto y le devuelve plata a la caja sin decirselo a nadie. El operador creia estar corrigiendo un dia y ademas borro un impuesto. El unico rastro es una fila anulada en Gastos y un contramovimiento en el ledger, que nadie va a mirar porque la pantalla dijo que todo salio bien. Es la leccion de MH-039 (un retroactivo que saca plata necesita rastro, no solo hacer lo correcto) aplicada a un camino de una sola fila. Ademas, en la misma llamada, ActualizarFechaPagoAsync valida que la fecha nueva no sea futura pero NO que sea >= Cheque.FechaEmision, guard que AcreditarAsync si tiene: el mismo dato admite por un camino lo que el otro rechaza."
    expectativa: "Si un metodo devuelve un monto 'para que el caller lo informe', la revision del fix incluye al caller: o el mensaje de exito nombra el monto anulado y por que, o el metodo no devuelve nada y la decision se toma arriba. Un valor de retorno ignorado es un fix a medias que se lee como completo. Y las dos puertas que escriben la misma fecha comparten las mismas validaciones."
    causa_raiz: "El fix se diseno y se verifico en el servicio donde estaba el defecto. El contrato nuevo (devolver el monto anulado) se agrego sin tocar el unico caller, que seguia llamando en modo void porque antes el metodo era void."
    capa: Infrastructure
    deteccion_qa:
      tipo: codigo
      consulta: "Cuando un fix cambia la firma de un metodo de void a un valor de retorno, grep de los callers: un `await X(...)` sin asignacion donde el doc-comment dice 'devuelve N para que el caller lo informe' es el defecto."
    archivos_fix:
      - "Services/PagoOrdenCompraService.cs - capturar el retorno de ActualizarFechaImpuestoAsync y agregar al mensaje de exito el monto del impuesto anulado y el motivo; agregar el guard nuevaFecha >= cheque.FechaEmision."
    migracion_ef: no
    regla_catalogo: "MH-051 en 32-estandares-qa-implementador.instructions.md"
    criterio_aceptacion:
      - "Corregir la fecha de pago de un cheque acreditado a una fecha sin alicuota vigente devuelve un mensaje que nombra el monto del impuesto anulado."
      - "Corregir la fecha a una anterior a la emision del cheque devuelve error."
    leccion_adicional: "Un fix de QA se re-verifica en los dos extremos: donde estaba el defecto y donde se consume el resultado. Cambiar void por un valor de retorno es cambiar un contrato, y un contrato nuevo con 1 caller sin tocar es un contrato que nadie cumple."

  - id: MH-052
    modulo: "Enums de catalogo / validacion server-side aplicada a un solo CRUD de los dos (GastoRecurrenteService vs GastoService)"
    titulo: "La exclusion de un valor de enum reservado al sistema se centralizo bien para las VISTAS y se valido server-side en un solo servicio: el CRUD hermano sigue aceptando el valor por POST"
    severidad: low
    reproducido_en: "marihogar, 2026-10-02, QA de CR-86 lote 3 corrida 2 (e973c7b). Confirmado en codigo. Cierre parcial de MH-047."
    pasos:
      - "Centralizar la exclusion de un valor de enum en un helper (aca CategoriasGastoSeleccionables) y usarlo en las vistas de alta de los DOS CRUDs que comparten el enum."
      - "Buscar la validacion server-side (REG-004): grep del helper en Services."
      - "Aca aparece solo en GastoService.CrearAsync. GastoRecurrenteService asigna `Categoria = input.Categoria` en el alta y en la edicion, sin ningun guard."
      - "Un POST armado a mano crea una plantilla de gasto recurrente de la categoria reservada."
    sintoma: "Exactamente OLV-019: la baja del valor se implementa en el combo y el POST la sigue burlando — pero en un solo lado, lo que es peor de detectar que en ninguno, porque el helper existe y da la impresion de que el tema esta cerrado. En marihogar no genera gastos fantasma porque ningun job materializa las plantillas (solo prellenan el form de alta), asi que el efecto real es una plantilla que al usarse muere contra el guard del alta de Gasto, con un error que el usuario no puede entender. Si alguna vez se agrega el job, la plantilla pasa a postear."
    expectativa: "Cuando dos CRUDs comparten el enum, la validacion server-side va en los dos, o en un unico punto que los dos atraviesen. El helper centraliza el SET de valores, no la validacion: centralizar el set y aplicarlo en un solo servicio deja la mitad del agujero abierto y el codigo parece cerrado."
    causa_raiz: "El defecto original se reporto nombrando las vistas (4) y el servicio (1, el de Gastos). El fix cubrio exactamente lo reportado. La plantilla recurrente estaba en el sintoma del parte pero no en la lista de archivos_fix del servicio."
    capa: Infrastructure
    deteccion_qa:
      tipo: codigo
      consulta: "grep -rln '<HelperDeExclusion>' en Services/ y comparar con la lista de servicios que escriben el campo del enum (grep -rn 'Categoria = input.Categoria'). La diferencia entre las dos listas es el agujero."
    archivos_fix:
      - "Services/GastoRecurrenteService.cs - rechazar en CrearAsync y en ActualizarAsync las categorias que no pasen CategoriasGastoSeleccionables.EsSeleccionable."
    migracion_ef: no
    regla_catalogo: "MH-052 en 32-estandares-qa-implementador.instructions.md"
    criterio_aceptacion:
      - "Un POST a mano con Categoria=8 al alta y a la edicion de plantilla de gasto recurrente devuelve error de validacion."
    leccion_adicional: "Un parte de defecto que enumera archivos_fix se cumple al pie de la letra, asi que la enumeracion es parte del defecto: si el parte lista 4 vistas y 1 servicio, el fix va a cubrir 4 vistas y 1 servicio. La contramedida es cerrar la lista por la fuente (que servicios ESCRIBEN el campo) en vez de por recorrido, el mismo corolario de MH-041."

  - id: MH-054
    modulo: "PAT-012 (previsualizar -> confirmar) / pantallas de regularizacion masiva (Cheques/RegularizarImpuesto, RegularizacionCaja, ConfiguracionCostosCobranza/Recalcular)"
    titulo: "Un previsualizar -> confirmar donde el Aplicar no recibe ningun parametro de lo previsualizado son dos lecturas independientes: el usuario confirma un numero y se aplica otro, y nada lo detecta"
    severidad: low
    reproducido_en: "marihogar, 2026-10-02, QA de CR-86 lote 3 corrida 3 (7c4a424). PREEXISTENTE en el proyecto, no una regresion del CR: el mismo patron esta en RegularizacionCajaController.Aplicar() (CR-84) y en el Recalcular de costos de cobranza. Confirmado en codigo."
    pasos:
      - "Buscar una pantalla que implemente previsualizar -> confirmar sobre una operacion masiva."
      - "Mirar la firma de la accion de Aplicar. Si no recibe NADA de lo que la previsualizacion mostro (ni el total, ni la cantidad, ni la lista de ids, ni un hash del universo), los dos pasos son dos lecturas independientes del estado vivo."
      - "El doc-comment suele afirmar justamente lo contrario: 'una sola fuente para la previsualizacion y para la aplicacion, el paso 2 no puede mirar un universo distinto del que el paso 1 le mostro al usuario'. Es el mismo METODO, no el mismo SNAPSHOT."
      - "Entre los dos requests cambiar el estado que decide el universo (acreditar otro documento, editar el parametro con vigencia, postear a mano una de las filas) y aplicar: se aplica un universo distinto del confirmado, con exito y sin aviso."
    sintoma: "El usuario ve 19 cheques / $39.719,67, confirma, y se postea otro conjunto. En el mejor caso el mensaje final dice un numero distinto del de la pantalla y alguien lo nota; en el peor la diferencia es de composicion y no de total. Con un solo usuario Administracion la ventana es chica, pero no es cero: la previsualizacion queda abierta en una pestaña y se confirma mas tarde. No hay ninguna assertion que compare lo previsualizado con lo aplicado, ni siquiera dentro del propio Aplicar, que en este caso RECALCULA la previsualizacion completa (29 PrevisualizarAsync) y despues la DESCARTA sin mirarla."
    expectativa: "El Aplicar recibe de la previsualizacion lo suficiente para verificar que el universo no cambio — la cantidad y el total esperados como minimo, idealmente la lista de ids — y si no coincide, no aplica: devuelve 'el universo cambio desde que previsualizaste, volve a previsualizar'. Es barato: cuando el Aplicar ya recalcula la previsualizacion internamente, la comparacion sale gratis. Un doc-comment que promete PAT-012 sin eso promete algo que el codigo no hace."
    causa_raiz: "PAT-012 se adopto en el proyecto como una convencion de UX (dos pasos, el segundo confirma) y no como una invariante de datos (el segundo paso aplica EXACTAMENTE lo que el primero mostro). Compartir el metodo que arma el universo resuelve que los dos pasos usen el mismo CRITERIO, que es el 80% del valor, y deja afuera que usen el mismo ESTADO."
    capa: Web
    deteccion_qa:
      tipo: codigo
      consulta: "grep de las acciones de Aplicar/Confirmar de las pantallas PAT-012: `public async Task<IActionResult> Aplicar()` sin parametros es el defecto. Comparar contra la firma de Previsualizar, que si suele recibir el rango o el filtro."
    archivos_fix:
      - "Controllers/ChequesController.cs + Interfaces/IChequeService.cs - que AplicarRegularizacionImpuestoAsync reciba cantidad y total esperados y los verifique contra lo que ArmarRegularizacionImpuestoAsync devuelve antes de postear (la previsualizacion ya se recalcula ahi dentro: solo hay que mirarla en vez de descartarla)."
      - "Views/Cheques/RegularizarImpuesto.cshtml - mandar en el POST los dos valores que la pantalla ya tiene."
      - "Mismo criterio aplicable a RegularizacionCajaController.Aplicar() y al Recalcular de costos de cobranza, como deuda declarada."
    migracion_ef: no
    regla_catalogo: "MH-054 en 32-estandares-qa-implementador.instructions.md"
    criterio_aceptacion:
      - "Aplicar con una cantidad/total esperados distintos de los vigentes devuelve error y no postea nada."
      - "El camino feliz (previsualizar y aplicar sin cambios en el medio) sigue funcionando igual."
    leccion_adicional: "Compartir el metodo que arma el universo hace que los dos pasos usen el mismo criterio; no hace que usen el mismo estado. 'Una sola fuente' en un doc-comment de PAT-012 hay que leerla preguntando 'una sola fuente de que: del criterio o del snapshot'. Y cuando el Aplicar ya recalcula la previsualizacion para despues descartarla, el chequeo que falta es literalmente una comparacion gratis."

  - id: OLV-028
    modulo: "Menu lateral vs. disponibilidad de un agente de plataforma (PermisosOrganizacion.PuedeUsarChatLibre / MenuOrganizacion)"
    titulo: "El item de menu de una conversacion de plataforma se decide por rol y nunca consulta si el agente tiene version publicada: el catalogo la oculta bien, el menu la ofrece y lleva a 'Todavia no esta disponible.'"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - QA M28 lote 1, 2026-10-02, commit 87530b2, olvidata_agentes_dev, portal local en Development con modelo simulado. Reproducido por navegador (Playwright MCP) como Empleado (empa@qa.test, org 1) ANTES de importar el agente del nucleo."
    pasos:
      - "No importar ni publicar el agente de plataforma nuevo (en la base no existe ni el artefacto)."
      - "Entrar como cualquier miembro activo y leer el menu lateral."
      - "Tocar el item y leer el cuerpo de la pantalla."
    sintoma: "El menu lateral muestra 'Chat libre' con su link a /ChatLibre. La pantalla abre con HTTP 200 y el cuerpo dice 'Todavia no esta disponible.', asi que la persona llega a una pantalla muerta desde un item que el criterio pide no ofrecer. El catalogo de Agentes (seccion 'Para configurar tu sistema') SI lo oculta correctamente, lo que confirma que el dato de disponibilidad existe y es alcanzable: lo que falta es consultarlo en el menu."
    expectativa: "Sin version publicada del agente, el item no esta en el menu ni en el catalogo. Entrar por URL sigue devolviendo 'Todavia no esta disponible.' (eso ya funciona)."
    causa_raiz: "PermisosOrganizacion.PuedeUsarChatLibre => EsMiembro && !EsStaff es un chequeo de rol puro; MenuOrganizacion.cs:83 registra el item sin ninguna condicion mas, y VeEnMenu(OpcionMenu.ChatLibre) nunca llama a IChatLibre.DisponibleAsync. El controller SI la consulta (de ahi que la URL responda bien), asi que la guarda esta implementada en uno de los dos lugares que el criterio nombra. El mismo molde lo arrastra OpcionMenu.Automatizar desde M15, donde el agente estaba publicado y por eso nunca se noto."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/Helpers/MenuOrganizacion.cs
        motivo: "Hipotesis: el item de una conversacion de plataforma necesita, ademas del rol, la disponibilidad del agente. Como VeEnMenu es sincronico y DisponibleAsync no, probablemente convenga resolver la disponibilidad una vez por request y pasarla al armado del menu, no una consulta por item."
      - path: src/<Proyecto>.Infrastructure/Services/Organizacion/PermisosOrganizacion.cs
        motivo: "Hipotesis: PuedeUsarChatLibre tiene que dejar de ser solo rol. Si se decide que el permiso es rol y la disponibilidad es otra dimension, el fix va entero en el helper y este archivo no se toca: es decision de diseno, por eso no se auto-aplica."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "Con el agente de plataforma sin publicar, leer los href del menu lateral y comparar contra los que el catalogo ofrece: todo item que el catalogo oculta y el menu muestra es un hit."
      condicion_falla: "Un item del menu lleva a una pantalla cuyo cuerpo dice que todavia no esta disponible."
    criterio_aceptacion:
      - "Sin version publicada, ningun miembro ve el item en el menu lateral ni en el catalogo."
      - "Con version publicada, el item vuelve a aparecer para todo miembro activo (incluido un Empleado)."
    pruebas_minimas:
      - "Como Empleado, con el agente en Borrador: el innerText del sidebar NO contiene el nombre de la conversacion, y la ruta por URL sigue respondiendo 'Todavia no esta disponible.'"
      - "Publicar y repetir: el item aparece y la pantalla abre con el cuadro de texto habilitado."
    leccion_adicional: "Una guarda de disponibilidad escrita en el controller NO cubre el menu: son dos lugares y el criterio de aceptacion habla de los dos. Al agregar una pantalla cuya existencia depende de un dato de la base (una version publicada, una licencia, una habilitacion), hay que enumerar los TRES renderizadores que la pueden ofrecer -menu, catalogo y pantalla de primeros pasos- y no solo el que se probo."

  - id: OLV-029
    modulo: "Rotulo del tipo de una conversacion de plataforma (Views/Tareas/Detalle.cshtml y Views/Tareas/Index.cshtml)"
    titulo: "Una cadena ternaria sin rama propia para el tipo nuevo rotula el chat libre como 'Configuracion de reglas' en el titulo y el encabezado, y en el listado cae al rubro tecnico 'plataforma'"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - QA M28 lote 1, 2026-10-02, commit 87530b2. Observado en las tareas 241 a 245 de olvidata_agentes_dev (Tipo=6), por navegador."
    pasos:
      - "Abrir una conversacion del tipo de tarea nuevo y leer el titulo de la pestana y el encabezado de la pantalla."
      - "Ir al listado de Tareas y leer la segunda linea de la fila de esa conversacion."
    sintoma: "El detalle dice 'Configuracion de reglas #243' en el titulo del navegador y 'Configuracion de reglas - 02/10/2026' en el encabezado, para una conversacion que la propia burbuja del agente firma como 'Chat libre'. En el listado la fila muestra 'Chat libre | plataforma': la segunda linea es el rubro tecnico, que es exactamente lo que el comentario del codigo dice que una conversacion de plataforma no debe mostrar."
    expectativa: "El tipo nuevo tiene su propio rotulo en las dos pantallas, y ninguna conversacion de plataforma muestra el nombre del rubro tecnico."
    causa_raiz: "Detalle.cshtml linea 15 arma el rotulo con una cadena ternaria cuyo ELSE final hace de default ('Configuracion de reglas'), asi que cualquier tipo de plataforma que no sea asistente ni analista hereda el rotulo del configurador. Index.cshtml linea 219 tiene el mismo molde en JS (row.tipo === 'ConfiguracionReglas' ... : row.tipo === 'AsistenteDirector' ... : row.rubroSlug) y ahi el default es el rubro tecnico. Es la variante de VISTA del riesgo R-A1 (switches con default al agregar un TipoTarea): el relevamiento cubrio los switches de C# y dejo afuera los ternarios de Razor y de JS, que no dan error de compilacion ni warning."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/Views/Tareas/Detalle.cshtml
        motivo: "Hipotesis: la cadena ternaria necesita rama propia para el tipo nuevo. Mejor que agregar una rama mas: que el rotulo salga de un unico helper por TipoTarea, para que el proximo tipo no herede el rotulo de otro en silencio."
      - path: src/<Proyecto>.Web/Views/Tareas/Index.cshtml
        motivo: "Hipotesis: el render de la columna cae al slug del rubro; necesita la rama del tipo nuevo, idealmente del mismo mapa que el detalle, servido al JS en vez de duplicado."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: codigo
      consulta: "Despues de agregar un valor a un enum que las vistas rotulan: buscar cadenas ternarias en Views/ y los comparadores 'row.tipo ===' en los .cshtml. Cada cadena cuyo else final sea un rotulo concreto (y no 'Desconocido') es un default silencioso."
      condicion_falla: "El titulo o la fila de una conversacion del tipo nuevo muestra el rotulo de otro tipo, o el slug del rubro tecnico."
    criterio_aceptacion:
      - "El detalle y el listado rotulan el tipo nuevo con su propio nombre."
      - "Ninguna conversacion de plataforma muestra el slug del rubro tecnico en el listado."
    pruebas_minimas:
      - "Abrir una conversacion del tipo nuevo: document.title y el encabezado contienen su nombre propio y NO el de otro tipo."
      - "En el listado, el innerText de su fila no contiene el slug del rubro tecnico."
    leccion_adicional: "El riesgo 'un TipoTarea nuevo cae en un switch con default' se releva en C# y se da por cubierto, pero las vistas rotulan con cadenas ternarias en Razor y en JS que son el mismo default sin tipado ni warning. El grep del enum tiene que incluir Views/ y los literales del rotulo, no solo el nombre del enum: en Index.cshtml el default se escribe comparando el string del tipo, donde el nombre del enum no aparece como tal."

  - id: OLV-033
    modulo: "Aplicar una propuesta de regla de alcance personal nacida en una conversacion de plataforma (Services/Reglas/ReglaService.cs)"
    titulo: "La guarda 'el configurador no crea preferencias personales' se escribio como lista blanca de UN tipo de tarea, asi que toda conversacion nueva que proponga una preferencia personal deja una tarjeta que no se puede aplicar nunca y que ademas se quema como Fallida"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - QA M28 lote 3, 2026-10-02, commit 6d679d8. Tareas 251 (Directora) y 261 (Empleado) de olvidata_agentes_dev, organizacion propia qa-org-d, por navegador y confirmado en base."
    pasos:
      - "En la conversacion nueva (chat libre), escribir un pedido que haga proponer una preferencia personal: 'De ahora en mas, cuando te pida un resumen respondeme en vinetas cortas.'"
      - "Verificar que la tarjeta aparece con su boton Aplicar (Alcance = Usuario)."
      - "Tocar Aplicar."
      - "Repetir como Empleado en su propia conversacion: es su propia preferencia y la politica dice que la aplica su autor."
    sintoma: "La respuesta del POST /Propuestas/Aplicar es 200 con success:false y el mensaje 'El configurador no crea ni cambia preferencias personales: solo reglas de la empresa, de areas, por agente o de clientes.'. La tarjeta pasa a 'No se pudo aplicar' con ese texto, que habla de OTRA conversacion. En base: Reglas de la organizacion sigue en 0 y la propuesta queda Estado=4 (Fallida). Reintentar da siempre lo mismo. El mismo pedido con alcance de empresa SI se aplica, asi que el camino parece andar y lo que esta roto es justo el alcance por defecto."
    expectativa: "Una preferencia personal propuesta en una conversacion donde la politica la admite se aplica, y la aplica su autor."
    causa_raiz: "ReglaService.CrearAsync rechaza AlcanceRegla.Usuario cuando la aplicacion viene de una propuesta, salvo que EsPropuestaDeTrabajoAsync diga que si; y ese helper esta escrito como 'p.TareaAgente.Tipo == TipoTarea.Trabajo', una lista blanca de un solo valor. La decision de QUE alcances se pueden proponer vive en la politica por tipo de conversacion (que si incluye el tipo nuevo), pero la decision de que se puede CREAR al aplicar vive en otro archivo y quedo atada al unico tipo que existia cuando se escribio. Es el molde inverso de MH-047: no es un default que agrega el valor nuevo, es una lista blanca que lo deja afuera, y el sintoma no es un error sino un mensaje de negocio correcto para otro contexto."
    capa: Infrastructure
    archivos_fix:
      - path: src/<Proyecto>.Infrastructure/Services/Reglas/ReglaService.cs
        motivo: "Hipotesis: EsPropuestaDeTrabajoAsync tiene que aceptar todos los tipos de conversacion cuya politica admite alcance personal, o mejor: preguntarle a la politica en vez de comparar el tipo a mano, para que el proximo tipo no herede el rechazo. Revisar en el mismo archivo las lineas con 'Tipo == TipoTarea.Trabajo' (hay al menos dos mas, en quien ve y quien edita la regla nacida de una propuesta) y en PropuestaReglaService las consultas que filtran por ese unico tipo."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: base
      consulta: "SELECT Estado, MotivoFallo FROM PropuestasRegla WHERE TareaAgenteId=<la conversacion> -- y el conteo de Reglas de esa organizacion antes y despues de tocar Aplicar."
      condicion_falla: "La propuesta queda Estado=4 con un MotivoFallo que nombra otra conversacion, y el conteo de reglas no se movio."
    criterio_aceptacion:
      - "Aplicar una preferencia personal propuesta en la conversacion nueva crea la regla y deja la propuesta Aplicada."
      - "El Empleado aplica su propia preferencia en su propia conversacion."
      - "El alcance de empresa sigue pidiendo Director (no se afloja nada)."
    pruebas_minimas:
      - "POST /Propuestas/Aplicar sobre una propuesta de Alcance=Usuario de la conversacion nueva: success:true y una fila nueva en Reglas con Alcance=3."
      - "Como Empleado, lo mismo sobre su propia conversacion: success:true."
    leccion_adicional: "Al agregar un tipo de conversacion se releva donde el tipo nuevo cae en un DEFAULT (R-A1) y se olvida lo contrario: donde hay una LISTA BLANCA de un solo valor que lo deja afuera. La busqueda tiene que ser por '== TipoTarea.<ElUnico>' ademas de por los switch con default, y hay que correrla en los servicios que ESCRIBEN la entidad, no solo en los que muestran la tarjeta: la visibilidad y el permiso se arreglaron en el servicio de propuestas y el alta quedo rota en otro archivo."

  - id: OLV-034
    modulo: "Rotulo del alcance de una propuesta de regla (Helpers de textos de la vista)"
    titulo: "El helper que pone en palabras el alcance de una tarjeta no tiene rama para el alcance personal y lo rotula con una raya: en la conversacion donde ese alcance es el DEFAULT, la tarjeta no dice a quien se aplica"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - QA M28 lote 3, 2026-10-02, commit 6d679d8. Propuesta 57 (Alcance=3) de la tarea 251, por navegador."
    pasos:
      - "Conseguir una tarjeta de propuesta de regla de alcance personal."
      - "Leer la linea 'Donde aplica' de la tarjeta."
    sintoma: "La tarjeta dice 'Donde aplica: --' para una propuesta que si tiene alcance (el personal). Con alcance de empresa la misma linea dice 'En toda la empresa'. La persona no tiene como saber que esa regla vale solo para ella."
    expectativa: "Cada alcance que se puede proponer tiene su frase; la raya queda para el alcance ausente."
    causa_raiz: "El switch del helper enumera organizacion, area, agente, cliente y cliente+agente, y manda el alcance personal al descarte final. Era inocuo mientras ese alcance solo aparecia donde la tarjeta no se mostraba; con una conversacion nueva cuyo alcance por defecto es el personal, pasa a ser el caso mas frecuente."
