    pruebas_minimas:
      - "Tarjeta con alcance personal: la linea 'Donde aplica' no es una raya."
    leccion_adicional: "Un descarte en un helper de rotulos no es dano hasta que un modulo nuevo convierte en frecuente un valor que antes casi no se veia. Al agregar una conversacion que propone con un alcance distinto al habitual, hay que recorrer los helpers de rotulo de ESA tarjeta valor por valor del enum, no solo los del listado."

  - id: OLV-030
    modulo: "Tarjetas de partes en una conversacion de plataforma que delega (Views/Tareas/_Conversacion.cshtml)"
    titulo: "Un flag 'es de plataforma' que nacio significando 'no tiene partes ni aprobaciones' sigue vaciando la lista de partes cuando el tipo nuevo SI delega: el hilo queda 'Esperando a otros agentes' sin mostrar de que ni dejar resolver"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - QA M28 lote 2, 2026-10-02, commit 6d679d8. Tareas 249, 254 y 256 (chat libre, Tipo=6) contra la tarea 252 (Trabajo) como control positivo, en olvidata_agentes_dev, por navegador."
    pasos:
      - "Abrir el chat libre y pedir trabajo a un agente mencionandolo, de modo que el turno delegue."
      - "Mientras el hilo esta en 'Esperando a otros agentes', contar los nodos .ov-parte del DOM."
      - "Control positivo: pedir la misma delegacion desde una tarea de Trabajo y contar los mismos nodos."
    sintoma: "En el chat libre: cero nodos .ov-parte, en EsperandoSubtareas y despues de completarse, aunque la base tiene la parte (SELECT COUNT(*) FROM TareasAgente WHERE TareaPadreId=249 da 1) y el listado de Tareas si muestra '1 parte' en la fila. En la tarea de Trabajo, la misma delegacion renderiza la tarjeta: 'Le pidio a inmo-agenda | USD 0,00 | Trabajando | Abrir la parte #253 | Cancelar esta parte'. El caso peor es una parte que espera aprobacion: el hilo queda en 'Esperando a otros agentes' por tiempo indefinido, sin decir de que espera y sin el enlace 'Resolver' que la tarjeta trae para ese estado."
    expectativa: "La conversacion que delega muestra la tarjeta de parte con su estado, su costo y sus acciones, igual que una tarea de trabajo. El flag de plataforma puede seguir ocultando lo que una conversacion de plataforma no tiene, pero no lo que ahora si tiene."
    causa_raiz: "_Conversacion.cshtml decide las partes del turno con 'Model.EsDePlataforma ? Array.Empty<SubtareaDto>() : Model.SubtareasDelTurno(t)'. El flag significaba 'conversacion de configuracion', que nunca delegaba, asi que vaciar la lista era correcto por construccion. El tipo nuevo entra al mismo flag a proposito (es la palanca que le da las herramientas de plataforma) y hereda de paso el vaciado. No hay switch de enum: es un BOOLEANO VIEJO cuyo significado se desdoblo, que es justo lo que un relevamiento de switches por el enum no encuentra."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/Views/Tareas/_Conversacion.cshtml
        motivo: "Hipotesis: la condicion de las partes no es 'es de plataforma' sino 'este tipo no delega'. Conviene una propiedad explicita en el ViewModel (p. ej. MuestraPartes) derivada de la misma lista blanca de tipos que usa SubagentesPermitidosAsync, para que el proximo tipo que delegue no dependa de acordarse de esta vista."
      - path: src/<Proyecto>.Web/Models/ConfiguradorViewModels.cs
        motivo: "Hipotesis: si el flag se sigue usando para aprobaciones y propuestas, hay que separar los dos significados en dos banderas y no reutilizar una."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: codigo
      consulta: "Al habilitar una capacidad nueva en un tipo que ya existia, buscar en las vistas los ternarios cuya condicion sea un flag de clase ('EsDePlataforma', 'EsInterno', 'EsDemo') y no el enum: cada uno es una capacidad que se apago por construccion y que nadie vuelve a mirar."
    criterio_aceptacion:
      - "Con el hilo en EsperandoSubtareas, la pantalla muestra una tarjeta por parte, con su agente y su estado."
      - "Si la parte espera aprobacion, la tarjeta ofrece el camino para resolverla."
      - "La tarjeta sigue sin aparecer en las conversaciones de plataforma que no delegan."
    pruebas_minimas:
      - "document.querySelectorAll('.ov-parte').length >= 1 mientras el hilo esta en 'Esperando a otros agentes'."
      - "El mismo selector sigue dando 0 en una conversacion de configuracion del mismo producto."
    leccion_adicional: "Un criterio de aceptacion que dice 'muestra la tarjeta X' se verifica contando el nodo en el DOM, no leyendo que el turno termino bien: la tarea 249 cerro con el resultado de la parte citado en el texto del agente, asi que leyendo la pantalla el criterio parece cumplido. Y la tarjeta hay que buscarla con un CONTROL POSITIVO en la superficie vieja: es la unica forma de distinguir 'no se renderiza' de 'no habia nada que renderizar'."

  - id: OLV-031
    modulo: "Autocomplete con grupos y tope de resultados (wwwroot/js/site.js)"
    titulo: "Un .slice(0, TOPE) sobre la lista concatenada corta el ULTIMO grupo entero: el grupo que ensena desaparece justo en la organizacion que tiene muchos agentes, y el test que lo cubre usa cero agentes"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - QA M28 lote 2, 2026-10-02, commit 6d679d8. Organizacion con 18 agentes usables y TOPE = 16, por navegador."
    pasos:
      - "En una organizacion con mas agentes usables que el tope del autocomplete, abrir la pantalla y escribir la arroba sola."
      - "Leer los rotulos de grupo del menu y comparar con lo que devuelve el endpoint que lo alimenta."
    sintoma: "El endpoint devuelve 22 opciones (18 del grupo 'Agentes' y 4 del grupo 'Configurar'), el menu pinta 16 y un solo rotulo de grupo: 'Agentes'. Las cuatro opciones de 'Configurar' y dos agentes quedan afuera. Con la licencia revocada (cero agentes) el grupo 'Configurar' aparece completo, y con un filtro que lo alcance tambien: solo falla con la lista llena. La pastilla pensada para ensenar el mecanismo -la que escribe la arroba sola y abre el menu- es la que mas lo expone."
    expectativa: "El tope recorta dentro de cada grupo, o deja al menos una cuota por grupo: ningun grupo puede desaparecer entero por el largo de otro."
    causa_raiz: "pintar() filtra la lista completa y aplica un unico '.slice(0, TOPE)' sobre la concatenacion que el servidor manda ya ordenada (agentes primero, configurar al final). El tope es global y el orden pone al grupo chico ultimo, asi que el grupo chico es el primero en caer. El test de la suite afirma el borde opuesto -que 'Configurar' esta aunque no haya ningun agente- y pasa, porque con cero agentes el slice no recorta nada."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/wwwroot/js/site.js
        motivo: "Hipotesis: recortar por grupo en vez de sobre la lista plana (agrupar y tomar hasta N de cada grupo), o reservar la cuota del grupo fijo antes de recortar el grupo variable."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: navegador
      consulta: "Con un tope de N resultados y una lista agrupada, probar SIEMPRE con mas de N elementos en el primer grupo y afirmar la cantidad de rotulos de grupo del menu, no la cantidad de items."
    criterio_aceptacion:
      - "Con la lista llena, el menu muestra los dos rotulos de grupo."
      - "Ninguna opcion del grupo fijo se pierde por el largo del grupo variable."
    pruebas_minimas:
      - "En una organizacion con mas agentes que el tope: document.querySelectorAll('.ov-menciones__grupo').length es 2."
      - "El grupo fijo conserva sus 4 opciones con la arroba sola."
    leccion_adicional: "Un test que afirma 'el grupo fijo esta' tiene que correr con la lista LLENA, no vacia: el caso vacio prueba que el grupo existe, no que sobrevive al recorte. Mas en general, cuando una lista agrupada se recorta, el tope pertenece al grupo y no a la lista."

  - id: OLV-032
    modulo: "Atributo que enciende un comportamiento opcional de JS (Views/Tareas/_CuadroSeguimiento.cshtml)"
    titulo: "El atributo que habilita un comportamiento opcional se emite SIEMPRE con valor vacio en vez de omitirse: el selector [data-x] matchea, el fetch('') se trae la pagina entera y el error queda en un catch mudo"
    severidad: trivial
    reproducido_en: "olvidata-agentes-multirubro - QA M28 lote 2, 2026-10-02, commit 6d679d8. Conversacion del analista (tarea 260): el compositor trae data-menciones vacio y escribir la arroba no abre nada, pero dispara un pedido."
    pasos:
      - "Abrir una conversacion que NO tiene el comportamiento habilitado y leer el atributo del compositor."
      - "Escribir el caracter que dispara el comportamiento y mirar la pestana de red."
    sintoma: "El atributo existe con valor vacio, asi que el selector de atributo lo matchea y el comportamiento arranca: fetch('') pide la pagina actual, devuelve HTML, r.json() lanza, y el catch devuelve lista vacia. Hacia el usuario no se ve nada (el menu no abre), pero hay un pedido de pagina completa por cada compositor que no deberia estar escuchando."
    expectativa: "El atributo se omite cuando el comportamiento no corresponde, o el JS trata el valor vacio como apagado antes de pedir nada."
    causa_raiz: "La vista escribe el atributo sin condicion; cuando no corresponde, la variable es vacia y Razor lo emite igual (un atributo de Razor se omite si la expresion es null, no si es string vacio). La nota de implementacion dice 'solo si es chat libre', asi que es una divergencia entre lo declarado y lo escrito. El JS, por su lado, confia en el selector de presencia y no valida la url antes de pedirla."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/Views/Tareas/_CuadroSeguimiento.cshtml
        motivo: "Hipotesis: emitir el atributo solo cuando hay url, pasando null en vez de string vacio."
      - path: src/<Proyecto>.Web/wwwroot/js/site.js
        motivo: "Hipotesis: salir temprano si getAttribute devuelve vacio, para que el apagado no dependa solo de la vista."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: navegador
      consulta: "Cuando un comportamiento se enciende con un atributo, verificar en la superficie que NO lo quiere que el atributo este AUSENTE, no vacio: [data-x] matchea el vacio y un catch mudo tapa lo que pase despues."
    criterio_aceptacion:
      - "En la superficie que no usa el comportamiento, el atributo no esta en el HTML."
      - "Escribir el caracter disparador no genera ningun pedido al servidor."
    pruebas_minimas:
      - "hasAttribute('data-menciones') da false en el compositor de la conversacion que no lo usa."
      - "Con el panel de red abierto, escribir la arroba no agrega ningun pedido."
    leccion_adicional: "Un catch que devuelve el valor neutro para que el compositor siga siendo un compositor es correcto como defensa, y es exactamente lo que esconde este caso: la unica evidencia esta en la pestana de red. Al probar un comportamiento opt-in, mirar el trafico de la superficie que NO lo pidio."

