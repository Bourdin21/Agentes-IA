  - id: CRM-003
    modulo: "Contactos / Index e Industrias / Index (DataTable server-side)"
    titulo: "Click en el encabezado de una columna del DataTable no reordena los datos: GetData de ContactosController e IndustriasController ignoran los parametros order[0][column]/order[0][dir] que DataTables envia y siempre devuelven un orden fijo"
    severidad: minor
    reproducido_en: "crm-olvidata - main, revision estatica de codigo (ContactosController.GetData, IndustriasController.GetData), no reproducido contra la app corriendo"
    pasos:
      - "Ir a Contactos (o Industrias) y hacer click en el encabezado de cualquier columna orderable (ej. 'Nombre')."
      - "Observar la flecha de orden en el encabezado (cambia visualmente) y los datos de la tabla."
    sintoma: "La UI de DataTables muestra la flecha de orden cambiando (asc/desc) pero las filas devueltas por el servidor no cambian de orden: ContactosController.GetData siempre hace '.OrderByDescending(c => c.FechaUltimaActividad)' e IndustriasController.GetData siempre hace '.OrderBy(i => i.Orden)', sin leer Request.Form[\"order[0][column]\"]/Request.Form[\"order[0][dir]\"] que el DataTable si envia (a diferencia de AuditController.GetData, que si implementa GetSortColumn() + SortColumn/SortDirection)."
    expectativa: "Un DataTable server-side estandar del Design System del estudio permite ordenar por cualquier columna orderable haciendo click en su encabezado (mismo patron ya implementado en AuditController.GetData)."
    causa_raiz: "ContactosController.GetData e IndustriasController.GetData no fueron migrados con el mismo soporte de ordenamiento dinamico que ya existe en AuditController.GetData (patron ya validado en la base del estudio); ambos hardcodean un unico OrderBy fijo."
    capa: Web
    archivos_fix:
      - path: OlvidataCRM.Web/Controllers/ContactosController.cs
        motivo: "PENDIENTE DE AUTORIZACION (Implementador): leer Request.Form[\"order[0][column]\"]/[\"order[0][dir]\"] + Request.Form[\"columns[{col}][data]\"] (mismo patron de AuditController.GetSortColumn) y aplicar un switch de OrderBy dinamico sobre las columnas visibles, con OrderByDescending(FechaUltimaActividad) como fallback."
      - path: OlvidataCRM.Web/Controllers/IndustriasController.cs
        motivo: "PENDIENTE DE AUTORIZACION (Implementador): mismo patron, con OrderBy(Orden) como fallback."
    migracion_ef: null
    deteccion_qa:
      tipo: static
      selector_o_endpoint: "POST /Contactos/GetData y POST /Industrias/GetData con order[0][column]/order[0][dir]"
      condicion_falla: "La consulta del controller no referencia Request.Form[\"order[0][column]\"] ni Request.Form[\"order[0][dir]\"] en ningun punto (confirmado por lectura de codigo)."
    criterio_aceptacion:
      - "Click en el encabezado 'Nombre' (o cualquier columna orderable) reordena las filas devueltas segun esa columna, asc/desc segun el click."
      - "El orden por defecto (sin click del usuario) se mantiene igual al actual (FechaUltimaActividad desc / Orden asc) — no es una regresion del comportamiento base, es una funcionalidad faltante."
    pruebas_minimas:
      - "Contactos/Index: click en encabezado 'Nombre' -> verificar que el orden de las filas cambia (prueba manual UI)."
      - "Industrias/Index: click en encabezado 'Precio USD' -> verificar que el orden cambia (prueba manual UI)."
    fix_aplicado:
      fecha: "2026-08-08"
      por: "implementador"
      resultado: "aplicado"
      archivos:
        - path: OlvidataCRM.Web/Controllers/ContactosController.cs
          motivo: "Agregado metodo AplicarOrden(IQueryable<Contacto>) que lee Request.Form[\"order[0][column]\"]/[\"order[0][dir]\"] y aplica un switch explicito (whitelist por indice de columna 0-6, sin LINQ dinamico desde texto libre) sobre Telefono/NombreContacto/NombreNegocio/Rubro/CanalOrigen/EstadoEmbudo/FechaUltimaActividad, con OrderByDescending(FechaUltimaActividad) como fallback igual al comportamiento anterior. AuditController.GetData, citado como referencia en el hallazgo original, ya no existe en este codigo (no hay pantalla de Auditoria en este proyecto) — se implemento el patron desde cero en vez de copiarlo."
