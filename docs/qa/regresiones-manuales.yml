  - id: MH-004
    modulo: "Caja mensual / Desglose facturado-no facturado (CajaService.ObtenerDesgloseFacturadoAsync)"
    titulo: "El desglose Facturado/No facturado de Caja mensual puede sumar menos que el total de Ingresos del periodo mostrado, si dentro del periodo se anulo algun Gasto"
    severidad: minor
    reproducido_en: "marihogar - master (working tree, Sprint CR-B / CR-9), confirmado por revision de codigo el 2026-07-27, no reproducido en navegador ni con datos reales (marihogar_dev no tiene ningun Gasto anulado todavia — confirmado por query SELECT Id FROM Gastos WHERE Anulado=1, 0 filas); reproducible por codigo con certeza."
    pasos:
      - "Como Administrador, registrar un Gasto con fecha dentro del mes actual."
      - "Anular ese Gasto (Gastos/Anular) el mismo dia o cualquier dia dentro del mismo periodo."
      - "Ir a Caja mensual (Caja/Index) con el filtro de fecha cubriendo ese periodo."
      - "Comparar 'Ingresos del periodo' (card principal) contra la suma de los 2 badges del desglose Facturado + No facturado."
    sintoma: "'Ingresos del periodo' es mayor que Facturado+No facturado. CajaService.ObtenerTotalesAsync suma TODOS los MovimientoCCLocal con Tipo=Ingreso del periodo (sin filtrar por OrigenTipo), mientras que ObtenerDesgloseFacturadoAsync (version previa al fix) solo consideraba movimientos con OrigenTipo='Venta' para el desglose — un Gasto anulado genera un contramovimiento Tipo=Ingreso/OrigenTipo='Gasto' (GastoService.AnularAsync, reversion del Egreso original) que quedaba contado en el total pero excluido del desglose."
    expectativa: "CA-CR9.2 (mismo criterio que CA-CR9.1/HU-9.3): 'la suma de ambos segmentos coincide siempre con el total ya mostrado (no duplica ni omite ninguna Venta)'. El desglose debe partir exactamente el mismo conjunto de movimientos que ya suma 'Ingresos del periodo', sin importar su OrigenTipo."
    causa_raiz: "Decision de implementacion documentada como cierta en 5-implementador.md (Sprint CR-B, decision #6) resulto incompleta: el grep de llamadores de ICCLocalService.RegistrarMovimientoAsync que declaraba 'solo VentaService escribe Ingreso, siempre con OrigenTipo=Venta; GastoService solo escribe Egreso' no contemplo que GastoService.AnularAsync (reversion de un Gasto ya registrado) tambien escribe Tipo=Ingreson con OrigenTipo='Gasto' (linea ~131-133 de GastoService.cs) — la reversion de un Egreso es, por definicion contable del ledger con signo, un Ingreso. El mismo patron (ObtenerDesgloseFacturadoAsync filtrando solo OrigenTipo=Venta) fue reutilizado en DashboardService (sin problema ahi, porque esa card se calcula desde la tabla Venta directamente, no desde MovimientoCCLocal) y de forma informativa en ProyeccionFinancieraService (donde el impacto es una dilucion menor del porcentaje informativo, no un incumplimiento de un CA explicito de suma exacta — no se aplico fix ahi, documentado como observacion menor separada)."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/CajaService.cs
        motivo: "ObtenerDesgloseFacturadoAsync: en vez de partir solo los movimientos OrigenTipo=Venta en facturados/no-facturados, ahora trae TODOS los Ingreso del periodo, calcula facturados igual que antes (subset Venta con ComprobanteAfip Emitido) y noFacturados = totalIngresos - facturados, garantizando por construccion que facturados+noFacturados == IngresosPeriodo sin importar que otros OrigenTipo existan."
    migracion_ef: null
    deteccion_qa:
      tipo: data
      selector_o_endpoint: "CajaService.ObtenerResumenAsync(desde,hasta) con al menos 1 Gasto anulado dentro del rango"
      condicion_falla: "CajaPeriodoDto.IngresosFacturados + CajaPeriodoDto.IngresosNoFacturados != CajaPeriodoDto.IngresosPeriodo"
    criterio_aceptacion:
      - "En cualquier periodo, IngresosFacturados + IngresosNoFacturados == IngresosPeriodo exacto, incluso con Gastos anulados dentro del rango."
      - "Sin Gastos anulados en el periodo, el comportamiento es identico al previo (regresion)."
    pruebas_minimas:
      - "Periodo sin Gastos anulados: desglose suma igual al total (ya cubierto, sin cambio)."
      - "Periodo con 1 Gasto anulado: desglose (Facturado+No facturado) suma exactamente IngresosPeriodo, con el monto de la reversion del Gasto contado como No facturado."
    fix_aplicado:
      fecha: "2026-07-27"
      por: "QA (auto-fix, Sprint CR-B)"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Infrastructure/Services/CajaService.cs
          motivo: "ObtenerDesgloseFacturadoAsync reescrito para calcular noFacturados como resta contra el total real de Ingreso del periodo (no como suma de un subconjunto potencialmente incompleto), cerrando el gap para cualquier OrigenTipo presente o futuro."
      build: "dotnet build MariHogar.slnx --no-incremental -> Compilacion correcta, 0 Errores (mismos 9 warnings preexistentes, ninguno nuevo) — verificado por QA tras el fix."
      verificacion: "Verificado por QA via revision de codigo del metodo reescrito y confirmacion de que DashboardService.ObtenerVentasPeriodoAsync (unica otra card con el mismo requisito de suma exacta) NO tiene el mismo problema porque particiona la misma lista de Ventas ya sumada por construccion (no una segunda query con un filtro distinto). No reproducido en navegador ni contra marihogar_dev con datos reales (no hay Gastos anulados en el dev actual) — el fix se valida por logica de codigo (facturados+noFacturados=totalIngresos es una identidad algebraica garantizada por la resta, no depende de que caso de dato se ejecute)."

