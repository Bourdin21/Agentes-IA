      tipo: navegador
      consulta: "Al verificar una guarda de visibilidad, cerrar el inventario por los LECTORES de la condicion, no por la pantalla que reporto el defecto: barrer TODOS los a[href] de la pagina, no el aside."
    criterio_aceptacion:
      - "Sin version publicada, ninguna superficie del portal enlaza la pantalla."
    pruebas_minimas:
      - "Con las versiones en Borrador, los a[href] de todo el tablero no contienen la ruta de ninguna de las conversaciones."
    leccion_adicional: "Un parte que nombra 'el menu' invita a arreglar el menu. La guarda pertenece a la condicion, no a la vista: si la condicion no es una sola funcion que todas consultan, el defecto reaparece en la superficie que nadie nombro."

  - id: OLV-036
    modulo: "Subida de un archivo desde una pantalla que NO tiene entidad padre (Documentos/Subir sin cliente)"
    titulo: "Un parametro de ruta int no nullable con valor vacio invalida el ModelState y el endpoint contesta el mensaje del OTRO campo: 'Elegi un archivo' con el archivo adentro del FormData"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - QA M28 ronda de re-verificacion, 2026-10-02, commit 7b508d5. Chat libre y conversacion del analista (sin cliente): POST /Documentos/Subir?clienteId= con un File real devuelve 200 {success:false, message:'Elegi un archivo.'}; el MISMO File a ?clienteId=74 devuelve success:true. Con ?clienteId=0 el servicio contesta 'El cliente no existe.'"
    pasos:
      - "Abrir una conversacion que acepta adjuntos SIN entidad padre y usar 'Subir un documento'."
      - "Elegir un archivo chico y legible; leer la fila de la cola de subida."
      - "Repetir el mismo POST con la entidad padre puesta, para tener el control positivo."
    sintoma: "La fila dice 'Elegi un archivo.' aunque el archivo esta elegido y viaja en el FormData. La persona no tiene forma de subir un adjunto nuevo desde esa conversacion, y el mensaje la culpa de algo que hizo."
    expectativa: "O la pantalla no ofrece subir cuando el endpoint lo necesita, o el endpoint acepta la subida sin entidad padre; en cualquier caso el mensaje nombra la causa real."
    causa_raiz: "La accion es Subir(int clienteId, SubirDocumentoViewModel model): con el valor vacio el binder falla sobre clienteId y deja ModelState invalido, y la primera linea de la accion traduce TODO ModelState invalido al unico mensaje del ViewModel ('Elegi un archivo'). El armador de la url del modal emite clienteId= vacio cuando no hay cliente."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/Controllers/DocumentosController.cs
        motivo: "Hipotesis: separar las dos validaciones (parametro de ruta vs. archivo) y no devolver el mensaje del archivo cuando lo que falla es el parametro."
      - path: src/<Proyecto>.Web/Views/Shared/_ModalDocumentos.cshtml
        motivo: "Hipotesis: no emitir el parametro vacio, o no ofrecer la subida cuando no hay entidad padre."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: navegador
      consulta: "Cuando una accion mezcla un parametro de ruta con un ViewModel, probarla con el parametro VACIO: si el unico chequeo es !ModelState.IsValid, el error del parametro sale disfrazado del error del campo, y el mensaje manda a QA a buscar donde no esta."
    criterio_aceptacion:
      - "Subir un archivo desde la conversacion sin entidad padre funciona, o la pantalla no lo ofrece."
      - "Ningun camino de error devuelve 'Elegi un archivo' con el archivo presente."
    pruebas_minimas:
      - "POST a la url que arma el modal, con un File real: success true, o un mensaje que nombre la causa real."
      - "Control positivo con la entidad padre puesta: el mismo File entra."
    leccion_adicional: "Un mensaje de validacion equivocado cuesta mas que la falla: el primer diagnostico fue 'Playwright no adjunta el archivo'. El control positivo (mismo archivo, otra url) es lo unico que lo desarma. Y una conversacion que acepta adjuntos sin entidad padre hay que probarla SUBIENDO, no solo adjuntando algo que ya estaba."

  - id: OLV-037
    modulo: "Rotulo del origen de un registro creado por conversacion (origen de una regla)"
    titulo: "Un registro nacido en la conversacion nueva se rotula con el nombre de la conversacion vieja: 'Propuesta del configurador' en una regla que salio de un chat libre"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - QA M28 ronda de re-verificacion, 2026-10-02, commit 7b508d5. Regla 118, aplicada desde el chat libre de la tarea 266: /Reglas/Detalle/118 dice 'ORIGEN Propuesta del configurador' y el historial 'Alta desde el configurador'. El enlace 'Ver conversacion' si apunta bien a /Tareas/Detalle/266."
    pasos:
      - "Aplicar una propuesta de regla desde la conversacion nueva."
      - "Abrir el detalle de la regla y leer el campo de origen y la fila del historial."
    sintoma: "El origen y el historial nombran una pantalla que la persona nunca uso. El enlace a la conversacion, en cambio, esta y es correcto."
    expectativa: "El origen nombra la conversacion de la que salio, o una frase generica que no afirme algo falso."
    causa_raiz: "El rotulo del origen es el de la familia 'propuesta', no el del tipo de la conversacion; al agregarse un cuarto tipo que tambien propone reglas, el texto fijo de la familia pasa a ser el nombre de uno solo de sus miembros."
    capa: Application
    archivos_fix:
      - path: src/<Proyecto>.Infrastructure/Services/ReglaService.cs
        motivo: "Hipotesis: derivar el rotulo del origen del TipoTarea de la conversacion, con la misma tabla sin default que resolvio el rotulo del titulo."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: navegador
      consulta: "Cuando un tipo nuevo empieza a crear registros que ya creaba otro, leer los rotulos de ORIGEN y de HISTORIAL del registro creado, no solo la pantalla donde nacio."
    criterio_aceptacion:
      - "Una regla nacida en la conversacion nueva no se atribuye a otra pantalla."
    pruebas_minimas:
      - "El detalle de la regla no dice 'del configurador' cuando la propuesta salio de un chat libre."
    leccion_adicional: "El implementador declaro este punto como decision (no le damos el enlace ni la leyenda) y lo observado es otra cosa: el enlace SI esta y la leyenda esta MAL. Una declaracion de alcance no exime de mirar la pantalla: lo que se declaro ausente puede estar presente y equivocado."

  - id: OLV-038
    modulo: "Ciclo de vida de un archivo transitorio (accion de promoverlo a permanente)"
    titulo: "La accion que convierte un registro transitorio en permanente vive SOLO en el estado efimero de la UI (el compositor, antes de enviar) y desaparece justo en el momento en que la historia de usuario dice que se usa: despues de que el agente lo proceso"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - QA M29 lote 2, 2026-10-02, commit 8fef7ae. Portal local 7201, org qa-l2 (tenant 27). Transitorio 117 subido en /ChatLibre y enviado en la tarea 279: el chip del hilo es un <a> plano a /Documentos/Ver/117 (document.querySelectorAll('.ov-chip-adjunto__accion').length = 0), /Documentos/Ver/117 ofrece solo Descargar / Renombrar / Dar de baja, #chipsSeguimiento al reabrir la conversacion esta vacio, y OpcionesParaAdjuntarAsync excluye los documentos sin cliente a proposito (CA-02.4). Control positivo: el MISMO flujo antes de enviar funciona entero (doc 118 -> cliente 76, chip pasa a solido con el nombre del cliente)."
    pasos:
      - "Subir un archivo a una conversacion eligiendo el destino reversible (solo en esta conversacion)."
      - "ENVIAR el mensaje con ese adjunto y dejar que el agente lo procese."
      - "Volver al hilo y buscar la accion de guardarlo en la carpeta de un cliente."
    sintoma: "No hay ningun camino. El chip del hilo no ofrece la accion, la ficha del documento tampoco, y el modal de adjuntar excluye los transitorios (correctamente, por otro criterio). La unica ventana en la que la accion existio fue antes de enviar el mensaje."
    expectativa: "La accion esta donde esta el archivo DESPUES de usarlo: en el chip del hilo, en la ficha del documento, o en las dos. Es el unico momento en que la persona ya sabe si le sirvio."
    causa_raiz: "La accion se escribio dentro del renderer de chips del compositor (una lista en memoria de JavaScript que se descarta al enviar) y no en la proyeccion persistida del adjunto del turno ni en la ficha del documento. El criterio de aceptacion decia 'desde el hilo' y el hilo tiene dos superficies: la que se esta escribiendo y la que ya quedo escrita; se implemento la primera."
    capa: Presentacion
    archivos_fix:
      - path: src/<Proyecto>.Web/Views/Tareas/_Conversacion.cshtml
        motivo: "Hipotesis: el chip de un adjunto ya enviado necesita saber si es transitorio (el DTO del adjunto del mensaje tiene que traer SinCliente) y, si lo es, ofrecer la accion y la leyenda con el mismo widget compartido."
      - path: src/<Proyecto>.Web/Views/Documentos/Ver.cshtml
        motivo: "Hipotesis: la ficha ya dice 'Sin cliente (solo de esta conversacion)'; ahi la accion es una linea mas al lado de Renombrar y Dar de baja, y alcanza para cerrar el ciclo."
      - path: src/<Proyecto>.Application/DTOs/<Tareas>Dtos.cs
        motivo: "Hipotesis: el adjunto del mensaje viaja sin el dato de si tiene cliente; sin eso la vista no puede decidir."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: navegador
      consulta: "Cuando una feature tiene un estado reversible que se puede promover, contar las SUPERFICIES donde el registro se ve despues de persistirse y verificar que la accion de promoverlo este en al menos una. Un contador de la accion en el DOM del hilo reabierto en cero es el FAIL."
    criterio_aceptacion:
      - "Reabierta la conversacion, el adjunto transitorio de un turno ya enviado ofrece guardarlo en un cliente, y al hacerlo pasa a ser documento de ese cliente sin volver a subir el archivo."
    pruebas_minimas:
      - "En el hilo reabierto, el chip del transitorio tiene la accion (selector de la accion con count >= 1) y al usarla el documento queda con ClienteCarteraId en base."
      - "Control negativo: un adjunto que YA tiene cliente no ofrece la accion."
    leccion_adicional: "El criterio decia 'desde el hilo, sin volver a subirlo' y la implementacion lo cumplio literalmente en la unica superficie donde el archivo todavia no era parte del hilo. Un criterio con la palabra 'despues' adentro (aca 'me resulto util') se prueba despues del evento, no antes."

  - id: OLV-039
    modulo: "Leyenda de estado de un registro con dos superficies de render (chip de adjunto)"
    titulo: "La leyenda que distingue el estado nuevo se agrego en el renderer compartido del compositor y no en la superficie persistida: en el hilo, el registro transitorio y el permanente se dibujan igual"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - QA M29 lote 2, 2026-10-02, commit 8fef7ae. En /Tareas/Detalle/279 el chip del transitorio 117 mide borderStyle 'solid' y texto 'omega-l2.txt', identico al de un documento con cliente: sin leyenda y sin el borde punteado. En el compositor, el mismo archivo mide borderStyle 'dashed', color var(--ov-gray-400) y texto 'solo en esta conversacion'. La ficha /Documentos/Ver/117 SI lo dice ('Sin cliente (solo de esta conversacion)')."
    pasos:
      - "Adjuntar un transitorio y un documento con cliente en un mismo turno y enviarlo."
      - "Reabrir la conversacion y comparar los dos chips del turno."
    sintoma: "Los dos se ven iguales. El riesgo de diseno que la propia etapa declaro -si los dos tipos de archivo se ven igual la feature es invisible- se cumple en la pantalla donde la conversacion se relee."
    expectativa: "El chip del hilo dice que va a pasar con el archivo, igual que el del compositor."
    causa_raiz: "El renderer de chips se unifico para las pantallas que arman un mensaje (JavaScript) y el chip del turno ya enviado se sigue dibujando en Razor, con un partial que nunca recibio el estado nuevo. Unificar cinco de seis superficies deja la sexta mintiendo por omision."
    capa: Presentacion
    archivos_fix:
      - path: src/<Proyecto>.Web/Views/Tareas/_Conversacion.cshtml
        motivo: "Hipotesis: el chip del adjunto enviado necesita la leyenda; es el mismo dato que pide OLV-038."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: navegador
      consulta: "Cuando una etapa declara que un estado nuevo 'se ve distinto', medir getComputedStyle y el texto del elemento en TODAS las superficies donde se dibuja, no solo en la que el diff toco. Dos superficies con el mismo borderStyle y sin leyenda es el FAIL."
    criterio_aceptacion:
      - "Un adjunto transitorio y uno con cliente, en el mismo turno ya enviado, se distinguen por texto y por estilo."
    pruebas_minimas:
      - "En el hilo, el chip del transitorio tiene leyenda propia y borde distinto del chip con cliente."
    leccion_adicional: "El unico renderer compartido cubrio las cinco pantallas que ESCRIBEN un mensaje; la que lo LEE quedo afuera y es la que mas veces se mira."

  - id: OLV-041
    modulo: "Chip de adjunto en el hilo reabierto: el destino se dice a medias (Tareas/_Conversacion)"
    titulo: "El arreglo de OLV-039 le dio al chip del hilo la leyenda del transitorio pero no el nombre del cliente: en el hilo un archivo guardado no dice DONDE quedo, y es justo lo que la persona acaba de decidir"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - QA M29 ronda de re-verificacion, 2026-10-02, commit 1e71bed. Hilo /Tareas/Detalle/9289 con cuatro adjuntos. Transitorio: dashed + rgb(148,163,184) + 'solo en esta conversacion' (correcto). Guardado desde el hilo (doc 140 -> Cliente Beta QA) y nacido con cliente (doc 138 -> Cliente Alfa QA): los dos quedan solid rgb(226,232,240) y el texto del chip es SOLO el nombre del archivo, sin el nombre del cliente. El MISMO documento en el chip del compositor si lo dice: 'unico-uno.txt | Cliente Beta QA'. Medido con getComputedStyle y textContent en claro y en oscuro."
    pasos:
      - "Adjuntar en una conversacion un archivo transitorio y otro con cliente; enviar el mensaje."
      - "Reabrir el hilo y leer el texto de los dos chips."
      - "Guardar el transitorio en un cliente desde el chip del hilo y volver a leer el chip (el hilo lo repinta el servidor)."
      - "Control: el mismo documento en el chip del COMPOSITOR, que si nombra al cliente."
    sintoma: "Despues de guardar, el chip del hilo cambia de estado (pierde el borde punteado y la leyenda) pero nunca nombra el cliente. La persona que acaba de elegir el destino no tiene en pantalla la confirmacion de cual fue, y al dia siguiente el hilo no dice de quien es cada archivo: hay que abrir Documentos/Ver uno por uno."
    expectativa: "D-02 pide el contraste completo: 'un archivo transitorio se ve distinto de uno guardado y lo dice en una linea: solo en esta conversacion CONTRA EL NOMBRE DEL CLIENTE'. Las dos superficies que dibujan el mismo chip dicen lo mismo."
    causa_raiz: "El arreglo de OLV-038/OLV-039 le agrego a AdjuntoMensajeDto los campos SinCliente y Version, que son los que necesitaba la ACCION, y no NombreCliente, que es el que necesita la LECTURA. La vista quedo con un unico '@if (a.SinCliente) { ...destino... }' y ningun else, asi que el caso 'tiene cliente' no tiene rama. Es la mitad que falto de la misma causa raiz: la superficie que RELEE el hilo sigue sabiendo menos que la que lo ESCRIBE, solo que ahora por un campo en vez de dos."
    capa: Application + Web
    archivos_fix:
      - path: src/<Proyecto>.Application/Motor/IMotorAgentes.cs
        motivo: "Hipotesis: AdjuntoMensajeDto suma NombreCliente (null cuando es transitorio), proyectado en la MISMA consulta que ya trae ClienteCarteraId; no hace falta consulta nueva."
      - path: src/<Proyecto>.Infrastructure/Services/Motor/ServicioTareas.cs
        motivo: "Proyectar el nombre del cliente del documento junto con ClienteCarteraId y VersionToken."
      - path: src/<Proyecto>.Web/Views/Tareas/_Conversacion.cshtml
        motivo: "El else del '@if (a.SinCliente)': un span ov-chip-adjunto__destino con el nombre del cliente, igual que hace el JS del compositor."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: dom
      selector_o_endpoint: "#conversacion .ov-chip-adjunto:not(.ov-chip-adjunto--transitorio) .ov-chip-adjunto__destino"
      condicion_falla: "En cero: ningun chip guardado del hilo nombra su destino."
    criterio_aceptacion:
      - "En el hilo reabierto, el chip de un adjunto CON cliente muestra el nombre del cliente, en claro y en oscuro."
      - "Despues de guardar un transitorio desde el chip del hilo, el chip repintado por el servidor muestra el nombre del cliente elegido."
      - "El chip del transitorio sigue diciendo 'solo en esta conversacion' y sigue sin fecha ni cuenta regresiva (D-04 intacto)."
    pruebas_minimas:
      - "Un turno con un transitorio y un adjunto con cliente: los dos chips del hilo dicen su destino y los dos textos son los mismos que en el compositor."
      - "Guardar desde el chip del hilo y leer el chip repintado: nombra al cliente sin recargar la pagina."
    leccion_adicional: "Regla para TODO proyecto del estudio, y es la tercera vez que aparece (OLV-030, OLV-038/039, esta): cuando un defecto es 'la pantalla que relee sabe menos que la que escribe', el arreglo tiene que cerrar el DTO por la lista de lo que la pantalla MUESTRA, no por la lista de lo que la ACCION necesita. Al re-verificar, el chequeo barato es comparar el textContent del mismo registro en las dos superficies: si no coinciden palabra por palabra, el defecto se arreglo a medias. Un criterio de diseno con la forma 'X contra Y' se verifica por sus DOS lados; verificar solo X deja pasar la mitad.'"

  - id: OLV-040
    modulo: "Residuo de OLV-036: accion que mezcla un parametro de ruta opcional con un ViewModel (Documentos/Subir)"
    titulo: "Volver el parametro nullable arregla el valor VACIO pero no el valor que NO PARSEA: con clienteId=../../otro el ModelState vuelve a caer y el endpoint contesta otra vez 'Elegi un archivo' con el archivo adentro"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - QA M29 lote 1, 2026-10-02, commit 8fef7ae. POST /Documentos/Subir con un File real: clienteId='' -> 200 success:true (OLV-036 arreglado); clienteId='0'/'-1'/un id de otra organizacion -> 404 'El cliente no existe.' (correcto); clienteId='../../otro' -> 200 {success:false, message:'Elegi un archivo.'} con el File presente en el FormData."
    pasos:
      - "Abrir el workspace de documentos de un cliente y tomar el token antiforgery."
      - "POST /Documentos/Subir con un File real y clienteId con un valor que no parsea como int (por ejemplo '../../otro' o 'abc')."
      - "Control positivo en la misma tanda: el MISMO File con clienteId vacio (entra sin cliente) y con un clienteId valido (entra con cliente)."
    sintoma: "La respuesta culpa al archivo ('Elegi un archivo') cuando el archivo esta y lo que falla es el otro parametro. Es el mismo mensaje mentiroso de OLV-036, en el unico camino que el fix de OLV-036 no cubrio."
    expectativa: "Ningun camino de error devuelve el mensaje del archivo cuando el archivo esta presente: el mensaje nombra el parametro que fallo (es el criterio_aceptacion textual de OLV-036, que con este caso no se cumple del todo)."
    causa_raiz: "OLV-036 se cerro cambiando la firma a Subir(int? clienteId, ...), lo que resuelve el valor ausente/vacio porque el binder ya no falla. Pero un valor NO PARSEABLE sigue invalidando el ModelState, y la unica guarda de la accion (if (!ModelState.IsValid || model.Archivo is null)) sigue traduciendo TODO ModelState invalido al unico mensaje del ViewModel. El nullable cambia el conjunto de entradas que fallan, no el colapso de las dos validaciones en un mensaje."
    capa: Web
    archivos_fix:
      - path: src/<Proyecto>.Web/Controllers/DocumentosController.cs
        motivo: "Hipotesis: separar las dos validaciones. Si falla el parametro de ruta, contestar por ese parametro (o 400/404), y reservar 'Elegi un archivo' para el caso en que de verdad no hay archivo."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: http
      consulta: "Al re-verificar un fix que volvio NULLABLE un parametro, no alcanza con probar el valor vacio: hay que probar tambien un valor que NO PARSEA. El nullable mueve la frontera del binder, no elimina la rama de ModelState invalido, asi que el mensaje equivocado sobrevive en un camino mas angosto."
    criterio_aceptacion:
      - "POST /Documentos/Subir con un File presente y un clienteId no parseable NO devuelve 'Elegi un archivo'."
      - "Control positivo en la misma tanda: clienteId vacio entra sin cliente y un clienteId valido entra con cliente."
    pruebas_minimas:
      - "Los cuatro valores de clienteId en una sola tanda: '' (entra), valido (entra), '0' ('El cliente no existe'), no parseable (mensaje que nombre el parametro)."
    leccion_adicional: "El impacto real es bajo (un formulario del navegador nunca manda un clienteId no numerico y nada queda guardado), pero el criterio de aceptacion del defecto original decia 'NINGUN camino de error devuelve Elegi un archivo con el archivo presente' y ese criterio no se cumple. Un fix que cambia el tipo de un parametro cierra el caso que se reporto, no la clase de casos que el criterio nombraba: al re-verificar hay que releer el criterio, no el ticket."

  - id: LP-009
    modulo: "Caja / cierre mensual (CajaMovimientoService.RegistrarMovimientoManualAsync, GastoService.CrearAsync, VentaWorkflowService.ConfirmarAsync - guarda de periodo cerrado)"
    titulo: "Cerrado el mes, el sistema sigue aceptando movimientos fechados DENTRO de ese mes: la guarda de periodo cerrado solo consulta el cierre DIARIO y nunca el MENSUAL, asi que el total mensual congelado queda silenciosamente desactualizado"
    severidad: major
    reproducido_en: "La Platense - rama entrega-1-migracion, commit 628cb7a (Sprint 0 item 0.3 / D9), QA lote 1 del 2026-10-05. Reproducido por HTTP real contra una copia aislada de laplatense_dev (laplatense_qa_d9)."
    pasos:
      - "Cerrar la caja mensual de un mes ya terminado (POST /Caja/CerrarMes con anio/mes del mes anterior). Anotar los totales que quedan congelados."
      - "Elegir un dia de ESE mes que NO tenga cierre diario (ej. el 15)."
      - "POST /Caja/MovimientoManual con Fecha = ese dia, Tipo = Egreso, Monto = 3333.33."
      - "POST /Gastos/Create con Fecha = ese mismo dia y Monto = 4444.44."
      - "Volver a /Caja/Mensual?anio=A&mes=M y comparar lo que muestra la pantalla contra la suma real de CajaMovimientos del mes."
    sintoma: "Los dos movimientos se aceptan ('Movimiento de caja registrado correctamente.' / 'Gasto registrado correctamente.') y quedan persistidos dentro del mes cerrado. La pantalla de Caja mensual sigue mostrando los egresos congelados del cierre (en la reproduccion: 777,77) mientras el ledger del mes ya acumula 8.555,54. El mes cerrado queda mal por 7.777,77 y nada en la UI lo indica."
    expectativa: "Si un periodo esta cerrado, ningun camino de escritura puede postear dentro de el. La guarda tiene que ser simetrica al cierre que existe: antes de persistir un movimiento con fecha F hay que rechazar tanto si existe CierreCajaDiario(F) como si existe CierreCajaMensual(anio(F), mes(F)), con un mensaje que diga cual de los dos cierres lo bloquea. Alternativa aceptable si el negocio lo pide: permitir el posteo y RE-CALCULAR el cierre mensual afectado, pero nunca dejar el total congelado conviviendo con un ledger distinto."
    causa_raiz: "La guarda de periodo cerrado se implemento como ICajaMovimientoService.EstaCerradoAsync(diaDeNegocio), que resuelve CierresCajaDiarios.AnyAsync(c => c.Fecha == dia). El cierre mensual (CierresCajaMensuales) se agrego como una entidad y una pantalla propias, con su propio CerrarMesAsync, pero nunca se incorporo a la guarda de escritura: no existe un EstaCerradoElMesAsync ni una consulta equivalente en ninguno de los 3 call sites que preguntan por 'periodo cerrado'. El commit 628cb7a agrego a CerrarMesAsync la guarda de 'no cerrar el mes en curso' justificandola en que congelaria un mes incompleto y bloquearia el resto del mes; la mitad complementaria - que una vez cerrado el mes no se pueda postear dentro - no se agrego."
    capa: Application
    archivos_fix:
      - path: FerreteriaLaPlatense.Application/Interfaces/ICajaMovimientoService.cs
        motivo: "Agregar Task<bool> EstaCerradoElMesAsync(DateTime diaDeNegocio) (o extender EstaCerradoAsync para que devuelva cual cierre bloquea) con el mismo contrato de 'recibe un dia de negocio argentino'."
      - path: FerreteriaLaPlatense.Infrastructure/Services/CajaMovimientoService.cs
        motivo: "Implementarlo sobre CierresCajaMensuales usando ArgentinaTime (anio/mes del dia de negocio) y llamarlo desde RegistrarMovimientoManualAsync junto con EstaCerradoAsync."
      - path: FerreteriaLaPlatense.Infrastructure/Services/GastoService.cs
        motivo: "CrearAsync y AnularAsync: agregar la consulta del cierre mensual al lado de la del diario que ya tienen."
      - path: FerreteriaLaPlatense.Infrastructure/Services/VentaWorkflowService.cs
        motivo: "ConfirmarAsync: misma guarda, sobre el mes de negocio de ArgentinaTime.Hoy."
    migracion_ef: null
    deteccion_qa:
      tipo: api
      selector_o_endpoint: "POST /Caja/MovimientoManual y POST /Gastos/Create con una Fecha que caiga dentro de un mes con fila en CierresCajaMensuales y en un dia SIN fila en CierresCajaDiarios."
      condicion_falla: "La respuesta trae el mensaje de exito y aparece una fila nueva en CajaMovimientos con Fecha dentro del rango UTC del mes cerrado."
    criterio_aceptacion:
      - "Con el mes M cerrado, POST /Caja/MovimientoManual con Fecha dentro de M es RECHAZADO con un mensaje que nombra el cierre mensual, y no persiste ninguna fila."
      - "Con el mes M cerrado, POST /Gastos/Create con Fecha dentro de M es RECHAZADO y no persiste ni el Gasto ni su CajaMovimiento."
      - "Un dia de un mes NO cerrado y sin cierre diario sigue aceptando movimientos igual que hoy (control positivo)."
      - "Para todo cierre mensual guardado, TotalIngresos/TotalEgresos coinciden con la suma recalculada de CajaMovimientos del rango UTC de ese mes de negocio."
    pruebas_minimas:
      - "Los 3 caminos de escritura (ajuste manual, gasto, confirmar venta) contra un mes cerrado y contra un mes abierto, en la misma tanda."
      - "Query de consistencia cierre-guardado vs recalculo sobre CierresCajaDiarios y CierresCajaMensuales despues de la tanda."
    regla_preventiva: "Cuando un sistema tiene mas de un cierre de periodo sobre el MISMO ledger (diario y mensual), la guarda de escritura tiene que preguntar por TODOS los periodos que contienen la fecha, no por el mas chico. Agregar un cierre nuevo sin agregarlo a la guarda deja un periodo que se puede cerrar pero no se puede congelar. Misma familia que MH-035 y MH-038 (postear en un pasado que un cierre ya habia sellado) y que DN-004."

  - id: LP-010
    modulo: "Ventas / Index y busqueda global (VentaWorkflowService.ListarAsync + AplicarBusquedaGlobalAsync) vs Caja / Index (CajaMovimientoService.ListarAsync) - semantica de la columna Fecha"
    titulo: "La unificacion del dia de negocio (D9) cambio la semantica de CajaMovimiento.Fecha pero dejo Venta.Fecha con la vieja: el mismo hecho aparece fechado en dos dias distintos segun la pantalla por la que se entre"
    severidad: major
    reproducido_en: "La Platense - rama entrega-1-migracion, commit 628cb7a (Sprint 0 item 0.3 / D9), QA lote 1 del 2026-10-05. Reproducido por HTTP real contra laplatense_qa_d9 sobre la Venta 8 (Fecha = 2026-08-25 01:44:10 UTC = 24/08 22:44 ART) y un CajaMovimiento sembrado con el mismo tipo de instante."
    pasos:
      - "Tener una Venta cuyo Fecha (instante UTC) caiga entre las 00:00 y las 03:00 UTC, es decir entre las 21:00 y las 24:00 del dia argentino ANTERIOR (ej. 2026-08-25 01:44:10 UTC = 24/08/2026 22:44 ART)."
      - "POST /Ventas/Listar con fechaDesde=fechaHasta=2026-08-24. Mirar recordsFiltered."
      - "POST /Ventas/Listar con fechaDesde=fechaHasta=2026-08-25. Mirar recordsFiltered y el valor del campo fecha del JSON."
      - "POST /Caja/Listar con fechaDesde=fechaHasta del dia argentino real, sobre un CajaMovimiento con un instante UTC equivalente."
    sintoma: "Ventas/Listar con el rango 24/08..24/08 devuelve recordsFiltered=0 y con 25/08..25/08 devuelve la venta, con fecha '2026-08-25T01:44:10.778381' (la grilla la dibuja como 25/08/2026 01:44). La busqueda global por fecha tipeada se comporta igual: '24/08/2026' -> 0, '25/08/2026' -> 1. Caja/Listar, en cambio, proyecta el instante a hora Argentina y devuelve el movimiento equivalente en el rango del dia argentino real. El operador ve la misma venta de las 22:44 del 24 como 'del 25' en Ventas y como 'del 24' en Caja, y el arqueo del 24 incluye una plata que el listado de Ventas no muestra ese dia."
    expectativa: "Una vez que el sistema define un dia de negocio unico (ArgentinaTime.DiaDeNegocio), TODA columna que sea un instante UTC y se muestre o se filtre como fecha tiene que proyectarse a ese dia de negocio: Venta.Fecha, PagoVenta.Fecha y MovimientoCCCliente.Fecha igual que CajaMovimiento.Fecha. El filtro de rango y la busqueda global tienen que comparar contra ArgentinaTime.RangoDiasUtc(desde, hasta), y la proyeccion del DTO tiene que pasar por ArgentinaTime.From antes de serializar."
    causa_raiz: "El barrido LP-002 del commit cubrio Caja, Gastos, Entregas, Dashboard, la vigencia de oferta y los defaults de DTOs/ViewModels, pero no toco VentaWorkflowService.ListarAsync (lineas 77-78: v.Fecha >= fechaDesde.Value.Date y v.Fecha < fechaHasta.Value.Date.AddDays(1) sobre una columna UTC) ni la proyeccion del DTO (Fecha = v.Fecha, sin ArgentinaTime.From), ni el bloque de fecha de AplicarBusquedaGlobalAsync, cuyo XML-doc incluso declara el criterio viejo como intencional: 'se compara Year/Month/Day de la columna tal cual esta guardada, que es exactamente el valor que muestra la grilla'. Antes de D9 las dos pantallas eran igual de crudas y coincidian; despues de D9 Caja se movio y Ventas no, asi que la incoherencia es nueva aunque el codigo de Ventas no haya cambiado."
    capa: Application
    archivos_fix:
      - path: FerreteriaLaPlatense.Infrastructure/Services/VentaWorkflowService.cs
        motivo: "ListarAsync: usar ArgentinaTime.RangoDiasUtc para fechaDesde/fechaHasta y proyectar Fecha = ArgentinaTime.From(v.Fecha) materializando antes (mismo patron que CajaMovimientoService.ListarAsync). AplicarBusquedaGlobalAsync: reemplazar la comparacion Year/Month/Day por ArgentinaTime.RangoDiaUtc(fecha) y corregir el XML-doc que declara el criterio viejo (LP-008)."
    migracion_ef: null
    deteccion_qa:
      tipo: api
      selector_o_endpoint: "POST /Ventas/Listar con fechaDesde=fechaHasta=<dia argentino> sobre una venta con Fecha UTC entre 00:00 y 03:00; y POST /Caja/Listar con el mismo dia."
      condicion_falla: "El dia argentino real devuelve 0 en Ventas y el dia UTC devuelve 1, o el campo fecha del JSON de Ventas trae la hora UTC sin proyectar."
    criterio_aceptacion:
      - "POST /Ventas/Listar con fechaDesde=fechaHasta=2026-08-24 devuelve la Venta 8, y con 2026-08-25 NO la devuelve."
      - "El campo fecha del JSON de /Ventas/Listar para la Venta 8 es 2026-08-24T22:44:10 (hora Argentina), no 2026-08-25T01:44:10."
      - "La busqueda global de Ventas por '24/08/2026' encuentra la Venta 8 y por '25/08/2026' no."
      - "Para un mismo hecho, el dia que muestra Ventas/Index y el dia que muestra Caja/Index coinciden."
    pruebas_minimas:
      - "Rango de un dia y busqueda global por fecha tipeada, sobre una venta nocturna, en Ventas y en Caja en la misma tanda."
      - "Regresion: ordenamiento por la columna Fecha del listado de Ventas sigue funcionando despues de materializar la pagina."
    regla_preventiva: "Unificar una semantica de fecha en un lugar la DESUNIFICA de todos los demas que no se tocaron. Cuando un sprint cambia como se interpreta una columna de fecha, el barrido LP-002 no es 'los sitios que leen esa columna' sino 'todas las columnas del sistema que representan el mismo concepto de negocio' - aca, todo instante UTC que el usuario lee como un dia. Si alguna se deja atras hay que dejarlo escrito como deuda explicita, porque el sintoma (dos pantallas con dos dias para el mismo hecho) es mas confuso para el usuario que el bug original."

  - id: LP-011
    modulo: "Caja mensual / CajaController.Mensual + ArgentinaTime.RangoMesUtc"
    titulo: "Un mes fuera de rango en la query string tira HTTP 500 en ArgentinaTime.RangoMesUtc, y el redirect de CerrarMes pasa por ahi: el mensaje de mes invalido que la guarda nueva produce es codigo muerto"
    severidad: minor
    reproducido_en: "La Platense - rama entrega-1-migracion, commit 628cb7a, QA lote 1 del 2026-10-05. Reproducido por HTTP real contra laplatense_qa_d9; stack capturado en Logs/LaPlatense-errors-dev-20261005_001.log."
    pasos:
      - "GET /Caja/Mensual?anio=2026&mes=13 -> HTTP 500."
      - "GET /Caja/Mensual?anio=0&mes=0 -> HTTP 500."
      - "POST /Caja/CerrarMes con anio=2026&mes=13 -> la guarda devuelve el error, el controller hace RedirectToAction(Mensual, new { anio, mes }) y el GET siguiente es el 500."
    sintoma: "Pantalla de error en vez del mensaje de validacion. System.ArgumentOutOfRangeException: 'Year, Month, and Day parameters describe an un-representable DateTime.' en ArgentinaTime.RangoMesUtc (new DateTime(anio, mes, 1)), llamada desde CajaMovimientoService.ObtenerTotalesMesAsync -> ObtenerResumenMesAsync -> CajaController.Mensual."
    expectativa: "Un anio/mes fuera de rango en la query string o en el POST tiene que resolverse con un mensaje de validacion o con un fallback al mes de negocio actual, nunca con un 500. La guarda que el commit agrego en CerrarMesAsync tiene que ser alcanzable: hoy el usuario nunca la ve porque el redirect posterior explota antes."
    causa_raiz: "CerrarMesAsync valida anio < 2000 || mes < 1 || mes > 12 y devuelve el error, pero CajaController.CerrarMes hace el redirect con los MISMOS valores crudos, y CajaController.Mensual los pasa sin validar a ObtenerResumenMesAsync, que ahora los deriva a ArgentinaTime.RangoMesUtc. La excepcion no es nueva del commit (ObtenerResumenMesAsync ya hacia new DateTime(anio, mes, 1) inline), pero la guarda que el commit agrego quedo inutil por este camino, asi que el defecto es de este lote."
    capa: Web
    archivos_fix:
      - path: FerreteriaLaPlatense.Web/Controllers/CajaController.cs
        motivo: "Mensual: validar anio/mes antes de llamar al servicio (rango 2000..2100 y 1..12) y caer al mes de negocio actual con un mensaje, en vez de pasar los valores crudos. CerrarMes: no redirigir con un anio/mes invalido."
      - path: FerreteriaLaPlatense.Application/Helpers/ArgentinaTime.cs
        motivo: "Opcional (defensa en profundidad): RangoMesUtc puede validar sus argumentos y tirar ArgumentOutOfRangeException con el nombre del parametro, en vez de dejar que explote el constructor de DateTime."
    migracion_ef: null
    deteccion_qa:
      tipo: api
      selector_o_endpoint: "GET /Caja/Mensual?anio=2026&mes=13 y GET /Caja/Mensual?anio=0&mes=0."
      condicion_falla: "HTTP 500 en vez de 200 con un mensaje de validacion."
    criterio_aceptacion:
      - "GET /Caja/Mensual?anio=2026&mes=13 devuelve 200 con un mensaje de mes invalido (o el mes actual), no 500."
      - "GET /Caja/Mensual?anio=0&mes=0 devuelve 200, no 500."
      - "POST /Caja/CerrarMes con mes=13 deja visible el mensaje de mes invalido en pantalla."
      - "GET /Caja/Mensual sin parametros y con un mes valido siguen funcionando igual que hoy."
    pruebas_minimas:
      - "mes = 0, 13, -1 y anio = 0, 1899, 9999 por query string y por POST, en una sola tanda."
    regla_preventiva: "Una guarda de validacion en el servicio no sirve si el controller redirige despues con los mismos valores invalidos: el camino de error tiene que terminar en una pantalla que sepa renderizarse con esos valores. Al agregar una validacion, probar el camino COMPLETO (POST + redirect + GET), no solo el retorno del servicio."

  - id: LP-012
    modulo: "Caja / Cierres diarios y Cierres mensuales (Views/Caja/Cierres.cshtml, Views/Caja/Mensual.cshtml + CajaMovimientoService.ListarCierresDiariosAsync / ListarCierresMensualesAsync)"
    titulo: "Los dos listados de cierres renderizan la caja de busqueda de DataTables pero el servidor ignora search[value]: tipear en el buscador no filtra nada y la grilla no avisa"
    severidad: minor
    reproducido_en: "La Platense - rama entrega-1-migracion, commit 628cb7a, QA lote 1 del 2026-10-05. Reproducido por HTTP real contra laplatense_qa_d9."
    pasos:
      - "POST /Caja/CierresListar con search[value]=24/08/2026 sobre una base con 3 cierres diarios de dias distintos."
      - "Idem POST /Caja/MensualListar con search[value]=24/08/2026."
    sintoma: "recordsFiltered=3 para cualquier termino tipeado (24/08/2026, 25/08/2026, 30/09/2026): devuelve siempre todas las filas. La vista inicializa el DataTable con serverSide:true y sin searching:false, asi que el input de busqueda se dibuja y el usuario cree que filtra."
    expectativa: "O el listado implementa la busqueda global igual que los 6 listados de PAT-016 (fecha visible, importes, nombre del usuario que cerro), o la vista pasa searching: false para no dibujar un control que no hace nada. Un buscador que no busca es peor que no tenerlo."
    causa_raiz: "ListarCierresDiariosAsync y ListarCierresMensualesAsync no tienen ningun AplicarBusquedaGlobalAsync: totalFiltrado = await query.CountAsync() donde query solo arrastra los filtros de fecha/anio. Los dos listados quedaron fuera del alcance de PAT-016 (que cubrio Productos, Clientes, Ventas, Caja, Gastos y Entregas) y la vista no se ajusto para reflejarlo."
    capa: Application
    archivos_fix:
      - path: FerreteriaLaPlatense.Infrastructure/Services/CajaMovimientoService.cs
        motivo: "Agregar busqueda global a ListarCierresDiariosAsync y ListarCierresMensualesAsync (fecha tipeada por rango, importes con BusquedaHelper, nombre del usuario) con el mismo patron de extraIds que ya usa ListarAsync."
      - path: FerreteriaLaPlatense.Web/Views/Caja/Cierres.cshtml
        motivo: "Alternativa minima si la busqueda no entra en el alcance: searching: false en la inicializacion del DataTable."
      - path: FerreteriaLaPlatense.Web/Views/Caja/Mensual.cshtml
        motivo: "Idem."
    migracion_ef: null
    deteccion_qa:
      tipo: api
      selector_o_endpoint: "POST /Caja/CierresListar y /Caja/MensualListar con search[value] no vacio."
      condicion_falla: "recordsFiltered es igual al total sin filtro para cualquier termino, y la vista no pasa searching:false."
    criterio_aceptacion:
      - "O POST /Caja/CierresListar con search[value]=<una fecha visible> devuelve solo las filas de ese dia, o la vista no dibuja el input de busqueda."
      - "Mismo criterio para /Caja/MensualListar."
      - "Los filtros de rango de fecha y de anio que ya funcionan siguen funcionando."
    pruebas_minimas:
      - "Un termino que coincide con una sola fila, uno que no coincide con ninguna, y vacio, en los dos listados."
    regla_preventiva: "Recurrencia de la familia MH-015 / MH-018 / ELV-006: un control que DataTables dibuja por defecto (buscador, encabezado ordenable) es una promesa de comportamiento. Si el server-side no la implementa, hay que apagar el control en la vista. Al auditar un listado server-side, revisar las 3 capacidades por defecto - buscar, ordenar por cada columna y paginar - contra lo que el servicio realmente soporta."
