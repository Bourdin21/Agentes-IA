  - id: ELV-001
    modulo: "Autorizacion global / Controllers del nucleo operativo (Alquileres, Contratos, Clientes, Maquinas, Incidencias, Pedidos, Articulos, Marcas, Modelos, Proveedores, Estanterias, Subcategorias)"
    titulo: "13 controllers sin [Authorize] y sin FallbackPolicy: un usuario NO autenticado lee y ESCRIBE datos del negocio"
    severidad: blocker
    reproducido_en: "dev (commit 3a86787 + fix H1 sin commitear) — reproducido 2026-08-20 contra clon local eleven_qa"
    pasos:
      - "Levantar la app y NO iniciar sesion (sin cookie de Identity)."
      - "GET /Alquileres -> responde 200 y renderiza la grilla completa."
      - "POST /Alquileres/GetDataTable con body {\"draw\":1,\"start\":0,\"length\":3} -> devuelve JSON con los 459 alquileres (cliente, ubicacion, contacto, contadores)."
      - "GET /Alquileres/Edit/{id} -> 200 con el formulario poblado y un __RequestVerificationToken valido."
      - "POST /Alquileres/Edit con ese token y los campos del form -> 302 al Index y el registro QUEDA MODIFICADO en base."
      - "Contraste: GET /Cuentas (controller que SI tiene [Authorize]) -> 302 al login."
    sintoma: "Cualquiera con acceso de red al sitio lista, abre y modifica alquileres, contratos, clientes y maquinas sin autenticarse. El registro modificado queda con UpdatedByUserId = NULL (sin atribucion en el audit trail)."
    expectativa: "Todo controller del nucleo operativo exige usuario autenticado; el anonimo recibe 302 al login (o 403). Solo Home (landing) y Account/Login quedan anonimos."
    causa_raiz: "Ningun [Authorize] a nivel clase en esos 13 controllers y AddAuthorization() en Program.cs define policies con nombre (RequireSuperUsuario / RequireAdministracion) pero NO define options.FallbackPolicy. Sin fallback, ASP.NET Core deja la accion abierta por defecto. La app se ve segura porque el sidebar no muestra los links al anonimo, pero las rutas responden igual si se las pide directo."
    capa: Web
    archivos_fix:
      - path: Eleven.Web/Program.cs
        motivo: "En AddAuthorization: definir options.FallbackPolicy = new AuthorizationPolicyBuilder().RequireAuthenticatedUser().Build(); (cierra por defecto TODO lo no marcado)."
      - path: Eleven.Web/Controllers/HomeController.cs
        motivo: "[AllowAnonymous] en la landing publica para que el fallback no la rompa."
      - path: Eleven.Web/Controllers/AccountController.cs
        motivo: "Verificar que Login/AccessDenied conserven [AllowAnonymous] bajo el fallback."
      - path: "Eleven.Web/Controllers/*.cs (los 13 sin guard)"
        motivo: "Ademas del fallback, declarar el [Authorize(Policy=...)] que corresponda por rol — REQUIERE DECISION FUNCIONAL previa de que rol accede a que modulo (Administrador vs Tecnico)."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /Alquileres y POST /Alquileres/GetDataTable sin cookie de sesion"
      condicion_falla: "Cualquier ruta del nucleo operativo devuelve 200 (en vez de 302/403) a un request sin autenticar, o un POST anonimo persiste cambios en base."
    criterio_aceptacion:
      - "Anonimo: GET /Alquileres, /Contratos, /Clientes, /Maquinas -> 302 al login."
      - "Anonimo: POST /Alquileres/GetDataTable -> 302/401, nunca JSON con datos."
      - "Anonimo: POST /Alquileres/Edit -> no persiste ningun cambio."
      - "Autenticado con rol valido: todas esas rutas siguen respondiendo 200 (sin regresion)."
      - "Home (landing) y Account/Login siguen accesibles sin sesion."
    pruebas_minimas:
