  - id: OLV-019
    modulo: "Cualquier valor de enum que el producto decide 'dejar de ofrecer al crear' manteniendo los registros viejos"
    titulo: "La baja del valor se implementa solo en el combo de la vista: un POST armado a mano lo sigue creando"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - commit 05d6ba7 (M14), POST a /Reglas/Create con Tipo=Procedimiento y el antiforgery real de la pagina. Reproducido por navegador (Playwright MCP) como Directora."
