  - id: MH-003
    modulo: "Compras / Pago de OC con cheque (PagoOrdenCompraService.RegistrarPagoAsync)"
    titulo: "Fecha de emision del cheque acepta una fecha futura via POST directo: el date picker restringe max=hoy solo en el cliente, sin revalidacion server-side equivalente"
    severidad: minor
    reproducido_en: "marihogar - master (working tree, Sprint CR-A / CR-2), confirmado por revision de codigo el 2026-07-27, no reproducido en navegador (regla de proceso: QA no automatiza UI)"
    pasos:
      - "Como Administrador, ir a OrdenesCompra/Details de una OC Confirmada o Recibida -> Registrar pago -> elegir Cheque."
      - "Sin usar el date picker (que restringe max=hoy), hacer POST directo a /OrdenesCompra/RegistrarPago/{id} con pagosJson conteniendo un pago Cheque cuyo fechaEmisionCheque sea una fecha futura (ej. hoy + 30 dias) y fechaVencimientoCheque coherente (posterior a la emision)."
      - "Observar la respuesta y, si tuvo exito, el registro persistido en Cheques."
    sintoma: "El pago se registra sin error: PagoOrdenCompraService.RegistrarPagoAsync valida FechaVencimientoCheque >= hoy y FechaEmisionCheque <= FechaVencimientoCheque, pero no valida FechaEmisionCheque <= hoy. El cheque queda persistido con una fecha de emision en el futuro, dato incoherente con un cheque fisico real (no se puede emitir un cheque que todavia no existe)."
    expectativa: "La fecha de emision de un cheque, al representar un documento fisico ya entregado por el proveedor/pagado por el local, nunca puede ser posterior a la fecha en la que se registra el pago (hoy) — mismo criterio que ya exige el date picker del formulario (max=hoy, OrdenesCompra/Details.cshtml, input .inp-cheque-emision)."
    causa_raiz: "El guard server-side de PagoOrdenCompraService.RegistrarPagoAsync (agregado en CR-2 junto con el resto de la validacion de FechaEmisionCheque) revalido 'obligatorio' y 'no posterior al vencimiento', pero no replico la cota 'no posterior a hoy' que el input HTML5 (type=date, max=...) ya aplica del lado cliente — violando el principio explicito del propio diseño del proyecto ('revalidacion server-side obligatoria antes de persistir, nunca confiar solo en client-side', 2-disenador-funcional.md seccion 'Validaciones de UI acordadas')."
