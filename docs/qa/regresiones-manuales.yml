  - id: ELV-001
    modulo: "Autorizacion global / Controllers del nucleo operativo (Alquileres, Contratos, Clientes, Maquinas, Incidencias, Pedidos, Articulos, Marcas, Modelos, Proveedores, Estanterias, Subcategorias)"
    titulo: "13 controllers sin [Authorize] y sin FallbackPolicy: un usuario NO autenticado lee y ESCRIBE datos del negocio"
    severidad: blocker
    reproducido_en: "dev (commit 3a86787 + fix H1 sin commitear) — reproducido 2026-08-20 contra clon local eleven_qa"
    pasos:
      - "Levantar la app y NO iniciar sesion (sin cookie de Identity)."
      - "GET /Alquileres -> responde 200 y renderiza la grilla completa."
      - "POST /Alquileres/GetDataTable con body {\"draw\":1,\"start\":0,\"length\":3} -> devuelve JSON con los 459 alquileres (cliente, ubicacion, contacto, contadores)."
      - "GET /Alquileres/Edit/{id} -> 200 con el formulario poblado y un __RequestVerificationToken valido."
      - "POST /Alquileres/Edit con ese token y los campos del form -> 302 al Index y el registro QUEDA MODIFICADO en base."
      - "Contraste: GET /Cuentas (controller que SI tiene [Authorize]) -> 302 al login."
    sintoma: "Cualquiera con acceso de red al sitio lista, abre y modifica alquileres, contratos, clientes y maquinas sin autenticarse. El registro modificado queda con UpdatedByUserId = NULL (sin atribucion en el audit trail)."
