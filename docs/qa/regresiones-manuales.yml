    expectativa: "La fila no vista se ve mas fuerte que la vista."
    causa_raiz: "'fw-semibold' es una utilidad que Bootstrap agrego en 5.3; el design system del proyecto sirve una compilacion que no la incluye. Se usa en decenas de vistas del repo y en todas es inerte: nadie lo noto porque en el resto de los casos es decorativa, no el unico diferenciador de un estado."
