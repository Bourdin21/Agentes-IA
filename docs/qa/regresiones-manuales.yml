    expectativa: "Combos, desplegables y calendario usan los tokens oscuros (--ov-surface, --ov-border, --ov-text) igual que .form-control/.form-select."
    causa_raiz: "olvidata-theme.css redefine en [data-theme=dark] solo .form-control/.form-select. Select2 oculta el <select> y dibuja su propio .select2-selection/.select2-dropdown con los colores fijos de select2-bootstrap-5-theme; daterangepicker igual con .daterangepicker. Al pasar Select2 a TODO select (regla 25) el hueco se hizo visible en todas las pantallas."
