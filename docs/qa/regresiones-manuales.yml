    archivos_fix:
      - path: src/<Proyecto>.Web/Helpers/ConfiguradorTextos.cs
        motivo: "Hipotesis: sumar la rama del alcance personal ('Solo en tus tareas' o equivalente). Conviene que el descarte final diga que el alcance falta, y no una raya que se lee como 'ninguno'."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: navegador
      consulta: "Renderizar una tarjeta por cada valor del enum de alcance y leer la linea del rotulo."
      condicion_falla: "Algun valor que el sistema puede proponer cae en el descarte."
    criterio_aceptacion:
