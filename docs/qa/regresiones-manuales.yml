          motivo: "Mismo patron — AplicarOrden(IQueryable<IndustriaCatalogo>) sobre Nombre/SistemaReferencia/Plan/PrecioBaseUsd/CotizaAutomatico/Orden, fallback OrderBy(Orden) igual al comportamiento anterior."
