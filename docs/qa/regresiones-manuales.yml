      - "Arrancar una conversacion con 'Revisa mis reglas actuales' y abrir 'Ver pasos'."
    sintoma: "El paso fallido dice 'No pudo registrar la propuesta: la propuesta no cambia nada de la regla. Indica el titulo, el texto, el modo, el tipo o las etiquetas nuevos.' El envoltorio esta bien redactado, pero lo que sigue a los dos puntos es el mensaje que la herramienta le devuelve AL MODELO: imperativo dirigido al agente. Otros mensajes de la misma familia, alcanzables con el modelo real, llegan peor: 'Esa persona no esta activa en la organizacion. Consulta equipo_listar.', 'El area indicada no existe en la organizacion. Consulta estructura_empresa.', 'El cliente indicado no existe en la organizacion. Buscalo con clientes_buscar.', 'No modifica la regla. Leela antes con regla_obtener.', 'Alcance desconocido. Usa empresa, area, agente, cliente, cliente_agente o mis_preferencias.', 'Indica regla_id.' Son 14 mensajes que nombran una herramienta o vuelcan un codigo crudo de alcance/modo."
    expectativa: "Lo que lee la persona en 'Ver pasos' nunca nombra una herramienta ni un codigo interno, tampoco en la rama de error. El mensaje para el modelo y el mensaje para la persona son dos textos distintos."
    causa_raiz: "En la rama de error, ResumenHerramientasConfigurador.Resultado y ResumenHerramientasAsistente.Resultado hacen Error($\"No pudo ...: {motivo}\") con motivo = MinusculaInicial(resultado.Trim()), donde 'resultado' es el string que la herramienta devolvio al modelo. El camino feliz si tiene rotulos redactados aparte; la rama de error no."
    capa: Infrastructure
    archivos_fix:
      - path: src/OlvidataAgentes.Infrastructure/Services/Configurador/ResumenHerramientasConfigurador.cs
        motivo: "La rama esError no debe volcar el texto para el modelo. Opciones: (a) que el fallo lleve dos mensajes (uno para el modelo, uno para la persona) y el rotulo use el segundo; (b) una lista blanca de motivos publicables y un generico para el resto."
      - path: src/OlvidataAgentes.Infrastructure/Services/Asistente/ResumenHerramientasAsistente.cs
        motivo: "Idem para las 5 herramientas de M7b."
      - path: src/OlvidataAgentes.Application/DTOs/AsignacionesDtos.cs
        motivo: "MensajesAsistente.PersonaNoExiste / AgenteNoExiste / ClienteNoExiste nombran la herramienta a consultar: separar el texto para el modelo del texto para la persona."
      - path: src/OlvidataAgentes.Infrastructure/Services/Configurador/HerramientasConfigurador.cs
        motivo: "Mismos mensajes, para las 9 herramientas de M4b."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /Tareas/Detalle/{id} de una conversacion de plataforma con al menos un paso fallido; abrir 'Ver pasos' y leer el texto del paso en error"
      condicion_falla: "El texto visible de un paso fallido contiene un nombre de herramienta en snake_case (equipo_listar, estructura_empresa, clientes_buscar, regla_obtener, agentes_disponibles) o un codigo crudo (cliente_agente, salvo_indicacion, mis_preferencias, regla_id, sugerencia_id, area_id)."
    criterio_aceptacion:
      - "Un paso fallido de cualquier herramienta de plataforma se lee sin un solo snake_case ni codigo interno."
      - "El camino feliz no cambia."
      - "Si no hay un texto para la persona, el rotulo cae en un generico honesto en vez de volcar el del modelo."
    pruebas_minimas:
      - "Navegador: el disparador determinista de los pasos (titulo de 150 caracteres terminado en ' (ajustada)') y verificar que el paso fallido no tiene snake_case."
      - "Regex sobre el innerText de la zona de pasos: /\b[a-z]{3,}_[a-z_]{2,}\b/ debe dar 0 coincidencias, igual que en el camino feliz."
      - "Barrido de los mensajes de error de las herramientas: ninguno que pueda llegar a pantalla nombra una herramienta."
    nota_generalizacion: "Aplica a TODO proyecto del estudio donde una herramienta de un agente devuelve un string que se le muestra a la persona. Regla: un mensaje de error de herramienta tiene DOS lectores (el modelo, que necesita saber que herramienta usar para arreglarlo, y la persona, que no tiene que enterarse de que existen herramientas) y por lo tanto necesita DOS textos. Cuando se redactan rotulos llanos para 'lo que hizo el agente', el camino feliz se redacta con cuidado y la rama de error se resuelve con una interpolacion del mensaje crudo: hay que revisar la rama de error con el mismo criterio. En QA: no alcanza con verificar el camino feliz, hay que forzar al menos un fallo de herramienta y mirar el rotulo."

  - id: OLV-015
    modulo: "Cualquier flujo donde una pantalla ofrece un boton 'convertir/derivar esto' hacia una accion de otro controller"
    titulo: "Dos guardas mutuamente excluyentes sobre el mismo flujo: el boton solo se muestra cuando la condicion es X y la accion de destino solo acepta NO-X, asi que el boton siempre da 404"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - commit 05d6ba7 (M14), olvidata_agentes_dev, portal local en Development con modelo simulado. Reproducido por navegador (Playwright MCP) como Directora de la org 19."
    pasos:
      - "Guardar una regla de tipo 'Regla' cuyo texto tenga pasos numerados (dispara la deteccion blanda de D-M14-6)."
      - "En el aviso que aparece despues de guardar, apretar 'Convertirlo en instructivo'."
    sintoma: "Se navega a /Instructivos/Crear?convertirRegla={id} y la pantalla es un 404 'Pagina no encontrada'. El unico dispositivo que el diseno puso para reencauzar un procedimiento cargado como regla no funciona nunca, y ademas la persona termina en una pagina de error."
    expectativa: "El boton que la pantalla muestra lleva a un formulario precargado. Si la accion de destino no puede atender ese caso, el boton no se muestra."
    causa_raiz: "ReglasController.AvisarSiPareceInstructivo hace 'if (model.Tipo != TipoRegla.Regla) return;' â€” solo pone el aviso para reglas de tipo Regla. InstructivoService.ReglaConvertibleAsync hace 'if (regla.Tipo != TipoRegla.Procedimiento) return NotFound()' â€” solo acepta reglas de tipo Procedimiento. Las dos condiciones no se pueden cumplir a la vez. El camino desde el detalle de una regla que YA es Procedimiento si funciona, y es el que se probo durante la implementacion; el de la deteccion blanda no se probo."
    capa: Infrastructure
    archivos_fix:
      - path: src/OlvidataAgentes.Infrastructure/Services/Instructivos/InstructivoService.cs
        motivo: "ReglaConvertibleAsync tiene que aceptar tambien Tipo == Regla (es el caso de la deteccion blanda). El resto de las guardas â€”organizacion, permiso, alcance propioâ€” no cambian."
      - path: src/OlvidataAgentes.Application/DTOs/InstructivosDtos.cs
        motivo: "MensajesInstructivos.ConvertidoDesdeRegla dice 'la regla de tipo procedimiento se desactivo': hace falta una variante para una regla comun, o una redaccion que sirva para las dos. Es decision de redaccion, por eso el fix no se auto-aplica."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "Todo enlace que una vista renderiza dentro de un aviso condicional y que apunta a una accion de OTRO controller que vuelve a resolver la entidad contra la base"
      condicion_falla: "La condicion que decide mostrar el enlace y la condicion que la accion de destino exige sobre la misma entidad son distintas (o contradictorias). Se detecta en codigo comparando las dos guardas, y por navegador haciendo clic en el boton y viendo un 404/403."
    criterio_aceptacion:
      - "Todo boton visible lleva a una pantalla que carga; ningun camino nuevo termina en 404."
      - "Las dos guardas (la que muestra el boton y la que atiende la accion) se leen juntas y son compatibles."
    pruebas_minimas:
      - "Navegador: disparar el aviso y hacer clic en su boton; tiene que abrir el formulario precargado."
      - "Navegador: el camino que ya funcionaba (desde el detalle de una entidad que ya cumple la condicion) sigue funcionando."
    nota_generalizacion: "Regla para QA: cuando el diseno define un dispositivo con un boton ('esto parece X, converti'), no alcanza con verificar que el aviso aparece â€” hay que APRETAR el boton. Y regla para el implementador: cuando una accion de destino revalida la entidad contra la base, la guarda de la accion y la guarda que decide mostrar el enlace tienen que escribirse en el mismo momento, mirando las dos."

  - id: OLV-016
    modulo: "Cualquier aviso 'blando' que el diseno pide mostrar AL GUARDAR (sugerencias, 'esto parece otra cosa', 'te conviene usar X')"
    titulo: "El aviso posterior al guardado se calcula solo en la rama de validacion fallida, asi que en el camino normal (guardado exitoso con redirect) no aparece nunca"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - commit 05d6ba7 (M14), olvidata_agentes_dev, portal local en Development. Reproducido por navegador (Playwright MCP)."
    pasos:
      - "Crear un instructivo cuyos 'pasos' sean una sola oracion sin numerar (el caso que D-M14-6 quiere detectar)."
      - "Guardar."
    sintoma: "Se redirige al detalle sin ningun aviso. El texto 'Esto parece una regla: algo que vale siempre, no los pasos de una tarea.' existe y esta bien redactado, pero solo se ve si despues se vuelve a abrir la pantalla de Editar. El dispositivo es invisible justo en el momento en que se comete el error."
    expectativa: "El aviso aparece al guardar, sobre el resultado del guardado, y nunca bloquea."
    causa_raiz: "La bandera del aviso (InstructivoFormViewModel.PareceRegla) se setea en CompletarAsync, que el controller llama solo cuando ModelState es invalido o al abrir Editar. El POST exitoso hace RedirectToAction y se saltea el calculo. El lado simetrico (la deteccion sobre una REGLA) si esta bien resuelto: TempData sobrevive el redirect y un partial lo pinta en el destino."
    capa: Web
    archivos_fix:
      - path: src/OlvidataAgentes.Web/Controllers/InstructivosController.cs
        motivo: "Tras un Crear/Editar exitoso, dejar la marca en TempData igual que ReglasController.AvisarSiPareceInstructivo, para que sobreviva el redirect."
      - path: src/OlvidataAgentes.Web/Views/Instructivos/Detalle.cshtml
        motivo: "Pintar el aviso en el destino del redirect. Donde va exactamente y que ofrece el boton (hoy 'Cargarlo como regla' manda a un formulario VACIO y se pierde el texto escrito) es decision de diseno: por eso el fix no se auto-aplica."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "POST de alta/edicion que termina en RedirectToAction y cuya vista tiene un aviso condicional alimentado por una propiedad del ViewModel"
      condicion_falla: "La propiedad que enciende el aviso se calcula en un metodo que solo corre cuando ModelState es invalido. Se confirma por navegador: guardar el caso que deberia disparar el aviso y no verlo."
    criterio_aceptacion:
      - "Guardando el caso que el diseno describe, el aviso se ve sin tener que reabrir la pantalla."
      - "El aviso nunca bloquea: la entidad ya quedo guardada."
    pruebas_minimas:
      - "Navegador: guardar el caso limite y verificar el aviso en la pantalla de destino."
      - "Navegador: guardar un caso normal y verificar que el aviso NO aparece."
    nota_generalizacion: "Regla para QA: un aviso que el diseno pide 'al guardar' se prueba guardando, no abriendo el formulario. Regla para el implementador: el estado que tiene que sobrevivir a un redirect va en TempData, no en el ViewModel; si en el mismo modulo hay un caso simetrico ya resuelto con TempData, hay que copiarlo."

