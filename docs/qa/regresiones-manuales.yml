      selector_o_endpoint: "Comparar las guardas de entrada de CreateAsync vs UpdateAsync en cualquier *Service con ambos caminos."
      condicion_falla: "Existe una validacion de invariante al inicio de CreateAsync que no tiene equivalente en UpdateAsync del mismo servicio."
