  # ── Entradas especificas del proyecto marihogar (BlankProject .NET 10 + EF Core + MySQL 8) ─────

  - id: MH-001
    modulo: "Stock / GetData (listado de movimientos, IN de coleccion local)"
    titulo: "500 en listado de movimientos de stock al resolver nombres de usuario: el provider MySQL de EF Core 10 no soporta un IN generado desde una coleccion local (Contains sobre HashSet<string>)"
    severidad: major
    reproducido_en: "marihogar - master, Sprint 1 (M3 Control de stock), smoke test funcional real del implementador contra marihogar_dev (MySQL local), confirmado y catalogado por QA el 2026-07-24"
    pasos:
      - "Como Administrador, ir a Stock -> Index (listado de movimientos) con al menos un movimiento registrado por un usuario (UsuarioId no nulo)."
      - "Observar la respuesta del POST /Stock/GetData."
    sintoma: "InvalidOperationException: Expression '@usuarioIds' in the SQL tree does not have a type mapping assigned, lanzada por StockService.ListarMovimientosAsync al intentar '_db.Users.Where(u => usuarioIds.Contains(u.Id))' con usuarioIds como HashSet<string> local."
    expectativa: "El listado de movimientos de stock resuelve el nombre de usuario de cada movimiento sin error, incluso contra MySQL con EF Core 10."
    causa_raiz: "El provider MySQL de EF Core 10 no puede asignar type mapping a un parametro IN generado a partir de una coleccion local (List/HashSet) dentro de un Where(...Contains(...)). Mismo patron ya presente y ya resuelto en UsersController.GetData del propio proyecto (comentario preexistente en el codigo), no reutilizado la primera vez que se escribio StockService."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/StockService.cs
        motivo: "ListarMovimientosAsync: en vez de '_db.Users.Where(u => usuarioIds.Contains(u.Id))', se trae la tabla de usuarios completa a memoria con ToListAsync() y se filtra en-proceso contra el HashSet<string> local, igual patron que UsersController.GetData."
    migracion_ef: null
    deteccion_qa:
      tipo: api
      selector_o_endpoint: "POST /Stock/GetData con al menos un MovimientoStock.UsuarioId no nulo"
      condicion_falla: "Respuesta 500 / InvalidOperationException sobre '@usuarioIds' al resolver UsuarioNombre."
    criterio_aceptacion:
      - "POST /Stock/GetData responde 200 con UsuarioNombre resuelto correctamente para movimientos con UsuarioId."
      - "Cualquier Service nuevo (de este u otro proyecto BlankProject/.NET 10/MySQL) que necesite un IN sobre una coleccion local aplica el patron 'traer a memoria + filtrar con HashSet', nunca Where(coleccionLocal.Contains(...)) traducido a SQL."
    pruebas_minimas:
      - "Ajuste de stock registrado por un usuario -> Stock/Index muestra su nombre sin error 500."
    fix_aplicado:
      fecha: "2026-07-24"
      por: "implementador (durante smoke test de Sprint 1, previo al ciclo de QA)"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Infrastructure/Services/StockService.cs
          motivo: "usuarioIds materializado en memoria (ToListAsync + Where en-proceso) en vez de Contains() traducido a SQL IN sobre una coleccion local."
      build: "dotnet build MariHogar.slnx -> Compilacion correcta, 0 Errores (re-verificado por QA el 2026-07-24)."
      verificacion: "Verificado por QA via revision de codigo (MariHogar.Infrastructure/Services/StockService.cs lineas 49-57): el fix esta presente y sigue el mismo patron ya usado en UsersController.GetData. Grep de '.Contains(' sobre todos los Services/Controllers nuevos del sprint (CategoriaService/MarcaService/ProductoService/StockService/ProductosController) no encontro otra ocurrencia del patron riesgoso. Item no estaba catalogado todavia en este archivo pese a que el fix ya se habia aplicado — QA lo cataloga ahora para cumplir la obligacion de trazabilidad cross-proyecto (30-qa-regresiones.instructions.md)."
    nota_qa_laplatense_etapa3: "Reaparicion del patron en OTRO proyecto (La Platense, rama migracion-catalogo, Etapa 3 migracion de catalogo, detectada por QA el 2026-08-17 por revision de codigo pre-merge, ANTES de aplicar la migracion EF a ninguna base). CatalogoMigracionService tenia dos IN sobre coleccion local de STRING — justo el caso que este item marca como riesgoso — ambos en el camino de PERSISTIR (nunca en el de preview, que retorna antes): (1) ProcesarProductosAsync, 'codigos.Contains(p.Codigo)' con codigos como List<string> del lote; (2) ProcesarCodigosProveedorAsync, 'codigos.Contains(c.CodigoDelProveedor)', idem. El proyecto usa MySql.EntityFrameworkCore 10.0.1, exactamente el provider y version donde este item se reprodujo empiricamente en marihogar. Efecto esperado: el operador ve un preview limpio y el 'Confirmar la importacion' revienta con InvalidOperationException/500 sin importar nada — o sea, el bug se manifiesta recien en el paso mas caro y menos reversible del flujo. Fix aplicado por QA (auto-fix, derivado de este item): NO se uso el 'traer la tabla completa a memoria' del archivos_fix original, porque aca la tabla es Productos con 121.691 filas dentro de un loop de lotes de 500 (244 relecturas del catalogo completo). Se reemplazo por relectura del lote POR Id (coleccion local de int, segura segun nota_qa_sprint4), aprovechando que ambos metodos ya tenian en memoria el mapa codigo->Id / clave->Id de la proyeccion completa que hacen al arrancar: cero consultas extra y semantica identica (ambas proyecciones usan IgnoreQueryFilters, asi que el conjunto alcanzado por Id es el mismo que alcanzaba el IN por string, soft-deleted incluidos). Leccion para el catalogo: el fix canonico de MH-001 ('materializar y filtrar en memoria') solo es aceptable cuando la tabla es chica; en tablas de volumen hay que convertir el IN de string a un IN de Id, no traerse la tabla."
    nota_qa_laplatense_entrega2: "SEGUNDA reaparicion en el MISMO proyecto (La Platense, rama entrega-2, QA de Entrega 2, 2026-08-21) — esta vez reproducida por EJECUCION real (HTTP 500 contra laplatense_dev), no por revision de codigo. Cinco call sites del patron, todos resolviendo nombres de usuario de Identity (coleccion local de string, exactamente el caso original de este item): CajaMovimientoService.ListarCierresDiariosAsync y .ListarCierresMensualesAsync, EntregaService.ListarAsync y .ListarRepartidoresAsync, y AjusteStockService.HistorialAsync. Hallazgo importante que AMPLIA este item: el error se dispara TAMBIEN con la coleccion local VACIA — se comprobo con 0 filas en CierresCajaDiarios y el endpoint igual devolvio 500. O sea que no hace falta que exista un dato para que reviente: los listados afectados estaban rotos desde el dia 1, al 100% de las cargas, y por eso el guard 'if (ids.Count == 0) return diccionarioVacio' que tenia EntregaService.ListarAsync era lo unico que lo mantenia en pie mientras no hubiera entregas con repartidor asignado. Consecuencia de alcance: AjusteStockService.HistorialAsync es codigo de ENTREGA 1, ya desplegado a produccion — la pantalla de historial de ajustes de stock estaba caida en produccion sin que nadie lo hubiera reportado. Fix aplicado por QA en los 5 puntos con el patron canonico de este item (materializar AspNetUsers con ToListAsync y filtrar en memoria con un HashSet<string>), que aca es seguro porque la tabla de usuarios es el personal del negocio (unidades, no miles). Leccion para el catalogo: al buscar este patron NO alcanza con probar los listados que tienen datos — hay que ejercitar todos los endpoints, incluso los vacios, porque el 500 es independiente del contenido de la coleccion."
    nota_qa_sprint4: "Refinamiento de alcance (marihogar, Sprint 4, 2026-07-24): QA encontro un nuevo caso del patron generico 'Where(coleccionLocal.Contains(...))' en CCProveedorService.ObtenerSaldosAsync ('_db.MovimientosCCProveedor.Where(m => ids.Contains(m.ProveedorId))' con ids como HashSet<int> local, consumido por ProveedorService.ListarAsync para la columna Saldo de Proveedores/Index) y lo reprodujo empiricamente contra marihogar_dev (MySQL real, provider MySql.EntityFrameworkCore 10.0.1 tal cual usa el proyecto, NO Pomelo) con un programa C# standalone que invoca el Service real. Resultado: el patron con HashSet<int>/List<int> (tipo primitivo con type mapping trivial) NO reproduce el error -- la consulta se traduce y ejecuta correctamente. Se reprodujo en el mismo experimento, como control, el patron ORIGINAL exacto de este item (HashSet<string> contra _db.Users.Contains) y ESE SI lanza la misma InvalidOperationException ('Expression @usuarioIds ... no type mapping assigned'). Conclusion: el riesgo real de MH-001 es especifico de colecciones locales de tipo string (probablemente por ambiguedad de charset/collation al parametrizar el arreglo), no de int/otros primitivos con mapping directo. CCProveedorService.ObtenerSaldosAsync se confirma seguro (PASS), sin necesidad de auto-fix. Se deja esta nota para que futuros ciclos de QA no traten como bloqueante cada '.Contains()' sobre coleccion local de tipo primitivo (int/long/etc.), y sigan poniendo el foco de grep en colecciones de string (ids de Identity, codigos, etc.)."
    nota_qa_laplatense_sprint0: "QUINTA aparicion (La Platense, rama entrega-1-migracion, Sprint 0 item 0.4, 2026-10-05) y VARIANTE NUEVA que el grep canonico de este item NO encuentra. El patron no fue un .Contains(): fue '.Where(p => patrones.Any(pat => EF.Functions.Like(p.Nombre.ToUpper(), pat)))' con patrones como string[] local, en tools/MigracionCatalogo (modo correctivo --solo-unidad-venta). Revienta con UnreachableException: 'A RelationalTypeMapping collection type mapping could not be found' — mensaje DISTINTO al 'does not have a type mapping assigned' del IN, lo que impide incluso asociar el error a este item. Como no hay ningun '.Contains(' en ese codigo, el barrido historico de MH-001 lo dejaba pasar: lo encontro la EJECUCION real contra laplatense_dev, no la revision de codigo. Fix aplicado por el implementador: una consulta por patron, con el patron viajando como variable ESCALAR (que si tiene type mapping), uniendo ids en un HashSet<int>. CONSECUENCIA PARA EL CATALOGO (lo que hay que cambiar al usar este item): el defecto de fondo es CUALQUIER coleccion local de string que el provider tenga que materializar como tabla de valores, no solo .Contains(). El barrido de QA pasa de grep -rn '.Contains(' a grep -rnE (punto)(Contains|Any)(parentesis-abierto) — en la practica: el mismo barrido pero agregando Any() ademas de Contains() y se filtran los casos cuya coleccion local sea de string (los de int/enum siguen siendo seguros, ver nota_qa_sprint4). Verificado por QA el 2026-10-05 ejecutando el modo correctivo contra laplatense_dev con 2 filas sembradas en Metro: los 6 grupos / 8 patrones LIKE corrieron sin excepcion y el listado salio correcto. Ya documentado tambien en 32-estandares-qa-implementador (seccion MH-001)."

