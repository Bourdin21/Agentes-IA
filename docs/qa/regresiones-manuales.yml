  - id: MH-009
    modulo: "Entregas / Cheques / Gastos — listados DataTables (EntregaListItemDto.FechaProgramada, ChequeListItemDto.FechaVencimiento, GastoListItemDto.Fecha)"
    titulo: "El fix global de horario Argentina (UnspecifiedAsUtcDateTimeConverter, forzado de Kind=Utc antes de serializar) hace retroceder un dia la fecha mostrada en 3 listados para los campos que son 'fecha calendario pura' (sin hora real), porque moment.js les aplica la conversion de huso horario -3h que antes no se aplicaba"
    severidad: major
    reproducido_en: "marihogar - master (working tree), Sprint de fix de horario UTC-3 (2026-07-31). Hallado por QA via revision de codigo + verificacion empirica contra marihogar_dev (programa C# standalone que reproduce exactamente la serializacion real de MVC con y sin el converter nuevo, usando un Gasto real de la base: Gasto.Id=480, Fecha=2025-05-05T00:00:00 Unspecified)."
    pasos:
      - "Como Administrador, ir a Gastos -> Index (o Entregas -> Index, o Cheques -> Index) con al menos 1 registro cuya fecha (Fecha/FechaProgramada/FechaVencimiento) sea una fecha 'pura' guardada a medianoche (sin componente de hora real)."
      - "Observar la columna de fecha de la grilla DataTables, con el navegador en huso horario Argentina (UTC-3)."
    sintoma: "La fecha mostrada en la grilla es un dia anterior a la fecha real guardada. Ejemplo verificado con datos reales de marihogar_dev: Gasto.Fecha=2025-05-05T00:00:00 (guardado, Kind=Unspecified) -> con el converter global nuevo el JSON serializa '2025-05-05T00:00:00Z' -> moment(d).format('DD/MM/YYYY') en el navegador Argentina interpreta el 'Z' y resta 3 horas -> muestra '04/05/2025' en vez de '05/05/2025'."
    expectativa: "Un campo que representa una fecha de calendario pura (sin hora real asociada — el usuario eligio un dia via <input type=date>, no un instante) debe mostrarse siempre con el mismo dia que fue guardado, sin importar el huso horario del navegador. Solo los campos que representan un instante real (CreatedAt, Fecha de Venta/ComprobanteAfip/MovimientoCCLocal, etc., todos poblados con DateTime.UtcNow) deben pasar por la conversion de huso horario -3h."
    causa_raiz: "UnspecifiedAsUtcDateTimeConverter (MariHogar.Web/Json/UnspecifiedAsUtcDateTimeConverter.cs, registrado globalmente en Program.cs via AddJsonOptions) fuerza Kind=Utc a TODO DateTime serializado por cualquier accion Json(...) del sistema, sin distinguir entre 'instante real' (Kind=Unspecified pero semanticamente UTC, ej. DateTime.UtcNow) y 'fecha calendario pura' (Kind=Unspecified pero semanticamente un dia sin huso horario, ej. Entrega.FechaProgramada = input.FechaProgramada.Date, Cheque.FechaVencimiento = linea.FechaVencimientoCheque.Value.Date, Gasto.Fecha = input.Fecha, poblado por defecto con DateTime.Today y editable via <input type=date>). Para el primer grupo el fix es correcto (soluciona el bug original de +3h). Para el segundo grupo, forzar 'Z' hace que moment.js (que antes interpretaba el string sin 'Z' como hora local del navegador, mostrando el dia guardado tal cual) ahora lo interprete como UTC y le reste 3 horas al convertir a Argentina, empujando la medianoche al dia anterior (21:00). Se identificaron exactamente 3 columnas de DataTables con este patron (moment(d).format('DD/MM/YYYY'), sin HH:mm, sobre un campo poblado por .Date/DateTime.Today): Entregas/Index.cshtml (fechaProgramada), Cheques/Index.cshtml (fechaVencimiento), Gastos/Index.cshtml (fecha). Se verificaron y descartaron por seguras las demas columnas de fecha del sistema (OrdenesCompra/Index 'fecha' y Presupuestos/Index 'createdAt' son instantes reales poblados con DateTime.UtcNow, no fechas puras; el resto de los listados con moment(d).format(...HH:mm) — CCLocal, ComprobantesAfip, Proveedores/CuentaCorriente, Stock, Ventas — usan Fecha=DateTime.UtcNow real, benefician correctamente del fix sin regresion)."
    capa: Web
    archivos_fix:
      - path: MariHogar.Web/Views/Entregas/Index.cshtml
        motivo: "Columna fechaProgramada: moment(d) -> moment.utc(d) (formatea los componentes del string ISO tal cual, sin restar el offset de huso horario del navegador — correcto para una fecha calendario pura, sin tocar el converter global que ya funciona bien para los campos con hora real)."
      - path: MariHogar.Web/Views/Cheques/Index.cshtml
        motivo: "Columna fechaVencimiento: mismo cambio moment(d) -> moment.utc(d)."
      - path: MariHogar.Web/Views/Gastos/Index.cshtml
        motivo: "Columna fecha: mismo cambio moment(d) -> moment.utc(d)."
    migracion_ef: null
    deteccion_qa:
      tipo: data
      selector_o_endpoint: "POST /Gastos/GetData, /Entregas/GetData, /Cheques/GetData con al menos 1 registro con fecha 'pura' (medianoche) — comparar el dia calendario devuelto en el JSON (con la 'Z' del converter global) contra el dia mostrado por moment.utc(d).format('DD/MM/YYYY') vs moment(d).format('DD/MM/YYYY')"
      condicion_falla: "moment(d).format('DD/MM/YYYY') (sin .utc()) sobre el valor JSON con sufijo 'Z' da un dia distinto al guardado en la columna Fecha/FechaProgramada/FechaVencimiento de la base."
    criterio_aceptacion:
      - "Gastos/Index: un Gasto con Fecha=X se muestra como X en la grilla (mismo dia, sin importar el huso horario del navegador)."
      - "Entregas/Index: una Entrega con FechaProgramada=X se muestra como X en la grilla."
      - "Cheques/Index: un Cheque con FechaVencimiento=X se muestra como X en la grilla, incluida la fila resaltada de 'vence en <=7 dias' (venceProximo, que se calcula server-side sobre el mismo valor, no afectada por este bug de presentacion)."
      - "Sin regresion en los campos con hora real (Ventas/Index, Stock/Index, CCLocal/Index, ComprobantesAfip/Index, Proveedores/CuentaCorriente, OrdenesCompra/Index, Presupuestos/Index): siguen mostrando la fecha ya corregida por HorarioArgentino/el converter global (fix original intacto)."
    pruebas_minimas:
      - "Con un Gasto real de marihogar_dev (Id=480, Fecha=2025-05-05T00:00:00): confirmar que Gastos/Index muestra 05/05/2025, no 04/05/2025 (verificado por QA via simulacion exacta de la serializacion + moment.utc, logica confirmada; pendiente de confirmacion visual del usuario en navegador real segun proceso de este proyecto)."
      - "Registrar una Entrega nueva con FechaProgramada=hoy+2 dias y confirmar que Entregas/Index muestra esa misma fecha exacta."
      - "Registrar un pago de OC con cheque con FechaVencimiento=hoy+30 dias y confirmar que Cheques/Index muestra esa misma fecha exacta, y que la fila se resalta correctamente si cae dentro de los proximos 7 dias."
    fix_aplicado:
      fecha: "2026-07-31"
      por: "QA (auto-fix)"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Web/Views/Entregas/Index.cshtml
          motivo: "moment(d).format('DD/MM/YYYY') -> moment.utc(d).format('DD/MM/YYYY') en la columna fechaProgramada."
        - path: MariHogar.Web/Views/Cheques/Index.cshtml
          motivo: "moment(d).format('DD/MM/YYYY') -> moment.utc(d).format('DD/MM/YYYY') en la columna fechaVencimiento."
        - path: MariHogar.Web/Views/Gastos/Index.cshtml
          motivo: "moment(d).format('DD/MM/YYYY') -> moment.utc(d).format('DD/MM/YYYY') en la columna fecha."
      build: "dotnet build MariHogar.slnx -c Release --no-incremental -> Compilacion correcta, 0 Errores (9 warnings preexistentes de siempre, ninguno nuevo) — el fix es JS puro dentro de vistas Razor, sin impacto de compilacion C#, re-verificado por QA despues del cambio."
      verificacion: "Verificado por QA con un programa C# standalone (referenciando MariHogar.Infrastructure + MariHogar.Web, conectado a marihogar_dev real) que reproduce exactamente la serializacion JSON de MVC con el converter nuevo registrado y simula la conversion de huso horario que aplicaria moment.js en un navegador Argentina: confirmado que un Gasto real (Id=480, Fecha=2025-05-05T00:00:00 Unspecified) se serializa como '2025-05-05T00:00:00Z' y que moment(d) (sin .utc()) lo mostraria como 04/05/2025 (bug), mientras que moment.utc(d) lo muestra como 05/05/2025 (correcto, mismo dia guardado). No reproducido en navegador real (regla de proceso de este proyecto: QA no automatiza UI) — el usuario debe confirmar visualmente en las 3 pantallas antes de dar el sprint por cerrado, ya que no hay Entregas ni Cheques cargados todavia en marihogar_dev para verificar esos 2 casos con datos reales (si se replican con Gastos, que si tiene datos, el patron es identico)."

  - id: MH-010
    modulo: "Ventas — Crear/Editar (campos de plata sobre jquery.maskMoney.js: Precio contado/tarjeta, Subtotal, Monto de pago, Total editable)"
    titulo: "jquery.maskMoney.js nunca dispara el evento nativo 'input' del navegador durante la escritura — solo dispara 'change' de jQuery, y unicamente al perder el foco — por lo que un handler que sincroniza el array JS de estado escuchando solo 'input' queda desactualizado con lo que el usuario tipeo hasta que el campo hace blur"
    severidad: critical
    reproducido_en: "marihogar - master (working tree), reportado por el cliente el 2026-08-15 ('al crear la venta con los pagos configurados, estos se guardan en un solo pago') sobre una Venta real (#660/#661, Total $24.999,81) — causa raiz confirmada por lectura linea por linea de jquery.maskMoney.js (MariHogar.Web/wwwroot/lib/maskmoney/jquery.maskMoney.js), no por reproduccion en navegador (regla de proceso de este proyecto: no se levanta la app)."
    pasos:
      - "Como cualquier rol, ir a Ventas/Create, agregar 1+ productos al carrito."
      - "En 'Formas de pago', click 'Agregar' para crear una linea (metodo Efectivo, monto default = saldo pendiente)."
      - "Escribir un monto PARCIAL en el campo de esa linea (ej. reemplazar el default por un valor menor) SIN hacer click/tab fuera del campo todavia."
      - "Click 'Agregar' de nuevo para crear una segunda linea, o directamente click 'Confirmar venta' sin haber perdido el foco del primer campo antes."
    sintoma: "La pantalla muestra el monto tipeado correctamente en cada campo (el plugin gestiona el enmascarado visual internamente), pero al confirmar la venta se guarda un unico PagoVenta con el monto ORIGINAL/default de la primera linea (o el total completo), y cualquier segunda linea con monto vacio/null se descarta silenciosamente por el filtro 'monto > 0'. Mismo patron de perdida de dato silenciosa aplica a los campos de Precio contado/tarjeta y Subtotal editables por Administrador, y al Total editable con reparto proporcional (CR-24.3)."
    expectativa: "El array JS que arma el payload de guardado (pagos[idx].monto, carrito[idx].precioUnitario/precioTarjeta/subtotal) debe reflejar siempre el ultimo valor visible en pantalla al momento de confirmar/guardar, sin depender de que el campo pierda el foco antes."
    causa_raiz: "jquery.maskMoney.js intercepta cada tecla (digitos, backspace, delete) con event.preventDefault() en sus handlers de keypress/keydown y escribe el nuevo valor via $input.val(...) de forma programatica (funciones internas applyMask/maskAndPosition) — .val() de jQuery NUNCA dispara el evento nativo 'input' del DOM. El unico evento que el plugin dispara es un 'change' sintetico de jQuery, y solo dentro de blurEvent (linea 'if ($input.val() !== onFocusValue) { $input.change(); }'), es decir unicamente cuando el campo pierde el foco Y el valor cambio desde que lo gano. Los handlers de Ventas/Create.cshtml y Ventas/Edit.cshtml (.inp-precio-venta, .inp-preciotarjeta-venta, .inp-subtotal-venta, .inp-monto-pago, #inpTotalVenta) escuchaban unicamente $(document).on('input', selector, ...) — evento que en la practica nunca se dispara durante la escritura en estos campos — dejando el array JS congelado en el valor con el que se creo la fila hasta que un blur incidental (ej. clickear otro control) disparara el 'change' que nadie escuchaba tampoco."
    capa: Web
    archivos_fix:
      - path: MariHogar.Web/Views/Ventas/Create.cshtml
        motivo: "Los 5 handlers .inp-precio-venta / .inp-preciotarjeta-venta / .inp-subtotal-venta / .inp-monto-pago / #inpTotalVenta pasan de escuchar solo 'input' a escuchar 'input change'. Ademas, el handler de '.btn-confirmar-venta' relee explicitamente cada campo .money visible del DOM (leerMoney) y sincroniza carrito[idx]/pagos[idx] justo antes de armar itemsPayload/pagosPayload, como defensa adicional por si el ultimo campo editado no llego a perder el foco antes del click."
      - path: MariHogar.Web/Views/Ventas/Edit.cshtml
        motivo: "Mismo fix en los 3 handlers .inp-precio-venta / .inp-preciotarjeta-venta / .inp-subtotal-venta (no tiene Formas de pago ni Total editable), mas la misma relectura defensiva en '#btnGuardarVenta' antes de armar itemsPayload."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "Ventas/Create — '#listaPagos .inp-monto-pago', '.inp-precio-venta', '.inp-preciotarjeta-venta', '.inp-subtotal-venta', '#inpTotalVenta'"
      condicion_falla: "Escribir un monto en un campo .money (sin blur), agregar una segunda linea/campo y confirmar/guardar -> el valor persistido en base difiere del ultimo valor mostrado en pantalla para ese campo antes del blur."
    criterio_aceptacion:
      - "Agregar 2+ lineas de pago con metodos y montos distintos (que sumen el total) sin clickear fuera de ningun campo entre pasos -> Confirmar venta -> se crean N PagoVenta, cada uno con el monto exacto tipeado en su linea."
      - "Editar el Precio contado/tarjeta o el Subtotal de un item y clickear directo en 'Confirmar venta' (sin blur previo del campo editado) -> el valor guardado en VentaItem coincide con el ultimo tipeado, no con el valor por defecto de la linea."
      - "Editar el Total (CR-24.3) y confirmar sin blur previo -> el reparto proporcional usa el ultimo total tipeado."
    pruebas_minimas:
      - "Venta con 2 lineas de pago (Efectivo parcial + Transferencia por el resto) que sumen el Total exacto -> Details debe mostrar 2 PagoVenta, no 1."
      - "Como Administrador, editar el Precio tarjeta de un item y confirmar sin tocar otro campo antes -> VentaItem.PrecioTarjeta persistido coincide con el tipeado."
    fix_aplicado:
      fecha: "2026-08-15"
      por: "orquestador"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Web/Views/Ventas/Create.cshtml
          motivo: "'input' -> 'input change' en los 5 handlers de campos .money + relectura defensiva del DOM en el click de Confirmar venta."
        - path: MariHogar.Web/Views/Ventas/Edit.cshtml
          motivo: "'input' -> 'input change' en los 3 handlers de campos .money + relectura defensiva del DOM en el click de Guardar cambios."
      build: "Sin impacto de compilacion C# (fix 100% JS dentro de vistas Razor) — Domain/Application/Infrastructure re-verificados con dotnet build en el mismo ciclo (0 errores); MariHogar.Web no se pudo re-compilar por lock del servidor de desarrollo del usuario corriendo en paralelo (mismo patron ya documentado en este proyecto), vistas Razor se recompilan en caliente sin reinicio."
      verificacion: "Verificado por lectura linea por linea de jquery.maskMoney.js (keypressEvent/keydownEvent/applyMask/blurEvent) confirmando que 'change' es el unico evento disparado y solo en blur. No reproducido en navegador (regla de proceso: no se levanta la app) — pendiente confirmacion visual del usuario con una venta real de 2+ formas de pago antes de dar el hallazgo por cerrado del todo."
    documentado_tambien_en: "C:/Sistemas/Agentes-IA/.github/instructions/23-web.instructions.md (regla generica 'jquery.maskMoney.js — nunca escuchar solo input en un campo enmascarado', aplicable a cualquier proyecto que reutilice este plugin vendored, ej. delicias-naturales)."

  - id: MH-011
    modulo: "Facturacion AFIP — precarga de items al facturar (ComprobanteAfipService.ObtenerPrecargaAsync)"
    titulo: "La precarga de PrecioUnitario en la pantalla de Facturar siempre usa el precio 'Negro' (VentaItem.PrecioUnitario) aunque la linea se haya vendido a precio 'Con IVA' (TipoPrecio=Tarjeta), precargando sistematicamente un valor mas bajo que lo realmente cobrado"
    severidad: major
    reproducido_en: "marihogar - master (working tree), hallazgo propio durante auditoria completa del proyecto (15/08/2026), confirmado por lectura de codigo, no reproducido en navegador."
    pasos:
      - "Crear una Venta con al menos 1 item vendido a precio 'Con IVA (21%)' (TipoPrecio=Tarjeta) y confirmarla."
      - "Ir a Ventas/Details de esa venta y abrir la pantalla 'Facturar' (ComprobanteAfip)."
      - "Observar el PrecioUnitario precargado para esa linea."
    sintoma: "El PrecioUnitario precargado es el precio 'Negro' de la linea (VentaItem.PrecioUnitario, el precio base sin el 21%), no el precio realmente cobrado (VentaItem.Subtotal / Cantidad), aunque la venta se haya cobrado a precio Con IVA — el Administrador puede corregirlo a mano (CR-25, la Venta es precarga/referencia), pero el valor por defecto queda sistematicamente por debajo de lo cobrado, con riesgo real de subfacturar si no se corrige."
    expectativa: "La precarga debe reflejar el precio unitario REAL de la linea tal como se cobro (Subtotal/Cantidad), sea cual sea el TipoPrecio elegido — el Administrador sigue pudiendo editarlo, pero el default no debe requerir correccion manual en el caso mas comun (linea vendida Con IVA)."
    causa_raiz: "ComprobanteAfipService.ObtenerPrecargaAsync mapeaba VentaItemParaFacturarDto.PrecioUnitario directo desde VentaItem.PrecioUnitario, campo que SIEMPRE guarda el precio 'Negro'/contado de la linea (ver VentaService.ConfirmarAsync) independientemente del TipoPrecio elegido — el recargo del 21% de una linea Con IVA vive en VentaItem.Subtotal, no en PrecioUnitario."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/ComprobanteAfipService.cs
        motivo: "ObtenerPrecargaAsync: PrecioUnitario del DTO pasa de 'i.PrecioUnitario' a 'i.Cantidad > 0 ? Math.Round(i.Subtotal / i.Cantidad, 2) : i.PrecioUnitario' — precarga el precio unitario real cobrado en vez del precio Negro fijo."
    migracion_ef: null
    deteccion_qa:
      tipo: data
      selector_o_endpoint: "GET pantalla Facturar de una Venta con al menos 1 VentaItem.TipoPrecio=Tarjeta — comparar VentaItemParaFacturarDto.PrecioUnitario contra VentaItem.Subtotal/Cantidad."
      condicion_falla: "PrecioUnitario precargado != Subtotal/Cantidad para una linea con TipoPrecio=Tarjeta."
    criterio_aceptacion:
      - "Venta con 1+ lineas a precio Con IVA -> pantalla Facturar precarga PrecioUnitario = Subtotal/Cantidad de cada linea, no el precio Negro."
      - "Venta con todas las lineas a precio Negro (Contado) -> sin cambio de comportamiento (Subtotal/Cantidad coincide con PrecioUnitario en ese caso)."
    pruebas_minimas:
      - "Venta con 1 item Cantidad=2, PrecioUnitario=1000 (Negro), TipoPrecio=Tarjeta -> Subtotal=2420 (1000x1,21x2) -> pantalla Facturar debe precargar PrecioUnitario=1210, no 1000."
    fix_aplicado:
      fecha: "2026-08-15"
      por: "orquestador"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Infrastructure/Services/ComprobanteAfipService.cs
          motivo: "Precarga de PrecioUnitario corregida a Subtotal/Cantidad."
      build: "dotnet build MariHogar.Infrastructure/MariHogar.Infrastructure.csproj -c Debug -> Compilacion correcta, 0 errores."
      verificacion: "Verificado por lectura de codigo (cambio de 1 linea de mapeo DTO). No reproducido en navegador (regla de proceso: no se levanta la app) — pendiente confirmacion visual del usuario facturando una venta real con lineas Con IVA."

  - id: MH-012
    modulo: "Facturacion AFIP — emision de comprobante (ComprobanteAfipService.EmitirAsync / ComprobantesAfipController.Create)"
    titulo: "Ampliar TipoComprobanteAfip con NotaCreditoA/B (CR-55) dejo el camino 'Facturar' aceptando esos 2 valores nuevos: un POST manipulado emite una Nota de Credito huerfana (sin CbtesAsoc) que ademas INCREMENTA CantidadFacturada"
    severidad: major
    reproducido_en: "marihogar - master (working tree, CR-55 sin commitear, 21/08/2026). Hallazgo de QA por lectura de codigo; no reproducido contra AFIP (prohibido: certificado de PRODUCCION real cargado)."
    pasos:
      - "Autenticarse con cualquier usuario que tenga la policy RequireVentas (Administrador o Vendedor)."
      - "Abrir la pantalla Facturar de una Venta con items pendientes (GET /ComprobantesAfip/Create?ventaId=N)."
      - "Interceptar/replicar el POST a /ComprobantesAfip/Create cambiando el campo de formulario tipoComprobante de 'FacturaB' a 'NotaCreditoB' (el resto del payload igual)."
    sintoma: "El servidor acepta el valor: se crea un ComprobanteAfip con TipoComprobante=NotaCreditoB y ComprobanteAsociadoId=NULL. Como el codigo deriva 'es Nota de Credito' de ComprobanteAsociadoId (no del TipoComprobante), el request a AFIP viaja como CbteTipo=8 SIN el bloque CbtesAsoc, y si AFIP aprueba, CantidadFacturada se INCREMENTA (comportamiento de factura) en vez de restarse. La NC huerfana ademas queda visible en el link publico de WhatsApp, porque el descarte de CR-55 en VentaService tambien filtra por ComprobanteAsociadoId."
