  # -- Entradas especificas del proyecto crm-olvidata (feature "4 frentes", 2026-09-14) -------------

  - id: CRM-023
    modulo: "Armar presupuesto por frente — /Modulos/Presupuesto (selector 'Frentes') y modal 'Armar propuesta' de Chats/Detail (selFrentesModal) -> GET /Modulos/Checklist"
    titulo: "El selector multiple de Frentes no llega al servidor: $.get con un array manda 'frentes[]=2&frentes[]=3', que ASP.NET Core NO bindea desde el query string, y el checklist cae a Build en silencio"
    severidad: major
    reproducido_en: "crm-olvidata - working tree sin commitear de la feature '4 frentes — combo con gancho' (2026-09-14), olvidatacrm_dev, app local. Reproducido por HTTP autenticado (Playwright MCP no disponible en la sesion)."
    pasos:
      - "Como SuperUsuario abrir /Modulos/Presupuesto, elegir un rubro y en 'Frentes' dejar solo Landing (o Landing + AI Agents + Chatbots)."
      - "Mirar el checklist que carga. Equivalente por HTTP: GET /Modulos/Checklist?industriaId=2&frentes%5B%5D=2&frentes%5B%5D=4 (lo que serializa jQuery por defecto)."
      - "Variante: Chats/Detail de un contacto -> 'Armar propuesta' -> el modal arranca con Landing + AI Agents + Chatbots."
    sintoma: "El checklist sale siempre con los modulos de Build (data-frentes=\"1\"), sin importar que frentes se eligieron. No hay error ni aviso: el usuario cree estar armando el combo y esta armando un presupuesto de gestion. Calcular/GenerarMensaje releen los frentes del data-frentes, asi que todo el circuito queda consistente... con Build."
    expectativa: "GET /Modulos/Checklist recibe los frentes elegidos: con Landing + AI Agents + Chatbots el checklist se arma con esos frentes (o muestra 'Todavia no hay modulos cargados ... en los frentes elegidos'), data-frentes=\"2,3,4\"."
    causa_raiz: "jQuery serializa arrays con corchetes por defecto (traditional:false -> 'frentes[]=2'). Del lado de ASP.NET Core, el parametro FrenteComercial[] frentes SI bindea 'frentes[]' en un POST de formulario (verificado: POST /Modulos/Calcular con frentes[]=2 filtra bien), pero NO en el query string de un GET: 'frentes[]=2&frentes[]=4' llega vacio, NormalizarFrentes() cae al default Build y lo oculta. 'frentes=2&frentes=3' (formato tradicional) si bindea: data-frentes=\"1,2\" para frentes=1&frentes=2. El riesgo estaba declarado por el Implementador en 5-implementador.md §7, pero solo para el POST."
    capa: Web
    archivos_fix:
      - path: OlvidataCRM.Web/Views/Modulos/Presupuesto.cshtml
        motivo: "cargarChecklist(): $.get(url, {...}) -> $.ajax({ url, data: {...}, traditional: true }) para que el array viaje como frentes=2&frentes=3."
      - path: OlvidataCRM.Web/Views/Chats/Detail.cshtml
        motivo: "cargarChecklistModal(): mismo cambio."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-14"
      por: "QA (auto-fix, JS de 2 vistas, sin logica de negocio nueva: hace llegar al servidor el parametro que el servidor ya esperaba)"
      resultado: "aplicado"
      archivos:
        - path: OlvidataCRM.Web/Views/Modulos/Presupuesto.cshtml
          motivo: "traditional: true en el GET del checklist."
        - path: OlvidataCRM.Web/Views/Chats/Detail.cshtml
          motivo: "traditional: true en el GET del checklist del modal."
    deteccion_qa:
      tipo: api
      selector_o_endpoint: "GET /Modulos/Checklist?industriaId=<rubro con matriz>&frentes%5B%5D=2&frentes%5B%5D=4 vs ...&frentes=2&frentes=4; y en navegador, la URL real del XHR que dispara el cambio del selector 'Frentes'"
      condicion_falla: "Con frentes distintos de Build en la request, la respuesta trae data-frentes=\"1\" (default) o los modulos de Build; o el XHR del selector viaja con 'frentes%5B%5D='."
    criterio_aceptacion:
      - "Elegir solo Landing en /Modulos/Presupuesto arma el checklist de Landing (o el aviso de 'sin modulos en los frentes elegidos'), nunca el de Build."
      - "Elegir Build + Landing arma el checklist agrupado con data-frentes=\"1,2\"."
      - "Con solo Build el checklist sigue identico al de antes del cambio (R9)."
      - "El modal de Chats/Detail respeta el default del combo (Landing + AI Agents + Chatbots)."
    pruebas_minimas:
      - "Navegador: cambiar el selector de Frentes y confirmar en la pestana Red que el GET viaja como frentes=2&frentes=3."
      - "Solo Build -> checklist y GenerarMensaje byte a byte iguales a la version anterior."
      - "Calcular con un moduloId de un frente no elegido -> ignorado (0 modulos)."
    nota_generalizacion: "Aplica a TODO proyecto del estudio que mande arrays por AJAX GET con jQuery ($.get, $.getJSON, $.ajax sin traditional) a una accion MVC con parametro de coleccion: el binder de ASP.NET Core no reconoce 'nombre[]' en el query string y el parametro llega vacio sin error. Si ademas la accion tiene un default 'sin valor = comportamiento viejo', la falla es completamente silenciosa. Regla: arrays por GET siempre con traditional:true (o $.param(data, true)); y probar el filtro con un valor distinto del default, no solo el camino que coincide con el default. Formalizado en 32-estandares-qa-implementador.instructions.md."

  - id: OLV-013
    modulo: "Programaciones - detalle e historial de vueltas (/Programaciones/Detalle/{id}), columna TAREA"
    titulo: "Pantalla nueva pinta el enum crudo (EsperandoAprobacion) en vez del rotulo llano, teniendo el partial del design system ya hecho"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro - commit f1be7aa (M12), olvidata_agentes_dev, portal local en Development con modelo simulado. Reproducido por navegador (Playwright MCP)."
    pasos:
      - "Como Director crear una programacion con la casilla 'Puede usar acciones que necesitan aprobacion' TILDADA y un pedido que dispare una accion que requiere aprobacion (ej. una conexion de M11 con 'Permitir consultas sin aprobacion' destildado)."
      - "Apretar 'Ejecutar ahora' y esperar el barrido del motor."
      - "Abrir /Programaciones/Detalle/{id} y mirar la columna TAREA del historial de vueltas."
    sintoma: "Al lado del enlace #177 dice 'EsperandoAprobacion' — el nombre del enum, todo junto y sin tilde. En el resto del portal ese mismo estado se muestra como 'Espera aprobacion' con su badge y su icono. Los otros estados disimulan el bug porque el nombre del enum coincide con el rotulo (Completada, Cancelada), salvo Pendiente ('En cola') y EsperandoSubtareas ('Esperando a otros agentes'), que tambien salen mal."
    expectativa: "La columna TAREA muestra el estado con el mismo rotulo llano que el resto del producto: 'Espera aprobacion' / 'En cola' / 'Esperando a otros agentes', usando el componente que ya existe."
    causa_raiz: "Views/Programaciones/Detalle.cshtml linea 203 hace '<span class=\"small text-muted ms-1\">@estadoTarea</span>': interpola el enum, que llama a ToString(). El partial Views/Tareas/_EstadoTarea.cshtml ya resuelve (clase, texto, icono) para los 7 valores de EstadoTarea y se usa en Tareas, pero la pantalla nueva de M12 no lo reutilizo."
    capa: Web
    archivos_fix:
      - path: src/OlvidataAgentes.Web/Views/Programaciones/Detalle.cshtml
        motivo: "Reemplazar la interpolacion del enum por el partial _EstadoTarea, que ya tiene el rotulo, el icono y la clase de cada estado."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-16"
      por: "QA (auto-fix, 1 vista, sin logica de negocio nueva: reutiliza el partial del design system que ya existia)"
      resultado: "aplicado"
      archivos:
        - path: src/OlvidataAgentes.Web/Views/Programaciones/Detalle.cshtml
          motivo: "await Html.PartialAsync(\"~/Views/Tareas/_EstadoTarea.cshtml\", estadoTarea) en lugar de @estadoTarea."
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /Programaciones/Detalle/{id} con al menos una vuelta cuya tarea NO este Completada; mirar la celda de la columna TAREA"
      condicion_falla: "El texto visible contiene 'EsperandoAprobacion', 'EsperandoSubtareas' o 'Pendiente' (nombres de enum) en vez de 'Espera aprobacion', 'Esperando a otros agentes' o 'En cola'."
    criterio_aceptacion:
      - "Una vuelta cuya tarea quedo esperando aprobacion muestra 'Espera aprobacion', no 'EsperandoAprobacion'."
      - "Una vuelta con la tarea completada sigue mostrandose igual que antes."
      - "El rotulo coincide exactamente con el que muestra /Tareas para la misma tarea."
    pruebas_minimas:
      - "Navegador: detalle de una programacion con autonomia encendida y una vuelta esperando aprobacion."
      - "Comparar el rotulo con el de /Tareas para la misma tarea: deben decir lo mismo."
      - "Tema claro y oscuro: el estado se distingue por icono y texto, no solo por color."
    nota_generalizacion: "Regla general para TODA pantalla nueva del estudio que muestre un enum de dominio ya existente: no interpolar el enum (@estado) ni depender de que el nombre coincida con el rotulo. Antes de escribir la celda, buscar si ya hay un partial/helper que traduzca ese enum (en este stack, Views/<Modulo>/_Estado*.cshtml o un *Textos.cs en Web/Helpers) y reutilizarlo. El bug es especialmente facil de pasar por alto porque los valores mas frecuentes suelen tener nombre igual al rotulo (Completada, Cancelada, Activa) y solo se nota en los estados compuestos. En QA: forzar al menos un estado cuyo nombre de enum NO sea una palabra sola."

