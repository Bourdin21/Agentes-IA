    causa_raiz: "Ningun [Authorize] a nivel clase en esos 13 controllers y AddAuthorization() en Program.cs define policies con nombre (RequireSuperUsuario / RequireAdministracion) pero NO define options.FallbackPolicy. Sin fallback, ASP.NET Core deja la accion abierta por defecto. La app se ve segura porque el sidebar no muestra los links al anonimo, pero las rutas responden igual si se las pide directo."
    capa: Web
    archivos_fix:
      - path: Eleven.Web/Program.cs
        motivo: "En AddAuthorization: definir options.FallbackPolicy = new AuthorizationPolicyBuilder().RequireAuthenticatedUser().Build(); (cierra por defecto TODO lo no marcado)."
      - path: Eleven.Web/Controllers/HomeController.cs
        motivo: "[AllowAnonymous] en la landing publica para que el fallback no la rompa."
      - path: Eleven.Web/Controllers/AccountController.cs
        motivo: "Verificar que Login/AccessDenied conserven [AllowAnonymous] bajo el fallback."
      - path: "Eleven.Web/Controllers/*.cs (los 13 sin guard)"
        motivo: "Ademas del fallback, declarar el [Authorize(Policy=...)] que corresponda por rol — REQUIERE DECISION FUNCIONAL previa de que rol accede a que modulo (Administrador vs Tecnico)."
