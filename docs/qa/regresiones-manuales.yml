      selector_o_endpoint: "getComputedStyle('.select2-selection').backgroundColor y '.select2-dropdown' con data-theme=dark"
      condicion_falla: "Con data-theme=dark el fondo de .select2-selection, .select2-dropdown o .daterangepicker es claro (luminancia > 140) mientras la card es oscura."
