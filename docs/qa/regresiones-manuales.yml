      - "Mandar el POST con todos los campos validos y el valor dado de baja."
      - "Verificar en la base que la entidad quedo con ese valor."
    sintoma: "La entidad se crea con el tipo que el diseno dio por discontinuado, y despues muestra el aviso 'esto ya no se carga asi' â€” un registro nuevo naciendo deprecado."
    expectativa: "El servidor no deja crear el valor discontinuado; en una edicion, el valor se conserva si la entidad ya lo tenia."
    causa_raiz: "El combo de la vista filtra la opcion (solo la ofrece si la entidad ya la tiene) pero el servicio de alta no valida nada sobre el tipo. La guarda es de presentacion, no de negocio."
    capa: Infrastructure
    archivos_fix:
      - path: src/OlvidataAgentes.Infrastructure/Services/Reglas/ReglaService.cs
        motivo: "En el alta, forzar o validar el tipo vigente. OJO: hay que decidir antes que pasa con las altas que NO vienen de la pantalla (en este proyecto, las propuestas del configurador de M4b, cuyo guion propone procedimientos). Es decision de alcance, por eso el fix no se auto-aplica."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "POST forzado a la accion de alta con el valor que el combo no ofrece, usando el antiforgery real"
      condicion_falla: "La entidad se crea con el valor discontinuado (se verifica en la base, no en la pantalla)."
    criterio_aceptacion:
      - "El POST forzado no crea la entidad con el valor discontinuado."
      - "Editar una entidad que ya lo tiene no le cambia el tipo en silencio."
    pruebas_minimas:
      - "POST forzado en el alta: rechazado o normalizado."
      - "POST forzado en la edicion de una entidad que NO lo tenia: rechazado."
      - "Edicion normal de una entidad que SI lo tenia: conserva el valor."
    nota_generalizacion: "Regla del estudio: 'esta opcion ya no se ofrece' es una regla de negocio, no de presentacion. Filtrar el combo evita el error honesto; no evita el POST forzado, ni una integracion, ni un agente que crea la entidad por otra via. En QA: toda vez que una entrega diga 'este valor ya no se ofrece', probar el POST forzado."

  - id: OLV-020
    modulo: "Informes y dashboards de staff que agregan datos de TODAS las organizaciones con IgnoreQueryFilters"
    titulo: "El GROUP BY agrupa por NOMBRE (de agente, de cliente) sin el TenantId, asi que dos organizaciones distintas pueden caer en la misma fila y la pantalla no tiene columna para notarlo"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro - commit 05d6ba7 (M14), /Uso/Automatizar. Verificado POR CODIGO (InformeAutomatizacion.ArmarAsync) y por la ausencia de columna de organizacion en la pantalla; no reproducido por navegador porque hacia falta crear agentes homonimos en dos organizaciones que esta corrida tenia que dejar intactas."
    pasos:
      - "Tener dos organizaciones que usen el mismo agente de la plataforma (o dos agentes propios con el mismo nombre) y que hayan pedido lo mismo."
      - "Abrir el informe del periodo."
    sintoma: "Las tareas de las dos organizaciones se cuentan en un solo grupo: 'corrio N veces, USD X'. Como no hay columna de organizacion, no hay forma de darse cuenta, y la conclusion del informe ('esto conviene pasarlo a codigo') se toma sobre un numero que no es de nadie."
    expectativa: "Un grupo pertenece a una organizacion. La fila dice de cual."
    causa_raiz: "La consulta usa IgnoreQueryFilters del filtro de tenant â€” correcto, es un informe de staff â€” pero el GroupBy es (Agente, Cliente, HashPedido) con Agente y Cliente resueltos a NOMBRE. Al sacar el filtro de tenant hay que volver a meter el TenantId en la clave a mano: el filtro global era lo unico que separaba las organizaciones."
    capa: Infrastructure
    archivos_fix:
      - path: src/OlvidataAgentes.Infrastructure/Services/Uso/InformeAutomatizacion.cs
        motivo: "Agregar TenantId a la proyeccion y a la clave del GroupBy, y traer el nombre de la organizacion."
      - path: src/OlvidataAgentes.Application/DTOs/UsoOlvidataDtos.cs
        motivo: "GrupoAutomatizacionDto necesita la organizacion."
      - path: src/OlvidataAgentes.Web/Views/Uso/Automatizar.cshtml
        motivo: "Columna 'Organizacion' en la grilla. Es cambio de pantalla, por eso el fix no se auto-aplica."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: consulta
      selector_o_endpoint: "grep de IgnoreQueryFilters en servicios de informes; revisar la clave de cada GroupBy posterior"
      condicion_falla: "Hay un IgnoreQueryFilters del filtro de tenant y la clave del GroupBy que sigue no incluye TenantId."
    criterio_aceptacion:
      - "Cada fila del informe pertenece a una sola organizacion y lo dice."
      - "Dos organizaciones con el mismo agente y el mismo pedido dan dos filas."
    pruebas_minimas:
      - "SQL: reproducir el GROUP BY del informe y verificar que ningun grupo tiene mas de un TenantId distinto."
      - "Navegador: la grilla tiene columna de organizacion."
    nota_generalizacion: "Regla del estudio: en cuanto una consulta saca el filtro global de tenant, TODO lo que venga despues (GroupBy, Distinct, Any, joins por nombre) perdio la separacion entre organizaciones y hay que reponerla explicitamente. El caso mas traicionero es agrupar por un nombre que el usuario elige, porque dos organizaciones pueden elegir el mismo. En QA: ante cualquier informe cross-tenant, leer la clave del GroupBy antes que la pantalla."

  - id: OLV-021
    modulo: "Portales con dos publicos en la misma app (staff/miembro y un tercero autenticado): layout de las vistas COMPARTIDAS"
    titulo: "El rol nuevo queda afuera de EsMiembro y las pantallas compartidas (AccessDenied, Error, 404) le dibujan el menu del OTRO publico: la frontera tapa los datos pero no el menu"
