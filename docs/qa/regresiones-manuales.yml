  - id: GAN-005
    modulo: "Facturas de venta / Egresos - grillas de coleccion (Items[i], Ingresos[i], Pagos[i]) con input type=number y cultura es-AR fija"
    titulo: "Los inputs numericos de las FILAS de coleccion se parsean con la cultura del request (es-AR) porque el tag helper no emite para ellos el marcador __Invariant: un valor invariante como 1121670.00 entra al servidor como 112.167.000 (x100)"
    severidad: blocker
    reproducido_en: "ganaderia - emo, main (working tree v17 sin commitear), ganaderia_dev, 2026-09-07, reproducido por navegador real (Playwright) contra la app corriendo"
    pasos:
      - "App con cultura fija es-AR (UseRequestLocalization en Program.cs) y SIN model binder invariante propio."
      - "Ir a Facturas de venta -> Nueva. Cargar un item (1000 kilos x 1000) y los impuestos."
      - "Presionar 'Generar sugerido' para que el JS complete los ingresos (escribe con toFixed(2), o sea SIEMPRE con punto decimal)."
      - "Presionar 'Emitir factura'."
      - "Variante Egresos: Egresos -> Nuevo, subtotal 100000, IVA 21%, y un pago cuyo importe tenga decimales."
      - "Variante edicion: abrir Facturas/Edit/{id} de una factura editable y presionar 'Guardar cambios' sin tocar nada."
    sintoma: "El alta se rechaza con 'La suma de los ingresos (112.167.000,00) no coincide con el Total de la factura (1.121.670,00).' El numero del mensaje es exactamente 100x el valor tipeado. Como 'Generar sugerido' y 'Reajustar al nuevo total' escriben SIEMPRE con toFixed(2), el flujo recomendado por la propia UI falla siempre; solo se puede guardar tipeando importes sin punto decimal. En edicion, reabrir y re-guardar sin tocar nada tambien falla."
    expectativa: "Un input type=number postea SIEMPRE en formato invariante por especificacion HTML; el servidor debe parsearlo como invariante. 'Generar sugerido' + guardar tiene que funcionar, y re-guardar una edicion sin cambios tiene que ser idempotente."
    causa_raiz: "ASP.NET Core resuelve el round-trip de cultura emitiendo un input hidden name=__Invariant value=NombreDelCampo por cada campo renderizado con el tag helper asp-for sobre un input type=number/date; el value provider usa ese marcador para parsear ese campo con InvariantCulture en vez de la cultura del request. Los campos ESCALARES de estas vistas usan asp-for y por eso funcionan bien (PorcentajeDescuento, MontoDescuento, PorcentajeIva, MontoIva, Subtotal). Pero las filas de coleccion estan escritas a mano con name=Items[@i].KilosTotales / name=Ingresos[@i].Importe / name=@(prefix).Importe (necesario porque las filas se agregan, quitan y reindexan por JS), asi que NO reciben el marcador y caen en el parseo es-AR, donde el punto es separador de MILES. Es la mitad de ENTRADA del mismo round-trip que LP-003 documenta del lado de la SALIDA; ganaderia ya tenia resuelta la salida (helper num con InvariantCulture) pero no la entrada, y no tiene el InvariantDecimalModelBinderProvider que si tiene La Platense."
    capa: Web
    archivos_fix:
      - path: Ganaderia.Web/Views/Facturas/Create.cshtml
        motivo: "Agregar un listener de submit en fase de captura que, antes de enviar, recorre los input[type=number][name] de #tblItems y #tblIngresos y appendea al form un input hidden name=__Invariant value={nombre del campo} por cada uno. Se hace en el submit y no en el markup porque las filas se agregan/quitan/reindexan por JS; se limpian los marcadores previos en cada pasada para que no se dupliquen."
      - path: Ganaderia.Web/Views/Egresos/Create.cshtml
        motivo: "Mismo listener sobre input.js-importe-pago[name] (las filas de _FilaPago.cshtml)."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /Facturas/Create y /Egresos/Create; comparar la lista de input[type=number][name] contra la lista de input[name='__Invariant'] del form"
      condicion_falla: "Existe algun input[type=number] con name (tipicamente los de indice de coleccion: Items[0].*, Ingresos[0].*, Pagos[0].*) que no tenga un input[name='__Invariant'] con ese mismo nombre como value."
    criterio_aceptacion:
      - "En Facturas/Create, 'Generar sugerido' seguido de 'Emitir factura' crea la factura sin el error de suma de ingresos."
      - "En Egresos/Create, un pago con importe decimal (114950.00) se acepta y persiste como 114950.00, no como 11.495.000."
      - "Abrir Facturas/Edit/{id} y guardar sin tocar nada es idempotente: ningun importe cambia en la base."
      - "El boton 'Reajustar al nuevo total' (v17/PF72) produce importes que el servidor acepta."
    pruebas_minimas:
      - "Alta de factura con descuento 10% sobre subtotal 1.000.000 + IVA 21% + IIBB 3%: total 1.121.670,00 con el ingreso generado por 'Generar sugerido'."
      - "Alta de egreso subtotal 100.000, descuento 5%, IVA 21%, un pago de 114.950,00 -> persiste Importe 114.950,00."
      - "Editar esa factura y re-guardar sin cambios -> los importes en base quedan identicos."
      - "Regresion: los comprobantes preexistentes (sin descuento) no cambian ningun importe."
    nota_generalizacion: "Aplica a CUALQUIER proyecto del baseline que (a) fije una cultura con coma decimal (es-AR/es-ES/pt-BR) via UseRequestLocalization, (b) NO registre un model binder invariante propio, y (c) tenga grillas dinamicas cuyos inputs se nombren a mano con indice en vez de asp-for. La combinacion es facil de pasar por alto porque los campos escalares de la MISMA pantalla funcionan perfecto (tienen su __Invariant) y porque la validacion dura del servidor rechaza el valor corrupto con un mensaje que parece un error de negocio ('la suma no coincide') y no de parseo. Ojo: falla RUIDOSA cuando hay una validacion de suma que la ataja, pero seria una corrupcion SILENCIOSA x100 en cualquier campo decimal de coleccion que no tenga una validacion cruzada."
    fix_aplicado:
      fecha: "2026-09-07"
      por: "QA (auto-fix durante el ciclo de QA de la iteracion v17 de ganaderia)"
      resultado: "aplicado"
      archivos:
        - path: Ganaderia.Web/Views/Facturas/Create.cshtml
          motivo: "listener submit en fase de captura que emite los marcadores __Invariant para #tblItems y #tblIngresos."
        - path: Ganaderia.Web/Views/Egresos/Create.cshtml
          motivo: "idem para input.js-importe-pago."
      build: "dotnet build Ganaderia.slnx -c Debug -> Compilacion correcta, 0 Errores."
      verificacion: "Verificado por navegador real (Playwright) contra ganaderia_dev: antes del fix, 'Generar sugerido' + Emitir factura fallaba con 'La suma de los ingresos (112.167.000,00) no coincide...'; despues del fix la factura se crea (Total 1.121.670,00 persistido). Egreso con pago 114.950,00 persiste correcto. Abrir Facturas/Edit/{id} y re-guardar sin tocar nada quedo idempotente (Subtotal 1.000.000,00 / Total 1.210.000,00 / ingresos 605.000,00 x2 sin cambios). PF72 (reajuste proporcional) pasa end-to-end. Invariantes de comprobantes en 0 desvios y base restaurada al baseline exacto."

  - id: GAN-006
    modulo: "Facturas de venta / Egresos - inputs de porcentaje de impuestos (step del input vs precision decimal(9,4) de la columna)"
    titulo: "Editar una factura existente es imposible: jquery-validate bloquea el submit con 'Please enter a multiple of 0.01' porque los % se renderizan con 4 decimales (21.0000) contra un step 0.01"
    severidad: blocker
    reproducido_en: "ganaderia - emo, main (working tree v17 sin commitear), ganaderia_dev, 2026-09-07, reproducido por navegador real (Playwright)"
    pasos:
      - "Tener una factura de venta editable (ningun ingreso Acreditado ni Rechazado) con IVA cargado."
      - "Abrir Facturas/Edit/{id}."
      - "Presionar 'Guardar cambios' sin modificar absolutamente nada."
    sintoma: "El submit no se envia nunca. Aparecen tres mensajes 'Please enter a multiple of 0.01.' (en ingles, del bundle de jquery-validate) sobre PorcentajeIva, PorcentajeIIBB y PorcentajeOtrasPercepciones. La validacion nativa del navegador (input.validity) da valida; el bloqueo lo pone jquery-validate. La unica salida es retipear a mano los tres porcentajes."
    expectativa: "Reabrir una factura editable y guardarla sin cambios tiene que funcionar y ser idempotente."
    causa_raiz: "Las columnas de porcentaje son decimal(9,4) (convencion del proyecto), asi que el ViewModel trae 21.0000 y el tag helper asp-for lo renderiza con su escala completa: value=21.0000. El input declara step=0.01. La regla step de jquery-validate rechaza cualquier valor con mas decimales que el step, aunque 21.0000 sea aritmeticamente un multiplo exacto de 0.01. En el ALTA no se nota porque los campos arrancan en 0 o los completa el driver JS con 2 decimales; solo aparece al REABRIR un registro persistido. El campo PorcentajeDescuento de v17 se salva de casualidad porque su driver arranca en modo monto y reescribe el .value a 2 decimales al cargar."
    capa: Web
    archivos_fix:
      - path: Ganaderia.Web/Views/Facturas/Create.cshtml
        motivo: "Alinear el step del input con la precision real de la columna: step=0.0001 en PorcentajeDescuento, PorcentajeIva, PorcentajeIIBB y PorcentajeOtrasPercepciones (decimal(9,4)). No se toca el valor renderizado ni la precision persistida, solo la restriccion declarada en la UI, que estaba mas estricta que el dominio."
      - path: Ganaderia.Web/Views/Egresos/Create.cshtml
        motivo: "idem en PorcentajeDescuento y PorcentajeIva."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /Facturas/Edit/{id} de una factura editable con impuestos cargados; ejecutar jQuery(form).validate().form() y leer errorList"
      condicion_falla: "errorList no vacio sobre campos que el usuario no toco, tipicamente con el mensaje 'Please enter a multiple of ...'; o bien: existe un input[type=number] cuyo value tiene mas decimales que los que permite su propio step."
    criterio_aceptacion:
      - "Abrir Facturas/Edit/{id} y presionar 'Guardar cambios' sin tocar nada guarda correctamente y no cambia ningun importe."
      - "jQuery(form).validate().form() sobre la edicion recien cargada devuelve errorList vacio."
      - "Sigue siendo posible cargar porcentajes con 2 decimales (21,5) en el alta y en la edicion."
    pruebas_minimas:
      - "Edit de una factura con IVA 21% + IIBB 3%: guardar sin cambios -> Details, importes identicos en base."
      - "Regresion: alta normal de factura con IVA 21% sigue funcionando."
      - "Regresion: PV19 (descuento >= 100%) y PV20 (descuento >= subtotal) siguen bloqueados en cliente y servidor."
    nota_generalizacion: "Patron general: cuando la columna es decimal(p,S) y el input declara step con MENOS decimales que S, cualquier pantalla de EDICION queda bloqueada por jquery-validate apenas el valor persistido se renderiza con su escala completa. Se detecta solo reabriendo un registro guardado, nunca en el alta. Regla: el step del input tiene que ser <= la precision de la columna (o el value debe renderizarse redondeado al step). Revisar en todo proyecto que use decimal(x,4) para porcentajes junto a step=0.01."
    fix_aplicado:
      fecha: "2026-09-07"
      por: "QA (auto-fix durante el ciclo de QA de la iteracion v17 de ganaderia)"
      resultado: "aplicado"
      archivos:
        - path: Ganaderia.Web/Views/Facturas/Create.cshtml
          motivo: "step 0.01 -> 0.0001 en los 4 inputs de porcentaje."
        - path: Ganaderia.Web/Views/Egresos/Create.cshtml
          motivo: "step 0.01 -> 0.0001 en los 2 inputs de porcentaje."
      build: "dotnet build Ganaderia.slnx -c Debug -> Compilacion correcta, 0 Errores."
      verificacion: "Verificado por navegador real (Playwright): antes del fix, jQuery(form).validate().form() sobre Facturas/Edit/{id} devolvia 3 errores 'Please enter a multiple of 0.01' y el submit no salia nunca; despues del fix devuelve errorList vacio y el re-guardado sin cambios es idempotente. PV19/PV20/PV21 siguen bloqueados en cliente y por POST directo."

  - id: DN-003
    modulo: "Pagos / reversion de un pago (PagoService.ReversarPago) â€” al introducir una FK directa MovimientoCaja.PagoId sobre un esquema con filas historicas"
    titulo: "El fallback heuristico (VentaId + Monto) no se acoto a las filas SIN FK: revertir un pago historico puede soft-deletear el movimiento de caja de un pago NUEVO del mismo importe en la misma venta"
    severidad: major
    reproducido_en: "delicias-naturales - checkpoint-20260826-auditoria-autosave, working tree de la iteracion 3 'Editar Pago' (2026-09-07), detectado por revision estatica contra la especificacion de Arquitectura"
    pasos:
      - "Partir de una base con pagos historicos anteriores a la migracion que agrega la FK (MovimientoCaja.PagoId = NULL en esos movimientos)."
      - "Sobre una venta que YA tiene un pago historico de $X, registrar un pago NUEVO por el mismo importe $X (el nuevo si graba MovimientoCaja.PagoId)."
      - "Eliminar o Editar el pago HISTORICO (el que no tiene FK)."
      - "Mirar que MovimientoCaja quedo con DeletedAt seteado."
    sintoma: "Se da de baja el movimiento de caja del pago NUEVO (el que tiene FK) en vez del movimiento huerfano del pago historico. El pago nuevo queda vivo pero sin su ingreso en caja: el arqueo de la caja chica baja $X sin que se haya eliminado ningun pago vigente, y el movimiento del pago historico sigue sumando."
    expectativa: "La reversion busca primero por la FK exacta (m.PagoId == pago.Id). Si no encuentra nada, el fallback por VentaId + Monto se limita EXCLUSIVAMENTE a los movimientos que no tienen FK (m.PagoId == null), que son los unicos que pueden pertenecer a un pago historico."
    causa_raiz: "Al migrar de una busqueda heuristica a una FK exacta, el fallback se conservo tal cual estaba (OrigenMovimiento + OrigenId + Monto + no eliminado) sin agregarle la condicion que lo hace mutuamente excluyente con el camino de la FK. Arquitectura lo habia especificado ('la busqueda por VentaId+Monto se mantiene como fallback exclusivamente para movimientos con PagoId == null') pero la implementacion omitio ese filtro. Mientras TODOS los movimientos son historicos el bug no se ve; aparece recien cuando conviven filas con y sin FK, o sea a partir del primer pago nuevo posterior al deploy."
    capa: Application
    archivos_fix:
      - path: Services/PagoService.cs
        motivo: "ReversarPago: agregar 'm.PagoId == null' como primera condicion del FirstOrDefault del fallback, para que nunca pueda elegir un movimiento que ya pertenece a otro pago conocido."
    migracion_ef: null
    deteccion_qa:
      tipo: static
      selector_o_endpoint: "Metodo de reversion que primero busca por FK y despues cae a un fallback heuristico (aca PagoService.ReversarPago)."
      condicion_falla: "El predicado del fallback no incluye una condicion que excluya las filas que SI tienen la FK seteada (IS NULL sobre la columna nueva)."
    criterio_aceptacion:
      - "Revertir un pago con FK toca unicamente el movimiento cuya FK apunta a ese pago."
      - "Revertir un pago historico (sin FK) nunca toca un movimiento que tenga la FK seteada, aunque coincida venta e importe."
      - "Una venta con dos pagos del mismo importe (uno historico, uno nuevo) sobrevive a la baja de cualquiera de los dos sin descuadrar la caja."
    pruebas_minimas:
      - "Venta con pago historico $1000 (movimiento sin FK) + pago nuevo $1000 (movimiento con FK). Eliminar el historico -> se da de baja el movimiento sin FK; el del pago nuevo sigue activo."
      - "Editar el pago nuevo -> se da de baja solo su propio movimiento; el historico queda intacto."
      - "Regresion: eliminar un pago de una venta que solo tiene pagos historicos sigue funcionando por el fallback."
    nota_generalizacion: "Regla general para CUALQUIER migracion que introduce una FK directa para reemplazar una busqueda heuristica sobre datos historicos (el patron 'FK nueva + fallback por atributos'): los dos caminos tienen que ser MUTUAMENTE EXCLUYENTES, y la forma de garantizarlo es acotar el fallback a las filas donde la FK nueva es NULL. Si no, durante todo el periodo de convivencia (que puede durar anios) el fallback puede secuestrar filas que ya pertenecen a un duenio conocido. Aplica igual en marihogar, ganaderia y la-platense, que tienen el mismo patron de movimientos financieros con origen polimorfico (OrigenTipo + OrigenId)."
    fix_aplicado:
      fecha: "2026-09-07"
      por: "QA (auto-fix durante el ciclo de QA de la iteracion 3 'Editar Pago' de delicias-naturales)"
      resultado: "aplicado"
      archivos:
        - path: Services/PagoService.cs
          motivo: "fallback acotado con 'm.PagoId == null', alineado con la especificacion de Arquitectura seccion 2."
      build: "MSBuild DeliciasNaturales.sln /t:Rebuild /p:MvcBuildViews=true -> EXITCODE 0, 0 Errores, 35 warnings preexistentes."
      verificacion: "Revision estatica del predicado + build limpio. NO verificado por navegador: el servidor MCP de Playwright no estaba disponible en la sesion. Pendiente la prueba manual de las 3 pruebas minimas en el entorno con datos historicos."

  - id: DN-004
    modulo: "Pagos / Editar un pago ya posteado (PagoService.EditarPago + RegistrarPagoInterno) â€” interaccion con el modulo de Caja"
    titulo: "Editar un pago (incluso solo la fecha) exige una caja chica ABIERTA y mueve el movimiento de caja desde la caja original â€” posiblemente ya CERRADA â€” a la caja abierta de hoy, alterando el arqueo de un cierre pasado"
    severidad: major
    reproducido_en: "delicias-naturales - checkpoint-20260826-auditoria-autosave, working tree de la iteracion 3 'Editar Pago' (2026-09-07), detectado por revision estatica. NO corregido."
    pasos:
      - "Registrar un pago en una venta con la caja chica abierta; el MovimientoCaja queda asociado a esa caja."
      - "Cerrar la caja chica del dia (Cajas -> Cerrar). Queda EstadoCaja.Cerrada con su arqueo."
      - "Al dia siguiente (o con la caja cerrada), entrar al detalle de la venta y presionar 'Editar pago' para corregir SOLO la fecha, con un motivo."
      - "Variante A: sin ninguna caja chica abierta -> mirar el mensaje de error."
      - "Variante B: con la caja chica de HOY abierta -> confirmar la edicion y despues abrir el detalle de la caja YA CERRADA del dia original."
    sintoma: "Variante A: la edicion se rechaza con 'No hay una caja chica abierta para registrar el ingreso.' â€” un mensaje que no tiene nada que ver con corregir un typo de fecha, y que deja al usuario sin forma de hacerlo. Variante B: el movimiento original se da de baja logica dentro de la caja ya cerrada (su saldo recalculado deja de coincidir con el arqueo del cierre) y el movimiento nuevo se agrega a la caja abierta de HOY, pero fechado con la fecha del pago (que puede ser de semanas atras). Dos cajas quedan mal: la vieja de menos, la nueva de mas."
    expectativa: "Corregir el dato de un pago no deberia reescribir el arqueo de una caja ya cerrada. El criterio de PAT-020/MH-020 es reversar por CONTRAMOVIMIENTO (un egreso nuevo en la caja vigente que neutraliza el ingreso original) en vez de dar de baja el movimiento original â€” el ledger de caja queda inmutable y el impacto cae siempre en el periodo abierto. Y una edicion que no cambia el importe no deberia depender de que haya una caja abierta."
    causa_raiz: "PagoService.ReversarPago revierte haciendo soft-delete del MovimientoCaja original (criterio heredado literalmente de PagosController.EliminarPago), sin mirar el EstadoCaja de la caja a la que pertenece; y PagoService.RegistrarPagoInterno exige incondicionalmente una caja chica Abierta para dar de alta el pago corregido. La feature declara seguir 'ledger inmutable' (PAT-023), pero eso solo se cumple a nivel de la fila Pago (soft-delete + pago nuevo enlazado): a nivel de MovimientoCaja / MovimientoCuentaCorriente el movimiento original SI se borra, que es exactamente lo que la regla (b) de la nota de generalizacion de MH-020 prohibe. El efecto existia de antes en EliminarPago, pero la iteracion 3 lo amplia a TODA edicion de pago porque elimina el camino liviano ActualizarFechaPago (que solo hacia UPDATE de la fecha del pago y del movimiento, sin tocar cajas)."
    capa: Application
    archivos_fix:
      - path: Services/PagoService.cs
        motivo: "PENDIENTE â€” decision de negocio. Opcion A (alineada con MH-020/PAT-020): ReversarPago postea un contramovimiento de Egreso en la caja chica abierta en vez de soft-deletear el MovimientoCaja original. Opcion B (acotada): si la caja del movimiento original esta Abierta, mantener el soft-delete actual; si esta Cerrada, postear contramovimiento. Requiere aprobacion del duenio del estudio: cambia como se ve el arqueo historico."
    migracion_ef: null
    deteccion_qa:
      tipo: data
      selector_o_endpoint: "POST /Pagos/EditarPago sobre un pago cuyo MovimientoCaja pertenece a una Caja con Estado = Cerrada; comparar el saldo recalculado de esa caja (Cajas/Details, suma de MontoDecorado de movimientos no eliminados) antes y despues."
      condicion_falla: "El saldo recalculado de una caja YA CERRADA cambia como consecuencia de editar o eliminar un pago; o la edicion falla con 'No hay una caja chica abierta' cuando el importe del pago no cambio."
    criterio_aceptacion:
      - "Editar solo la fecha de un pago no cambia el saldo de ninguna caja cerrada."
      - "Editar un pago con la caja chica cerrada no falla con un error de caja (o, si la decision es exigir caja abierta, el mensaje lo explica en terminos de la edicion, no del ingreso)."
      - "El impacto neto en caja de una edicion que baja el monto de $X a $Y es exactamente -($X - $Y) sobre el periodo ABIERTO, sin retocar periodos cerrados."
    pruebas_minimas:
      - "Pago en caja cerrada -> editar solo fecha -> el arqueo de la caja cerrada queda identico."
      - "Sin caja chica abierta -> editar solo fecha -> resultado esperado segun la decision que se tome."
      - "Editar el monto de $1000 a $400 -> la caja vigente refleja -$600 neto, la caja original no cambia."
    nota_generalizacion: "Es la contracara de MH-020 regla (b) ('los pagos ya posteados se reversan por un CONTRAMOVIMIENTO nuevo â€” nunca editando ni borrando el movimiento original') mirada desde la EDICION en vez de la cancelacion. Aplica a todo proyecto del estudio que tenga (a) movimientos financieros agrupados en un contenedor con estado terminal (caja diaria, periodo contable, cierre mensual) y (b) una operacion de correccion que reversa el movimiento original. Regla: reversar SIEMPRE por contramovimiento en el periodo abierto; el soft-delete del movimiento original solo es aceptable si se puede garantizar que su periodo sigue abierto. Ojo tambien con la mitad simetrica: exigir un contenedor ABIERTO para poder corregir un dato que no mueve plata (una fecha) convierte una correccion trivial en una operacion bloqueada."


  - id: KOI-009
    modulo: Global / URLs AJAX bajo aplicacion anidada (_Layout, Dashboard, notifications.js)
    titulo: "Las llamadas AJAX con URL absoluta desde la raiz (/Controller/Accion) dan 404 cuando la app esta deployada como aplicacion ANIDADA bajo un subdirectorio (/koi)"
    severidad: major
    reproducido_en: produccion (https://portaldelinversor.com.ar/koi/)
    pasos:
      - "Deployar la app como aplicacion anidada bajo un subdirectorio (PathBase = /koi)."
      - "Abrir el Dashboard con la consola del navegador abierta."
      - "Observar la pestana Red."
    sintoma: "404 GET https://<host>/Notifications/GetRecent y 404 GET https://<host>/Dashboard/Historico?meses=12 (sin el prefijo /koi). La campanita de notificaciones nunca carga, el grafico historico del Dashboard queda vacio, y marcar notificaciones como leidas no persiste. En consola: 'Unexpected token <, \"<!DOCTYPE \"... is not valid JSON' — es el HTML del 404 parseado como JSON."
    expectativa: "Toda URL de AJAX se resuelve contra el PathBase de la app, no contra la raiz del host."
    causa_raiz: "5 call sites escriben la URL como literal absoluto desde la raiz ('/Notifications/GetRecent') en vez de resolverla con Url.Content('~/...'), Url.Action(...) o un prefijo global tomado de Request.PathBase. Funciona en local (donde PathBase es vacio) y se rompe solo al deployar anidado, por eso pasa el build y la prueba local."
    capa: Web
    archivos_fix:
      - path: KoiDumplings.Web/wwwroot/js/notifications.js
        motivo: "Lineas 11, 46 y 56: $.get('/Notifications/GetRecent'), $.post('/Notifications/MarkAsRead'), $.post('/Notifications/MarkAllAsRead'). Al ser un .js estatico no puede usar Url.Content: exponer el PathBase desde _Layout (ej. window.APP_BASE = '@Url.Content(\"~/\")') y prefijar."
      - path: KoiDumplings.Web/Views/Dashboard/Index.cshtml
        motivo: "Linea 906: fetch('/Dashboard/Historico?meses=' + meses) -> fetch('@Url.Action(\"Historico\", \"Dashboard\")?meses=' + meses)."
      - path: KoiDumplings.Web/Views/Shared/_Layout.cshtml
        motivo: "Linea 402: fetch('/Account/ToggleTema') -> Url.Action. Ademas es el lugar natural para publicar window.APP_BASE."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "Escuchar page.on('response') y filtrar status >= 400 mientras se navega el Dashboard"
      condicion_falla: "Aparece cualquier request 404 cuya URL NO contenga el PathBase de la app."
    criterio_aceptacion:
      - "Navegando cualquier pantalla no hay ningun 404 de endpoints propios."
      - "La campanita lista las notificaciones recientes."
      - "El grafico historico del Dashboard se dibuja con datos."
      - "El toggle de tema persiste tras recargar."
    pruebas_minimas:
      - "Con la app bajo /koi: abrir Dashboard y confirmar 0 requests 404 a endpoints propios."
      - "Click en la campanita -> se listan notificaciones."
      - "Cambiar el tema y recargar -> el tema elegido se mantiene."
    nota_generalizacion: "Aplica a TODO proyecto del estudio que se deployee bajo un subdirectorio (SmarterASP con aplicacion anidada). Regla: en Razor usar siempre Url.Action/Url.Content; en .js estaticos nunca escribir rutas absolutas desde la raiz — tomar el prefijo de una variable global publicada por el layout. El modo de falla es especialmente traicionero porque el build compila, la prueba local pasa, y en produccion la funcionalidad falla EN SILENCIO (un 404 de un GET AJAX no muestra nada al usuario)."

  - id: KOI-010
    modulo: P-03 Estado de Resultados mensual / repintado AJAX del % de referencia
    titulo: "El % de referencia de un concepto porcentual se repinta como '3.00 %' (punto) en vez de '3,00 %' (coma) tras revertir/guardar por AJAX"
    severidad: minor
    reproducido_en: produccion (https://portaldelinversor.com.ar/koi/), periodo 2026-09
    pasos:
      - "Como Administrador abrir Estado de Resultados de un periodo ABIERTO."
      - "Sobrescribir a mano el importe de un concepto porcentual (ej. Regalias 3%)."
      - "Pulsar el boton 'volver al %' de la columna de porcentaje y confirmar."
      - "Mirar la celda del % SIN recargar la pagina."
    sintoma: "La celda muestra '3.00 %' con punto decimal. Al recargar la pagina vuelve a verse '3,00 %'. Convive en la misma grilla con importes formateados en es-AR, asi que la inconsistencia es visible."
    expectativa: "El repintado por AJAX respeta el mismo formato es-AR que rinde Razor con ToString(\"N2\")."
    causa_raiz: "pintarPorcentajeConcepto() usaba valor.toFixed(2), que siempre emite punto decimal, en vez del helper fmt() que el resto de la vista ya usa (toLocaleString('es-AR')). Es el unico repintado numerico de la vista que no pasa por fmt()."
    capa: Web
    archivos_fix:
      - path: KoiDumplings.Web/Views/EstadoResultados/Mensual.cshtml
        motivo: "En pintarPorcentajeConcepto(): reemplazar valor.toFixed(2) por fmt(valor), conservando el fallback '—' cuando no hay porcentaje."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "span.porcentaje-valor dentro de tr[data-subgrupo-id] tras un POST a RevertirConcepto o GuardarVentas"
      condicion_falla: "El texto del span contiene el porcentaje con PUNTO decimal (ej. 3.00 %) en vez de coma (3,00 %)."
    criterio_aceptacion:
      - "Tras revertir al %, la celda muestra el porcentaje con coma decimal, igual que tras una recarga."
      - "El fallback '—' se conserva cuando el concepto no tiene porcentaje."
    pruebas_minimas:
      - "Override + revertir sobre un concepto porcentual -> la celda muestra '3,00 %' sin recargar."
      - "Recargar la pagina -> el valor coincide con el que se veia antes de recargar."
    nota_generalizacion: "Patron a vigilar en toda vista que repinte numeros por AJAX: el servidor rinde con la cultura es-AR y el cliente tiende a usar toFixed(), que es invariante. Si la vista ya tiene un helper de formato, TODO repintado numerico debe pasar por el; un solo call site que se saltee el helper produce una inconsistencia visible dentro de la misma grilla."

  - id: KOI-011
    modulo: Auditoria transversal / AuditLogs.Action
    titulo: "Una accion de auditoria de negocio mas larga que la columna Action mata en silencio la funcionalidad que la escribe"
    severidad: critical
    reproducido_en: "dev (copia de produccion) 2026-09-11; confirmado en produccion por inspeccion de esquema: la columna es varchar(20) y NO existe ninguna fila con las dos acciones nuevas, o sea que las dos funciones nunca se completaron desde que se entregaron"
    pasos:
      - "Como Administrador abrir el Estado de Resultados de un mes CERRADO."
      - "Editar el importe de un gasto y confirmar el aviso de impacto en liquidaciones."
      - "Variante 2: en un mes abierto, pulsar 'Recalcular %' con un concepto escrito a mano y confirmar el pisado."
    sintoma: "El aviso previo funciona perfecto, pero al confirmar no se guarda nada: 'No se pudo guardar la correccion. No se modifico nada.' En la variante 2, HTTP 500 con body vacio. En el log: MySqlException: Data too long for column 'Action' at row 1."
    expectativa: "La correccion se guarda y queda su registro de auditoria."
    causa_raiz: "AppDbContext dimensiono AuditLogs.Action con HasMaxLength(20) pensando en el audit automatico ('Create'/'Update'/'Delete'), pero los servicios escriben ademas auditoria de NEGOCIO con nombres descriptivos. 'EdicionPeriodoCerrado' y 'RecalculoPisaManuales' miden 21; 'ReasignacionConcepto' mide 20 exactos y pasaba raspando. El SaveChanges es unico, asi que la transaccion revierte entera: es fail-safe, pero la funcion queda muerta."
    capa: Infrastructure
    archivos_fix:
      - path: KoiDumplings.Infrastructure/Data/AppDbContext.cs
        motivo: "Action a HasMaxLength(50): mas del doble de margen sobre la accion mas larga."
    migracion_ef: "20260911132810_E24_AuditLogActionLength (AlterColumn a varchar(50)). En MySQL 'dotnet ef migrations script --idempotent' NO sirve: emite IF NOT EXISTS ... BEGIN ... END, que fuera de un procedimiento es error de sintaxis. Hay que escribir el equivalente a mano (ALTER por sentencia preparada condicionada a information_schema + INSERT ... WHERE NOT EXISTS en __EFMigrationsHistory)."
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "POST /EstadoResultados/GuardarConceptoEnPeriodoCerrado y POST /EstadoResultados/PisarManuales"
      condicion_falla: "Tras confirmar, la operacion no persiste (o responde 500) y el log trae 'Data too long for column'."
    criterio_aceptacion:
      - "Las dos operaciones persisten el cambio Y su fila en AuditLogs."
      - "Ninguna Action del codigo supera el largo declarado en el modelo."
    pruebas_minimas:
      - "Corregir un gasto de un mes cerrado -> el importe cambia y queda una fila con Action='EdicionPeriodoCerrado'."
      - "Pisar un concepto manual con el recalculo -> el importe cambia y queda una fila con Action='RecalculoPisaManuales'."
    nota_generalizacion: "Aplica a TODO proyecto del estudio con auditoria propia. Regla: si el codigo escribe nombres de accion descriptivos, la columna NO puede dimensionarse para los verbos del audit automatico. El modo de falla es traicionero: el build compila, el analisis estatico no lo ve, la UI muestra su aviso previo correctamente, y recien al confirmar revienta contra la base — y como el rollback deja todo intacto, parece 'no hizo nada' en vez de 'fallo'. Chequeo barato: comparar el largo de cada literal de Action contra el HasMaxLength del modelo. Peor consecuencia posible: el usuario que no puede corregir un mes cerrado recurre a REABRIRLO, que es la operacion destructiva que esa funcionalidad venia a evitar."

  - id: KOI-012
    modulo: Migraciones de datos / consolidacion de catalogos
    titulo: "Una migracion de datos con ids de produccion escritos a mano traslada plata al concepto equivocado en cualquier otra base"
    severidad: major
    reproducido_en: "dev (copia de produccion) 2026-09-11, migracion E20_ConsolidacionCatalogos_A2"
    pasos:
      - "Tomar una base cuyo catalogo tenga los mismos conceptos pero con otros Id (dev, o una base nueva creada con dotnet ef database update)."
      - "Correr la migracion de consolidacion."
      - "Mirar a que concepto quedaron imputados los importes historicos."
    sintoma: "La migracion corre sin error y los totales por periodo no se mueven, pero la imputacion queda corrupta: 'Alquiler del local 4.500.000' aterriza en 'Cristaleria & Equipamiento', 'Otros gastos 10.022.838,72' en 'Pastillas Horno Rational'. 133 filas creadas, 266 actualizadas, 133 dadas de baja."
    expectativa: "La migracion mueve los conceptos correctos, o no mueve nada."
    causa_raiz: "El mapeo estaba escrito como pares de Id literales de produccion (12->39, 13->40, ...). Los Id son datos de una base concreta, no identidad estable del dominio: en otra base esos numeros son otros conceptos."
    capa: Infrastructure
    archivos_fix:
      - path: KoiDumplings.Infrastructure/Data/Migrations/20260910014549_E20_ConsolidacionCatalogos_A2.cs
        motivo: "Cada par declara los nombres esperados de origen y destino; las seis sentencias que usan el mapa los validan por JOIN contra Subgrupos. Un par que no coincide queda intacto, y se registra una fila 'MigracionOmitida' en AuditLogs."
    migracion_ef: "No se crea una migracion nueva: se endurece la ya aplicada. En produccion esta registrada en __EFMigrationsHistory, asi que editarla NO la re-ejecuta; el cambio protege entornos nuevos."
    deteccion_qa:
      tipo: datos
      selector_o_endpoint: "Estado de Resultados de un mes historico posterior a la migracion"
      condicion_falla: "Un importe historico aparece bajo un concepto que no tiene nada que ver con el original."
    criterio_aceptacion:
      - "En una base con los nombres esperados, la migracion produce el mismo resultado que antes."
      - "En una base donde los nombres no coinciden, no mueve nada y deja constancia."
    pruebas_minimas:
      - "Dos bases gemelas (mismos ids e importes, distintos nombres): la de forma de produccion consolida; la otra deja 0 tocadas, 0 creadas, 0 de baja y 1 aviso."
      - "Los totales por periodo quedan identicos en los dos casos."
    nota_generalizacion: "Aplica a TODA migracion de datos del estudio. Regla: una migracion nunca debe direccionar filas por Id de una base concreta — resolver por clave natural (nombre, codigo) y validarla antes de escribir; si no matchea, no tocar nada y dejar rastro. Ojo con dos restricciones de MySQL al escribir la guarda: no se puede hacer UPDATE de una tabla usando esa misma tabla en una subconsulta del FROM ('You can't specify target table for update in FROM clause'), y MySql.Data interpreta las variables de sesion @var como parametros ('Parameter must be defined'), asi que la guarda termina siendo por fila con JOIN plano y no todo-o-nada."

  - id: KOI-013
    modulo: Configuracion / Benchmarks de mercado — checkbox booleano con hidden companion
    titulo: "El hidden en false escrito ANTES del checkbox hace que un bool siempre llegue en false al binder"
    severidad: major
    reproducido_en: "dev (copia de produccion) 2026-09-11, pantalla Configuracion > Benchmarks"
    pasos:
      - "Abrir Configuracion > Benchmarks como Administrador."
      - "Tildar 'Se muestra' en un benchmark (ej. S&P 500) y guardar la fila."
      - "Mirar el valor de Activo en la base, y el reporte de cualquier inversor."
    sintoma: "El benchmark queda Activo=0 aunque el tilde estaba puesto, y DESAPARECE de la comparativa de mercado de los 15 inversores. Volver a tildarlo no lo arregla: cae en el mismo camino. Un benchmark nuevo nace apagado."
    expectativa: "El tilde puesto guarda Activo=1 y el benchmark aparece en la comparativa."
    causa_raiz: "En la vista, el <input type=hidden name=activo value=false> estaba escrito ANTES del <input type=checkbox name=activo value=true>. Con el checkbox tildado el navegador manda los dos valores en el orden del DOM ('false','true') y el binder de bool se queda con el PRIMERO. El comentario del codigo describia el patron correcto, pero el orden hacia lo contrario."
    capa: Web
    archivos_fix:
      - path: KoiDumplings.Web/Views/Configuracion/Benchmarks.cshtml
        motivo: "Checkbox primero, hidden despues — el orden que genera asp-for. Aplica a la fila de edicion inline y a la fila de alta."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "POST de la fila de Benchmarks; leer new FormData(form).getAll('activo')"
      condicion_falla: "El cuerpo del POST manda ['false','true'] (hidden primero) y/o el registro queda en 0 con el tilde puesto."
    criterio_aceptacion:
      - "Tilde puesto -> 1; destildado -> 0; vuelto a tildar -> 1."
      - "Un registro nuevo con el tilde por defecto nace en 1."
    pruebas_minimas:
      - "Los tres pasos (poner, sacar, volver a poner) leidos contra la base, no contra la pantalla."
      - "El benchmark activo aparece en la comparativa del reporte del inversor y el desactivado no."
    nota_generalizacion: "Aplica a TODO proyecto del estudio con checkboxes booleanos en formularios armados a mano (edicion inline en tabla, forms fuera del <table> enganchados con form=...), donde no se puede usar asp-for. Regla: checkbox PRIMERO, hidden false DESPUES; el binder de bool toma el primer valor de la coleccion. El modo de falla es silencioso — la pantalla vuelve a dibujar el tilde como el usuario lo dejo y recien se nota cuando alguien mira el efecto aguas abajo. Chequeo barato: grep de type=\"hidden\" inmediatamente antes de un checkbox con el mismo name."

  - id: KOI-014
    modulo: Dashboard / script de inicio que toca botones que pueden no existir
    titulo: "Un getElementById sin guard en el arranque deja la pantalla entera en blanco cuando el markup condicional no se renderizo"
    severidad: minor
    reproducido_en: "dev (copia de produccion) 2026-09-11, /Dashboard?anio=2024&mes=5 con usuario Inversor"
    pasos:
      - "Entrar como Inversor a Rendimiento Historico."
      - "Elegir en el selector un anio/mes sin datos cargados."
    sintoma: "Pantalla vacia y TypeError: Cannot read properties of null (reading 'classList'). Como el error corta el script, se cae todo lo que venia despues."
    expectativa: "La pantalla renderiza su aviso de 'sin datos' y la consola queda limpia."
    causa_raiz: "cargarHistorico() hacia document.getElementById('btnHist12').classList.toggle(...) y se invocaba incondicionalmente al final del script, aunque el bloque de botones y el canvas viven dentro de un @if del markup."
    capa: Web
    archivos_fix:
      - path: KoiDumplings.Web/Views/Dashboard/Index.cshtml
        motivo: "Resolver primero el canvas y salir temprano si no esta, mas null-guard en los dos botones. El early return ademas evita disparar un fetch cuyo resultado no tendria donde ir."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "Cualquier pantalla con graficos, en el estado 'sin datos'"
      condicion_falla: "La consola del navegador trae un TypeError sobre null en el arranque, y/o la pantalla queda vacia."
    criterio_aceptacion:
      - "En el estado sin datos: renderiza el aviso y la consola queda sin errores."
      - "En el estado con datos: el grafico se dibuja igual que antes."
    pruebas_minimas:
      - "Navegador real sobre el estado sin datos -> 0 errores de consola."
      - "Navegador real sobre el estado con datos -> canvas dibujado y toggles funcionando."
    nota_generalizacion: "Aplica a TODA vista del estudio que mezcle markup condicional con un script de inicio. Regla: un script que corre en el arranque debe estar bajo la MISMA condicion que el markup que toca, o resolver el elemento y salir temprano. Verificar el estado vacio con navegador real y consola abierta: es el estado que nadie prueba, y un unico TypeError temprano apaga el resto de la pantalla."

