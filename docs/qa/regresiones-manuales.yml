  # ── Entradas especificas del proyecto ShowroomGriffin (BlankProject .NET 10 + EF Core + MySQL) ──

  - id: SG-001
    modulo: "Stock / MatrizEditar (grilla pivot Color x Talle con altas desde celdas vacias)"
    titulo: "Una grilla que postea inputs numericos opcionalmente vacios contra un ViewModel con tipos de valor NO nullables bloquea el POST completo por error de model binding, sin guardar ninguna fila valida"
    severidad: critical
    reproducido_en: "main (commit f400671, ya desplegado a produccion)"
    pasos:
      - "Como Administrador, ir a /Stock/Matriz y elegir una Marca cuya tabla muestre al menos una celda vacia '—'."
      - "Pulsar 'Editar stock de esta marca' para entrar a /Stock/MatrizEditar?marcaId=X."
      - "Modificar la cantidad de una o mas celdas que SI tienen stock."
      - "Dejar vacias todas las celdas '—' (caso normal: el usuario no quiere dar de alta esos talles)."
      - "Escribir un Motivo y pulsar 'Guardar cambios', confirmando el dialogo SweetAlert2."
    sintoma: "Aparece un toast rojo de error con un mensaje generico de framework (tipo \"The value '' is invalid.\") y NO se guarda absolutamente nada: ni las altas ni las celdas existentes que se habian editado correctamente. El historial de movimientos de stock queda sin registros nuevos."
    expectativa: "Se guardan las celdas modificadas y las celdas '—' vacias se ignoran en silencio (criterio explicito del propio servicio: 'if (alta.CantidadNueva <= 0) continue; // el usuario no cargo nada en esta celda')."
    causa_raiz: "Doble causa independiente, ambas en la frontera vista <-> ViewModel. (1) StockMatrizAltaGuardarViewModel declara CantidadNueva como int, PrecioVenta como decimal y StockMinimo como int — tipos de valor NO nullables — mientras MatrizEditar.cshtml renderiza el input de cantidad SIN atributo value. Un <input type=number> vacio postea cadena vacia; SimpleTypeModelBinder la convierte a null y, al no ser el tipo nullable, agrega error de ModelState via ValueMustNotBeNullAccessor, por lo que el guard !ModelState.IsValid del controller retorna antes de invocar el servicio. El ViewModel analogo de Carga Masiva (StockCargaMasivaFilaViewModel) si usa int?/decimal?, por eso esa pantalla no falla. (2) La cultura global de la app es es-AR, asi que Razor serializa el decimal sugerido con coma decimal ('45000,00'); el algoritmo de saneamiento de valor de HTML5 deja vacio cualquier input type=number cuyo valor no sea un valid floating-point number, y la funcion JS que sincroniza el precio de la fila hacia los hidden de cada alta copia ese vacio SOBRE el hidden que el servidor ya habia renderizado bien — destruyendo un valor correcto y produciendo el mismo error de binding por una segunda via."
    capa: Application + Web
    archivos_fix:
      - path: ShowroomGriffin.Application/DTOs/Stock/StockViewModels.cs
        motivo: "StockMatrizAltaGuardarViewModel: pasar CantidadNueva/PrecioVenta/StockMinimo a int?/decimal?/int? (misma forma que StockCargaMasivaFilaViewModel)."
      - path: ShowroomGriffin.Infrastructure/Services/StockService.cs
        motivo: "GuardarMatrizAsync: ajustar los guards del loop de Altas a HasValue antes de comparar/usar los valores."
      - path: ShowroomGriffin.Web/Views/Stock/MatrizEditar.cshtml
        motivo: "Renderizar el precio sugerido con CultureInfo.InvariantCulture, y en sincronizarPrecioYMinimoDeAltas() no sobrescribir el hidden cuando el input visible este vacio."
    migracion_ef: null
    deteccion_qa:
      tipo: static
      selector_o_endpoint: "Cualquier vista que postee inputs indexados opcionales (Coleccion[i].Campo) contra un ViewModel cuyo miembro correspondiente sea un tipo de valor no nullable (int/decimal/DateTime sin ?); y cualquier <input type=number> cuyo value se renderice desde un decimal bajo una cultura con coma decimal."
      condicion_falla: "Existe al menos un input del formulario que puede quedar vacio y cuyo miembro destino en el ViewModel NO es nullable; o un input type=number con value renderizado desde decimal/decimal? sin CultureInfo.InvariantCulture."
    criterio_aceptacion:
      - "Guardar la Matriz de una marca con celdas '—' vacias persiste las celdas modificadas y no reporta error."
      - "El input de Precio por fila muestra el precio sugerido, no un campo vacio."
      - "Cargar una cantidad en una celda '—' crea la variante con el precio y stock minimo sugeridos correctos."
      - "Los mensajes de error que ve el usuario son de negocio (en castellano), nunca mensajes de model binding del framework."
    pruebas_minimas:
      - "Editar 2 celdas con stock dejando todas las '—' vacias -> debe guardar."
      - "Editar 2 celdas y ademas cargar cantidad en 1 celda '—' -> debe guardar ambas cosas."
      - "Vaciar a mano el precio de una fila y cargar una '—' de esa fila -> debe dar error de negocio claro, no error de binding."
      - "Regresion: /Stock/CargaMasiva sigue guardando con filas vacias (ViewModel nullable, no afectado)."

  # ── Entradas especificas del proyecto La Platense (ferreteria, BlankProject .NET 10 + EF Core + MySQL) ──

  - id: LP-001
    modulo: "Clasificacion ABC automatica (ClasificacionAbcAutomaticaService.RecalcularAsync) — Etapa 3, migracion de catalogo"
    titulo: "El calculo por lote de rotacion ABC agrega ItemVenta de TODAS las Ventas de la ventana sin filtrar Venta.Estado: los borradores (carritos editables que todavia no vendieron) y las ventas anuladas cuentan como cantidad vendida e inflan la clase ABC sugerida del producto"
    severidad: major
    reproducido_en: "migracion-catalogo (cambios sin commitear, revision de codigo pre-merge)"
    pasos:
      - "Como Administrador, crear una Venta nueva y agregar un item con una cantidad alta de un producto que normalmente no rota (ej. 500 unidades)."
      - "Dejar la venta en estado Borrador — NO facturarla (no emitir comprobante AFIP)."
      - "Ir a /Stock y ejecutar 'Recalcular clasificacion ABC' con ventana de 12 meses."
      - "Abrir el producto del borrador en /Productos/Edit y mirar la clasificacion ABC sugerida."
    sintoma: "El producto del borrador aparece con clasificacion ABC sugerida 'A' (o 'B') pese a no tener ninguna venta real: el resumen del recalculo lo cuenta en 'productos con ventas en el periodo' y le sugiere una clase alta. Borrar el borrador o dejarlo abandonado no revierte la sugerencia hasta el siguiente recalculo. En un sistema con el modulo de anulacion por nota de credito ya implementado, el mismo efecto lo produce una venta Anulada."
    expectativa: "Solo los items de Ventas efectivamente consumadas (Estado == Facturada) cuentan como cantidad vendida para el Pareto. Un Borrador no vendio nada y una Anulada se revirtio: ninguno de los dos debe influir en la rotacion. Es el mismo criterio que ya aplica DashboardService.ObtenerProductosMasVendidos sobre la misma agregacion."
    causa_raiz: "La query de agregacion filtra unicamente por rango de fechas sobre la navegacion (i.Venta.Fecha >= desdeUtc && i.Venta.Fecha <= hastaUtc) y omite el predicado de estado de la entidad padre. ItemVenta existe desde que se agrega la linea al Borrador (la Venta nace editable en este proyecto y se vuelve inmutable al facturar), por lo que la tabla hija contiene filas que no representan ninguna venta consumada. Patron generalizable: un calculo agregado sobre filas hijas debe filtrar por el estado actual de la entidad padre, contra el conjunto explicito de estados validos (== Facturada), nunca por fecha sola ni por una comparacion negativa generica (!= Borrador) que dejaria pasar los estados terminales como Anulada."
    capa: Infrastructure
    archivos_fix:
      - path: FerreteriaLaPlatense.Infrastructure/Services/ClasificacionAbcAutomaticaService.cs
        motivo: "RecalcularAsync: agregar i.Venta.Estado == EstadoVenta.Facturada al Where de la agregacion de ItemsVenta, y documentar el criterio en el XML-doc de la clase (punto 2)."
    migracion_ef: null
    deteccion_qa:
      tipo: static
      selector_o_endpoint: "Cualquier agregacion/ranking/Pareto sobre una tabla hija de un documento con maquina de estados (ItemVenta, ItemCompra, DetalleRemito): revisar que el Where incluya el estado del padre, no solo el rango de fechas."
      condicion_falla: "Existe una query que agrupa/suma filas hijas de un documento con estados (Borrador/Facturada/Anulada, Borrador/Generada/Cancelada) filtrando por fecha del padre pero SIN filtrar su Estado contra el conjunto explicito de estados consumados."
    criterio_aceptacion:
      - "El recalculo ABC ignora por completo los items de Ventas en Borrador y en Anulada."
      - "El contador 'productos con ventas en el periodo' del resumen del recalculo coincide con la cantidad de productos que aparecen en ventas Facturadas de la ventana."
      - "El criterio de estado esta documentado en el XML-doc del servicio, alineado con el codigo."
      - "El recalculo sigue escribiendo unicamente ClasificacionABCSugerida, nunca ClasificacionABC."
    pruebas_minimas:
      - "Venta en Borrador con cantidad alta de un producto sin rotacion -> recalcular -> el producto NO debe quedar A/B por ese borrador."
      - "Facturar esa misma venta -> recalcular -> ahora si debe reflejarse en la sugerencia."
      - "Regresion: el resumen del recalculo (A/B/C y productos con venta) sigue devolviendo numeros coherentes con el total del catalogo."
      - "Regresion: 'Aceptar sugerencia' en la ficha de producto sigue copiando la sugerencia al campo manual."

