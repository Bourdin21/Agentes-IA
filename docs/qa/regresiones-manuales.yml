  - id: OLV-011
    modulo: "Formularios de EDICION con un campo fecha que el servidor solo valida cuando cambia — Asignaciones/Editar (M7b, input date con min=hoy)"
    titulo: "Editar una asignacion ya vencida es imposible: el atributo min=hoy del input date bloquea el submit con 'Please enter a value greater than or equal to 2026-09-15.' (en ingles) aunque la fecha no se toque"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro, QA M7b 2026-09-15 (localhost, Playwright; /Asignaciones/Editar/{id} de una asignacion con VenceEl en el pasado)"
    pasos:
      - "Crear una asignacion con vencimiento y dejar pasar la fecha (en QA: UPDATE TareasAsignadas SET VenceEl = CURDATE() - INTERVAL 10 DAY WHERE Id = <id>)."
      - "Abrir /Asignaciones/Editar/<id>, cambiar solo el titulo (o la persona) SIN tocar la fecha y pulsar Guardar."
      - "Comparar con un POST directo a /Asignaciones/Editar/<id> con el MISMO valor de VenceEl: el servidor lo acepta."
    sintoma: "El formulario no se envia nunca: queda en pantalla 'Please enter a value greater than or equal to <hoy>.' (en ingles, del bundle de jquery-validate) bajo el campo Vence. El Director no puede reasignar, corregir el titulo ni cambiar el cliente de una asignacion vencida sin ADEMAS moverle el vencimiento. El servidor si acepta el guardado (verificado por POST con el mismo valor persistido): el bloqueo es solo del navegador."
    expectativa: "El servidor exige 'hoy o mas adelante' SOLO cuando el vencimiento cambia (regla de diseno D-M7-15); el cliente tiene que hacer lo mismo: se puede guardar una asignacion vencida sin tocar la fecha, y si la persona SI la cambia se vuelve a exigir hoy o mas adelante, con el mensaje en castellano."
    causa_raiz: "La vista renderiza siempre min=\"@hoy\" en el <input type=date>. jquery-validate deriva una regla 'min' de ese atributo HTML5 y la aplica al valor PERSISTIDO al reabrir el registro, aunque el usuario no lo haya tocado; el mensaje sale del bundle en ingles porque el proyecto no localiza $.validator.messages. Como en GAN-006 (step vs decimal(9,4)), el alta no lo detecta: el campo arranca vacio o con una fecha futura y solo falla al REABRIR un registro guardado. Los tests de servicio no lo ven: el servicio acepta el guardado."
    capa: Web
    archivos_fix:
      - path: OlvidataAgentes.Web/Views/Asignaciones/Form.cshtml
        motivo: "min solo cuando el valor cargado NO quedo en el pasado (venceViejo => min vacio); listener change que repone min=hoy apenas la persona cambia la fecha; $.validator.messages.min en castellano con el mismo texto del servidor."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-15"
      por: "QA (auto-fix, sin logica de negocio nueva: el cliente pasa a replicar la regla que el servidor ya tenia)"
      resultado: "aplicado"
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "pantalla de EDICION con <input type=date ... min/max>: abrir un registro cuya fecha persistida queda fuera del rango y guardar sin tocarla"
      condicion_falla: "El submit no se envia, o aparece cualquier mensaje 'Please enter a value ...' en ingles."
    criterio_aceptacion:
      - "Editar una asignacion vencida cambiando solo el titulo guarda sin errores y deja VenceEl igual."
      - "Si se cambia la fecha a una pasada, se rechaza con 'La fecha tiene que ser hoy o mas adelante.' (castellano) en cliente y en servidor."
      - "El alta sigue con min=hoy y rechaza la fecha de ayer."
    pruebas_minimas:
      - "Navegador: editar una asignacion vencida sin tocar la fecha (guarda); cambiar la fecha a 2020-01-01 (rechaza en castellano); alta con la fecha de ayer (rechaza); chips Hoy / Manana / En una semana / Sin fecha."
      - "POST directo con el mismo VenceEl persistido: el servidor lo acepta."
    nota_generalizacion: "Familia de GAN-006 y OLV-005: un atributo de validacion HTML5 (min, max, step, pattern) que expresa la regla del ALTA se aplica igual en la EDICION, donde el valor persistido puede haber quedado fuera del rango legitimamente (fechas que pasan, precios que cambian de escala, estados heredados). Regla para todo proyecto del estudio: (a) cuando el servidor valida un campo SOLO si cambia, la vista tiene que emitir el atributo SOLO si el valor cargado ya cumple, y reponerlo en el evento change; (b) todo mensaje de jquery-validate derivado de atributos HTML5 sale en ingles salvo que se sobreescriba $.validator.messages, asi que el barrido de QA de cada formulario nuevo incluye disparar la validacion del cliente, no solo leer los data-val-*. Se detecta unicamente reabriendo un registro guardado con el valor fuera de rango."

