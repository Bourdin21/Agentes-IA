    fix_aplicado:
      fecha: "2026-09-15"
      por: "QA M5 (auto-fix, extension del fix catalogado)"
      resultado: "aplicado"
      archivos:
        - path: OlvidataAgentes.Web/wwwroot/css/site.css
          motivo: "[data-theme=dark] .select2-selection--multiple .select2-selection__choice con color/borde/fondo por tokens, X invertida y campo de busqueda con --ov-text."
        - path: OlvidataAgentes.Web/wwwroot/css/site.css
          motivo: "REINCIDENCIA en QA M8 2026-09-16 (tercera libreria con markup propio): el .accordion de Bootstrap 5.1 fija background-color: #fff a mano (no usa variables), asi que la pantalla de casos de prueba —unico uso de .accordion del portal— quedaba blanca en tema oscuro con todo su contenido ilegible (176 mediciones bajo 4,5). Bloque [data-theme=dark] para .accordion-item/.accordion-button/.accordion-body con los tokens --ov-*."

  - id: OLV-002
    modulo: "Tema oscuro / alertas .ov-alert (danger, warning, info, success) y badge bg-info text-dark"
    titulo: "En tema oscuro el texto de las alertas .ov-alert queda oscuro sobre fondo oscuro (contraste 1,5-2,6) y el badge bg-info text-dark queda blanco sobre celeste"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro, QA M3b 2026-09-14 (localhost, Playwright; detalle de tarea con turno fallido, limite de ajustes y suscripcion vencida)"
    pasos:
      - "Activar el tema oscuro (toggle del topbar o cookie crm-tema=dark)."
      - "Abrir una pantalla con .ov-alert: detalle de una tarea con un turno Fallido (alerta danger), una tarea que llego al limite de ajustes (warning), Reglas como Empleado o el aviso de reglas cambiadas (info)."
      - "Mirar el texto de la alerta y el badge 'Ajuste' de la conversacion."
    sintoma: "El mensaje de error del turno (#991b1b sobre fondo rgba .15 casi negro) practicamente no se lee: contraste 1,54 en danger, 1,96 en warning y 2,61 en info. El badge 'Ajuste' (bg-info text-dark) muestra texto blanco sobre celeste (1,79). En tema claro todo cumple (5,1 a 7,9)."
    expectativa: "En tema oscuro el texto de cada .ov-alert usa un tono claro de su color y el badge bg-info text-dark conserva texto oscuro; contraste >= 4,5 en todos los casos."
    causa_raiz: "olvidata-theme.css redefine en [data-theme=dark] los fondos --ov-*-subtle como rgba(...,0.15) pero .ov-alert.{info,success,warning,danger} tiene color de texto fijo pensado para fondo claro. Ademas el theme fuerza [data-theme=dark] .text-dark { color: var(--ov-text) !important }, que tambien pisa el texto de los badges bg-info/bg-warning con text-dark (fondo fijo claro)."
    capa: Web
    archivos_fix:
      - path: OlvidataAgentes.Web/wwwroot/css/site.css
        motivo: "Overrides [data-theme=dark] con tonos claros para .ov-alert.info/.success/.warning/.danger (y sus enlaces) y color oscuro !important para .badge.bg-info.text-dark y .badge.bg-warning.text-dark (especificidad mayor que el .text-dark del theme)."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "getComputedStyle('.ov-alert.danger > div').color contra el fondo efectivo (componiendo alpha de ancestros) con data-theme=dark; idem .ov-alert.warning, .ov-alert.info y .badge.bg-info.text-dark"
      condicion_falla: "Con data-theme=dark el contraste WCAG entre texto y fondo efectivo de una .ov-alert o de un badge text-dark es menor a 4,5."
    criterio_aceptacion:
      - "Tema oscuro: alertas danger, warning e info legibles (contraste >= 4,5), incluidos sus enlaces; badge 'Ajuste' con texto oscuro."
      - "Tema claro: sin cambios."
    pruebas_minimas:
      - "Navegador real en tema oscuro: medir contraste de las cuatro variantes de .ov-alert y del badge; captura por elemento."
      - "Mismo recorrido en tema claro para descartar regresion."
    nota_generalizacion: "Aplica a todo proyecto del baseline con olvidata-theme.css y tema oscuro (PAT-009): el hueco es del theme, no de una pantalla. OBS-4 de QA M2 (ov-alert info con bajo contraste) era el mismo problema. Regla: al usar fondos 'subtle' con alpha en tema oscuro, el color de texto del componente tambien tiene que tener su variante oscura; y un override global con !important (.text-dark) rompe los badges de fondo claro."

  - id: OLV-003
    modulo: "Tema claro/oscuro / textos de riesgo: .dropdown-item.text-danger en menus y motivo de una card atenuada (opacity) con color danger"
    titulo: "Texto rojo de accion o de motivo con contraste bajo: dropdown-item text-danger en tema oscuro (3,23) y motivo 'No disponible' dentro de una card con opacity .72 en tema claro (2,69)"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro, QA M4 2026-09-14 (localhost, Playwright; catalogo de Agentes con menu ⋮ y agente de la empresa con la suscripcion del rubro vencida)"
    pasos:
      - "Tema oscuro: abrir el menu ⋮ de una card de agente (o el menu de usuario del topbar) y mirar 'Archivar' / 'Cerrar sesion'."
      - "Tema claro: quitar la licencia del rubro de un agente de la empresa y abrir Agentes: la card queda atenuada con 'Este agente no esta disponible: la suscripcion a <rubro> no esta vigente.'"
      - "Medir el contraste efectivo (color del texto compuesto con la opacidad heredada contra el fondo efectivo)."
    sintoma: "Oscuro: #dc3545 sobre #1e293b = 3,23. Claro: #ef4444 con opacity .72 heredada de la card sobre blanco = 2,69: el motivo, que es justamente lo que explica por que no se puede usar el agente, es lo menos legible de la card."
    expectativa: "Textos rojos de accion y de motivo con contraste >= 4,5 en ambos temas; la atenuacion de una card no disponible no alcanza al texto que explica el motivo."
    causa_raiz: "Bootstrap .text-danger (#dc3545, !important) no tiene variante para [data-theme=dark]; y .ov-card-atenuada aplica opacity a toda la card, que se multiplica sobre cualquier color del contenido (incluido el motivo en --ov-danger #ef4444, que en blanco ya ronda 3,8)."
    capa: Web
    archivos_fix:
      - path: OlvidataAgentes.Web/wwwroot/css/site.css
        motivo: "Opacity de la card atenuada solo en nombre, badges y descripcion; motivo en rojo AA (#b91c1c en claro, #fca5a5 en oscuro) con opacidad plena; [data-theme=dark] .dropdown-item.text-danger con tono claro !important."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "getComputedStyle('.dropdown-menu.show .dropdown-item.text-danger').color con data-theme=dark; getComputedStyle('.ov-motivo-no-disponible').color compuesto con la opacity de .ov-card-atenuada, contra el fondo efectivo, en ambos temas"
      condicion_falla: "Contraste WCAG efectivo < 4,5 del item rojo del menu en tema oscuro o del motivo de la card atenuada en cualquier tema."
    criterio_aceptacion:
      - "Tema oscuro: 'Archivar' y 'Cerrar sesion' legibles (>= 4,5)."
      - "Ambos temas: motivo 'No disponible' >= 4,5 y la card sigue viendose atenuada (nombre, badges y descripcion)."
    pruebas_minimas:
      - "Navegador real: medir el item rojo del menu en oscuro y el motivo de una card no disponible en claro y oscuro, esperando al fin del fundido de pagina (fadeIn 250ms) antes de medir."
      - "Captura de la card no disponible en ambos temas."
    nota_generalizacion: "Aplica a todo proyecto del baseline con olvidata-theme.css: cualquier .text-danger/.text-warning de Bootstrap usado como texto (no como fondo) necesita variante oscura, y una atenuacion por opacity sobre un contenedor degrada tambien el texto que explica el estado. Regla: atenuar solo lo decorativo y dejar el mensaje de estado con opacidad plena. Ojo al medir: el layout aplica fadeIn (opacity 0 → 1) al contenido; medir antes de que termine da contraste 1 falso."

  - id: OLV-004
    modulo: "Tema claro/oscuro / botones outline y enlaces de marca: btn-outline-secondary, btn-outline-info, btn-outline-primary y a con color de marca"
    titulo: "Botones outline y enlaces con color de Bootstrap/marca sin variante por tema: btn-outline-secondary 3,12 en oscuro, btn-outline-info 1,96 y btn-outline-primary/enlaces 2,70-2,98 en claro"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro, QA M4b 2026-09-14 (localhost, Playwright; Reglas, Configurar conversando, conversacion con tarjetas y detalle de regla)"
    pasos:
      - "Tema oscuro: Reglas > Configurar conversando > Nueva conversacion (chips) y una conversacion con tarjetas (Descartar / Ver regla)."
      - "Tema claro: lista de conversaciones (boton 'Abrir'), encabezado de Reglas ('Configurar conversando'), tarjeta ('Editar y aplicar') y detalle de regla ('Ver conversacion')."
      - "Medir el contraste efectivo del texto del boton o enlace contra el fondo efectivo, esperando el fin del fadeIn."
    sintoma: "Oscuro: #6c757d sobre #1e293b = 3,12 (chips, Descartar, Ver regla). Claro: #0dcaf0 sobre blanco = 1,96 ('Abrir'); #2b9de4 sobre blanco = 2,98 y sobre #f0f4f8 = 2,70. El texto de las tarjetas, alertas y badges nuevos cumple; los botones que los accionan son lo menos legible."
    expectativa: "Texto de botones outline y enlaces con contraste >= 4,5 en ambos temas (o >= 3 si se acepta como texto grande/negrita por decision de diseno documentada)."
    causa_raiz: "El theme usa los colores por defecto de Bootstrap para .btn-outline-secondary/.btn-outline-info y el color de marca #2b9de4 para .btn-outline-primary y enlaces, sin variante oscura para secondary ni tono AA para info/primary en claro. No lo introduce una feature: son tokens compartidos (58, 10 y 18 usos en las vistas del portal)."
    capa: Web
    archivos_fix:
      - path: OlvidataAgentes.Web/wwwroot/css/site.css
        motivo: "Propuesto (no aplicado, requiere decision de diseno): [data-theme=dark] .btn-outline-secondary con texto/borde claro (ej. #cbd5e1); .btn-outline-info en claro con tono AA (ej. #0e7490); .btn-outline-primary y enlaces de marca en claro con un tono AA derivado de la marca (ej. #1f6fa8), manteniendo el fondo del hover. btn-primary (blanco sobre #2b9de4 = 2,98) queda a decision de marca."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "getComputedStyle de '.btn-outline-secondary', '.btn-outline-info', '.btn-outline-primary' y enlaces de contenido contra el fondo efectivo, con data-theme=dark y light"
      condicion_falla: "Contraste WCAG efectivo < 4,5 del texto de un boton outline o enlace de contenido en cualquier tema (sin excepcion de diseno documentada)."
    criterio_aceptacion:
      - "Tema oscuro: chips y botones Descartar/Ver regla/Volver >= 4,5."
      - "Tema claro: 'Abrir', 'Editar y aplicar', 'Configurar conversando' y enlaces 'Ver conversacion' >= 4,5."
    pruebas_minimas:
      - "Navegador real: medir los 4 tokens en ambos temas en al menos una grilla, un encabezado con acciones y un detalle, despues del fadeIn."
      - "Capturas antes/despues en ambos temas para validar que la marca sigue reconocible."
    nota_generalizacion: "Aplica a todo proyecto del baseline con olvidata-theme.css. Al medir contraste de una feature, separar lo que agrega la feature de los tokens compartidos del theme: un fix de tokens cambia todo el portal y debe pasar por diseno, no por auto-fix de QA."

  - id: OLV-005
    modulo: "Formularios MVC con asp-for sobre una coleccion opcional no anulable (select multiple / Select2) — Agentes/Ejecutar 'Documentos para esta tarea'"
    titulo: "Una List<int> no anulable en el ViewModel recibe [Required] implicito: el tag helper emite data-val-required en ingles y el navegador bloquea el envio cuando el campo opcional queda vacio"
    severidad: major
    reproducido_en: "olvidata-agentes-multirubro, QA M5 2026-09-15 (localhost, Playwright; Agentes > Ejecutar con cliente de cartera elegido y sin documentos adjuntos)"
    pasos:
      - "Agentes > inmo-cm > Nueva tarea. Elegir un cliente de cartera (aparece 'Documentos para esta tarea')."
      - "No elegir documentos, escribir el pedido y pulsar 'Enviar tarea'."
    sintoma: "La tarea no se envia: queda en la misma pantalla con 'The Documentos para esta tarea field is required.' (en ingles) bajo el campo. Sin cliente si se envia (el bloque oculto no se valida) y un POST directo sin el campo tambien crea la tarea: el bloqueo es solo de validacion del navegador. Regresion del flujo principal de M3 (tarea sobre un cliente)."
    expectativa: "Adjuntar documentos es opcional: con cliente y sin documentos la tarea se crea igual que antes de M5; solo se valida el maximo de 10."
    causa_raiz: "Con Nullable habilitado, MVC trata toda propiedad de tipo referencia no anulable como [Required] implicito (SuppressImplicitRequiredAttributeForNonNullableReferenceTypes = false por defecto). `public List<int> DocumentoIds { get; set; } = new();` con asp-for genera data-val-required con el mensaje por defecto en ingles; jQuery Validate lo aplica al select (Select2 lo oculta con select2-hidden-accessible, que no cuenta como :hidden). Los tests de servicio no pasan por el model binding ni por la vista, por eso 159/159 no lo detecto."
    capa: Web
    archivos_fix:
      - path: OlvidataAgentes.Web/Models/AgentesViewModels.cs
        motivo: "EjecutarAgenteViewModel.DocumentoIds pasa a List<int>? (opcional); se conserva [MaxLength(10)]."
      - path: OlvidataAgentes.Web/Controllers/AgentesController.cs
        motivo: "Al recargar la vista tras un error, (vm.DocumentoIds ?? []) antes de filtrar los vigentes."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-15"
      por: "QA (auto-fix, sin logica de negocio nueva: el campo ya era opcional para el servicio)"
      resultado: "aplicado"
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "atributos del <select asp-for> / <input asp-for> de campos opcionales: buscar data-val-required=\"The ... field is required.\"; enviar el formulario con el campo vacio"
      condicion_falla: "Un campo opcional renderiza data-val-required o el formulario no se envia con el campo vacio; cualquier mensaje 'The ... field is required.' en ingles visible."
    criterio_aceptacion:
      - "Con cliente y sin documentos, 'Enviar tarea' crea la tarea."
      - "Con 11 documentos sigue apareciendo 'Podes adjuntar hasta 10 documentos por mensaje.'"
    pruebas_minimas:
      - "Navegador: enviar con cliente y sin documentos; enviar con 2 documentos; POST con 11."
      - "Barrido de la vista: ningun data-val-required en ingles."
    nota_generalizacion: "Aplica a TODO proyecto del estudio con <Nullable>enable</Nullable> y ViewModels: una coleccion o string opcional declarada no anulable queda requerida en cliente y servidor con mensaje en ingles. Regla: propiedades opcionales de formulario siempre anulables (List<int>?, string?) o [ValidateNever] explicito; y en QA barrer data-val-required en ingles en cada formulario nuevo. Los tests de servicio no lo cubren: solo aparece en navegador."

  - id: OLV-006
    modulo: "Grillas DataTables server-side con columnas formateadas en servidor (tamano '14 KB', '3,9 MB') — Documentos de un cliente y Documentos de la organizacion (staff)"
    titulo: "La busqueda global no encuentra por la columna Tamano visible: el valor se guarda en bytes y se formatea al proyectar, y la busqueda solo compara nombre, autor, tipo, lectura, partes y fecha"
    severidad: minor
    reproducido_en: "olvidata-agentes-multirubro, QA M5 2026-09-15 (localhost, Playwright; /Documentos?clienteId=41 buscando '14 KB')"
    pasos:
      - "Abrir Documentos de un cliente con varios documentos."
      - "Escribir en la busqueda global el tamano que muestra una fila (ej. '14 KB')."
    sintoma: "0 resultados, aunque la columna Tamano de una fila dice exactamente '14 KB'."
    expectativa: "Checklist 26 regla 10a: la busqueda global matchea contra cualquier columna visible, incluidos importes/tamanos y fechas."
    causa_raiz: "DocumentoCarteraService.IdsBusquedaGlobalAsync cubre partes (entero), fecha, tipo y lectura, pero no TamanoBytes: el texto visible sale de NombreDocumentoHelper.FormatoTamano en la proyeccion y no hay equivalente en SQL."
    capa: Infrastructure
    archivos_fix:
      - path: OlvidataAgentes.Infrastructure/Services/Documentos/DocumentoCarteraService.cs
        motivo: "Si la busqueda tiene digitos, traer Id + TamanoBytes del alcance (cliente, max. 200; u organizacion para staff) y comparar contra FormatoTamano en memoria."
      - path: OlvidataAgentes.Infrastructure/Services/Evaluacion/CorridaEvaluacionService.cs
        motivo: "REINCIDENCIA en QA M8 2026-09-16 (listado de corridas de pruebas): las columnas Tipo ('Sin costo' / 'Real'), Resultado ('No paso las pruebas') y Version ('v1') se ven en palabras pero se guardan como enum o entero, y la busqueda global solo miraba nombre del artefacto, rubro, modelo y fecha. Se traduce lo escrito a los valores guardados (ModosQueDicen / EstadosQueDicen / ResultadosQueDicen / NumeroVersionQueDice, normalizando sin tildes) y a la consulta viajan solo los enums."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-15"
      por: "QA (auto-fix, sin logica de negocio nueva)"
      resultado: "aplicado"
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "DataTable().search('<tamano visible de una fila>') en /Documentos?clienteId= y /Clientes/Documentos/<tenant>"
      condicion_falla: "0 filas buscando el texto exacto de la columna Tamano de una fila visible."
    criterio_aceptacion:
      - "Buscar '14 KB' encuentra la planilla de 14 KB en ambas grillas."
    pruebas_minimas:
      - "Navegador: buscar un tamano en KB y otro en MB; buscar texto sin digitos sigue igual."
    nota_generalizacion: "Aplica a toda grilla del estudio con columnas cuyo texto visible se arma en servidor a partir de un numero (tamanos, duraciones, porcentajes): la busqueda global tiene que comparar contra el mismo formateador que la columna, no contra el valor crudo."

  - id: OLV-007
    modulo: "Grillas con filtros Select2 automaticos (ovAplicarSelect2 aplica Select2 a todo <select>) — bandeja Aprobaciones (M6)"
    titulo: "Un <select> marcado con el atributo data-select2 rompe la inicializacion de Select2 y la pagina no carga la grilla: 'GetData(...).destroy is not a function'"
    severidad: blocker
    reproducido_en: "olvidata-agentes-multirubro, QA M6 2026-09-15 (localhost, Playwright; /Aprobaciones como Empleado y como Director)"
    pasos:
      - "Entrar a /Aprobaciones con pedidos pendientes."
    sintoma: "La grilla queda sin filas ni 'No hay acciones esperando aprobación', la consola muestra 'pageerror: r.GetData(...).destroy is not a function' y no sale ninguna llamada a /Aprobaciones/Listar: no se puede aprobar ni ver el historial desde la bandeja."
    expectativa: "La bandeja carga por AJAX con filtros Select2 y acciones."
    causa_raiz: "Select2 guarda su instancia con Utils.GetData(el, 'select2'), que tambien lee atributos data-*. Con data-select2 presente devuelve '' (no null) y el constructor llama ''.destroy(), la excepcion corta el $(function) antes de crear el DataTable. Las demas vistas no usan ese atributo (ovAplicarSelect2 ya toma todos los select; la excepcion es data-select2-manual)."
    capa: Web
    archivos_fix:
      - path: OlvidataAgentes.Web/Views/Aprobaciones/Index.cshtml
        motivo: "Quitar el atributo data-select2 de fPedidaPor, fCliente y fResueltaPor."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-15"
      por: "QA (auto-fix, sin logica de negocio nueva)"
      resultado: "aplicado"
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "grep 'data-select2[ >]' en Views/**/*.cshtml; en navegador, consola de la pagina + request a la accion Listar"
      condicion_falla: "Algun <select> con data-select2 (sin -manual) o pageerror 'GetData(...).destroy' al cargar."
    criterio_aceptacion:
      - "La bandeja (Pendientes e Historial) carga filas y los filtros Select2 funcionan sin errores de consola."
    pruebas_minimas:
      - "Navegador: /Aprobaciones y /Aprobaciones?pestana=historial como Director y Empleado, sin pageerror y con XHR a Listar 200."
    nota_generalizacion: "Nunca usar data-select2 como marcador en vistas del template Olvidata ni en otros proyectos con Select2 4.x: colisiona con la clave interna del plugin. Usar una clase o data-ov-*."

