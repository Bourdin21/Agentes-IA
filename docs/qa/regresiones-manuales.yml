  - id: LP-003
    modulo: "Ventas / Editar borrador (grilla de Items y Pagos con <input type=\"number\"> y valores decimales de Razor)"
    titulo: "Reabrir un borrador guardado deja TODOS los inputs numericos vacios: Razor renderiza el decimal con la cultura es-AR ('3,000') y el navegador descarta el value por invalido en un <input type=\"number\">"
    severidad: blocker
    reproducido_en: "La Platense - rama entrega-2, QA de Entrega 2 (2026-08-21), reproducido por navegador real (Playwright) contra laplatense_dev con el catalogo real migrado"
    pasos:
      - "Configurar la app con cultura fija es-AR (UseRequestLocalization con es-AR, como hace Program.cs de La Platense)."
      - "Ir a Ventas -> Nueva, agregar 1 o 2 items (por buscador o por escaneo de codigo de barras) y presionar 'Guardar borrador'."
      - "Volver a abrir el mismo borrador (Ventas -> Editar/{id}, o el redirect que hace el propio guardado)."
      - "Observar las columnas Cantidad / Precio unit. / % IVA / Descuento / Recargo de cada fila, y el bloque de Totales."
    sintoma: "Las filas de items aparecen con el producto correcto pero TODOS los inputs numericos vacios; los totales de pantalla muestran $ 0,00 aunque la venta esta bien guardada en la base. Si el vendedor vuelve a presionar 'Guardar borrador' sin retipear todo, el guardado se rechaza con 'La cantidad de <producto> debe ser mayor a 0.' — el borrador queda inutilizable: no se puede editar ni volver a guardar, solo cancelar o facturar con los valores originales."
    expectativa: "Al reabrir un borrador, cada input numerico llega poblado con el valor guardado y los totales de pantalla coinciden con los de la base. El borrador se puede editar y volver a guardar (criterio de aceptacion PF2: editar precio/cantidad/IVA/descuento antes de emitir AFIP, sin anular ni recrear)."
    causa_raiz: "El atributo value de un <input type=\"number\"> tiene que ser un 'valid floating-point number' segun HTML: SIEMPRE punto decimal, independientemente de la cultura del usuario. Con cultura es-AR activa, Razor renderiza @it.Cantidad como '3,000' y @it.PrecioUnitario como '1,27'; el navegador considera invalido ese value y deja el input vacio (no muestra error, simplemente lo descarta). Es la contraparte de SALIDA del problema que el proyecto ya habia resuelto solo del lado de la ENTRADA con InvariantDecimalModelBinderProvider (Program.cs): ambas mitades del round-trip tienen que usar cultura invariante. Solo afecta a los value escritos a mano en Razor (value=\"@modelo.Campo\"); las filas que agrega el JS a partir de un JSON no fallan, porque System.Text.Json ya serializa los numeros con punto."
    capa: Web
    archivos_fix:
      - path: FerreteriaLaPlatense.Web/Views/Ventas/Editar.cshtml
        motivo: "Declarar un helper local 'Func<decimal,string> num = v => v.ToString(CultureInfo.InvariantCulture)' en el bloque @{} de la vista y usarlo en los 6 value de inputs numericos (Items[i].Cantidad/PrecioUnitario/PorcentajeIVA/Descuento/Recargo y Pagos[i].Monto). No tocar los textos de solo lectura (subtotales, totales), que SI deben seguir formateados en es-AR."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /Ventas/Editar/{id} de un borrador con al menos 1 item ya guardado; inspeccionar el HTML crudo de los <input type=\"number\">"
      condicion_falla: "Algun value de un <input type=\"number\"> contiene una coma (ej. value=\"3,000\"), o el input queda vacio en el navegador pese a que la entidad tiene el valor cargado en la base."
    criterio_aceptacion:
      - "El HTML crudo de /Ventas/Editar/{id} renderiza los value con punto decimal ('3.000', '1.27'), nunca con coma."
      - "Al reabrir un borrador, los inputs llegan poblados y los totales de pantalla coinciden con los persistidos."
      - "Re-guardar un borrador reabierto sin modificar nada guarda correctamente y no cambia los importes (idempotente)."
      - "Editar cantidad/precio/IVA de un item guardado y guardar recalcula los totales en el servidor (PF2)."
    pruebas_minimas:
      - "Alta de borrador con 2 items -> guardar -> reabrir: inputs poblados, totales != 0."
      - "Reabrir y guardar sin tocar nada -> 'guardado correctamente', importes iguales."
      - "Reabrir, cambiar cantidad y precio, guardar -> totales recalculados por el servidor."
      - "Regresion: agregar un item nuevo por escaneo sobre un borrador reabierto sigue funcionando (filas por JS)."
    nota_generalizacion: "Aplica a CUALQUIER proyecto del baseline que fije una cultura con coma decimal (es-AR/es-ES/pt-BR) y escriba a mano value=\"@modelo.Campo\" sobre un <input type=\"number\">. Ojo con el hermano de este bug: si el decimal se renderiza en es-AR sobre un input que NO es type=number (ej. un hidden), el value 'sobrevive' y se postea tal cual — y ahi InvariantDecimalModelBinder lo parsea con NumberStyles.Any en InvariantCulture PRIMERO, donde la coma es separador de miles: '40,98' entra como 4098, no como 40.98. Es decir: el mismo render culture-dependiente produce input vacio en type=number y corrupcion silenciosa x100 en el resto. La regla segura es una sola: todo decimal que va a volver al servidor se renderiza en cultura invariante."
    fix_aplicado:
      fecha: "2026-08-21"
      por: "QA (auto-fix durante el ciclo de QA de Entrega 2 de La Platense)"
      resultado: "aplicado"
      archivos:
        - path: FerreteriaLaPlatense.Web/Views/Ventas/Editar.cshtml
          motivo: "helper 'num' con InvariantCulture aplicado a los 6 value de inputs numericos."
      build: "dotnet build FerreteriaLaPlatense.slnx -> Compilacion correcta, 0 Errores."
      verificacion: "Verificado por navegador real contra laplatense_dev: el HTML crudo pasa de value=\"3,000\" a value=\"3.000\"; el borrador reabierto llega con los 5 inputs poblados y total $ 17,97 (antes $ 0,00); re-guardar sin tocar nada responde 'guardado correctamente'; editar cantidad 3->10, precio 1,27->2,50 e IVA 21->10,5 y guardar recalcula a subtotal $ 36,04 / IVA $ 4,94 / total $ 40,98 en el servidor."

  - id: LIP-001
    modulo: "ABMs de catalogo y Produccion Mensual / Create-Edit (Practicas, UnidadesBioquimicas, CentrosSalud, ProduccionMensual)"
    titulo: "Los errores de regla de negocio devueltos por el Service (ServiceResult.CreateError -> ModelState.AddModelError(string.Empty, ...)) no se muestran en ninguna parte: la vista vuelve a renderizarse sin ningun bloque de errores, con lo que el rechazo es invisible para el usuario"
    severidad: major
    reproducido_en: "labipac - main (working tree, sesion 6 M19-M25 sin commitear), labipac_dev, 2026-08-23"
    pasos:
      - "Autenticarse como Administrador/SuperUsuario."
      - "Caso A (RN-24, duplicado de periodo): ir a /ProduccionMensual/Create y crear un periodo con un Mes+Anio+Centro de Salud que YA existe. Guardar."
      - "Caso B (RN-25 rama 2, centro invalido): POST a /ProduccionMensual/Create con CentroSaludId de un centro inexistente o inactivo."
      - "Caso C (nombre duplicado): ir a /UnidadesBioquimicas/Create (o /Practicas/Create, o /CentrosSalud/Create) y guardar con un Nombre que ya existe."
    sintoma: "La pagina responde HTTP 200, vuelve al formulario con los datos tipeados y NO muestra ningun mensaje. No hay alert, no hay validation-summary, no hay texto en rojo. El usuario no tiene forma de saber por que no se guardo, y tipicamente reintenta el mismo alta varias veces. La regla SI se aplica correctamente en el servidor (verificado por query: no se persiste ninguna fila), el defecto es exclusivamente de feedback."
    expectativa: "Cuando un Service rechaza la operacion con ServiceResult.CreateError, el mensaje ('Ya existe un periodo para Julio 2026 con el Centro de Salud X.', 'Ya existe una unidad bioquimica con ese nombre.', 'El centro de salud seleccionado no existe o esta inactivo.') debe quedar visible en el formulario re-renderizado, igual que ya ocurre en ProduccionMensual/CargaMasiva.cshtml."
    causa_raiz: "Los Controllers hacen ModelState.AddModelError(string.Empty, result.Message) y devuelven View(model), que es el patron correcto. El problema esta en las vistas: ninguna de las 7 vistas Create/Edit de estos modulos incluye <div asp-validation-summary=\"ModelOnly\"> ni un bloque manual que recorra ViewData.ModelState. Los errores con clave string.Empty (los de Service) no tienen ningun <span asp-validation-for> que los adopte — a diferencia de los errores de DataAnnotation, que si se renderizan porque estan asociados a un campo concreto. Por eso el sintoma se enmascara: las validaciones de formato SI se ven y las de negocio NO. La misma solucion ya esta implementada y validada dentro del proyecto en ProduccionMensual/CargaMasiva.cshtml (bloque @if (!ViewData.ModelState.IsValid) con alert-danger)."
    capa: Web
    archivos_fix:
      - path: LabIPAC.Web/Views/ProduccionMensual/Create.cshtml
        motivo: "Agregar el bloque de errores de ModelState (RN-24 duplicado de periodo, RN-25 centro invalido)."
      - path: LabIPAC.Web/Views/Practicas/Create.cshtml
        motivo: "Agregar el bloque de errores de ModelState (nombre duplicado, RN-02 desde Service)."
      - path: LabIPAC.Web/Views/Practicas/Edit.cshtml
        motivo: "Idem Create."
      - path: LabIPAC.Web/Views/UnidadesBioquimicas/Create.cshtml
        motivo: "Agregar el bloque de errores de ModelState (nombre duplicado, RN-26 desde Service)."
      - path: LabIPAC.Web/Views/UnidadesBioquimicas/Edit.cshtml
        motivo: "Idem Create."
      - path: LabIPAC.Web/Views/CentrosSalud/Create.cshtml
        motivo: "Agregar el bloque de errores de ModelState (nombre duplicado)."
      - path: LabIPAC.Web/Views/CentrosSalud/Edit.cshtml
        motivo: "Idem Create."
    migracion_ef: null
    deteccion_qa:
      tipo: api
      selector_o_endpoint: "POST /ProduccionMensual/Create con un Mes+Anio+CentroSaludId ya existente (o POST /UnidadesBioquimicas/Create con un Nombre ya existente)"
      condicion_falla: "La respuesta 200 NO contiene el texto del mensaje del Service ('Ya existe...') en ningun lado del HTML, pese a que la fila no se creo en la base."
    criterio_aceptacion:
      - "POST de un alta rechazada por regla de Service devuelve 200 y el HTML contiene el mensaje exacto del ServiceResult."
      - "La regla sigue bloqueando el alta (no se persiste nada): el fix es solo de presentacion, no cambia ninguna decision de negocio."
      - "Las validaciones de DataAnnotation por campo siguen mostrandose donde ya se mostraban (no se duplican ni se pierden)."
    pruebas_minimas:
      - "Crear un periodo duplicado (mismo Mes+Anio+Centro) -> bloqueado Y con mensaje visible."
      - "Crear una Practica/Perfil/Centro con nombre repetido -> bloqueado Y con mensaje visible."
      - "Alta valida en los 4 ABMs sigue funcionando sin regresion."
    nota_generalizacion: "Patron generalizable a cualquier proyecto del baseline: si un Controller usa ModelState.AddModelError(string.Empty, ...) para propagar un ServiceResult, la vista TIENE que tener asp-validation-summary=\"ModelOnly\" (o un bloque equivalente). Sin eso el rechazo es silencioso y solo se nota que 'el boton no hace nada'. Conviene chequearlo de forma estatica: por cada Controller con AddModelError(string.Empty), verificar que todas las vistas que devuelve tengan el bloque."
    fix_aplicado:
      fecha: "2026-08-23"
      por: "QA (auto-fix durante el ciclo de QA de la sesion 6 de labipac, M19-M25)"
      resultado: "aplicado"
      archivos:
        - path: "LabIPAC.Web/Views/{ProduccionMensual,Practicas,UnidadesBioquimicas,CentrosSalud}/{Create,Edit}.cshtml (7 vistas)"
          motivo: "Se agrego <div asp-validation-summary=\"ModelOnly\" class=\"text-danger mb-3\"> como primer hijo del <form>, replicando el patron ya validado dentro del mismo proyecto en Views/Users/Create.cshtml y Views/Account/Login.cshtml. Cero logica de negocio nueva: solo se hace visible un ModelState que ya se poblaba correctamente."
      build: "dotnet build LabIPAC.slnx -> Compilacion correcta, 0 Errores, 9 Advertencias (todas preexistentes: NU1902 MailKit/MimeKit y CS0114 HomeController.StatusCode). Sin warnings nuevos."
      verificacion: "Verificado con la app corriendo y login real contra labipac_dev. Los 5 rechazos de Service ahora renderizan su mensaje: RN-24 periodo duplicado ('Ya existe un periodo para Julio 2026 con el Centro de Salud hvjhbjhb.'), RN-25 centro invalido ('El centro de salud seleccionado no existe o esta inactivo.'), y nombre duplicado en los 3 ABMs ('Ya existe una unidad bioquimica / una practica / un centro de salud con ese nombre.'). No-regresion confirmada: las 4 altas validas siguen devolviendo 302 y persistiendo; el error de DataAnnotation de campo ('El Centro de Salud es obligatorio.') sigue apareciendo una sola vez en su <span asp-validation-for> y NO se duplica en el summary (ModelOnly excluye correctamente los errores con clave de campo)."

  - id: LP-004
    modulo: "Listados DataTables server-side con filtros persistidos en Session (patron PAT-016 parte 2)"
    titulo: "El buscador global se pierde al volver al listado: las respuestas concurrentes del endpoint Listar escriben Session fuera de orden y la ultima en completar (con search vacio) pisa a la del texto que el usuario dejo tipeado"
    severidad: minor
    reproducido_en: "La Platense - entrega-2 (commit 53e2c48), laplatense_dev con 112.485 productos, 2026-08-24"
    pasos:
      - "Autenticarse como SuperUsuario."
      - "Ir a /Productos (listado grande: ~112k filas)."
      - "Tipear un texto en el buscador global del DataTable (ej. '2026') a velocidad normal de tecleo."
      - "Esperar a ver los resultados filtrados (~1 a 1,5 s) y navegar a otra pantalla (ej. /Dashboard)."
      - "Volver a /Productos."
    sintoma: "El buscador global vuelve VACIO y la grilla sin filtrar, pese a que PAT-016 debe reponer el filtro. Medido: 0 de 6 intentos conservaron el filtro en /Productos esperando 1,2 s antes de navegar; 6 de 6 lo conservaron esperando 4 s; 6 de 6 en /Clientes (2.992 filas) con la misma espera de 1,2 s. Los filtros de COLUMNA (que se mandan en un unico draw por evento 'change') si persisten siempre — el defecto afecta solo al buscador global, que dispara un draw por pulsacion."
    expectativa: "Al volver al listado, el buscador global debe conservar el ultimo texto que el usuario dejo aplicado, igual que los filtros de columna, independientemente del tamano de la tabla y de cuan rapido se navegue."
    causa_raiz: "El endpoint Listar persiste Session[\"<Entidad>_Busqueda\"] = Request.Form[\"search[value]\"] en CADA draw. DataTables dispara un draw por pulsacion y aborta el XHR anterior del lado del cliente, pero el servidor sigue procesando las requests abortadas y todas escriben Session. Como las respuestas no completan en el mismo orden en que se emitieron (en una tabla de 112k filas cada busqueda tarda 2 a 2,6 s), la ULTIMA en completar es la que queda en Session — y suele ser un draw anterior con search vacio (el de la carga inicial o el del filtro de columna), que segun la semantica de FiltrosSessionHelper.Guardar BORRA la key. Cronologia medida: REQ search='' a 2597ms, REQ search='2' a 2612ms, REQ search='2026' a 3332ms; RESP '' a 3137ms, RESP '2' a 4843ms, RESP '2026' a 5980ms. Si el usuario navega antes de los ~6 s, gana la respuesta equivocada. Es una condicion de carrera de escritura en Session, no un error de logica del helper."
    capa: Web
    archivos_fix:
      - path: FerreteriaLaPlatense.Web/Helpers/FiltrosSessionHelper.cs
        motivo: "Descartar escrituras rancias usando el contador 'draw' que DataTables ya manda e incrementa en cada peticion: guardar el draw junto con los filtros y aplicar el lote solo si su draw es >= al ultimo persistido para esa entidad. No requiere datos nuevos del cliente."
      - path: "FerreteriaLaPlatense.Web/Controllers/{Productos,Clientes,Ventas,Caja,Gastos,Entregas}Controller.cs"
        motivo: "Pasar Request.Form[\"draw\"] al helper en los 6 metodos GuardarFiltros()."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "input del buscador global: .dataTables_filter input, en /Productos"
      condicion_falla: "Tras tipear un texto, esperar 1,2 s, navegar a /Dashboard y volver a /Productos, el value del input esta vacio en vez de conservar el texto tipeado."
    criterio_aceptacion:
      - "Tipear en el buscador global, navegar a otra pantalla y volver conserva el texto en el listado mas grande del sistema (Productos) sin depender del tiempo de espera."
      - "Los filtros de columna siguen persistiendo como hasta ahora (no-regresion)."
      - "'Limpiar filtros' sigue borrando todo, incluido el buscador global, y al reentrar no repone nada."
    pruebas_minimas:
      - "Productos: tipear en el buscador global, esperar 1 s, navegar y volver -> el texto sigue puesto (repetir 5 veces)."
      - "Clientes/Gastos/Ventas/Caja/Entregas: misma prueba, sin regresion."
      - "Limpiar filtros en los 6 listados -> todo vacio y nada repuesto al reentrar."
    nota_generalizacion: "Patron generalizable a CUALQUIER proyecto que combine DataTables server-side con persistencia de filtros en Session (PAT-016 parte 2). El riesgo crece con el tamano de la tabla: es invisible en listados chicos (respuesta < 300 ms) y sistematico en los grandes, que son justamente donde recordar el filtro mas le sirve al usuario. Sintoma tipico de reporte del cliente: 'a veces se me borra el buscador cuando vuelvo'. Regla preventiva: nunca escribir estado de sesion desde un endpoint que el cliente dispara por pulsacion y aborta — o se debouncea la escritura, o se descartan las escrituras rancias con el contador 'draw'."
    fix_aplicado: null

  - id: LP-005
    modulo: "Cualquier pantalla de solo lectura (Details / comprobante / reporte) de una entidad cuyo campo cambio de UNIDAD semantica (importe -> porcentaje, o viceversa)"
    titulo: "Al cambiar Descuento/Recargo de monto fijo a porcentaje se actualizo la pantalla de edicion pero NO la de Details: la venta facturada muestra un 10% como '$ 10,00', contradiciendo su propio Subtotal"
    severidad: minor
    reproducido_en: "La Platense - entrega-2 (commit 9c6b1db), laplatense_dev, 2026-08-24"
    pasos:
      - "Autenticarse como SuperUsuario."
      - "Crear una venta con un item (cantidad 3, precio 4600), descuento 10 y recargo 5, y guardar el borrador."
      - "Facturar la venta (o forzarla a Facturada) y abrir /Ventas/Details/{id}."
    sintoma: "La grilla de items muestra los encabezados 'Descuento' y 'Recargo' y las celdas '$ 10,00' y '$ 5,00', como si fueran importes en pesos, cuando en realidad son 10% y 5%. La contradiccion es visible en la propia fila: con un descuento literal de $10 y un recargo de $5 el subtotal seria $13.795,00, pero la fila muestra $13.041,00 (que es 3 x 4600 x 0,9 x 1,05, el calculo correcto por porcentaje). El calculo es correcto; lo que enga\u00f1a es la unidad mostrada."
    expectativa: "Toda vista que renderice el campo debe mostrarlo en la unidad vigente ('10,00 %'), no en la anterior. La pantalla de revision de un comprobante ya emitido es justamente donde el dato mal rotulado hace mas dano."
    causa_raiz: "El cambio de unidad se aplico en la entidad, el Service, el DTO, el ViewModel y la vista EDITABLE (Views/Ventas/Editar.cshtml: encabezados 'Descuento %', inputs con min=0 max=100), pero la vista de SOLO LECTURA (Views/Ventas/Details.cshtml) quedo con el render anterior '$ @it.Descuento.ToString(\"N2\")'. Es un barrido incompleto: se busco por los puntos que participan del calculo o de la validacion y se paso por alto el que solo muestra."
    capa: Web
    archivos_fix:
      - path: FerreteriaLaPlatense.Web/Views/Ventas/Details.cshtml
        motivo: "Encabezados a 'Descuento %' / 'Recargo %' y celdas a '@it.Descuento.ToString(\"N2\") %' en vez de '$ ...'."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /Ventas/Details/{id} de una venta con Descuento distinto de 0, tabla de items"
      condicion_falla: "La celda de Descuento empieza con '$' en vez de terminar en '%', o el encabezado dice 'Descuento' a secas mientras la columna guarda un porcentaje."
    criterio_aceptacion:
      - "Details muestra 'Descuento %' / 'Recargo %' y los valores con sufijo '%'."
      - "El Subtotal de la fila no cambia (el fix es solo de presentacion)."
      - "Editar sigue mostrando lo mismo que Details para la misma venta (unidades coherentes entre pantallas)."
    pruebas_minimas:
      - "Venta con descuento 10% y recargo 5% -> Details muestra '10,00 %' y '5,00 %' y subtotal $ 13.041,00."
      - "Venta con descuento 0 y recargo 0 -> muestra '0,00 %' sin romper el layout."
    nota_generalizacion: "Patron generalizable: cuando un campo cambia de UNIDAD (importe <-> porcentaje, unitario <-> total, neto <-> bruto), el barrido tiene que cubrir TODAS las superficies que lo renderizan, no solo las que lo calculan o validan — grep del nombre del campo sobre .cshtml y sobre los formatters de columnas de DataTables, no solo sobre .cs. Las vistas de solo lectura (Details, comprobante, remito, export a Excel/PDF, mail) son las que mas se olvidan y las que el usuario final mas mira. Sintoma delator y barato de chequear: el propio Subtotal/Total de la fila no cierra con los numeros mostrados a su izquierda."
    fix_aplicado:
      fecha: "2026-08-24"
      por: "QA (auto-fix durante la 2a vuelta de QA de Entrega 2 de La Platense)"
      resultado: "aplicado"
      archivos:
        - path: FerreteriaLaPlatense.Web/Views/Ventas/Details.cshtml
          motivo: "Encabezados 'Descuento %' / 'Recargo %' y celdas con sufijo '%' en vez de prefijo '$'. Replica exacta del criterio ya aplicado en Editar.cshtml en el mismo commit del cambio de unidad; cero logica de negocio nueva."
      build: "dotnet build FerreteriaLaPlatense.slnx -> Compilacion correcta, 0 Errores."
      verificacion: "Verificado por navegador real contra laplatense_dev sobre la venta 8 (Facturada): la fila pasa de '21,00 % | $ 10,00 | $ 5,00 | $ 13.041,00' a '21,00 % | 10,00 % | 5,00 % | $ 13.041,00'. Subtotal, IVA ($ 2.738,61) y Total ($ 15.779,61) sin cambios."

  - id: LP-006
    modulo: "Cualquier grilla DataTables que muestre la hora de un movimiento con new Date(v).toLocaleString('es-AR') — detectado en Clientes/CuentaCorriente.cshtml y Caja/Index.cshtml (ledgers financieros)"
    titulo: "La hora de los movimientos del ledger se renderiza en reloj de 12 horas SIN marcador AM/PM: un cobro de las 13:04 se muestra como '01:04:22' y una deuda de las 00:00 como '12:00:00'"
    severidad: minor
    reproducido_en: "La Platense - rama entrega-1-migracion, QA Sprint 0 lote 2 (2026-10-05), reproducido por navegador real (Playwright) contra laplatense_dev, confirmado identico en chrome-headless-shell y en chromium completo (no es artefacto del headless)"
    pasos:
      - "Registrar un cobro de cuenta corriente pasado el mediodia de Argentina (ej. 13:04 ART)."
      - "Tener en la misma cuenta un movimiento imputado a las 00:00 del dia de negocio (ej. el Debito de una venta fiada persistido con ArgentinaTime.InicioDiaUtc)."
      - "Abrir /Clientes/CuentaCorriente/{id} y leer la columna Fecha de la grilla. Mismo efecto en /Caja."
    sintoma: "La FECHA es correcta (5/10/2026, dia de negocio argentino bien proyectado), pero la hora miente: el movimiento de las 13:04:22 ART aparece como '5/10/2026, 01:04:22' y el de las 00:00 ART como '5/10/2026, 12:00:00'. Sin AM/PM no hay forma de distinguir la manana de la tarde, y la medianoche se lee como mediodia. En un ledger que el operador usa para conciliar la caja del dia, dos movimientos separados por 12 horas se muestran con la misma hora."
    expectativa: "La hora se muestra en reloj de 24 horas: '5/10/2026, 13:04:22' y '5/10/2026, 00:00:00'. Es el formato que espera un usuario argentino y el unico no ambiguo sin marcador AM/PM."
    causa_raiz: "El render de la columna es `new Date(v).toLocaleString('es-AR')`. El dato que llega por el wire es correcto y ya esta proyectado a hora Argentina por el servidor ('2026-10-05T13:04:22.42715', sin sufijo Z, verificado sobre la respuesta cruda de CuentaCorrienteListar), asi que NO hay doble conversion de huso. El problema es solo de formato: el CLDR de Chromium para es-AR resuelve el timeStyle por defecto de toLocaleString con hourCycle de 12 horas, y el formato numerico por defecto no emite el designador de periodo. Patron generalizable: en una grilla financiera la hora nunca se delega al default de toLocaleString — se pide el reloj de 24 horas de forma explicita (hour12: false / hourCycle: 'h23', o un formateo con moment/dayjs con patron HH:mm:ss)."
    capa: Web
    archivos_fix:
      - path: FerreteriaLaPlatense.Web/Views/Clientes/CuentaCorriente.cshtml
        motivo: "Columna 'fecha' del DataTable: reemplazar toLocaleString('es-AR') por un formateo con reloj de 24 horas explicito (ej. toLocaleString('es-AR', { hour12: false }) o moment(v).format('DD/MM/YYYY HH:mm:ss') — moment ya esta cargado en la vista para el daterangepicker). NO usar moment.utc(): el valor que manda el servidor ya esta en hora Argentina (ver MH-014, que es el error opuesto)."
      - path: FerreteriaLaPlatense.Web/Views/Caja/Index.cshtml
        motivo: "Misma columna 'fecha', mismo reemplazo. El defecto es preexistente en esta pantalla (no lo introdujo el Sprint 0), pero es el mismo ledger de dinero y conviene cerrarlo de una vez para no dejar dos semanticas de hora conviviendo."
    migracion_ef: null
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /Clientes/CuentaCorriente/{id} y GET /Caja -> leer el texto de la columna Fecha de un movimiento registrado despues del mediodia ART y de otro imputado a las 00:00."
      condicion_falla: "La hora mostrada de un movimiento posterior al mediodia es menor o igual a 12, o un movimiento de las 00:00 se muestra como 12:00:00, o la celda no trae ni 'a. m.'/'p. m.' ni una hora >= 13."
    criterio_aceptacion:
      - "Un movimiento registrado a las 13:04 ART se muestra con hora '13:04' (no '01:04') en la grilla de cuenta corriente y en la de Caja."
      - "Un movimiento imputado a las 00:00 del dia de negocio se muestra con hora '00:00' (no '12:00')."
      - "La FECHA sigue siendo el dia de negocio argentino (no se introduce ninguna conversion de huso nueva en el cliente)."
    pruebas_minimas:
      - "Registrar un cobro de CC despues del mediodia ART y verificar la hora en la grilla."
      - "Verificar la misma fila en /Caja filtrando por origen CobroCC: la hora tiene que coincidir con la de la grilla de CC."
      - "Regresion: un movimiento de la manana (ej. 09:30) sigue mostrandose como 09:30."

  - id: LP-007
    modulo: "Ventas / GuardarBorrador (VentasController.GuardarBorrador, switch sobre el parametro `continuar`)"
    titulo: "Un valor no reconocido de `continuar` guarda el borrador y NO cierra la venta, en silencio: el switch cae en el caso por defecto sin ningun aviso en pantalla"
    severidad: minor
    reproducido_en: "La Platense - rama entrega-1-migracion, QA Sprint 0 lote 2 (2026-10-05), reproducido por navegador real (Playwright) contra laplatense_dev sobre la venta 9 (Borrador con el total cubierto)"
    pasos:
      - "Abrir /Ventas/Editar/{id} de un borrador confirmable (pagos que cubren el total)."
      - "Postear el formulario completo a /Ventas/GuardarBorrador agregando un hidden name=\"continuar\" con un valor que no sea 'confirmar' ni 'facturar' (ej. 'zzz')."
    sintoma: "HTTP 200 con redirect a /Ventas/Editar/{id}: el borrador queda guardado con los datos nuevos pero la venta sigue en Borrador, sin stock descontado, sin movimiento de Caja y sin ningun mensaje que diga que el cierre no se ejecuto. Es el mismo sintoma de clase que D8 (la pantalla pide una cosa y el server hace otra, en silencio), del lado del servidor."
    expectativa: "Un valor de `continuar` que el server no sabe interpretar es un error de contrato, no un no-op: o se rechaza con un mensaje explicito, o el parametro se tipa como un enum acotado para que el binder lo rechace antes de entrar a la accion. Lo que no puede pasar es que una peticion que pedia cerrar la venta devuelva 200 y deje el documento abierto sin avisar."
    causa_raiz: "El switch es `continuar switch { \"confirmar\" => ..., \"facturar\" => ..., _ => GuardadoOk(...) }` sobre un `string?`. El caso por defecto es legitimo y necesario para el boton 'Guardar borrador' (que postea sin `continuar`), pero no distingue 'no se pidio continuar' (continuar == null) de 'se pidio continuar con un valor que no entiendo'. NOTA sobre el defecto hermano: el commit 800db75 agrego la guarda de doble envio en el cliente justificandola en que un segundo click posteaba `continuar=confirmar&continuar=confirmar` y eso caia en este default — ese camino concreto NO se reproduce: el SimpleTypeModelBinder de ASP.NET Core toma el primer valor, asi que el POST duplicado SI confirma (verificado sobre la venta 10, que quedo Confirmada con 2 movimientos de caja, uno por pago, sin duplicacion). La guarda de reentrada sigue siendo correcta y util (evita dos POST independientes y el doble disparo de la UI), pero el agujero que queda abierto es este, el del valor desconocido."
    capa: Web
    archivos_fix:
      - path: FerreteriaLaPlatense.Web/Controllers/VentasController.cs
        motivo: "GuardarBorrador: separar `continuar is null or \"\"` (guardado normal -> GuardadoOk) de un valor desconocido (-> TempData[\"ErrorMessage\"] explicito y redirect a Editar, o tipar el parametro como un enum acotado). No cambiar el comportamiento de 'confirmar'/'facturar'."
    migracion_ef: null
    deteccion_qa:
      tipo: static
      selector_o_endpoint: "Cualquier accion MVC que encadene un paso siguiente a partir de un parametro string libre (`continuar`, `accion`, `siguiente`, `then`) resuelto con un switch con `_ =>`."
      condicion_falla: "El caso por defecto del switch ejecuta el camino 'feliz' mas corto (guardar y volver) en vez de rechazar el valor, y por lo tanto no se puede distinguir 'no se pidio nada' de 'se pidio algo que no entiendo'."
    criterio_aceptacion:
      - "POST a /Ventas/GuardarBorrador con continuar='zzz' sobre un borrador confirmable deja un mensaje de error visible en pantalla y NO cierra la venta en silencio."
      - "POST sin el parametro `continuar` (boton 'Guardar borrador') sigue guardando y redirigiendo a Editar con el mensaje de exito, sin cambios."
      - "POST con continuar='confirmar' y con continuar='facturar' siguen funcionando igual que hoy."
    pruebas_minimas:
      - "Los tres valores: ausente, 'confirmar', y uno desconocido."
      - "Regresion del doble envio: dos invocaciones seguidas del boton Confirmar siguen produciendo UN solo POST y UNA sola confirmacion (stock, Caja y CC una vez)."

  - id: LP-008
    modulo: "Cualquier regla de negocio documentada en XML-doc / comentario prescriptivo del servicio que la implementa"
    titulo: "Al ampliar el conjunto de estados que una agregacion considera se cambio el Where pero NO el XML-doc ni el comentario que lo justifica: el codigo dice Confirmada+Facturada y su propia documentacion sigue diciendo 'solo Facturada'"
    severidad: minor
    reproducido_en: "La Platense, rama entrega-1-migracion, commit 7477550 (Sprint 0, 2026-10-05). Observado por QA el 2026-10-05 por lectura directa de los dos archivos tocados por el commit."
    pasos:
      - "Abrir FerreteriaLaPlatense.Infrastructure/Services/ClasificacionAbcAutomaticaService.cs y leer el XML-doc de la clase (punto 2 del criterio) y el comentario de bloque inmediatamente anterior al Where de la agregacion."
      - "Comparar con el Where real de la linea 82."
      - "Repetir en FerreteriaLaPlatense.Infrastructure/Services/DashboardService.cs: XML-doc de ObtenerTopProductosMesAsync contra el Where de la linea 109."
    sintoma: "El XML-doc de ClasificacionAbcAutomaticaService dice 'Solo cuentan los items de Ventas en estado Facturada' y el comentario de bloque dice 'El filtro por Estado == Facturada es imprescindible', mientras el codigo filtra por (Confirmada || Facturada). El XML-doc de DashboardService.ObtenerTopProductosMesAsync dice 'sobre Ventas Facturadas'. Los tres son prescriptivos, no descriptivos: afirman cual es la regla correcta."
    expectativa: "La documentacion en el codigo nombra el conjunto de estados que el codigo realmente aplica (venta consumada = Confirmada o Facturada, desde el 2026-09-03) y explica por que Confirmada entra."
    causa_raiz: "El cambio de criterio toco el predicado pero no el texto que lo justifica. Es especialmente peligroso en este caso porque el comentario no describe el codigo: ARGUMENTA a favor del criterio viejo ('es imprescindible', 'Solo cuentan'). El proximo que lea el archivo tiene dos fuentes de verdad en contradiccion y la que esta escrita en prosa suena mas autorizada que el predicado."
    capa: Infrastructure
    archivos_fix:
      - path: FerreteriaLaPlatense.Infrastructure/Services/ClasificacionAbcAutomaticaService.cs
        motivo: "XML-doc de la clase, punto 2 del criterio (aprox. lineas 22-24) y comentario de bloque anterior al Where (aprox. lineas 71-78): reescribir el conjunto de estados consumados como (Confirmada || Facturada) y dejar el motivo (Confirmar es lo que descuenta stock y registra Caja/CC desde el 2026-09-03; Facturar solo agrega CAE). Mantener escrito por que Borrador y Anulada siguen afuera, que ES correcto y sigue siendo la parte valiosa del comentario (LP-001)."
      - path: FerreteriaLaPlatense.Infrastructure/Services/DashboardService.cs
        motivo: "XML-doc de ObtenerTopProductosMesAsync (aprox. lineas 96-99): 'sobre Ventas Facturadas' pasa a nombrar los dos estados."
    migracion_ef: null
    deteccion_qa:
      tipo: codigo
      selector_o_endpoint: "grep -n 'Facturada' sobre los archivos tocados por un commit que cambie el conjunto de estados de una agregacion: todo match que caiga en un comentario o XML-doc y no en un predicado es candidato."
      condicion_falla: "Queda al menos un comentario o XML-doc que nombre un conjunto de estados distinto del que aplica el Where del mismo metodo."
    criterio_aceptacion:
      - "En ClasificacionAbcAutomaticaService y DashboardService, ningun comentario ni XML-doc nombra 'solo Facturada' / 'Estado == Facturada' como el criterio vigente."
      - "El motivo por el que Borrador y Anulada quedan excluidas sigue escrito (no se borra el comentario, se corrige)."
    pruebas_minimas:
      - "Lectura de los 3 bloques de texto senalados contra el predicado del mismo metodo."
    regla_preventiva: "Cuando un cambio amplia o reduce el conjunto de estados que una agregacion considera (LP-001 es la familia), el barrido de LP-002 ('relevar TODOS los sitios de uso') incluye los COMENTARIOS y XML-doc de los sitios tocados, no solo los predicados. Un comentario prescriptivo desactualizado es una regla de negocio falsa persistida en el repo, y sobrevive al cambio porque no rompe el build ni ninguna prueba."
  - id: MH-014
    modulo: "Pagos con tarjeta / Index (PagosTarjeta/Index.cshtml, columna 'Fecha de pago' — CR-59)"
    titulo: "La columna 'Fecha de pago' del listado nuevo aplica moment.utc() sobre PagoVenta.Fecha, que es un INSTANTE REAL en UTC y no una fecha calendario pura: para pagos registrados entre las 21:00 y las 23:59 de Argentina el listado muestra un dia mas que Ventas/Details y Ventas/Index para el mismo pago"
    severidad: minor
    reproducido_en: "marihogar - master (working tree), CR-59 (2026-08-27). Hallado por QA por revision de codigo comparada contra la regla ya establecida en MH-009 y contra las 2 superficies que ya renderizan el mismo campo (Views/Ventas/Details.cshtml linea 81, Views/Ventas/Index.cshtml linea 147). No verificado en navegador (MCP de Playwright no expuesto en la sesion)."
    pasos:
      - "Confirmar una Venta con un pago con Tarjeta de credito entre las 21:00 y las 23:59 hora Argentina (o forzar en marihogar_dev un PagosVenta.Fecha con hora UTC >= 03:00 del dia siguiente al dia argentino real, ej. '2026-08-28 01:30:00' para un pago del 27/08 a las 22:30 AR)."
      - "Como Administrador, abrir /PagosTarjeta/Index y mirar la columna 'Fecha de pago' de ese pago."
      - "Abrir /Ventas/Details/{ventaId} de la misma venta y mirar la fecha del mismo pago en la card de Formas de pago."
    sintoma: "PagosTarjeta/Index muestra 28/08/2026 mientras Ventas/Details muestra '27/08/2026 22:30' y Ventas/Index muestra '27/08/2026 22:30' para exactamente el mismo PagoVenta. El Administrador ve dos fechas distintas del mismo cobro segun la pantalla por la que entre."
    expectativa: "Un campo que representa un INSTANTE REAL (PagoVenta.Fecha, poblado con DateTime.UtcNow o con HorarioArgentino.ConvertirAUtc(...), con componente de hora verdadero) debe convertirse a hora Argentina antes de mostrarse, igual que Ventas/Index (moment(d).format('DD/MM/YYYY HH:mm')) y Ventas/Details (HorarioArgentino.Convertir(p.Fecha)). moment.utc() esta reservado para las FECHAS CALENDARIO PURAS (las persistidas con .Date), que en esta misma pantalla son unicamente FechaAcreditacionEfectiva."
    causa_raiz: "Al clonar Cheques/Index.cshtml se copio el patron moment.utc(d).format('DD/MM/YYYY') para las DOS columnas de fecha del listado nuevo. En Cheques ese patron es correcto porque su unica columna de fecha (fechaVencimiento) es una fecha calendario pura (Cheque.FechaVencimiento = linea.FechaVencimientoCheque.Value.Date) y fue justamente el fix de MH-009. En PagosTarjeta/Index hay dos columnas con semantica DISTINTA: fechaAcreditacionEfectiva SI es fecha pura (VentaService.ConfirmarAsync / PagoVentaService.RegistrarPagoAsync la persisten con .Value.Date) y moment.utc es correcto ahi, pero fecha (PagoVenta.Fecha) es un instante real en UTC (VentaService.cs lineas 330/334: HorarioArgentino.ConvertirAUtc(input.Fecha.Value.Date + horaArgentinaAhora.TimeOfDay) o DateTime.UtcNow). Aplicarle moment.utc anula la conversion -3h que el converter global (UnspecifiedAsUtcDateTimeConverter) esta justamente ahi para habilitar. Es el error espejo de MH-009: alla se aplicaba la conversion a un campo que no la necesitaba, aca se suprime en un campo que si la necesita."
    capa: Web
    archivos_fix:
      - path: MariHogar.Web/Views/PagosTarjeta/Index.cshtml
        motivo: "Columna 'fecha' (Fecha de pago): moment.utc(d).format('DD/MM/YYYY') -> moment(d).format('DD/MM/YYYY HH:mm'), mismo render exacto que la columna 'fecha' de Ventas/Index.cshtml. NO tocar la columna fechaAcreditacionEfectiva, que con moment.utc ya esta correcta (fecha calendario pura, criterio de MH-009)."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-08-27"
      por: "Joaquin (directo, no delegado — cambio de una linea con fix ya propuesto textualmente por QA)"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Web/Views/PagosTarjeta/Index.cshtml
          motivo: "Columna 'fecha': moment.utc(d).format('DD/MM/YYYY') -> moment(d).format('DD/MM/YYYY HH:mm'). Columna fechaAcreditacionEfectiva sin tocar."
      build: "dotnet build MariHogar.Web/MariHogar.Web.csproj -> 0 Errores."
    deteccion_qa:
      tipo: data
      selector_o_endpoint: "POST /PagosTarjeta/GetData con al menos 1 pago cuyo PagosVenta.Fecha tenga hora UTC entre 00:00 y 02:59 (es decir, un pago hecho entre las 21:00 y las 23:59 hora Argentina del dia anterior) — comparar el dia mostrado en la columna 'Fecha de pago' contra el dia mostrado por /Ventas/Details/{ventaId} para el mismo pago."
      condicion_falla: "El dia calendario de la columna 'Fecha de pago' de PagosTarjeta/Index difiere del dia mostrado para el mismo PagoVenta en Ventas/Details o Ventas/Index."
    criterio_aceptacion:
      - "Un pago con tarjeta registrado a las 22:30 AR del 27/08 se muestra como 27/08 en PagosTarjeta/Index, igual que en Ventas/Index y Ventas/Details."
      - "La columna 'Fecha de acreditacion' sigue mostrando el mismo dia guardado sin corrimiento (no se toca: es fecha pura, MH-009 ya resuelto con moment.utc)."
      - "Sin regresion en el resaltado de fila 'vence proximo' (venceProximo se calcula server-side sobre FechaAcreditacionEfectiva.Date vs DateTime.Today, no depende de la presentacion de ninguna de las dos columnas)."
    pruebas_minimas:
      - "Con un PagoVenta real de marihogar_dev con Metodo=TarjetaCredito y Fecha con hora UTC < 03:00: confirmar que PagosTarjeta/Index y Ventas/Details muestran el mismo dia."
      - "Con un pago de horario diurno (ej. 14:00 AR = 17:00 UTC): confirmar que no cambia de dia con el fix (caso mayoritario, no debe haber regresion visible)."
    nota_generalizacion: "Patron generalizable a cualquier proyecto con un converter global que fuerza Kind=Utc antes de serializar: al clonar una pantalla que ya tiene el fix de MH-009 aplicado (moment.utc), NO copiar ese moment.utc a las columnas de fecha nuevas sin clasificar antes cada campo en 'instante real' (persistido con DateTime.UtcNow / conversion desde hora local) vs 'fecha calendario pura' (persistida con .Date / DateTime.Today). moment.utc solo corresponde al segundo grupo. Regla barata de chequeo: si el campo se muestra con HH:mm en alguna otra pantalla del sistema, es un instante real y va moment(d), no moment.utc(d)."

  - id: MH-015
    modulo: "Pagos con tarjeta / Index (PagosTarjeta/Index.cshtml, columna 'Cuotas' — CR-59)"
    titulo: "La columna 'Cuotas' se renderiza ordenable (default de DataTables) pero 'cantidadCuotas' no esta en el switch de SortColumn de VentaService.ListarPagosTarjetaAsync: al clickear el encabezado la flecha cambia y el listado se reordena por fecha de acreditacion, no por cuotas"
    severidad: trivial
    reproducido_en: "marihogar - master (working tree), CR-59 (2026-08-27). Hallado por QA por revision de codigo (mismo mecanismo ya catalogado como CRM-003 en olvidata-crm). No verificado en navegador (MCP de Playwright no expuesto en la sesion)."
    pasos:
      - "Como Administrador, abrir /PagosTarjeta/Index con al menos 3 pagos con distinta CantidadCuotas y distinta FechaAcreditacionEfectiva."
      - "Clickear el encabezado 'Cuotas'."
    sintoma: "La flecha de orden aparece sobre 'Cuotas' pero las filas se reordenan por Fecha de acreditacion (rama default del switch). Clickear de nuevo invierte ese orden por fecha, nunca por cuotas."
    expectativa: "O la columna ordena de verdad por CantidadCuotas, o no se ofrece como ordenable (orderable: false) para no prometer una interaccion que el servidor no implementa. Mismo criterio que el implementador ya aplico deliberadamente en esta misma pantalla con 'searching: false' (el service no implementa SearchValue, asi que se oculto el buscador en vez de dejarlo inerte)."
    causa_raiz: "VentaService.ListarPagosTarjetaAsync mapea 'ventaId'/'clienteNombre'/'monto'/'fecha'/'estado' en el switch de request.SortColumn; 'cantidadCuotas' no esta mapeado ('fechaAcreditacionEfectiva' tambien cae en la rama default, pero ahi es a proposito y esta bien). Del lado de la vista, DataTables marca ordenable toda columna salvo las que declaran orderable:false — la columna de Cuotas no lo declara. Patron heredado de Cheques/Index (donde 'proveedorNombre' y 'cuota' tienen exactamente el mismo problema), no introducido por CR-59, pero replicado en superficie nueva."
    capa: Web
    archivos_fix:
      - path: MariHogar.Web/Views/PagosTarjeta/Index.cshtml
        motivo: "Columna Cuotas: agregar orderable: false. Opcion alternativa (mas trabajo, mismo resultado funcional): agregar la rama 'cantidadCuotas' al switch de VentaService.ListarPagosTarjetaAsync. Elegir una sola; no aplicar las dos."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-08-27"
      por: "Joaquin (directo, no delegado — cambio de una linea)"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Web/Views/PagosTarjeta/Index.cshtml
          motivo: "Columna 'cantidadCuotas': agregado orderable: false."
      build: "dotnet build MariHogar.Web/MariHogar.Web.csproj -> 0 Errores."
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /PagosTarjeta/Index -> click en el <th>Cuotas</th> del DataTable #tablaPagosTarjeta"
      condicion_falla: "El encabezado Cuotas tiene la clase sorting/sorting_asc de DataTables (es clickeable) y al clickearlo el orden de la columna Cuotas no queda monotono."
    criterio_aceptacion:
      - "El encabezado 'Cuotas' no ofrece orden (sin flecha, sin cursor de click) o, si lo ofrece, reordena realmente por cantidad de cuotas."
      - "Sin regresion en el orden por defecto (Fecha de acreditacion ascendente) ni en las columnas que si ordenan bien (Venta, Cliente, Monto, Fecha de pago, Estado)."
    pruebas_minimas:
      - "Click en cada encabezado ordenable y confirmar que el orden resultante corresponde a esa columna (o que el encabezado no es clickeable)."
    nota_generalizacion: "Mismo mecanismo que CRM-003 (olvidata-crm). Regla preventiva al clonar un DataTable server-side: la lista de columnas de la vista y el switch de SortColumn del service tienen que cubrir exactamente el mismo conjunto — toda columna que no este en el switch va con orderable:false, salvo la que corresponde deliberadamente a la rama default."

  - id: MH-016
    modulo: "Stock / edicion inline (StockService.ActualizarStockAsync — CR-61) x Aumento masivo de precios (AumentoMasivoPrecioService)"
    titulo: "Cada edicion inline de stock reasigna Producto.RowVersion (token de concurrencia optimista): una carga masiva de stock invalida en silencio la previsualizacion abierta de Aumento masivo de precios y aborta el lote entero; ademas ActualizarStockAsync no captura DbUpdateConcurrencyException y filtra el mensaje crudo de EF en ingles al toast del usuario"
    severidad: minor
    reproducido_en: "marihogar - master (working tree), CR-61 (2026-08-31). Hallado por QA por revision de codigo cruzada (AppDbContext.OnBeforeSaveChanges linea 622-626 + AumentoMasivoPrecioService.AplicarAsync lineas 83-91 + StockService.ActualizarStockAsync lineas 91-115). No verificado en navegador (MCP de Playwright no expuesto en la sesion). No es un defecto introducido por CR-61 en sentido estricto — AjustarAsync tenia el mismo comportamiento — pero CR-61 multiplica por uno o dos ordenes de magnitud la cantidad de writes sobre Producto (su proposito declarado es 'carga masiva de stock'), y ninguna de las 4 definiciones (1/2/3/5) menciona RowVersion ni Aumento masivo entre las invariantes a preservar."
    pasos:
      - "Como Administrador A, abrir /AumentoMasivoPrecios/Index, elegir alcance 'Todos' (o una Marca amplia) y apretar 'Previsualizar'. Dejar la previsualizacion en pantalla sin confirmar."
      - "Como Administrador B (u otra pestana del mismo usuario), abrir /Stock y editar la celda Stock de CUALQUIER producto incluido en esa previsualizacion (basta una fila)."
      - "Volver a la pestana de A y apretar 'Aplicar aumento'."
      - "Variante del segundo sintoma: hacer que dos ediciones inline del MISMO producto se solapen (ventana de microsegundos entre el FirstOrDefaultAsync y el SaveChangesAsync de ActualizarStockAsync)."
    sintoma: "(a) El aumento masivo se rechaza entero con 'El producto X fue modificado por otro usuario despues de la previsualizacion. Vuelva a previsualizar e intente nuevamente.', sin aplicar ni un solo producto — aunque lo unico que cambio fue el stock, un campo que el aumento de precios ni lee ni escribe. Durante una sesion de conteo fisico (decenas o cientos de celdas guardadas seguidas) la ventana en la que un aumento masivo puede confirmarse con exito se vuelve practicamente nula. (b) En la colision entre dos ediciones inline, el toast de SweetAlert2 muestra el texto crudo de EF Core en ingles ('Database operation expected to affect 1 row(s) but actually affected 0 row(s). Data may have been modified or deleted since entities were loaded...') porque el catch generico concatena ex.Message."
    expectativa: "(a) Una edicion que solo toca StockActual no deberia invalidar una previsualizacion de precios: el token de concurrencia existe para proteger PrecioCompra/PrecioEfectivo (M16/CA-N19), no el stock. O bien el bump de RowVersion se acota a los cambios que tocan campos de precio, o bien AumentoMasivoPrecioService compara contra un token de precios propio en vez del RowVersion global de la fila. (b) ActualizarStockAsync deberia capturar DbUpdateConcurrencyException antes del catch generico y devolver un mensaje en castellano y accionable ('Otro usuario acaba de modificar el stock de este producto. Recargue el listado e intente nuevamente.'), igual que ya hace AumentoMasivoPrecioService.AplicarAsync. Nunca devolver ex.Message crudo a la UI."
    causa_raiz: "AppDbContext.OnBeforeSaveChanges reasigna producto.RowVersion = Guid.NewGuid().ToByteArray() para TODA entidad Producto en estado Added o Modified, sin discriminar que propiedad cambio. ActualizarStockAsync asigna producto.StockActual sobre una entidad trackeada, con lo cual la fila queda Modified y su RowVersion se renueva en cada guardado de celda. AumentoMasivoPrecioService.AplicarAsync compara el RowVersion en Base64 que viajo a la previsualizacion contra el actual y aborta el lote completo al primer mismatch (rollback + early return, linea 86-91). Del lado del segundo sintoma: al ser RowVersion un IsConcurrencyToken, EF emite UPDATE ... WHERE Id=@id AND RowVersion=@original; si afecta 0 filas lanza DbUpdateConcurrencyException, que en ActualizarStockAsync solo la ve el catch (Exception ex) generico que hace 'Error al actualizar el stock: ' + ex.Message y ese string se pinta tal cual en el toast. Nota colateral: el riesgo que el Arquitecto declaro para CR-61 ('last write wins entre dos editores de stock') no describe lo que realmente pasa — el token de concurrencia impide el last-write-wins y el dato queda integro; lo que falta es el manejo prolijo de la excepcion."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/StockService.cs
        motivo: "ActualizarStockAsync: agregar 'catch (DbUpdateConcurrencyException) { await tx.RollbackAsync(); return ServiceResult<int>.CreateError(\"Otro usuario acaba de modificar el stock de este producto. Recargue el listado e intente nuevamente.\"); }' ANTES del catch generico. Ademas, no devolver ex.Message crudo en el catch generico (loguearlo y devolver un texto fijo)."
      - path: MariHogar.Infrastructure/Data/AppDbContext.cs
        motivo: "OnBeforeSaveChanges: acotar el bump de Producto.RowVersion a los cambios que realmente tocan campos de precio (ej. condicionarlo a entry.Property(nameof(Producto.PrecioCompra)).IsModified || entry.Property(nameof(Producto.PrecioEfectivo)).IsModified || entry.Property(nameof(Producto.PrecioLista)).IsModified, mas el caso Added). ATENCION: este archivo es transversal — el cambio afecta a Ventas y Ordenes de compra, que tambien modifican Producto via RegistrarMovimientoAsync. Requiere decision del Arquitecto antes de tocarse; la opcion (a) es opcional y la (b) es la que cierra el defecto visible."
    migracion_ef: null
    fix_aplicado: null
    deteccion_qa:
      tipo: codigo
      selector_o_endpoint: "MariHogar.Infrastructure/Services/StockService.cs -> ActualizarStockAsync; MariHogar.Infrastructure/Data/AppDbContext.cs -> OnBeforeSaveChanges (bloque 'M16: RowVersion gestionado manualmente')."
      condicion_falla: "ActualizarStockAsync tiene un unico catch (Exception ex) que concatena ex.Message, sin una rama previa para DbUpdateConcurrencyException. Y el bump de RowVersion en OnBeforeSaveChanges no discrimina que propiedad de Producto se modifico."
    criterio_aceptacion:
      - "Una colision de concurrencia en la edicion inline devuelve un mensaje en castellano, accionable, sin texto de excepcion ni nombres de tabla/columna."
      - "Guardar una celda de Stock no rompe, por si sola, una previsualizacion de Aumento masivo de precios abierta sobre ese producto (o, si se decide no tocar AppDbContext, el comportamiento queda documentado como limitacion conocida y el mensaje del aumento masivo explica que puede haberse debido a una edicion de stock)."
      - "Sin regresion en la concurrencia optimista real del Aumento masivo: dos aumentos masivos solapados se siguen bloqueando entre si."
    pruebas_minimas:
      - "Previsualizar un aumento masivo, editar una celda de Stock de un producto del lote en otra pestana, confirmar el aumento: debe aplicarse (o fallar con un mensaje que nombre la causa real)."
      - "Dos aumentos masivos solapados sobre el mismo lote: el segundo se sigue rechazando."
      - "Confirmar una Venta y una Orden de compra despues del fix de AppDbContext (si se aplica): RegistrarMovimientoAsync sigue posteando y no aparece ninguna DbUpdateConcurrencyException nueva."
    nota_generalizacion: "Regla preventiva: cuando una entidad lleva un token de concurrencia optimista gestionado a mano en SaveChanges y ese token se renueva ante CUALQUIER Modified, todo feature nuevo que escriba esa entidad con alta frecuencia (edicion inline, carga masiva, importaciones) entra automaticamente en conflicto con todos los flujos preview->confirm que dependen del token. Verificar el impacto cruzado antes de aprobar Arquitectura, no solo la concurrencia dentro del propio feature. Ademas: ningun ServiceResult debe devolver ex.Message a la UI — patron ya presente en varios services de marihogar heredado del molde original."

  - id: MH-017
    modulo: "Stock / listado de productos con edicion inline (Views/Stock/Index.cshtml — CR-61)"
    titulo: "El listado de Stock no muestra la columna Modelo (que si tiene Productos/Index) pero si ofrece el filtro por Modelo, y el link 'Ajustar stock' filtra por Nombre con match parcial: dos productos homonimos que solo se distinguen por Modelo se ven como dos filas identicas en la unica pantalla donde el stock se guarda al instante, sin confirmacion ni motivo"
    severidad: minor
    reproducido_en: "marihogar - master (working tree), CR-61 (2026-08-31). Hallado por QA por revision de codigo (Views/Stock/Index.cshtml columnas 62-67, ProductoService.ListarAsync linea 27-28 'p.Nombre.Contains(...)', AppDbContext linea 137 'HasIndex(e => e.Nombre)' NO unique). No verificado en navegador (MCP de Playwright no expuesto en la sesion). El implementador siguio al pie de la letra la lista de columnas del diseno; el gap es de 2-disenador-funcional.md, no de la implementacion."
    pasos:
      - "Cargar dos productos con el MISMO Nombre, misma Marca y misma Categoria, y distinto Modelo (Producto.Nombre no tiene indice unico, se permite)."
      - "Como Administrador, ir a /Productos, apretar el boton 'Ajustar stock' (icono fa-boxes-stacked) de uno de los dos."
      - "Mirar el listado de /Stock al que se cae."
    sintoma: "El listado muestra DOS filas con Nombre, Marca y Categoria identicos y ninguna columna que las distinga (Modelo no esta entre las 5 columnas: Nombre / Marca / Categoria / Stock / Stock minimo). El diseno afirmaba que el link dejaria 'al producto como unica fila del listado filtrado', pero el filtro es Contains, no igualdad: tambien caen todos los productos cuyo nombre CONTIENE ese texto (ej. entrar por 'Heladera' trae tambien 'Heladera Whirlpool 300L'). Como cada celda de Stock se guarda al instante en el blur, sin dialogo de confirmacion y sin motivo, elegir la fila equivocada escribe un MovimientoStock real e irreversible (el ledger es inmutable: solo se corrige con un contramovimiento)."
    expectativa: "El listado de Stock deberia permitir identificar sin ambiguedad la fila que se esta editando: agregar la columna Modelo (ya viene en ProductoListItemDto, cero costo de query) es la correccion minima. Complementariamente, el link 'Ajustar stock' podria navegar por Id en vez de por Nombre para garantizar una sola fila."
    causa_raiz: "2-disenador-funcional.md (seccion CR-61) especifico las columnas 'Nombre, Marca, Categoria, Stock, Stock minimo' — omitio Modelo, que Productos/Index si muestra — y a la vez especifico los filtros 'Nombre/Marca/Categoria/Modelo', dejando un filtro sobre un campo que no se ve. En paralelo definio el link como Stock/Index?nombre={nombreProducto} asumiendo que el filtro por Nombre es exacto, cuando ProductoService.ListarAsync usa p.Nombre.Contains(filtro.Nombre) (parcial, y case/accent-insensitive por la collation de MySQL). El encoding de la URL SI esta bien resuelto en las dos superficies (encodeURIComponent en Productos/Index.cshtml, asp-route-nombre en Productos/Edit.cshtml), no es ahi el problema."
    capa: Web
    archivos_fix:
      - path: MariHogar.Web/Views/Stock/Index.cshtml
        motivo: "Agregar el <th>Modelo</th> y la entrada { data: 'modelo', render: function (d) { return d || '<span class=\"text-muted\">-</span>'; } } al array de columns, entre Marca y Categoria (mismo orden y mismo render que Productos/Index.cshtml). 'modelo' ya esta mapeado en el switch de SortColumn de ProductoService.ListarAsync, asi que puede quedar ordenable sin caer en el patron MH-015."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-08-31"
      por: "Joaquin (directo, no delegado — cambio de 2 lineas con fix ya propuesto por QA)"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Web/Views/Stock/Index.cshtml
          motivo: "Columna Modelo agregada entre Nombre y Marca (no entre Marca y Categoria como sugeria QA — posicion distinta, mismo resultado: visible y distingue homonimos). render identico al de Productos/Index.cshtml."
      build: "dotnet build MariHogar.Web/MariHogar.Web.csproj -> 0 Errores."
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /Stock -> encabezados del DataTable #tablaStock"
      condicion_falla: "La tabla #tablaStock tiene 5 encabezados y ninguno dice 'Modelo', pese a que el panel de filtros de arriba ofrece un input #filtroModelo."
    criterio_aceptacion:
      - "El listado de Stock muestra Modelo, de modo que dos productos homonimos son distinguibles antes de editar su stock."
      - "El filtro por Modelo sigue funcionando y ahora se corresponde con una columna visible."
      - "Sin regresion en la edicion inline: la celda de Stock sigue siendo la unica editable y el badge 'Bajo minimo' sigue actualizandose en su td."
    pruebas_minimas:
      - "Abrir /Stock y confirmar 6 columnas (Nombre / Marca / Modelo / Categoria / Stock / Stock minimo)."
      - "Filtrar por Modelo y verificar que las filas devueltas muestran ese modelo."
      - "Entrar por el boton 'Ajustar stock' de un producto cuyo nombre sea prefijo de otro y confirmar que se distinguen las filas."
    nota_generalizacion: "Regla preventiva: en una pantalla con escritura inmediata por fila (sin confirmacion), el listado tiene que contener todas las columnas necesarias para identificar univocamente la fila. Y todo filtro ofrecido en el panel debe tener su columna visible en la tabla — un filtro sobre un campo invisible siempre confunde. Ver tambien la regla inversa ya catalogada en MH-015 (columna ordenable sin soporte en el service)."

  - id: MH-018
    modulo: "Plantillas de gasto recurrente / Index (Views/GastosRecurrentes/Index.cshtml, columna 'Forma de pago' — CR-62)"
    titulo: "Recurrencia de MH-015 en superficie nueva: la columna 'Forma de pago' se renderiza ordenable (default de DataTables) pero 'formaPago' no esta en el switch de SortColumn de GastoRecurrenteService.ListarAsync; al clickear el encabezado la flecha cambia y el listado se reordena por Nombre ascendente, ignorando ademas la direccion pedida"
    severidad: trivial
    reproducido_en: "marihogar - master (working tree), CR-62 (2026-09-02). Hallado por QA por revision de codigo (Views/GastosRecurrentes/Index.cshtml columnas 68-72 + GastoRecurrenteService.ListarAsync lineas 31-37 + DataTableRequestHelper.Parse, que mapea SortColumn al atributo 'data' de la columna clickeada). No verificado en navegador (MCP de Playwright declarado en .mcp.json pero no expuesto en la sesion)."
    pasos:
      - "Como Administrador, ir a /Gastos y apretar 'Gestionar plantillas de gasto recurrente'."
      - "Cargar al menos 3 plantillas con distinta Forma de pago y nombres que NO queden en el mismo orden alfabetico que la forma de pago."
      - "Clickear el encabezado 'Forma de pago'. Clickearlo de nuevo."
    sintoma: "La flecha de orden aparece sobre 'Forma de pago' pero las filas se reordenan por Nombre ascendente (rama default del switch). El segundo click tampoco invierte nada: la rama default es 'query.OrderBy(g => g.Nombre)' fija, sin usar la variable 'asc' — a diferencia de las ramas 'nombre' y 'categoria', que si respetan la direccion."
    expectativa: "O la columna ordena de verdad por FormaPago, o no se ofrece como ordenable (orderable: false), mismo criterio que ya se aplico en esta misma vista a 'descripcion' y a la columna de Acciones, y que ya se aplico como fix de MH-015 en PagosTarjeta/Index."
    causa_raiz: "GastoRecurrenteService.ListarAsync mapea solo 'nombre' y 'categoria' en el switch de request.SortColumn. La vista es un clon de Marcas/Index.cshtml, donde el switch de MarcaService cubre el 100% de las columnas ordenables porque la unica columna extra ('cantidadProductos') va con orderable:false. Al clonar se agregaron 2 columnas nuevas (formaPago y descripcion): a 'descripcion' se le puso orderable:false, a 'formaPago' no. DataTables marca ordenable toda columna que no lo declare. Exactamente el mismo mecanismo que MH-015 (marihogar) y CRM-003 (olvidata-crm)."
    capa: Web
    archivos_fix:
      - path: MariHogar.Web/Views/GastosRecurrentes/Index.cshtml
        motivo: "Columna { data: 'formaPago' }: agregar orderable: false (queda igual que 'descripcion' en la misma vista). Opcion alternativa (mas trabajo, mismo resultado funcional): agregar la rama \"formaPago\" => asc ? query.OrderBy(g => g.FormaPago) : query.OrderByDescending(g => g.FormaPago) al switch de GastoRecurrenteService.ListarAsync. Elegir una sola; no aplicar las dos."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-02"
      por: "Joaquin (directo, no delegado — cambio de 1 linea con fix ya propuesto por QA)"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Web/Views/GastosRecurrentes/Index.cshtml
          motivo: "Columna 'formaPago': agregado orderable: false, mismo criterio que 'descripcion' en la misma vista."
      build: "dotnet build MariHogar.Web/MariHogar.Web.csproj -> 0 Errores."
    deteccion_qa:
      tipo: ui
      selector_o_endpoint: "GET /GastosRecurrentes/Index -> click en el <th>Forma de pago</th> del DataTable #tablaGastosRecurrentes"
      condicion_falla: "El encabezado 'Forma de pago' tiene la clase sorting/sorting_asc de DataTables (es clickeable) y al clickearlo el orden de la columna Forma de pago no queda monotono; el orden visible sigue siendo por Nombre."
    criterio_aceptacion:
      - "El encabezado 'Forma de pago' no ofrece orden (sin flecha, sin cursor de click) o, si lo ofrece, reordena realmente por forma de pago y respeta asc/desc."
      - "Sin regresion en el orden por defecto (Nombre ascendente) ni en las columnas que si ordenan bien (Nombre, Categoria)."
    pruebas_minimas:
      - "Click en cada encabezado ordenable de /GastosRecurrentes y confirmar que el orden resultante corresponde a esa columna (o que el encabezado no es clickeable)."
      - "Confirmar que el filtro por Nombre y la paginacion siguen funcionando despues del cambio."
    nota_generalizacion: "Tercera aparicion del mismo mecanismo en el estudio (CRM-003, MH-015, MH-018) y la segunda dentro de marihogar. La regla preventiva de MH-015 sigue vigente y hay que aplicarla EN EL MOMENTO DE CLONAR un DataTable server-side, no despues: si al clon se le agregan columnas que el molde no tenia, cada columna nueva o entra al switch de SortColumn del service o sale con orderable:false. Observacion colateral de la misma familia: la vista tampoco declara 'searching: false' pese a que GastoRecurrenteService.ListarAsync ignora request.SearchValue (usa el filtro dedicado #filtroNombre) — el cuadro de busqueda global de DataTables queda inerte. Ese segundo punto es heredado tal cual de Marcas/Index.cshtml (mismo comportamiento hoy en produccion), no introducido por CR-62; se documenta aca para que se corrija junto si se toca la vista."

  - id: MH-019
    modulo: "Dashboard (card 'Cheques por vencer') + Proyeccion financiera (M17) — DashboardService.ObtenerChequesPorVencerAsync y ProyeccionFinancieraService.ObtenerAsync"
    titulo: "Al cancelar una OC que tiene un pago programado con cheque, el cheque queda Pendiente para siempre (CR-67 le bloquea la acreditacion) y sigue sumando en la card 'Cheques por vencer' del Dashboard y en 'Cheques por vencer' / 'Pagos de compra programados' de la Proyeccion financiera: plata que ya no se va a pagar nunca, y sin ninguna forma de sacarla desde la UI"
    severidad: major
    reproducido_en: "marihogar - master (working tree), CR-67 (2026-09-02). Hallado por QA por revision de codigo durante el QA de CR-67, contrastando los consumidores de EstadoCheque.Pendiente / EstadoPagoOrdenCompra.Pendiente contra los 2 que CR-67 si arreglo (los jobs de notificacion). NO reproducible con los datos actuales de marihogar_dev: la base de dev tiene 0 OrdenesCompra en estado Cancelada (verificado por QA con consulta de solo lectura). No verificado en navegador (MCP de Playwright declarado en .mcp.json pero no expuesto en la sesion)."
    pasos:
      - "Crear una Orden de Compra y confirmarla (estado Confirmada, que es un estado pagable y a la vez cancelable)."
      - "Registrar un pago programado con metodo Cheque, con FechaVencimiento dentro de los proximos 30 dias. Queda PagoOrdenCompra.Estado=Pendiente y Cheque.Estado=Pendiente."
      - "Cancelar la Orden de Compra (motivo obligatorio)."
      - "Ir al Dashboard y mirar la card 'Cheques por vencer'. Ir despues a Proyeccion financiera y mirar 'Cheques por vencer' y 'Pagos de compra programados'."
    sintoma: "El monto del cheque de la OC ya cancelada sigue contando en la card 'Cheques por vencer' del Dashboard y en los dos informativos de la Proyeccion financiera. Ademas el cheque sigue apareciendo en el listado /Cheques. Como CR-67 agrego el guard de OC Cancelada en ChequeService.AcreditarAsync, ese cheque tampoco se puede acreditar nunca mas: queda Pendiente de forma permanente y el numero equivocado no se puede limpiar desde ninguna pantalla."
    expectativa: "Un cheque cuyo PagoOrdenCompra pertenece a una OrdenCompra en estado Cancelada no debe contar en ningun total ni informe (pedido explicito del cliente en CR-67: las compras y pagos a proveedores cancelados no se muestran en ningun informe). Mismo criterio que ya aplican los 2 jobs de notificacion despues de CR-67 y que ya aplica el calculo de SaldoPendienteOrdenesCompra de la propia Proyeccion (que si acota a OCs Confirmada/Recibida)."
    causa_raiz: "CR-67 (Parte A) decidio deliberadamente NO tocar los PagoOrdenCompra en estado Pendiente que tienen un Cheque asociado al cancelar la OC (caso (b) del foreach de OrdenCompraService.CancelarAsync: el cheque es un documento fisico real y no se hace desaparecer solo). Esa decision es razonable, pero deja vivo un PagoOrdenCompra Pendiente + Cheque Pendiente colgando de una OC Cancelada, y CR-67 solo agrego el filtro de OC Cancelada en 2 de los 5 lugares que consumen ese estado: ChequeService.ObtenerYMarcarVencidosNoNotificadosAsync y PagoOrdenCompraService.ObtenerYMarcarPagosVencidosNoNotificadosAsync. Quedaron sin filtrar: (1) DashboardService.ObtenerChequesPorVencerAsync, (2) el bloque de cheques de ProyeccionFinancieraService.ObtenerAsync, (3) el bloque pagosCompraProgramados de ProyeccionFinancieraService.ObtenerAsync. El origen del under-scoping esta documentado: la propia auditoria de infraestructura del 2026-09-02, en GAP-3, afirma que 'ProyeccionFinancieraService no esta afectado (ya acota a OCs Confirmada/Recibida)' — eso es cierto SOLO para el calculo de saldoOc (ocsPendientes), pero NO para las otras dos consultas del MISMO metodo, que filtran por estado del cheque/pago sin mirar el estado de la OC. CR-67 heredo esa afirmacion sin re-verificarla."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/DashboardService.cs
        motivo: "ObtenerChequesPorVencerAsync: agregar al Where la exclusion de cheques cuya OC este Cancelada, con la misma forma ya validada en ChequeService.ObtenerYMarcarVencidosNoNotificadosAsync (c.PagoOrdenCompra.OrdenCompra.Estado != EstadoOrdenCompra.Cancelada). Atencion: ese metodo ya hace Include(c => c.PagoOrdenCompra) pero NO ThenInclude(p => p.OrdenCompra); hay que agregarlo."
      - path: MariHogar.Infrastructure/Services/ProyeccionFinancieraService.cs
        motivo: "Dos consultas del mismo metodo ObtenerAsync: (1) el bloque 'cheques' (Estado==Pendiente && FechaVencimiento<=horizonte) y (2) el bloque 'pagosCompraProgramados' (Estado==Pendiente && FechaPagoTentativa<=horizonte). En ambos, excluir los que cuelgan de una OC Cancelada. No tocar ocsPendientes, que ya acota bien a Confirmada/Recibida."
      - path: MariHogar.Infrastructure/Services/ChequeService.cs
        motivo: "OPCIONAL, decision del cliente (no es parte del defecto numerico): ChequeService.ListarAsync tampoco excluye cheques de OCs Canceladas del listado /Cheques. Si se quiere alinear con el pedido literal del cliente ('no figuren en ningun lado'), agregar ahi el mismo criterio con un checkbox 'Mostrar cancelados', igual que CR-67 hizo en los 2 ledgers de Cuenta Corriente. Si se prefiere que el cheque fisico siga siendo visible (coherente con la decision (b) de CR-67 de no hacerlo desaparecer), dejarlo como esta y documentarlo."
    migracion_ef: null
    deteccion_qa:
      tipo: data
      selector_o_endpoint: "GET /Dashboard (card 'Cheques por vencer') y GET /ProyeccionFinanciera. Chequeo estatico equivalente: grep de 'EstadoCheque.Pendiente' y 'EstadoPagoOrdenCompra.Pendiente' en MariHogar.Infrastructure/Services/ y confirmar que TODA consulta que los use tambien filtre por el estado de la OrdenCompra."
      condicion_falla: "Existe al menos un Cheque con Estado=Pendiente (o un PagoOrdenCompra con Estado=Pendiente y FechaPagoTentativa no nula) cuyo PagoOrdenCompra.OrdenCompra.Estado == Cancelada, y su monto aparece sumado en la card del Dashboard o en la Proyeccion financiera."
    criterio_aceptacion:
      - "Con una OC Cancelada que tiene un pago programado con cheque, la card 'Cheques por vencer' del Dashboard no cuenta ese cheque ni su monto."
      - "La Proyeccion financiera no cuenta ese cheque en 'Cheques por vencer' ni ese pago en 'Pagos de compra programados'."
      - "Sin regresion: un cheque Pendiente de una OC Confirmada o Recibida sigue contando exactamente igual que hoy en las 3 consultas."
      - "Sin regresion en SaldoPendienteOrdenesCompra (ocsPendientes), que ya excluia las Canceladas y no se toca."
    pruebas_minimas:
      - "OC Confirmada + pago programado con cheque -> cancelar la OC -> Dashboard y Proyeccion financiera no muestran ese monto."
      - "OC Confirmada + pago programado con cheque SIN cancelar -> Dashboard y Proyeccion siguen mostrando el monto (control de no regresion)."
      - "OC Recibida con cheque Pendiente -> sigue contando (control de no regresion)."
    nota_generalizacion: "Patron: cuando un CR agrega un guard de estado (aca 'la OC esta Cancelada') a un flujo, hay que barrer TODOS los consumidores del estado que quedo huerfano, no solo los que motivaron el reporte. La forma barata de hacerlo es un grep del enum involucrado (EstadoCheque.Pendiente / EstadoPagoOrdenCompra.Pendiente) y revisar consulta por consulta. Riesgo agravante especifico de este caso: el guard nuevo de AcreditarAsync convierte el dato inconsistente en PERMANENTE — antes del guard, el usuario podia acreditar el cheque y sacarlo de 'Pendiente' (mal por otro motivo, pero al menos se limpiaba); despues del guard no hay ninguna transicion de salida, asi que el numero equivocado se queda para siempre. Cada vez que se agrega un guard que cierra la ultima transicion de salida de un estado, verificar que no quede ninguna entidad atrapada en ese estado alimentando totales."

  - id: MH-020
    modulo: "Ventas / Cancelacion (VentaService.CancelarAsync, EliminarPagoAsync) — reportado por el cliente sobre Venta #694 en produccion"
    titulo: "Cancelar una Venta no daba de baja el PagoVenta que seguia Pendiente (nunca posteado en CC Local), y el reversal de la venta cancelada reversaba el Total nominal en vez de solo lo efectivamente cobrado — ademas, eliminar ese pago colgado hacia recalcular el Estado de la Venta y la sacaba de Cancelada"
    severidad: critical
    reproducido_en: "marihogar - produccion, Venta #694 (reportado por el cliente 2026-09-02). Reproducido con datos reales via consulta de solo lectura contra produccion antes de corregir."
    pasos:
      - "Crear una Venta con un pago con tarjeta de credito (queda PagoVenta.EstadoAcreditacion = Pendiente, sin movimiento en CC Local todavia)."
      - "Cancelar la Venta (motivo obligatorio) SIN haber acreditado el pago primero."
      - "Entrar al detalle de la Venta cancelada: el pago sigue figurando Pendiente. Eliminar ese pago desde el detalle."
      - "Mirar el Estado de la Venta despues de eliminar el pago, y mirar Cuenta corriente del local para ver que movimiento quedo posteado por la cancelacion."
    sintoma: "(1) El pago Pendiente de una Venta cancelada segui existiendo y editable, pese a que la venta ya estaba anulada. (2) Eliminar ese pago recalculaba el Estado de la Venta a partir de los pagos restantes SIN chequear que la Venta ya estuviera Cancelada, dejandola en un estado incoherente (una venta cancelada que 'vuelve' a Pendiente solo por tocar un dato del pago, sin haber cambiado nada de la venta en si). (3) CancelarAsync posteaba un Egreso de reversion por el venta.Total completo, aunque ese pago jamas hubiera llegado a acreditarse ni a postear un Ingreso real — reversaba plata que el sistema nunca habia registrado como cobrada."
    expectativa: "Al cancelar una Venta con pagos asociados: los pagos aun Pendientes (nunca posteados) se dan de baja junto con la venta, sin generar movimiento (nada que reversar); el Egreso de reversion en CC Local es exactamente la suma de los pagos que SI llegaron a postear un Ingreso real (EstadoAcreditacion != Pendiente), nunca el Total nominal de la venta; y ninguna accion posterior sobre un pago de una venta ya Cancelada debe modificar el Estado de esa Venta."
    causa_raiz: "CancelarAsync nunca incluia ni tocaba la coleccion Pagos de la Venta al cancelar — el pago Pendiente quedaba huerfano, vivo y editable. EliminarPagoAsync recalculaba Venta.Estado desde los pagos remanentes sin ningun guard de 'la venta ya esta Cancelada, no tocar su Estado'. Y el reversal de CC Local usaba venta.Total (el monto nominal de la venta) en vez de sumar solo los PagoVenta con EstadoAcreditacion != Pendiente (los que realmente llegaron a postear un Ingreso)."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/VentaService.cs
        motivo: "CancelarAsync: Include(v => v.Pagos); dentro de la misma transaccion, soft-delete de todo PagoVenta con EstadoAcreditacion == Pendiente (nada que reversar, nunca se posteo). El Egreso de reversion en CC Local pasa a calcularse como venta.Pagos.Where(p => p.EstadoAcreditacion != Pendiente).Sum(p => p.Monto) en vez de venta.Total — y si esa suma da 0, no se postea ningun movimiento. EliminarPagoAsync: guard if (pago.Venta.Estado != EstadoVenta.Cancelada) antes de recalcular el Estado de la Venta; si ya esta Cancelada, el Estado queda intacto pase lo que pase con el pago."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-02"
      por: "Joaquin (directo, investigacion + fix sobre reporte real del cliente con evidencia concreta — Venta #694)"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Infrastructure/Services/VentaService.cs
          motivo: "CancelarAsync (soft-delete de pagos Pendiente + reversal acotado a lo posteado) y EliminarPagoAsync (guard de Venta Cancelada) — ver detalle arriba."
      build: "dotnet build MariHogar.Web/MariHogar.Web.csproj -> 0 Errores."
      correccion_datos_produccion: "Venta #694: Estado vuelto a Cancelada (habia quedado Pendiente por el bug de EliminarPagoAsync); movimiento erroneo #1201 de CC Local (Egreso $318.999,56 por venta.Total completo) NO editado ni borrado — se poste un contramovimiento nuevo (misma OrigenTipo/OrigenId) que lo neutraliza, respetando el principio de ledger inmutable."
    deteccion_qa:
      tipo: data
      selector_o_endpoint: "Cancelar una Venta con un PagoVenta Pendiente sin acreditar; revisar CC Local y el Estado de la Venta despues de eliminar ese pago desde el detalle."
      condicion_falla: "Un PagoVenta Pendiente sobrevive a la cancelacion de su Venta y sigue siendo editable/eliminable; eliminarlo cambia Venta.Estado; o el Egreso de reversion en CC Local es distinto de la suma de los pagos que realmente llegaron a Acreditado antes de cancelar."
    criterio_aceptacion:
      - "Cancelar una Venta con pago Pendiente sin acreditar da de baja ese pago y NO postea ningun movimiento de reversion (nunca hubo Ingreso que reversar)."
      - "Cancelar una Venta con pago ya Acreditado postea un Egreso de reversion exactamente por el monto de ese pago, nunca por venta.Total si difiere (ej. venta con descuento aplicado despues, o pago parcial)."
      - "Ninguna accion sobre un pago de una Venta ya Cancelada (editar nota, eliminar) cambia el Estado de esa Venta."
    pruebas_minimas:
      - "Venta con pago Pendiente (tarjeta sin acreditar) -> cancelar -> el pago desaparece del detalle, sin movimiento nuevo en CC Local."
      - "Venta con pago ya Acreditado -> cancelar -> CC Local muestra un Egreso exactamente por ese monto."
      - "Venta cancelada con pago (de cualquier estado) -> intentar eliminar ese pago -> la Venta sigue Cancelada."
    nota_generalizacion: "Mismo mecanismo mirado desde el lado de Compras: ver MH-019 y CR-67 (OrdenCompraService.CancelarAsync replica exactamente este patron — pagos Pendiente sin cheque se dan de baja, pagos Pagado se reversan con contramovimiento). Regla general para cualquier comprobante con maquina de estados + pagos asociados (Venta, OrdenCompra, y cualquier entidad futura del mismo tipo): al cancelar, (a) los pagos aun no posteados se dan de baja sin generar movimiento, (b) los pagos ya posteados se reversan por un CONTRAMOVIMIENTO nuevo — nunca editando ni borrando el movimiento original (ledger inmutable) —, (c) el monto reversado es la suma de lo efectivamente posteado, nunca el Total nominal del comprobante, y (d) ninguna operacion posterior sobre un pago de un comprobante ya en estado terminal debe recalcular el estado del comprobante. Formalizado como regla nueva en `32-estandares-qa-implementador.instructions.md`."

  - id: MH-021
    modulo: "Ventas / Compras — acreditacion o confirmacion manual de un pago con fecha diferida (VentaService.AcreditarPagoAsync, PagoOrdenCompraService.ConfirmarPagoAsync)"
    titulo: "La fecha de acreditacion/pago efectiva se posteaba en Cuenta Corriente con la fecha SUGERIDA cargada al registrar el pago (ej. la fecha estimada de liquidacion de una tarjeta a 6 cuotas), nunca con la fecha real en que el Administrador confirmo la accion — reportado por el cliente sobre las Ventas #687 y #681 en produccion"
    severidad: major
    reproducido_en: "marihogar - produccion, Ventas #687 y #681 (reportado por el cliente 2026-09-02, con fechas y montos exactos). 5 filas con discrepancia real confirmada via AuditLog (distinguidas de otras 151 filas historicas sin registro de AuditLog, que son datos migrados anteriores a esta funcionalidad y no son bug)."
    pasos:
      - "Registrar un pago con tarjeta de credito a varias cuotas en una Venta (FechaAcreditacionEfectiva se carga con una fecha sugerida a futuro, segun la cantidad de cuotas)."
      - "Semanas despues, el Administrador entra a /PagosTarjeta (hoy 'Ingresos') y marca ese pago como Acreditado, en una fecha distinta a la sugerida originalmente (lo habitual: se acredita cuando se revisa el resumen bancario real, no exactamente el dia estimado al vender)."
      - "Mirar el movimiento de Ingreso que quedo posteado en Cuenta corriente del local para ese pago."
    sintoma: "El Ingreso quedaba posteado con la fecha SUGERIDA original (cargada semanas o meses antes, al momento de la venta), no con la fecha real en que el Administrador efectivamente confirmo la acreditacion — el periodo contable del ingreso no coincidia nunca con el momento real de la accion que lo genero."
    expectativa: "Al confirmar manualmente la acreditacion/pago de un PagoVenta o PagoOrdenCompra, la fecha efectiva (FechaAcreditacionEfectiva / FechaPagoTentativa) se pisa con la fecha real de HOY (Argentina) en el momento exacto de la confirmacion, y el movimiento de Cuenta Corriente se postea con esa fecha real — la fecha sugerida cargada al registrar el pago es solo un punto de partida, no el valor final."
    causa_raiz: "FechaAcreditacionEfectiva/FechaPagoTentativa se cargaban una unica vez, al registrar el pago, como una fecha SUGERIDA — y nunca se volvian a tocar en el momento de la confirmacion manual real. El criterio de negocio original (usar FechaAcreditacionEfectiva en vez de UtcNow al postear el movimiento) era correcto, pero faltaba actualizar ese campo al momento real de la accion antes de usarlo."
    capa: Infrastructure
    archivos_fix:
      - path: MariHogar.Infrastructure/Services/VentaService.cs
        motivo: "AcreditarPagoAsync: pago.FechaAcreditacionEfectiva = HorarioArgentino.Ahora.Date; inmediatamente antes de postear el movimiento de Ingreso en CC Local."
      - path: MariHogar.Infrastructure/Services/PagoOrdenCompraService.cs
        motivo: "ConfirmarPagoAsync: mismo fix simetrico — pago.FechaPagoTentativa = HorarioArgentino.Ahora.Date; antes de postear el movimiento en CC Proveedores. Aplicado sin que el cliente lo pidiera explicitamente para Compras — mismo principio enunciado por el cliente aplicaba identico de ese lado."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-09-02"
      por: "Joaquin (directo, investigacion + fix sobre reporte real del cliente con evidencia concreta — Ventas #687/#681)"
      resultado: "aplicado"
      archivos:
        - path: MariHogar.Infrastructure/Services/VentaService.cs
          motivo: "AcreditarPagoAsync pisa FechaAcreditacionEfectiva con la fecha real de la accion."
        - path: MariHogar.Infrastructure/Services/PagoOrdenCompraService.cs
          motivo: "ConfirmarPagoAsync pisa FechaPagoTentativa con la fecha real de la accion (fix simetrico, no reportado, encontrado por el mismo principio)."
      build: "dotnet build MariHogar.Web/MariHogar.Web.csproj -> 0 Errores."
      correccion_datos_produccion: "5 filas de PagoVenta con discrepancia real confirmada por AuditLog corregidas retroactivamente (FechaAcreditacionEfectiva del pago + Fecha del movimiento de CC Local ya posteado, ambos ajustados a la fecha real de acreditacion tomada del AuditLog). Las otras 151 filas sin registro en AuditLog (datos migrados, anteriores a esta funcionalidad) NO se tocaron — no son bug, son historicos sin trazabilidad de cuando se confirmaron de verdad."
    deteccion_qa:
      tipo: data
      selector_o_endpoint: "Comparar PagoVenta.FechaAcreditacionEfectiva contra el Timestamp real del AuditLog de la fila que cambio EstadoAcreditacion a Acreditado, para pagos con AuditLog disponible."
      condicion_falla: "FechaAcreditacionEfectiva (o FechaPagoTentativa en PagoOrdenCompra) queda igual a la fecha sugerida original despues de una confirmacion manual, en vez de actualizarse a la fecha real de esa confirmacion."
    criterio_aceptacion:
      - "Acreditar un PagoVenta hoy postea el Ingreso en CC Local con la fecha de hoy, sin importar que fecha sugerida tenia el pago al registrarse."
      - "Confirmar un PagoOrdenCompra hoy postea el movimiento en CC Proveedores con la fecha de hoy, mismo criterio."
    pruebas_minimas:
      - "Registrar un pago con fecha sugerida a futuro -> acreditarlo/confirmarlo HOY -> el movimiento de Cuenta Corriente queda fechado hoy, no en la fecha sugerida original."
    nota_generalizacion: "Regla general para cualquier flujo de confirmacion diferida (un dato se registra con una fecha 'sugerida' en el momento de la carga inicial, y se confirma de verdad en otro momento posterior, por otro usuario o rol): el campo de fecha efectiva debe pisarse con la fecha real de la confirmacion en el momento exacto en que esa confirmacion ocurre — nunca conservar la fecha sugerida original una vez que la accion real ya sucedio. Formalizado como regla nueva en `32-estandares-qa-implementador.instructions.md`."

  - id: CRM-015
    modulo: "Matriz de modulos MVP/FULL — generador del borrador de propuesta (Application/Services/PropuestaMvpFullService.cs, helper Minuscula)"
    titulo: "Los modulos cuyo nombre EMPIEZA con una sigla salen deformados en el mensaje que se copia al WhatsApp del cliente: 'ABM Cuadrilla' -> 'aBM Cuadrilla', 'SEO basico y deploy' -> 'sEO basico y deploy', 'CRM de WhatsApp' -> 'cRM de WhatsApp'"
    severidad: major
    reproducido_en: "olvidata-crm - master (working tree sin commitear), feature matriz de modulos MVP/FULL (2026-08-28). Reproducido por QA ejecutando POST /Modulos/GenerarMensaje contra olvidatacrm_dev."
    pasos:
      - "Como SuperUsuario, entrar a /Modulos/Presupuesto y elegir 'Utilities / gestion de reclamos y cuadrillas'."
      - "Dejar los imprescindibles pre-tildados y apretar 'Generar mensaje'."
      - "Leer el texto generado en el textarea."
    sintoma: "El mensaje listo para copiar/pegar al cliente dice 'aBM Cuadrilla, aBM Materiales, aBM Reclamo, aBM Tipo de servicio'. En Landing page sale 'sEO basico y deploy'; en Alquiler de maquinaria, 'cRM de WhatsApp (bandeja de conversaciones)'. Es el texto que Joaquin manda tal cual por WhatsApp despues de una demo."
    expectativa: "Una sigla al inicio del nombre se mantiene intacta ('ABM Cuadrilla', 'SEO basico y deploy', 'CRM de WhatsApp'), igual que ya se mantienen las siglas del medio del nombre (AFIP/ARCA, QR, IA, WhatsApp). Solo se baja la inicial cuando es una palabra normal capitalizada por vivir en una grilla ('Stock e inventario' -> 'stock e inventario')."
    causa_raiz: "PropuestaMvpFullService.Minuscula() baja SIEMPRE la primera letra con char.ToLower(nombre[0]) para que el nombre entre en una frase corrida. El comentario del propio metodo declara la intencion de no romper siglas, pero solo contempla las que estan en el medio del nombre (por eso no usa ToLower() completo); el caso de la sigla en la PRIMERA palabra no esta contemplado y produce el capitalizado mixto 'aBM'. Afecta a 9 de los 84 modulos del seed, todos ellos imprescindibles en su rubro (o sea: caen dentro de los 4 items que el mensaje lista explicitamente), en 4 de los 9 rubros con matriz."
    capa: Application
    archivos_fix:
      - path: OlvidataCRM.Application/Services/PropuestaMvpFullService.cs
        motivo: "Minuscula(): no bajar la inicial cuando los 2 primeros caracteres son mayusculas (sigla al inicio). Deja intacto el resto del comportamiento."
    migracion_ef: null
    fix_aplicado:
      fecha: "2026-08-28"
      por: "QA (auto-fix, sin logica de negocio nueva — restaura la intencion ya declarada en el comentario del propio metodo)"
      resultado: "aplicado"
      archivos:
        - path: OlvidataCRM.Application/Services/PropuestaMvpFullService.cs
          motivo: "Guard de sigla inicial en Minuscula()."
      build: "dotnet build -c Release --no-incremental -> 0 Errores / 13 Advertencias (mismo baseline)."
    deteccion_qa:
      tipo: api
      selector_o_endpoint: "POST /Modulos/GenerarMensaje con industriaId=8 (Utilities) y los moduloIds imprescindibles del rubro"
      condicion_falla: "El campo 'texto' de la respuesta contiene una minuscula seguida inmediatamente de 2+ mayusculas al inicio de un item enumerado (regex: (^|[ ,:])[a-z][A-Z]{2,})."
    criterio_aceptacion:
      - "El mensaje de Utilities lista 'ABM Cuadrilla', 'ABM Materiales', 'ABM Reclamo', 'ABM Tipo de servicio' con la sigla intacta."
      - "El mensaje de Landing page lista 'SEO basico y deploy'; el de Alquiler de maquinaria, 'CRM de WhatsApp (bandeja de conversaciones)'."
      - "Sin regresion en los nombres que SI deben bajar la inicial: Retail sigue diciendo 'catalogo con variantes de color y talle', 'stock e inventario'."
      - "Las siglas del medio del nombre siguen intactas: 'facturacion electronica AFIP/ARCA', 'reserva con QR'."
    pruebas_minimas:
      - "Generar el mensaje de los 9 rubros con matriz y confirmar que ningun item enumerado presenta el patron minuscula+2 mayusculas."
      - "Generar el mensaje de Retail y confirmar que los nombres normales siguen bajando la inicial dentro de la frase."
    nota_generalizacion: "Patron generalizable a cualquier helper que 'des-capitaliza' un nombre de catalogo para meterlo en una frase corrida: bajar nombre[0] a ciegas rompe todo nombre que empiece con sigla. Regla barata: si los 2 primeros caracteres son mayusculas, es una sigla y se deja como esta. Aplica igual al camino inverso (capitalizar la inicial de un texto que empieza con sigla en minusculas)."

