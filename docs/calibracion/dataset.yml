# Dataset estructurado de calibracion de presupuesto — fuente consultable por
# el agente presupuestador, en vez de releer la prosa historica completa de
# 27-presupuesto-parametros.instructions.md en cada estimacion.
#
# La prosa de 27-presupuesto-parametros.instructions.md sigue siendo la fuente
# de RAZONES/contexto de cada cierre (por que subio o bajo un ratio, que causo
# una subestimacion puntual, decisiones de negocio). Este archivo es la fuente
# de NUMEROS: leerlo primero para obtener medianas/rangos, ir a la prosa solo
# si se necesita el contexto de un cierre puntual.
#
# Obligacion de mantenimiento (ver presupuesto-mvc.agent.md, Paso 0 y salida de
# cierre de calibracion): al cerrar un proyecto con datos reales (horas reales
# medidas), agregar una entrada en cierres_reales ANTES o AL MISMO TIEMPO que
# se documenta en 27-presupuesto-parametros.instructions.md — no dejar que el
# dataset estructurado quede desactualizado respecto de la prosa.

version: 1
ultima_actualizacion: 2026-09-16
tasa_vigente_usd_hora: 35
# FORK de factores desde 2026-09-08 (ver "Modelo de facturacion" en 27-presupuesto-parametros):
#   Build (sistema nuevo / rewrite para cliente nuevo)    -> M / 4.0 x 1.20 x tasa = M x 10.50
#   Merge / modulo nuevo post-entrega / Extras opcionales -> M / 2.5 x 1.20 x tasa = M x 16.80
formula_vigente_build: "Costo_modulo = M / 4.0 x 1.20 x tasa_vigente_usd_hora = M x 10.50"
formula_vigente_merge_extras: "Costo_modulo = M / 2.5 x 1.20 x tasa_vigente_usd_hora = M x 16.80"

# Descuento de expansion agresiva — solo Build inicial cliente nuevo (o rewrite).
# factor_tier = MAX(tier por reutilizacion, tier por volumen) — nunca se suman.
# Ver seccion "Descuento de expansion agresiva por reutilizacion cross-proyecto"
# en 27-presupuesto-parametros.instructions.md para el detalle y el gatillo
# (tablero de ciclos economicos, checkpoint octubre 2027).
descuento_expansion_agresiva:
  por_reutilizacion:
    - tier: 1
      nombre: "Expansion Agresiva"
      condicion: "R >= 70%"
      descuento_pct: 30
    - tier: 2
      nombre: "Expansion Moderada"
      condicion: "40% <= R < 70%"
      descuento_pct: 15
    - tier: 3
      nombre: "Estandar"
      condicion: "R < 40%"
      descuento_pct: 0
  por_volumen:
    - tier: V0
      nombre: "Estandar"
      condicion: "Subtotal_lista < USD 600"
      descuento_pct: 0
    - tier: V1
      nombre: "Volumen"
      condicion: "USD 600 <= Subtotal_lista < 1200"
      descuento_pct: 5
    - tier: V2
      nombre: "Volumen alto"
      condicion: "USD 1200 <= Subtotal_lista < 2000"
      descuento_pct: 10
    - tier: V3
      nombre: "Volumen mayor"
      condicion: "Subtotal_lista >= USD 2000"
      descuento_pct: 15
factor_eficiencia_ia_build: 4.0          # desde 2026-09-08
factor_eficiencia_ia_merge_extras: 2.5   # fork deliberado, no unificar
contingencia_temporal_pct: 20

# Cierres reales a nivel PROYECTO (no por modulo) — usar para sanity check del
# total (Paso 8 del metodo de presupuesto-mvc.agent.md).
cierres_reales:

  - proyecto: "delicias-naturales - iteracion evolutiva Junio 2026"
    horas_pert_contingencia: null
    horas_reales: 4
    ratio_pert_real: null
    horas_formula: 4
    ratio_formula_real: 1.0
    fecha_cierre: 2026-06-30
    cierre_real: true
    notas: >
      Unico cierre del dataset con estimacion exacta (ratio 1.0): 4 h estimadas, 4 h reales.
      Workflow complejo con extensiones (solicitudes de ingreso de stock con estados por item
      + pedidos listos para retirar). Se cobro por horas reales a USD 40/h (tasa de entonces),
      total USD 160 - para comparar contra la tasa vigente hay que recalcular a USD 35/h.
      No tiene PERT reconstruido, asi que no aporta ratio PERT/real; su valor es mostrar que
      con alcance bien delimitado y sin sorpresas tecnicas la estimacion clava el numero.

  - proyecto: ShowroomGriffin
    horas_pert_contingencia: 101.1
    horas_reales: 25
    ratio_pert_real: 4.0
    horas_formula: 40.6
    ratio_formula_real: 1.6
    fecha_cierre: null
    cierre_real: true
    notas: "Primer cierre real del dataset con IA asistida."

  - proyecto: ganaderia
    horas_pert_contingencia: 101.0
    horas_reales: 20
    ratio_pert_real: 5.05
    horas_formula: 38.6
    ratio_formula_real: 1.93
    fecha_cierre: 2026-07-03
    cierre_real: true
    modulos_funcionales: 8
    notas: >
      Record del dataset en ratio PERT/real al momento de este cierre. Proyecto de
      referencia comercial para alcances similares (8-11 modulos, ABM+workflow+financiero).
      Precio comercial real USD 950 (incl. 15% desc. referido + 1er año mantenimiento
      empaquetado); desarrollo puro implicito USD 650 ≈ USD 32.5/h efectivo.

  - proyecto: contadores-bma-conversor
    horas_pert_contingencia: 13.1
    horas_reales: 8
    ratio_pert_real: 1.6
    horas_formula: 5.3
    ratio_formula_real: 0.66
    fecha_cierre: 2026-06-29
    cierre_real: true
    modulos_funcionales: 3
    notas: >
      Unico cierre con ratio_formula_real < 1 (subestimado) — causa: deploy inicial en
      hosting compartido subestimado 3x (1h estimada -> 3h real). No afecta la formula
      para proyectos donde el deploy se estima con el piso correcto (ver seccion
      "Alerta de subestimacion sistematica en deploy inicial").

  - proyecto: "vinosefue — sprint compras al proveedor"
    horas_pert_contingencia: 28.27
    horas_reales: 4
    ratio_pert_real: 7.07
    horas_formula: 11.42
    ratio_formula_real: 2.86
    fecha_cierre: 2026-07-03
    cierre_real: true
    items_reconstruidos: 8
    notas: >
      Fue el record del dataset hasta 2026-08-27, cuando crm-olvidata lo supero (8.18x PERT/real). Sigue siendo la referencia de sprint evolutivo con reconstruccion retroactiva. Reconstruccion retroactiva sin presupuesto
      formal previo — real no desglosado por item (reparto proporcional aproximado).
      Iteracion evolutiva que reutiliza PAT-001, PAT-002, PAT-003 del catalogo de
      patrones — origino la regla de granularidad "modificacion existente vs modulo nuevo".

  - proyecto: "labipac — SESION 3"
    horas_pert_contingencia: 13.69
    horas_reales: 2.0
    ratio_pert_real: 6.84
    horas_formula: 5.52
    ratio_formula_real: 2.76
    fecha_cierre: 2026-07-08
    cierre_real: true
    notas: >
      Segundo lugar del dataset. Tercera ronda de mejoras sobre el mismo proyecto —
      origino la regla "segunda/tercera ronda sobre el mismo modulo" (usar piso del
      rango de modificacion existente, no la mediana, incluso si parece pantalla nueva).

  - proyecto: "vinosefue — filtro categoria en export catalogo"
    horas_pert_contingencia: 6.55
    horas_reales: 1.5
    ratio_pert_real: 4.37
    horas_formula: 2.76
    ratio_formula_real: 1.84
    fecha_cierre: 2026-07-13
    cierre_real: true
    notas: >
      El ratio mas bajo del grupo "evolutivo" — confirma que anclar la reconstruccion
      en reutilizacion desde el arranque (no como correccion posterior) baja el ratio
      de sobreestimacion de forma consistente.

  - proyecto: "crm-olvidata — sprint bugs/gaps de auditoria + 3 mejoras"
    horas_pert_contingencia: 22.5
    horas_reales: 2.75
    ratio_pert_real: 8.18
    horas_formula: 10.56
    ratio_formula_real: 3.84
    fecha_cierre: 2026-08-27
    cierre_real: true
    items_reconstruidos: 17
    notas: >
      Nuevo record del dataset en ambos ratios (supera el 7.07x de vinosefue). Sprint de fixes
      sobre sistema propio del estudio (sin cobro a cliente): 17 items de modificacion sobre
      modulos existentes, implementacion y QA delegadas a subagentes (1.18 h de ejecucion de
      subagentes + ~1-1.5 h de orquestacion, deploy y documentacion). El real esta documentado
      como rango 2.5-3 h: se carga el punto medio 2.75 h y los ratios se calculan sobre el;
      con los extremos del rango dan 7.5x-9x (PERT) y 3.5x-4.2x (formula).
      Familia "evolutiva/reutilizacion" sobre el propio repo: NO usarlo para subir el factor
      global de Build (misma restriccion que el cierre KOI/Ayres). horas_formula calculada con
      el fork de Merge/post-entrega (M/2.5 x 1.20 = 22.0/2.5 x 1.20 = 10.56 h), que es el que
      corresponde a trabajo evolutivo. La memoria no desglosa contingencia aparte del PERT:
      22.5 h es el PERT declarado, no un PERT+20% recalculado. Unico retrabajo: vocabulario de
      Contacto.Rubro no declarado en Arquitectura.

  - proyecto: "KOI / Ayres POS - integracion REST"
    horas_pert_contingencia: null
    horas_reales: 2.6
    ratio_pert_real: null
    horas_formula: null
    ratio_formula_real: null
    fecha_cierre: 2026-09-08
    cierre_real: true
    notas: >
      Flujo completo (Discovery a Documentacion) en 2.6 h reales contra un ancla previa de 15-18 h,
      reutilizando PAT-024 (cache de token) y la estructura de integracion ya existente en el propio
      proyecto. Familia "evolutiva/reutilizacion": NO usarlo para subir el factor global de Build
      (esa eficiencia ya esta capturada por M chico + descuento por reutilizacion). Detonante, junto
      con la baja de "Energy Nutrition", del cambio de factor de Build 2.5 -> 4.0.

# Cierres de entrega 100% agentica (2026-09-16).
# Categoria separada a proposito: estos sprints no tienen horas humanas que medir
# -- el trabajo lo ejecutan subagentes y lo unico medible es tiempo de computo.
# Mezclarlos con cierres_reales romperia los ratios (el denominador no es comparable).
# Se abre con el umbral que marihogar dejo pedido: 2-3 cierres del mismo patron.
# Mientras tenga 1 sola fila con dato duro, NO se usa para calibrar: es registro.
cierres_agentic:

  - proyecto: "crm-olvidata - sprint bugs/gaps auditoria"
    fecha_cierre: 2026-08-27
    minutos_agente: 70.7          # 2 corridas de Implementador + 2 de QA
    horas_humanas_orquestacion: 1.5   # estimado, no cronometrado
    horas_reales_totales: 2.75
    notas: >
      Unico de esta familia con tiempo de agente desglosado por corrida. Ver el
      cierre equivalente en cierres_reales (misma fecha) para los ratios contra PERT.

  # Pendientes de extraer (ya medidos en sus propios docs, falta pasarlos aca):
  #   marihogar                  -> 6 sprints agenticos, tiempo por sprint en su trazabilidad.md
  #   olvidata-agentes-multirubro -> M3b / M4 / M4b, cierre sin presupuesto previo (no hay ratio posible)

# Rangos de referencia por tipo de modulo (horas M = caso mas probable PERT).
# Costo USD ya calculado con la formula de BUILD vigente (M x 10.50, factor 4.0 desde 2026-09-08).
# Para Merge / modulo nuevo post-entrega / Extras opcionales usar M x 16.80 (factor 2.5).
rangos_por_tipo_modulo:

  - tipo: "Ajuste puntual (campo, validacion, logica menor)"
    m_horas_min: 0.5
    m_horas_max: 1
    horas_facturables_min: 0.15
    horas_facturables_max: 0.3
    usd_min: 5
    usd_max: 11

  - tipo: "Deploy inicial hosting compartido (subdominio + vendor + .htaccess)"
    m_horas_min: 2
    m_horas_max: 3
    horas_facturables_min: 0.6
    horas_facturables_max: 0.9
    usd_min: 21
    usd_max: 32
    nota: "Usar 3h si el mecanismo de deploy es no estandar (FTP+zip, Passenger WSGI, PHP especifico)."

  - tipo: "ABM simple (sin relaciones, sin logica)"
    m_horas_min: 1
    m_horas_max: 2
    horas_facturables_min: 0.3
    horas_facturables_max: 0.6
    usd_min: 11
    usd_max: 21

  - tipo: "UI pantalla unica sin BD (drag-and-drop, sin framework)"
    m_horas_min: 1
    m_horas_max: 1
    horas_facturables_min: 0.3
    horas_facturables_max: 0.3
    usd_min: 11
    usd_max: 11

  - tipo: "ABM intermedio (con relaciones y validaciones)"
    m_horas_min: 4
    m_horas_max: 7
    horas_facturables_min: 1.2
    horas_facturables_max: 2.1
    usd_min: 42
    usd_max: 74

  - tipo: "Modulo con workflow / estados"
    m_horas_min: 4
    m_horas_max: 6
    horas_facturables_min: 1.2
    horas_facturables_max: 1.8
    usd_min: 42
    usd_max: 63

  - tipo: "Modulo financiero o con logica compleja"
    m_horas_min: 5
    m_horas_max: 8
    horas_facturables_min: 1.5
    horas_facturables_max: 2.4
    usd_min: 53
    usd_max: 84

  - tipo: "Parser Excel propietario (formato jerarquico, pivot, multi-input)"
    m_horas_min: 4
    m_horas_max: 6
    horas_facturables_min: 1.2
    horas_facturables_max: 1.8
    usd_min: 42
    usd_max: 63

  - tipo: "ABM complejo (padre/hijos, trazabilidad)"
    m_horas_min: 7.7
    m_horas_max: 11.5
    horas_facturables_min: 2.3
    horas_facturables_max: 3.5
    usd_min: 81
    usd_max: 121

  - tipo: "Integracion REST documentada (1-2 endpoints, token que vence, sin persistencia nueva)"
    m_horas_min: 3
    m_horas_max: 5
    horas_facturables_min: 0.9
    horas_facturables_max: 1.5
    usd_min: 32
    usd_max: 53
    nota: "Cierre real KOI/Ayres 2026-09-08 (2.6 h reales, con reutilizacion de PAT-024). El riesgo dominante es la habilitacion de acceso (red + credenciales), no el mapeo de endpoints: cotizarla como item de riesgo aparte."

  - tipo: "Integracion ARCA/AFIP (cert .p12 + homologacion)"
    m_horas_min: 5
    m_horas_max: 9
    horas_facturables_min: 1.5
    horas_facturables_max: 2.7
    usd_min: 53
    usd_max: 95
    ver_tambien_patron: PAT-006

# Modificacion sobre modulo existente (iteracion evolutiva) — usar SIEMPRE que
# el item reutilice un patron ya resuelto en el mismo repo o cross-proyecto
# (ver docs/patrones/catalogo.yml), en vez de los rangos de "modulo nuevo" de arriba.
modificacion_modulo_existente:

  - tipo: "Agregar campo simple"
    m_horas: 0.5
    usd: 10

  - tipo: "Agregar regla de negocio"
    m_horas_min: 1
    m_horas_max: 2
    usd_min: 20
    usd_max: 40

  - tipo: "Nuevo reporte o exportacion (sobre modulo existente)"
    m_horas_min: 1
    m_horas_max: 2
    usd_min: 20
    usd_max: 40

  - tipo: "Migracion EF requerida"
    m_horas: 0.5
    usd: 10
    nota: "por cada migracion"

  - tipo: "Refactor de vinculo/FK entre entidades existentes + migracion de datos"
    m_horas_min: 1.5
    m_horas_max: 2
    usd_min: 25
    usd_max: 34
    fuente: "vinosefue sprint compras proveedor 2026-07-03"

  - tipo: "Nuevo ledger/cuenta corriente reutilizando patron ya existente"
    m_horas_min: 1
    m_horas_max: 1.5
    usd_min: 17
    usd_max: 25
    fuente: "vinosefue sprint compras proveedor 2026-07-03"
    ver_tambien_patron: PAT-001

  - tipo: "ABM manual reutilizando servicios ya existentes"
