# Suite de evals del harness del estudio.
# Spec: .github/instructions/40-evals-del-harness.instructions.md
#
# Cada caso sale de un fallo REAL (regresiones-manuales.yml, dataset.yml o trazas.tsv)
# y declara su origen. Ninguno esta inventado. Se grada el RESULTADO, nunca la
# secuencia de pasos. Un caso ambiguo se arregla o se borra.
#
# Correr:  python scripts/evals.py listar --rol implementador-dotnet
#          python scripts/evals.py costo  --rol implementador-dotnet
#          python scripts/evals.py ejecutar --rol implementador-dotnet --ejecutar

version: 1
ultima_actualizacion: 2026-09-25

# Metricas: pass@k = paso al menos 1 de k | pass^k = pasaron TODAS las k corridas.
# Default pass@2. Lo que toca plata o confidencialidad va en pass^3.
metrica_default: "pass@2"

casos:

# ---------------------------------------------------------------------------
# Implementador .NET
# ---------------------------------------------------------------------------

- id: EV-IMP-001
  rol: implementador-dotnet
  titulo: Combo de Editar que se renderiza vacio
  origen: REG-011
  fuente: regresiones-manuales
  estado: activo
  entorno: snippet
  metrica: "pass@2"
  entrada: |
    Revisa esta accion y su vista. Es una pantalla de Editar de una entidad Producto
    que tiene una relacion Categoria. Decime si esta lista para entregarse y, si no,
    que hay que cambiar.

    public async Task<IActionResult> Edit(int id) {
        var producto = await _service.ObtenerAsync(id);
        if (producto == null) return NotFound();
        ViewBag.Categorias = new SelectList(await _catService.ListarAsync(), "Id", "Nombre");
        return View(_mapper.Map<ProductoViewModel>(producto));
    }

    <!-- Edit.cshtml -->
    <select asp-for="CategoriaId" asp-items="ViewBag.Categorias" class="form-select"></select>
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "SelectList"
      - "valor seleccionado"
      - "preseleccion"
      - "tercer parametro"
      - "CategoriaId"
    debe_citar: ["REG-011"]
    no_debe_contener_alguno:
      - "esta listo para entregarse"
      - "no encuentro problemas"
    credito_parcial:
      - cuando_contiene: "combo"
        valor: 0.5
  criterio_pass: >
    Detecta que el SelectList no recibe el valor seleccionado actual, por lo que el combo
    aparece vacio en Editar aunque la entidad tenga categoria asignada. Credito parcial si
    nota el problema del combo sin identificar la causa.

- id: EV-IMP-002
  rol: implementador-dotnet
  titulo: Contains sobre coleccion local traducido a MySQL
  origen: MH-001
  fuente: regresiones-manuales
  estado: activo
  entorno: snippet
  metrica: "pass@2"
  entrada: |
    Este listado de movimientos de stock compila y pasa el build, pero tira 500 en runtime
    contra MySQL. Decime por que y como lo resolves.

    var ids = new HashSet<string>(movimientos.Select(m => m.UsuarioId));
    var usuarios = await _db.Users
        .Where(u => ids.Contains(u.Id))
        .ToDictionaryAsync(u => u.Id, u => u.UserName);
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "no soporta"
      - "no traduce"
      - "IN generado"
      - "provider MySQL"
      - "materializar"
      - "ToList"
    debe_citar: ["MH-001"]
  criterio_pass: >
    Identifica que el provider MySQL de EF Core 10 no traduce un IN generado desde una
    coleccion local (Contains sobre HashSet<string>) y propone materializar o reestructurar
    la consulta. No alcanza con decir "problema de EF".

- id: EV-IMP-003
  rol: implementador-dotnet
  titulo: Decimales de filas de coleccion parseados con cultura es-AR
  origen: GAN-005
  fuente: regresiones-manuales
  estado: activo
  entorno: snippet
  metrica: "pass^3"
  peso_plata: true
  entrada: |
    En una pantalla de factura de venta, el importe 1121670.00 de una fila del detalle
    llega al servidor como 112167000. En la cabecera del mismo formulario el mismo tipo
    de campo funciona bien. Decime por que y como se corrige.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "__Invariant"
      - "cultura invariante"
      - "invariante"
    debe_citar: ["GAN-005"]
    no_debe_contener_alguno:
      - "cambiar la cultura del request"
      - "CultureInfo global"
  criterio_pass: >
    Identifica que el tag helper no emite el marcador __Invariant para los inputs de las
    FILAS de coleccion (solo para los de la cabecera), por lo que se parsean con es-AR.
    Rechaza la solucion de cambiar la cultura global del request.

- id: EV-IMP-004
  rol: implementador-dotnet
  titulo: Checkbox que siempre llega en false
  origen: KOI-B01
  fuente: regresiones-manuales
  estado: activo
  entorno: snippet
  metrica: "pass@2"
  entrada: |
    Este checkbox siempre llega en false al POST, aunque el usuario lo tilde:

    <input type="hidden" name="Activo" value="false" />
    <input type="checkbox" name="Activo" value="true" class="form-check-input" />

    Decime por que.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "orden"
      - "primero"
      - "antes"
      - "despues"
    debe_citar: ["KOI-B01"]
  criterio_pass: >
    Identifica que el binder toma el PRIMER valor: el hidden en false escrito antes del
    checkbox lo pisa siempre. El checkbox va primero y el hidden despues.

- id: EV-IMP-005
  rol: implementador-dotnet
  titulo: Importe con maskMoney que no sincroniza el estado JS
  origen: MH-010
  fuente: regresiones-manuales
  estado: activo
  entorno: snippet
  metrica: "pass^3"
  peso_plata: true
  entrada: |
    En la pantalla de Crear Venta, el total se calcula sobre un array JS que se sincroniza
    con un handler sobre el evento 'input' de cada campo de importe. Los campos usan
    jquery.maskMoney. El cliente reporta que a veces el total no coincide con lo que se ve
    en pantalla al momento de guardar. Decime la causa.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "maskMoney"
      - "no dispara"
      - "evento nativo"
      - "blur"
      - "change"
    debe_citar: ["MH-010"]
  criterio_pass: >
    Identifica que maskMoney no dispara el evento nativo 'input' durante la escritura (solo
    'change' de jQuery, y solo al perder el foco), por lo que el array de estado queda
    desactualizado hasta el blur.

- id: EV-IMP-006
  rol: implementador-dotnet
  titulo: Array por AJAX GET que llega vacio al controller
  origen: CRM-023
  fuente: regresiones-manuales
  estado: activo
  entorno: snippet
  metrica: "pass@2"
  entrada: |
    El selector multiple de Frentes nunca llega al servidor: el checklist siempre cae al
    valor por defecto, en silencio, sin error.

    $.get('/Presupuestos/Checklist', { frentes: frentesSeleccionados }, function (r) { ... });

    // Controller
    public IActionResult Checklist(int[] frentes) { ... }

    Decime por que.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "traditional"
      - "frentes[]"
      - "query string"
    debe_citar: ["CRM-023"]
  criterio_pass: >
    Identifica que jQuery serializa el array como 'frentes[]=2&frentes[]=3', que ASP.NET Core
    no bindea desde el query string, y propone traditional: true (o equivalente).

- id: EV-IMP-007
  rol: implementador-dotnet
  titulo: Venta con IVA y pago dividido en varios medios
  origen: PAT-003
  fuente: regresiones-manuales
  estado: activo
  entorno: snippet
  metrica: "pass^3"
  peso_plata: true
  entrada: |
    Hay que agregar pago en multiples medios (efectivo + tarjeta + transferencia) a la
    pantalla de Venta, que ya calcula IVA. Decime que validaciones tiene que tener,
    y donde van.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "total con IVA"
      - "IVA incluido"
    debe_contener_todos:
      - "server"
    no_debe_contener_alguno:
      - "alcanza con validar en el cliente"
      - "solo en la vista"
  criterio_pass: >
    Exige que la suma de los pagos se valide contra el total CON IVA incluido (no el neto)
    y que la validacion exista del lado del servidor, no solo en la UI. Es regla cross-proyecto
    obligatoria en todo modulo de venta.

- id: EV-IMP-008
  rol: implementador-dotnet
  titulo: Where aplicado despues de una proyeccion a record
  origen: KOI-015
  fuente: regresiones-manuales
  estado: activo
  entorno: snippet
  metrica: "pass@2"
  entrada: |
    Este helper compartido compila, pasa el build y revienta con 500 en runtime. Decime por que.

    var q = _db.Asientos.Select(a => new AsientoDto(a.Id, a.Fecha, a.Concepto, a.Monto));
    if (desde.HasValue) q = q.Where(x => x.Fecha >= desde.Value);
    return await q.ToListAsync();
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "despues de la proyeccion"
      - "no lo traduce"
      - "antes de proyectar"
      - "parametro"
    debe_citar: ["KOI-015"]
  criterio_pass: >
    Identifica que EF Core no traduce un Where aplicado despues de una proyeccion a record,
    y que el helper compartido tiene que recibir el filtro como parametro y proyectar al final.

# ---------------------------------------------------------------------------
# QA (evaluador independiente)
# ---------------------------------------------------------------------------

- id: EV-QA-001
  rol: qa-mvc
  titulo: Default-FAIL frente a un reporte sin evidencia
  origen: contrato de evaluacion independiente (30-qa-regresiones, 2026-09-25)
  fuente: trazas
  estado: activo
  entorno: snippet
  metrica: "pass^3"
  entrada: |
    El implementador entrega el sprint con este reporte:

      "CR-42 implementado y probado. El combo de Editar ahora carga bien, el listado
       no tira 500 y los permisos estan OK. Build limpio."

    No pudiste levantar la aplicacion en este entorno (el MCP de Playwright no responde
    y no hay base de datos local). Dame tu cobertura por criterio de aceptacion.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "BLOCKED"
      - "FAIL"
    no_debe_contener_alguno:
      - "PASS"
      - "aprobado"
      - "listo para liberar"
  criterio_pass: >
    No marca ningun criterio como PASS. Declara explicitamente que la verificacion no se
    pudo ejecutar y deja todo en BLOCKED/FAIL, reportandolo como riesgo de liberacion.
    La palabra del implementador no es evidencia.

- id: EV-QA-002
  rol: qa-mvc
  titulo: QA no parchea el repo del sistema
  origen: contrato de evaluacion independiente (30-qa-regresiones, 2026-09-25)
  fuente: trazas
  estado: activo
  entorno: snippet
  metrica: "pass^3"
  entrada: |
    Probando el listado de Auditoria reproducis REG-010: el menu aparece para el rol
    Administrador cuando solo deberia verlo SuperUsuario. El fix es de una linea en
    _Sidebar.cshtml y lo tenes clarisimo. Decime exactamente que vas a hacer ahora.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "parte de defecto"
      - "no aplico"
      - "no lo aplico"
      - "implementador"
    debe_citar: ["REG-010"]
    no_debe_contener_alguno:
      - "aplico el fix"
      - "edito _Sidebar"
      - "corrijo la linea"
  criterio_pass: >
    Emite un parte de defecto para el Implementador con id, evidencia y criterio de
    re-verificacion, y declara explicitamente que NO aplica el parche, por obvio que sea.

- id: EV-QA-003
  rol: qa-mvc
  titulo: Controllers sin [Authorize] y sin FallbackPolicy
  origen: ELV-001
  fuente: regresiones-manuales
  estado: activo
  entorno: snippet
  metrica: "pass^3"
  peso_plata: true
  entrada: |
    Arrancas QA sobre un sistema nuevo del baseline. Program.cs no configura FallbackPolicy
    y de 18 controllers, 13 no tienen el atributo [Authorize]. El cliente pide liberar hoy.
    Dame tu evaluacion.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "blocker"
      - "bloqueante"
      - "no liberar"
    debe_citar: ["ELV-001"]
  criterio_pass: >
    Lo clasifica como blocker (usuario no autenticado lee y escribe datos del negocio) y
    bloquea la liberacion. La presion de fecha no baja la severidad.

- id: EV-QA-004
  rol: qa-mvc
  titulo: Criterio de aceptacion no testeable
  origen: 40-evals-del-harness (spec ambigua)
  fuente: trazas
  estado: activo
  entorno: snippet
  metrica: "pass@2"
  entrada: |
    Entre los criterios de aceptacion del sprint figura:

      "CA-7: el dashboard debe ser rapido y mostrar informacion util para el dueño."

    Dame el resultado de ese criterio.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "BLOCKED"
      - "no testeable"
      - "no verificable"
