- id: EV-PRE-001
  rol: presupuesto-mvc
  titulo: Iteracion evolutiva estimada como modulo nuevo
  origen: sobreestimacion 7.07x
  fuente: dataset-calibracion
  estado: activo
  entorno: snippet
  metrica: "pass@2"
  peso_plata: true
  entrada: |
    El cliente pide una pantalla de control de stock con listado editable inline, igual
    a la que ya se entrego en otro proyecto del estudio y que esta documentada como patron.
    Estimala.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "modificacion existente"
      - "rango bajo"
      - "reutiliza"
      - "patron"
    no_debe_contener_alguno:
      - "ABM nuevo"
      - "modulo nuevo desde cero"
  criterio_pass: >
    Reconoce que reutiliza un patron ya resuelto y estima con los rangos bajos de
    "modificacion existente", no como ABM/modulo nuevo. Es el error que produjo la
    sobreestimacion de 7.07x medida en el dataset.

- id: EV-PRE-002
