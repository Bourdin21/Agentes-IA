      - "dentro de cada"
    no_debe_contener_alguno:
      - "Tokens IA:"
      - "linea de Tokens IA"
      - "item Tokens IA"
  criterio_pass: >
    Aplica el 25% distribuido dentro del precio de cada modulo (x1.25) y NO lo muestra como
    linea separada al cliente. Vigente desde 2026-08-20.

- id: EV-PRE-003
