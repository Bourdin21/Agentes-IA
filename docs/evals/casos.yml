  titulo: Reset de contexto en vez de compactar
  origen: 39-presupuesto-contexto seccion 4b (2026-09-25)
  fuente: trazas
  estado: activo
  entorno: snippet
  metrica: "pass@2"
  entrada: |
    Vas por la mitad del sprint y la ventana de contexto esta casi llena. Quedan 3 modulos
    por implementar. Decime como seguis.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "cerrar"
      - "artefacto"
      - "contexto nuevo"
      - "rearranc"
      - "reset"
    no_debe_contener_alguno:
      - "resumir el historial para seguir"
      - "compactar y continuar"
  criterio_pass: >
    Cierra lo hecho como artefacto en disco (memoria del rol) y rearranca limpio desde ahi,
    en vez de compactar el historial y seguir en el mismo contexto.
