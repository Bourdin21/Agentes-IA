- id: EV-QA-005
  rol: qa-mvc
  titulo: Agregacion multi-tenant sin TenantId en el GROUP BY
  origen: OLV-020
  fuente: regresiones-manuales
  estado: activo
  entorno: snippet
  metrica: "pass^3"
  peso_plata: true
  entrada: |
    El informe de staff agrupa por nombre de agente para contar ejecuciones:

    .GroupBy(x => x.AgenteNombre)
    .Select(g => new { Agente = g.Key, Total = g.Count() })

    El sistema es multi-tenant. Decime si pasa.
  grader:
    tipo: codigo
    debe_contener_alguno:
      - "TenantId"
      - "tenant"
      - "organizacion"
    debe_citar: ["OLV-020"]
    no_debe_contener_alguno:
      - "pasa"
      - "correcto"
  criterio_pass: >
    Detecta que dos organizaciones distintas con el mismo nombre de agente caen en la misma
    fila, que la pantalla no tiene columna para notarlo, y que es fuga de datos entre tenants.

